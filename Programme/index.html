        const projDays = daysBetween(pStart, pEnd) + 1;
        const elapsed = Math.max(0, Math.min(projDays, daysBetween(pStart, tNow) + 1));

        const health = leaves.map(t => {
            const s = parseDate(t.start), e = parseDate(t.end);
            const dur = daysBetween(s, e) + 1;
            let expected = 0;
            if (tNow >= e) expected = 100;
            else if (tNow >= s) expected = Math.round(((daysBetween(s, tNow) + 1) / dur) * 100);
            const variance = t.progress - expected;
            return { t, dur, expected, variance, daysBehind: Math.max(0, Math.round((expected - t.progress) / 100 * dur)) };
        });
        const behind = health.filter(h => h.variance < -5).sort((a, b) => a.variance - b.variance);
        const ahead = health.filter(h => h.variance > 5).length;
        const onTrack = health.length - behind.length - ahead;
        const overdue = leaves.filter(t => t.progress < 100 && parseDate(t.end) < tNow);
        const dueSoon = leaves.filter(t => t.progress < 100 && parseDate(t.start) <= addDays(tNow, 14) && parseDate(t.end) >= tNow)
            .sort((a, b) => parseDate(a.end) - parseDate(b.end));
        const milestones = state.tasks.filter(t => t.milestone);
        const msDone = milestones.filter(t => t.progress === 100 || parseDate(t.end) < tNow && t.progress === 100).length;

        const critical = state.tasks.filter(t => t.isCritical && isLeaf(t)).sort((a, b) => parseDate(a.start) - parseDate(b.start));
        const critDays = critical.reduce((a, t) => a + daysBetween(parseDate(t.start), parseDate(t.end)) + 1, 0);

        const wAvg = (() => {
            const wSum = leaves.reduce((a, t) => a + (daysBetween(parseDate(t.start), parseDate(t.end)) + 1), 0);
            const pSum = leaves.reduce((a, t) => a + t.progress * (daysBetween(parseDate(t.start), parseDate(t.end)) + 1), 0);
            return wSum ? Math.round(pSum / wSum) : 0;
        })();
        const expectedOverall = Math.round((elapsed / projDays) * 100);

        // Group progress
        const groups = {};
        leaves.forEach(t => {
            const g = t.group || 'General';
            groups[g] = groups[g] || { w: 0, p: 0, n: 0, done: 0 };
            const dur = daysBetween(parseDate(t.start), parseDate(t.end)) + 1;
            groups[g].w += dur; groups[g].p += t.progress * dur; groups[g].n++;
            if (t.progress === 100) groups[g].done++;
        });

        // Monthly workload (active leaf tasks per month)
        const months = [];
        let mCur = new Date(Date.UTC(pStart.getUTCFullYear(), pStart.getUTCMonth(), 1));
        const mEnd = new Date(Date.UTC(pEnd.getUTCFullYear(), pEnd.getUTCMonth(), 1));
        let mGuard = 0;
        while (mCur <= mEnd && mGuard++ < 120) {
            const next = new Date(Date.UTC(mCur.getUTCFullYear(), mCur.getUTCMonth() + 1, 1));
            const count = leaves.filter(t => parseDate(t.start) < next && parseDate(t.end) >= mCur).length;
            months.push({ label: mCur.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' }) + ' ' + String(mCur.getUTCFullYear()).slice(2), count });
            mCur = next;
        }
        const maxCount = Math.max(1, ...months.map(m => m.count));

        const varianceBadge = wAvg >= expectedOverall
            ? `<span class="text-emerald-600 font-bold">${wAvg - expectedOverall >= 1 ? '+' + (wAvg - expectedOverall) + '% ahead' : 'on schedule'}</span>`
            : `<span class="text-red-500 font-bold">${expectedOverall - wAvg}% behind plan</span>`;

        const kpi = (label, value, sub, colour) => `
            <div class="kpi-card p-4">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">${label}</p>
                <p class="text-2xl font-extrabold ${colour || 'text-slate-700'} leading-tight mt-1">${value}</p>
                ${sub ? `<p class="text-[11px] text-slate-400 mt-0.5">${sub}</p>` : ''}
            </div>`;

        let html = `<div class="max-w-6xl mx-auto space-y-5">
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                ${kpi('Project Span', projDays + 'd', displayDate(fmtDate(pStart)) + ' → ' + displayDate(fmtDate(pEnd)))}
                ${kpi('Overall Progress', wAvg + '%', 'Expected ' + expectedOverall + '% · ' + varianceBadge)}
                ${kpi('Overdue Tasks', overdue.length, overdue.length ? 'Past finish, not complete' : 'Nothing overdue', overdue.length ? 'text-red-500' : 'text-emerald-600')}
                ${kpi('Active in Next 14 Days', dueSoon.length, 'Underway or starting soon')}
                ${kpi('Milestones', msDone + ' / ' + milestones.length, milestones.length ? 'Completed to date' : 'None defined')}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="kpi-card p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-1">Schedule Health</h3>
                    <p class="text-[11px] text-slate-400 mb-3">Actual progress vs where each task should be today, based on its dates.</p>
                    <div class="flex gap-2 mb-4 text-[11px] font-bold">
                        <span class="px-2.5 py-1 rounded-full bg-red-50 text-red-600">${behind.length} behind</span>
                        <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">${onTrack} on track</span>
                        <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-600">${ahead} ahead</span>
                    </div>`;
        if (behind.length) {
            html += `<div class="space-y-2">`;
            behind.slice(0, 6).forEach(h => {
                html += `<div class="flex items-center justify-between gap-3 text-xs border-b border-slate-100 pb-2">
                    <div class="min-w-0">
                        <p class="font-semibold text-slate-700 truncate">${esc(h.t.name)}</p>
                        <p class="text-[10px] text-slate-400">${h.t.progress}% done · should be ~${h.expected}%</p>
                    </div>
                    <span class="text-red-500 font-bold whitespace-nowrap">~${h.daysBehind}d behind</span>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `<p class="text-xs text-emerald-600 font-semibold">No tasks are meaningfully behind plan. Keep it going.</p>`;
        }
        html += `</div>

                <div class="kpi-card p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-1">Critical Path</h3>
                    <p class="text-[11px] text-slate-400 mb-3">${critical.length} task(s) with zero float — any slip here moves the finish date of ${displayDate(fmtDate(pEnd))}.</p>
                    <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1">`;
        critical.forEach(t => {
            html += `<div class="flex items-center justify-between gap-2 text-xs bg-red-50/60 border border-red-100 rounded-lg px-3 py-1.5">
                <span class="font-semibold text-slate-700 truncate">${esc(t.name)}</span>
                <span class="text-[10px] text-slate-500 whitespace-nowrap">${displayDate(t.start)} → ${displayDate(t.end)}</span>
            </div>`;
        });
        if (!critical.length) html += `<p class="text-xs text-slate-400">Link tasks with dependencies to calculate the critical path.</p>`;
        html += `</div>
                    ${critical.length ? `<p class="text-[11px] text-slate-500 mt-3">Combined critical work: <span class="font-bold">${critDays} days</span></p>` : ''}
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                <div class="kpi-card p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-3">Progress by Group</h3>
                    <div class="space-y-3">`;
        Object.keys(groups).sort().forEach(g => {
            const gr = groups[g];
            const pct = gr.w ? Math.round(gr.p / gr.w) : 0;
            html += `<div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="font-semibold text-slate-600 truncate">${esc(g)}</span>
                    <span class="text-slate-400">${gr.done}/${gr.n} done · ${pct}%</span>
                </div>
                <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-[#006858]" style="width:${pct}%"></div></div>
            </div>`;
        });
        html += `</div></div>

                <div class="kpi-card p-5">
                    <h3 class="text-sm font-bold text-slate-700 mb-1">Next 14 Days</h3>
                    <p class="text-[11px] text-slate-400 mb-3">Tasks underway or starting between now and ${displayDate(fmtDate(addDays(tNow, 14)))}.</p>
                    <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1">`;
        if (dueSoon.length) {
            dueSoon.slice(0, 10).forEach(t => {
                const late = parseDate(t.end) < addDays(tNow, 5);
                html += `<div class="flex items-center justify-between gap-2 text-xs border border-slate-100 rounded-lg px-3 py-1.5">
                    <span class="font-semibold text-slate-700 truncate">${t.milestone ? '&#9670; ' : ''}${esc(t.name)}</span>
                    <span class="text-[10px] ${late ? 'text-amber-600 font-bold' : 'text-slate-500'} whitespace-nowrap">finishes ${displayDate(t.end)}</span>
                </div>`;
            });
        } else {
            html += `<p class="text-xs text-slate-400">Nothing scheduled in the next fortnight.</p>`;
        }
        html += `</div></div>
            </div>

            <div class="kpi-card p-5">
                <h3 class="text-sm font-bold text-slate-700 mb-1">Workload by Month</h3>
                <p class="text-[11px] text-slate-400 mb-4">Number of tasks active in each month — useful for spotting crunch periods.</p>
                <div class="flex items-end gap-1 h-28 overflow-x-auto pb-1">`;
        months.forEach(m => {
            const h = Math.round((m.count / maxCount) * 100);
            html += `<div class="flex flex-col items-center gap-1 shrink-0" style="width:34px">
                <span class="text-[9px] font-bold text-slate-500">${m.count || ''}</span>
                <div class="w-5 rounded-t bg-[#006858]/80" style="height:${Math.max(h, 3)}%"></div>
                <span class="text-[8px] text-slate-400 whitespace-nowrap">${m.label}</span>
            </div>`;
        });
        html += `</div></div></div>`;
        refs.insights.innerHTML = html;
    };

    /* =========================================================
       11b. PRINT ENGINE — tiles a wide programme across pages
            that line up when taped, or squeezes it onto one.
       ========================================================= */
    const PAPER = { A4: [210, 297], A3: [297, 420], A2: [420, 594], A1: [594, 841] };
    const MMPX = 96 / 25.4;
    const printOpts = { paper: 'A3', orient: 'landscape', mode: 'tile', margin: 8, overlap: 24, listW: 230 };

    const printRowLayout = (rows) => {
        const y = {}; const bands = []; let h = 0;
        rows.forEach(r => {
            if (r.type === 'group') { bands.push({ y: h, label: r.label }); h += GROUP_H; }
            else { y[r.task.id] = h; h += ROW_H; }
        });
        return { y, bands, totalH: h };
    };

    // Timeline canvas at full width — each page shows a window onto this.
    const buildPrintTimeline = (rows, cols, lay, minT, maxT) => {
        let h = `<div style="position:absolute;inset:0;display:flex">`;
        cols.bottom.forEach(c => {
            h += `<div style="flex:none;width:${c.w}px;height:100%;border-right:1px solid #dbe2ea;${c.weekend ? 'background:#f1f5f9;' : ''}"></div>`;
        });
        h += `</div>`;

        lay.bands.forEach(b => {
            h += `<div style="position:absolute;left:0;top:${b.y}px;width:${gridWidth}px;height:${GROUP_H}px;background:#e8edf2;border-bottom:1px solid #b9c4d0;border-top:1px solid #b9c4d0"></div>`;
        });
        rows.forEach(r => {
            if (r.type !== 'task') return;
            const y = lay.y[r.task.id];
            h += `<div style="position:absolute;left:0;top:${y + ROW_H}px;width:${gridWidth}px;height:0;border-bottom:1px solid #eef2f6"></div>`;
        });

        const tNow = todayUTC();
        if (tNow >= minT && tNow <= maxT) {
            const tx = (daysBetween(minT, tNow) + 0.5) * ppd();
            h += `<div style="position:absolute;top:0;height:${lay.totalH}px;left:${tx}px;width:1px;background:#ef4444"></div>`;
        }

        rows.forEach(r => {
            if (r.type !== 'task') return;
            const t = r.task, y = lay.y[t.id], g = barGeom(t);
            const crit = state.showCriticalPath && t.isCritical ? 'outline:2px solid #ef4444;outline-offset:1px;' : '';
            if (t.milestone) {
                const cx = g.left + Math.min(ppd(), 42) / 2;
                h += `<div style="position:absolute;left:${cx - 6}px;top:${y + ROW_H / 2 - 6}px;width:12px;height:12px;transform:rotate(45deg);background:${t.color};border:1px solid #fff;${crit}"></div>`;
            } else if (!isLeaf(t)) {
                h += `<div style="position:absolute;left:${g.left}px;top:${y + ROW_H / 2 - 4}px;width:${g.width}px;height:8px;background:#334155;${crit}">
                    <div style="height:100%;width:${g.eff.progress}%;background:#6ee7b7"></div></div>`;
            } else {
                h += `<div style="position:absolute;left:${g.left}px;top:${y + ROW_H / 2 - 9}px;width:${g.width}px;height:18px;background:${t.color};border-radius:3px;overflow:hidden;${crit}">
                    <div style="height:100%;width:${t.progress}%;background:rgba(0,0,0,.18)"></div>
                    ${g.width > 70 ? `<span style="position:absolute;inset:0;display:flex;align-items:center;padding:0 5px;font-size:9px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden">${esc(t.name)} · ${t.progress}%</span>` : ''}
                </div>`;
            }
        });

        h += buildArrowSVG(rows, lay.totalH, 0, lay.y, gridWidth);
        return h;
    };

    const buildPrintList = (rows, lay, PLW) => {
        let h = '';
        rows.forEach(r => {
            if (r.type === 'group') {
                h += `<div style="height:${GROUP_H}px;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#475569;background:#e8edf2;border-bottom:1px solid #b9c4d0;border-top:1px solid #b9c4d0">${esc(r.label)}</div>`;
                return;
            }
            const t = r.task, g = barGeom(t);
            const indent = 6 + r.depth * 12;
            const bold = hasChildren(t.id) ? '700' : '500';
            h += `<div style="height:${ROW_H}px;display:flex;align-items:center;border-bottom:1px solid #eef2f6;font-size:9px">
                <div style="flex:1;min-width:0;padding-left:${indent}px;padding-right:4px;font-weight:${bold};color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.milestone ? '&#9670; ' : ''}${esc(t.name)}</div>
                <div style="width:56px;flex:none;padding:0 3px;color:#64748b;border-left:1px solid #eef2f6;white-space:nowrap">${displayDate(g.eff.start).replace(/ \d{4}$/, '')}</div>
                <div style="width:56px;flex:none;padding:0 3px;color:#64748b;border-left:1px solid #eef2f6;white-space:nowrap">${displayDate(g.eff.end).replace(/ \d{4}$/, '')}</div>
                <div style="width:30px;flex:none;text-align:center;color:#94a3b8;border-left:1px solid #eef2f6">${t.milestone ? '—' : g.eff.dur + 'd'}</div>
            </div>`;
        });
        return h;
    };

    const buildPrintHeaderStrip = (cols) => {
        const hasTop = cols.top.length > 0;
        let h = '';
        if (hasTop) {
            h += `<div style="display:flex;height:16px;border-bottom:1px solid #e2e8f0;width:${gridWidth}px">`;
            cols.top.forEach(c => {
                h += `<div style="flex:none;width:${c.w}px;overflow:hidden;padding-left:4px;font-size:9px;font-weight:700;color:#475569;border-right:1px solid #cbd5e1;white-space:nowrap">${esc(c.label)}</div>`;
            });
            h += `</div>`;
        }
        h += `<div style="display:flex;height:${hasTop ? 20 : 30}px;width:${gridWidth}px">`;
        cols.bottom.forEach(c => {
            h += `<div style="flex:none;width:${c.w}px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;border-right:1px solid ${c.weekend ? '#cbd5e1' : '#e2e8f0'};${c.weekend ? 'background:#f1f5f9;' : ''}">
                ${c.sub ? `<span style="font-size:6px;color:#94a3b8;line-height:1">${c.sub}</span>` : ''}
                <span style="font-size:8px;font-weight:700;color:#475569;line-height:1.2;white-space:nowrap">${esc(c.label)}</span>
            </div>`;
        });
        h += `</div>`;
        return h;
    };

    const dateAtX = (x, minT) => fmtDate(addDays(minT, Math.max(0, Math.round(x / ppd()))));

    const buildPrintDoc = () => {
        computeCPM();
        const rows = buildRows();
        const { minT, maxT, cols } = computeBounds();
        if (!rows.some(r => r.type === 'task')) { toast('There is nothing to print.', true); return false; }

        const lay = printRowLayout(rows);
        const [pw, ph] = PAPER[printOpts.paper];
        const landscape = printOpts.orient === 'landscape';
        const pageWmm = (landscape ? ph : pw) - printOpts.margin * 2;
        const pageHmm = (landscape ? pw : ph) - printOpts.margin * 2;
        const usableW = Math.floor(pageWmm * MMPX);
        const PLW = Math.min(printOpts.listW, Math.floor(usableW * 0.45));
        const headerH = cols.top.length ? 36 : 30;

        const timelineHTML = buildPrintTimeline(rows, cols, lay, minT, maxT);
        const listHTML = buildPrintList(rows, lay, PLW);
        const stripHTML = buildPrintHeaderStrip(cols);
        const title = esc(document.getElementById('project-title').value || 'Project Timeline');
        const viewLabel = { day: 'Days', week: 'Weeks', month: 'Months', quarter: 'Quarters', year: 'Years' }[state.viewMode];

        const pageBlock = (inner) => `<div class="print-page" style="width:${usableW}px">${inner}</div>`;
        const meta = (pageTxt, rangeTxt) => `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-family:Inter,sans-serif">
            <div><span style="font-size:13px;font-weight:800;color:#006858">${title}</span>
            <span style="font-size:9px;color:#64748b;margin-left:8px">${viewLabel} view · printed ${new Date().toLocaleDateString('en-IE')}</span></div>
            <div style="font-size:9px;font-weight:700;color:#475569">${pageTxt}${rangeTxt ? ' · ' + rangeTxt : ''}</div>
        </div>`;

        let doc = '';

        if (printOpts.mode === 'fit') {
            const fullW = PLW + gridWidth;
            const scale = Math.min(1, usableW / fullW);
            const scaledH = (headerH + lay.totalH) * scale;
            doc = pageBlock(
                meta('Single sheet · scaled to ' + Math.round(scale * 100) + '%', displayDate(fmtDate(minT)) + ' → ' + displayDate(fmtDate(maxT))) +
                `<div style="width:${usableW}px;height:${scaledH}px;overflow:hidden">
                    <div style="width:${fullW}px;transform:scale(${scale});transform-origin:top left">
                        <div style="display:flex;border:1px solid #94a3b8">
                            <div style="width:${PLW}px;flex:none;border-right:1px solid #94a3b8">
                                <div style="height:${headerH}px;background:#f8fafc;border-bottom:1px solid #94a3b8"></div>
                                ${listHTML}
                            </div>
                            <div style="width:${gridWidth}px;flex:none">
                                <div style="border-bottom:1px solid #94a3b8;background:#f8fafc">${stripHTML}</div>
                                <div style="position:relative;height:${lay.totalH}px;width:${gridWidth}px">${timelineHTML}</div>
                            </div>
                        </div>
                    </div>
                </div>`
            );
        } else {
            const sliceW = usableW - PLW;
            const step = Math.max(60, sliceW - printOpts.overlap);
            const pages = Math.max(1, Math.ceil((gridWidth - printOpts.overlap) / step));
            for (let p = 0; p < pages; p++) {
                const offset = Math.min(p * step, Math.max(0, gridWidth - sliceW));
                const from = displayDate(dateAtX(offset, minT));
                const to = displayDate(dateAtX(Math.min(offset + sliceW, gridWidth) - 1, minT));
                const joinNote = p > 0 ? `<div class="join-mark">◀ overlaps sheet ${p}</div>` : '';
                doc += pageBlock(
                    meta(`Sheet ${p + 1} of ${pages}`, from + ' → ' + to) +
                    `<div style="display:flex;border:1px solid #94a3b8;position:relative">
                        ${joinNote}
                        <div style="width:${PLW}px;flex:none;border-right:2px solid #475569">
                            <div style="height:${headerH}px;background:#f8fafc;border-bottom:1px solid #94a3b8;display:flex;align-items:flex-end;padding:0 8px 3px">
                                <span style="flex:1;font-size:8px;font-weight:700;text-transform:uppercase;color:#64748b">Task</span>
                                <span style="width:56px;font-size:8px;font-weight:700;text-transform:uppercase;color:#64748b">Start</span>
                                <span style="width:56px;font-size:8px;font-weight:700;text-transform:uppercase;color:#64748b">Finish</span>
                                <span style="width:30px;font-size:8px;font-weight:700;text-transform:uppercase;color:#64748b;text-align:center">Dur</span>
                            </div>
                            ${listHTML}
                        </div>
                        <div style="width:${sliceW}px;flex:none;overflow:hidden">
                            <div style="width:${gridWidth}px;margin-left:-${offset}px;border-bottom:1px solid #94a3b8;background:#f8fafc">${stripHTML}</div>
                            <div style="width:${gridWidth}px;margin-left:-${offset}px;position:relative;height:${lay.totalH}px">${timelineHTML}</div>
                        </div>
                    </div>
                    <div style="margin-top:4px;font-size:8px;color:#94a3b8;font-family:Inter,sans-serif">Sheet ${p + 1} of ${pages} · ${printOpts.paper} ${printOpts.orient} · trim at the outer line and overlap ${printOpts.overlap}px with the next sheet</div>`
                );
            }
        }

        let root = document.getElementById('print-root');
        if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
        root.innerHTML = doc;

        let rule = document.getElementById('page-rule');
        if (!rule) { rule = document.createElement('style'); rule.id = 'page-rule'; document.head.appendChild(rule); }
        rule.innerHTML = `@page { size: ${printOpts.paper} ${printOpts.orient}; margin: ${printOpts.margin}mm; }`;
        return true;
    };

    const openPrintPanel = () => {
        let panel = document.getElementById('print-panel');
        if (!panel) {
            panel = document.createElement('div');
            panel.id = 'print-panel';
            panel.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[70] p-4 no-print';
            panel.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
                    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-800">Print Setup</h2>
                        <button id="pp-close" class="text-slate-400 hover:text-red-500">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Layout</label>
                            <select id="pp-mode" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="tile">Tile across sheets (full size, tape together)</option>
                                <option value="fit">Squeeze onto one sheet</option>
                            </select>
                            <p id="pp-hint" class="text-[11px] text-slate-400 mt-1.5"></p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Paper</label>
                                <select id="pp-paper" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                                    <option>A4</option><option>A3</option><option>A2</option><option>A1</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Orientation</label>
                                <select id="pp-orient" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                                    <option value="landscape">Landscape</option><option value="portrait">Portrait</option>
                                </select>
                            </div>
                        </div>
                        <div id="pp-estimate" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-600"></div>
                        <p class="text-[11px] text-slate-400 leading-relaxed">In the browser's print dialog, set the same paper size and turn on background graphics. Choose "Scale: Default" — the sheets are already sized here.</p>
                        <div class="flex justify-end gap-3 pt-1">
                            <button id="pp-cancel" class="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg hover:bg-slate-200">Cancel</button>
                            <button id="pp-go" class="px-5 py-2 bg-[#006858] text-white text-sm font-bold rounded-lg hover:bg-emerald-700 shadow-md shadow-emerald-200">Print</button>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(panel);
            panel.addEventListener('mousedown', (e) => { if (e.target === panel) closePrintPanel(); });
            document.getElementById('pp-close').onclick = closePrintPanel;
            document.getElementById('pp-cancel').onclick = closePrintPanel;
            document.getElementById('pp-go').onclick = () => {
                closePrintPanel();
                if (buildPrintDoc()) setTimeout(() => window.print(), 60);
            };
            ['pp-mode', 'pp-paper', 'pp-orient'].forEach(id => {
                document.getElementById(id).onchange = () => { readPrintPanel(); updatePrintEstimate(); };
            });
        }
        document.getElementById('pp-mode').value = printOpts.mode;
        document.getElementById('pp-paper').value = printOpts.paper;
        document.getElementById('pp-orient').value = printOpts.orient;
        updatePrintEstimate();
        panel.classList.remove('hidden'); panel.classList.add('flex');
    };
    const closePrintPanel = () => {
        const p = document.getElementById('print-panel');
        if (p) { p.classList.add('hidden'); p.classList.remove('flex'); }
    };
    const readPrintPanel = () => {
        printOpts.mode = document.getElementById('pp-mode').value;
        printOpts.paper = document.getElementById('pp-paper').value;
        printOpts.orient = document.getElementById('pp-orient').value;
    };
    const updatePrintEstimate = () => {
        computeCPM();
        const rows = buildRows();
        computeBounds();
        const [pw, ph] = PAPER[printOpts.paper];
        const landscape = printOpts.orient === 'landscape';
        const usableW = Math.floor(((landscape ? ph : pw) - printOpts.margin * 2) * MMPX);
        const PLW = Math.min(printOpts.listW, Math.floor(usableW * 0.45));
        const est = document.getElementById('pp-estimate');
        const hint = document.getElementById('pp-hint');
        const taskCount = rows.filter(r => r.type === 'task').length;
        if (printOpts.mode === 'fit') {
            const scale = Math.min(1, usableW / (PLW + gridWidth));
            const pct = Math.round(scale * 100);
            const bigger = ['A4', 'A3', 'A2'].indexOf(printOpts.paper);
            const suggestion = pct < 40
                ? (bigger !== -1
                    ? ` <span class="text-amber-600 font-semibold">Text will be very small — try ${['A3', 'A2', 'A1'][bigger]}, a coarser timescale, or tiling instead.</span>`
                    : ` <span class="text-amber-600 font-semibold">Text will be very small even on A1 — switch to a coarser timescale or tile across sheets.</span>`)
                : '';
            est.innerHTML = `<b>1 sheet</b> at <b>${pct}%</b> scale · ${taskCount} tasks.` + suggestion;
            hint.innerText = 'The whole programme is scaled down to fit a single sheet.';
        } else {
            const sliceW = usableW - PLW;
            const step = Math.max(60, sliceW - printOpts.overlap);
            const pages = Math.max(1, Math.ceil((gridWidth - printOpts.overlap) / step));
            est.innerHTML = `<b>${pages} sheet${pages > 1 ? 's' : ''}</b> at full size · ${taskCount} tasks · task names repeat on every sheet.`;
            hint.innerText = 'Each sheet carries the task list, so sheets read on their own and tape together.';
        }
    };

    /* =========================================================
       12. MODAL
       ========================================================= */
    const openModal = () => { refs.modal.classList.remove('hidden'); refs.modal.classList.add('flex'); };
    const closeModal = () => { refs.modal.classList.add('hidden'); refs.modal.classList.remove('flex'); };

    const populateDepsChecklist = (selectedIds, currentId) => {
        const box = document.getElementById('task-dependencies');
        box.innerHTML = '';
        const options = state.tasks.filter(t => t.id !== currentId);
        if (!options.length) { box.innerHTML = '<p class="text-slate-400 p-1">No other tasks yet.</p>'; return; }
        options.forEach(t => {
            const row = document.createElement('label');
            row.className = 'flex items-center gap-2 px-1 py-0.5 rounded hover:bg-white cursor-pointer';
            row.innerHTML = `<input type="checkbox" value="${t.id}" ${selectedIds.includes(t.id) ? 'checked' : ''} class="dep-check h-3.5 w-3.5 rounded border-slate-300 text-[#006858] focus:ring-emerald-500">
                <span class="truncate font-mono text-[10px] text-slate-400">#${t.id}</span>
                <span class="truncate">${esc(t.name)}</span>`;
            box.appendChild(row);
        });
    };

    const populateParentSelect = (selectedId, currentId) => {
        const sel = document.getElementById('task-parent');
        sel.innerHTML = '<option value="">— None (top level) —</option>';
        state.tasks.forEach(t => {
            if (t.id === currentId) return;
            if (currentId !== null && isDescendantOf(t.id, currentId)) return; // no cycles
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.text = `#${t.id} ${t.name}`;
            if (selectedId === t.id) opt.selected = true;
            sel.appendChild(opt);
        });
    };

    const syncDurationFromDates = () => {
        const s = parseDate(document.getElementById('task-start').value);
        const e = parseDate(document.getElementById('task-end').value);
        if (s && e && e >= s) document.getElementById('task-duration').value = daysBetween(s, e) + 1;
    };
    const syncEndFromDuration = () => {
        const s = parseDate(document.getElementById('task-start').value);
        const d = parseInt(document.getElementById('task-duration').value, 10);
        if (s && Number.isFinite(d) && d >= 1) document.getElementById('task-end').value = fmtDate(addDays(s, d - 1));
    };
    const applyMilestoneUI = () => {
        const ms = document.getElementById('task-milestone').checked;
        document.getElementById('end-date-wrap').style.opacity = ms ? '.4' : '1';
        document.getElementById('duration-wrap').style.opacity = ms ? '.4' : '1';
        document.getElementById('task-end').disabled = ms;
        document.getElementById('task-duration').disabled = ms;
        if (ms) { document.getElementById('task-end').value = document.getElementById('task-start').value; document.getElementById('task-duration').value = 1; }
    };

    /* =========================================================
       13. GLOBAL APP API + EVENT WIRING
       ========================================================= */
    window.app = {
        toggleSort: (m) => { state.sortBy = m; persist(); render(); },
        toggleCollapse: (id) => {
            if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id);
            persist(); render();
        },
        loadSample: () => { snapshot(); state.tasks = hospitalTemplate.map(normaliseTask); state.collapsed = new Set(); persist(); render(); toast('Sample project loaded'); },
        editTask: (id) => {
            const t = byId(id);
            if (!t) return;
            document.getElementById('modal-title').innerText = 'Edit Task';
            document.getElementById('task-id').value = t.id;
            document.getElementById('task-name').value = t.name;
            document.getElementById('task-group').value = t.group;
            document.getElementById('task-start').value = t.start;
            document.getElementById('task-end').value = t.end;
            document.getElementById('task-progress').value = t.progress;
            document.getElementById('progress-val').innerText = t.progress + '%';
            document.getElementById('task-color').value = t.color;
            document.getElementById('task-milestone').checked = t.milestone;
            document.getElementById('task-notes').value = t.notes || '';
            populateParentSelect(t.parentId, t.id);
            populateDepsChecklist(t.dependencies, t.id);
            syncDurationFromDates();
            applyMilestoneUI();
            const del = document.getElementById('delete-task-btn');
            del.classList.remove('opacity-0', 'pointer-events-none');
            openModal();
        }
    };

    document.getElementById('add-task-btn').onclick = () => {
        refs.form.reset();
        document.getElementById('modal-title').innerText = 'New Task';
        document.getElementById('task-id').value = '';
        document.getElementById('task-color').value = '#006858';
        document.getElementById('task-start').value = fmtDate(todayUTC());
        document.getElementById('task-end').value = fmtDate(addDays(todayUTC(), 4));
        document.getElementById('progress-val').innerText = '0%';
        populateParentSelect(null, null);
        populateDepsChecklist([], null);
        syncDurationFromDates();
        applyMilestoneUI();
        document.getElementById('delete-task-btn').classList.add('opacity-0', 'pointer-events-none');
        openModal();
    };

    refs.form.onsubmit = (e) => {
        e.preventDefault();
        const idVal = document.getElementById('task-id').value;
        const currentId = idVal ? parseInt(idVal, 10) : null;
        const milestone = document.getElementById('task-milestone').checked;
        const start = document.getElementById('task-start').value;
        let end = milestone ? start : document.getElementById('task-end').value;
        if (!start) { toast('A start date is required.', true); return; }
        if (!end) end = start;
        if (parseDate(end) < parseDate(start)) { toast('The end date cannot be before the start date.', true); return; }

        const deps = [...document.querySelectorAll('#task-dependencies .dep-check:checked')].map(c => parseInt(c.value, 10));
        const parentVal = document.getElementById('task-parent').value;
        const parentId = parentVal === '' ? null : parseInt(parentVal, 10);

        const newId = currentId !== null ? currentId : (state.tasks.length ? Math.max(...state.tasks.map(t => t.id)) + 1 : 1);
        if (createsDepCycle(newId, deps)) { toast('Those dependencies would create a loop. Remove the circular link.', true); return; }
        if (parentId !== null && currentId !== null && (parentId === currentId || isDescendantOf(parentId, currentId))) {
            toast('A task cannot be placed inside its own subtask.', true); return;
        }
        if (deps.includes(parentId)) { toast('A task cannot depend on its own parent — the parent dates roll up from it.', true); return; }

        snapshot();
        const taskData = {
            name: document.getElementById('task-name').value.trim() || 'Task',
            group: document.getElementById('task-group').value.trim() || 'General',
            start, end,
            progress: parseInt(document.getElementById('task-progress').value, 10) || 0,
            color: document.getElementById('task-color').value,
            dependencies: deps,
            parentId,
            milestone,
            notes: document.getElementById('task-notes').value
        };
        if (currentId !== null) {
            const idx = state.tasks.findIndex(t => t.id === currentId);
            state.tasks[idx] = { ...state.tasks[idx], ...taskData };
        } else {
            state.tasks.push(normaliseTask({ id: newId, ...taskData }));
        }
        computeEffective();
        cascadeDates(newId);
        closeModal();
        persist();
        render();
        refreshGroupSuggestions();
    };

    document.getElementById('delete-task-btn').onclick = () => {
        const id = parseInt(document.getElementById('task-id').value, 10);
        const kids = childrenOf(id);
        const msg = kids.length
            ? `Delete this task? Its ${kids.length} subtask(s) will be kept and moved to the top level.`
            : 'Delete this task?';
        if (!confirm(msg)) return;
        snapshot();
        state.tasks = state.tasks.filter(t => t.id !== id);
        state.tasks.forEach(t => {
            t.dependencies = t.dependencies.filter(d => d !== id);
            if (t.parentId === id) t.parentId = null;
        });
        state.collapsed.delete(id);
        closeModal();
        persist();
        render();
    };

    document.getElementById('cancel-btn').onclick = closeModal;
    document.getElementById('close-modal-x').onclick = closeModal;
    refs.modal.addEventListener('mousedown', (e) => { if (e.target === refs.modal) closeModal(); });

    document.getElementById('task-progress').oninput = (e) => document.getElementById('progress-val').innerText = e.target.value + '%';
    document.getElementById('task-start').onchange = () => { if (document.getElementById('task-milestone').checked) document.getElementById('task-end').value = document.getElementById('task-start').value; syncDurationFromDates(); };
    document.getElementById('task-end').onchange = syncDurationFromDates;
    document.getElementById('task-duration').oninput = syncEndFromDuration;
    document.getElementById('task-milestone').onchange = applyMilestoneUI;

    document.getElementById('view-mode').onchange = (e) => { state.viewMode = e.target.value; persist(); render(); };
    document.getElementById('subtask-mode').onchange = (e) => { state.subtaskMode = e.target.value; persist(); render(); };
    document.getElementById('toggle-critical').onclick = (e) => {
        state.showCriticalPath = !state.showCriticalPath;
        e.currentTarget.classList.toggle('active-toggle', state.showCriticalPath);
        render();
    };
    document.getElementById('search-input').oninput = (e) => { state.filterTerm = e.target.value; render(); };
    document.getElementById('expand-all-btn').onclick = () => { state.collapsed = new Set(); persist(); render(); };
    document.getElementById('collapse-all-btn').onclick = () => {
        state.collapsed = new Set(state.tasks.filter(t => hasChildren(t.id)).map(t => t.id));
        persist(); render();
    };
    document.getElementById('undo-btn').onclick = undo;

    document.getElementById('today-btn').onclick = () => {
        if (state.activeTab !== 'timeline') switchTab('timeline');
        const tNow = todayUTC();
        if (!state.minDate || tNow < state.minDate) { toast('Today is outside this project timeline.'); return; }
        const tx = state.listWidth + daysBetween(state.minDate, tNow) * ppd();
        refs.container.scrollTo({ left: Math.max(0, tx - refs.container.clientWidth / 2), behavior: 'smooth' });
    };

    const switchTab = (tab) => {
        state.activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
            const active = b.dataset.tab === tab;
            b.classList.toggle('bg-white', active);
            b.classList.toggle('text-[#006858]', active);
            b.classList.toggle('text-white/80', !active);
        });
        refs.container.classList.toggle('hidden', tab !== 'timeline');
        refs.insights.classList.toggle('hidden', tab !== 'insights');
        if (tab === 'insights') renderInsights();
    };
    document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

    document.getElementById('new-project-btn').onclick = () => {
        if (!confirm('Clear this project and start empty?\n\nYour browser autosave will be replaced, but any project files you saved to disk are untouched.')) return;
        snapshot();
        state.tasks = [];
        state.collapsed = new Set();
        persist();
        render();
    };

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) openFile(file);
        e.target.value = ''; // allow re-opening the same file
    };
    document.getElementById('print-btn').onclick = openPrintPanel;
    document.getElementById('save-json-btn').onclick = saveProjectJSON;
    document.getElementById('download-btn').onclick = exportExcel;
    document.getElementById('download-html-btn').onclick = saveHTMLCopy;

    document.getElementById('project-title').onchange = persist;

    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !refs.modal.classList.contains('flex')) { e.preventDefault(); undo(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); openPrintPanel(); }
        if (e.key === 'Escape' && refs.modal.classList.contains('flex')) closeModal();
        if (e.key === 'Escape') closePrintPanel();
    });

    let resizeTimer = null;
    window.onresize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            state.listWidth = window.innerWidth < 768 ? 170 : 420;
            render();
        }, 150);
    };

    const refreshGroupSuggestions = () => {
        const list = document.getElementById('group-suggestions');
        list.innerHTML = '';
        [...new Set(state.tasks.map(t => t.group || 'General'))].forEach(g => {
            const opt = document.createElement('option');
            opt.value = g;
            list.appendChild(opt);
        });
    };

    // --- Boot ---
    refreshGroupSuggestions();
    render();
});

</script>
</body>
</html>
