<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE Project Gantt Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://assets.hse.ie/static/hse-frontend/assets/favicons/favicon.ico">
<style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

    .gantt-chart-container::-webkit-scrollbar { width: 10px; height: 10px; }
    .gantt-chart-container::-webkit-scrollbar-track { background: #f1f5f9; }
    .gantt-chart-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid #f1f5f9; }
    .gantt-chart-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .gantt-tooltip {
        visibility: hidden; opacity: 0; transition: opacity .15s;
        pointer-events: none; position: absolute; z-index: 60;
    }
    .gantt-bar-wrapper:hover .gantt-tooltip { visibility: visible; opacity: 1; }

    .gantt-bar-wrapper { cursor: grab; }
    .gantt-bar-wrapper.summary-bar { cursor: pointer; }
    .gantt-bar-wrapper.dragging { cursor: grabbing; opacity: .85; }
    .resize-handle { cursor: ew-resize; }

    .critical-path-highlight { box-shadow: 0 0 0 2px #ef4444, 0 3px 10px rgba(239,68,68,.35); }

    .dependency-arrow { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .dependency-arrow.critical { stroke: #ef4444; stroke-width: 2.2; stroke-dasharray: 4; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -8; } }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
        background: #059669; cursor: pointer; border-radius: 50%;
        border: 2px solid white; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }

    .group-header-row { background: linear-gradient(to right, #eef2f6, #ffffff); border-bottom: 2px solid #e2e8f0; }
    .sort-header:hover { color: #059669; cursor: pointer; background-color: #f0fdf4; }

    .toolbar-btn { transition: background .15s; }
    .toolbar-btn.active-toggle { background: rgba(0,0,0,.45) !important; }

    .toast {
        animation: toastIn .25s ease-out;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .kpi-card { border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; }

    /* Print pages are built by the app so wide programmes tile correctly */
    #print-root { display: none; }
    .join-mark {
        position: absolute; top: -13px; left: 0; font-size: 8px; font-weight: 700;
        color: #94a3b8; font-family: Inter, sans-serif;
    }

    @media print {
        .no-print { display: none !important; }
        html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; height: auto !important; }
        body > div.max-w-7xl, #toast-wrap, #task-modal, #print-panel { display: none !important; }
        #print-root { display: block !important; }
        .print-page {
            page-break-after: always; break-after: page;
            page-break-inside: avoid; break-inside: avoid;
            overflow: hidden; position: relative;
        }
        .print-page:last-child { page-break-after: auto; break-after: auto; }
        #print-root * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        ::-webkit-scrollbar { display: none; }
    }
</style>
</head>
<body class="bg-slate-100 p-4 md:p-8 min-h-screen text-slate-800">

<div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col h-[calc(100vh-4rem)]">

    <!-- Header -->
    <header class="p-4 md:p-5 text-white flex flex-col gap-3 shrink-0" style="background-color:#006858;">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="flex items-center gap-4 min-w-0 flex-1">
                <div class="bg-white p-2 rounded-lg shadow-sm shrink-0">
                    <img src="https://www.esther.ie/wp-content/uploads/2022/05/HSE-Logo-Green-NEW-no-background.png" alt="HSE Logo" class="h-8 w-auto">
                </div>
                <div class="min-w-0 w-full">
                    <input type="text" id="project-title" value="Project Timeline" class="text-xl md:text-2xl font-bold bg-transparent border-none text-white w-full focus:outline-none focus:ring-1 focus:ring-white/30 rounded px-1 -ml-1 placeholder-white/50 truncate">
                    <p class="text-[10px] font-medium opacity-80 uppercase tracking-wider">Strategic Planning Suite</p>
                </div>
            </div>
            <button id="add-task-btn" class="flex items-center gap-2 px-4 py-2 bg-white text-[#006858] font-bold text-xs uppercase tracking-wide rounded-xl hover:bg-emerald-50 transition-all shadow-lg active:scale-95 no-print shrink-0">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
                New Task
            </button>
        </div>

        <!-- Toolbar -->
        <div class="flex items-center gap-2 flex-wrap no-print">
            <div class="flex bg-black/20 p-0.5 rounded-xl border border-white/10" id="tab-switch">
                <button data-tab="timeline" class="tab-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-white text-[#006858]">Timeline</button>
                <button data-tab="insights" class="tab-btn px-3 py-1.5 text-xs font-bold rounded-lg text-white/80 hover:text-white">Insights</button>
            </div>

            <div class="flex bg-black/20 p-1 rounded-xl border border-white/10">
                <select id="view-mode" class="bg-transparent text-xs font-semibold text-white border-none focus:ring-0 cursor-pointer py-1 px-2">
                    <option value="day" class="text-slate-800">Days</option>
                    <option value="week" class="text-slate-800">Weeks</option>
                    <option value="month" class="text-slate-800">Months</option>
                    <option value="quarter" class="text-slate-800">Quarters</option>
                    <option value="year" class="text-slate-800">Years</option>
                </select>
            </div>

            <div class="flex bg-black/20 p-1 rounded-xl border border-white/10" title="Show or hide subtasks">
                <select id="subtask-mode" class="bg-transparent text-xs font-semibold text-white border-none focus:ring-0 cursor-pointer py-1 px-2">
                    <option value="all" class="text-slate-800">All tasks</option>
                    <option value="top" class="text-slate-800">No subtasks</option>
                </select>
            </div>

            <button id="toggle-critical" class="toolbar-btn flex items-center gap-2 px-3 py-2 bg-black/20 hover:bg-black/30 rounded-xl border border-white/10 text-xs font-semibold" title="Highlight the critical path">
                <span class="w-2 h-2 rounded-full bg-red-400"></span> Critical Path
            </button>

            <button id="today-btn" class="toolbar-btn px-3 py-2 bg-black/20 hover:bg-black/30 rounded-xl border border-white/10 text-xs font-semibold" title="Scroll to today">Today</button>

            <div class="w-px h-6 bg-white/20 mx-1 hidden md:block"></div>

            <button id="undo-btn" title="Undo (Ctrl+Z)" class="toolbar-btn p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
            </button>

            <label for="file-input" class="toolbar-btn cursor-pointer p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10" title="Open a project file (.json, .xlsx, .xls, .csv)">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            </label>
            <input type="file" id="file-input" class="hidden" accept=".json,.xlsx,.xls,.csv">

            <button id="save-json-btn" title="Save project file (new time-stamped file, never overwrites)" class="toolbar-btn p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
            </button>

            <button id="download-btn" title="Export to Excel (new time-stamped file)" class="toolbar-btn p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </button>

            <button id="download-html-btn" title="Save as interactive HTML copy (new time-stamped file)" class="toolbar-btn p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
            </button>

            <button id="print-btn" title="Print setup — tile across sheets or fit to one" class="toolbar-btn p-2 bg-white/10 hover:bg-white/20 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            </button>

            <button id="new-project-btn" title="Clear project (start empty)" class="toolbar-btn p-2 bg-red-500/80 hover:bg-red-600 rounded-xl border border-white/10">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </header>

    <!-- Stats & Filter Bar -->
    <div class="grid grid-cols-1 md:grid-cols-12 border-b border-slate-200 bg-white shrink-0 no-print shadow-sm z-20">
        <div class="md:col-span-8 grid grid-cols-5 divide-x divide-slate-100">
            <div class="p-3 text-center md:text-left">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total</p>
                <p id="stat-total" class="text-xl font-bold text-slate-700 leading-none mt-1">0</p>
            </div>
            <div class="p-3">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Progress</p>
                <div class="flex items-center gap-2 mt-1">
                    <p id="stat-progress" class="text-xl font-bold text-slate-700 leading-none">0%</p>
                    <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden max-w-[60px]">
                        <div id="stat-progress-bar" class="h-full bg-[#006858] transition-all duration-500" style="width:0%"></div>
                    </div>
                </div>
            </div>
            <div class="p-3 text-center md:text-left">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Done</p>
                <p id="stat-completed" class="text-xl font-bold text-emerald-600 leading-none mt-1">0</p>
            </div>
            <div class="p-3 text-center md:text-left">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Pending</p>
                <p id="stat-pending" class="text-xl font-bold text-amber-500 leading-none mt-1">0</p>
            </div>
            <div class="p-3 text-center md:text-left">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Overdue</p>
                <p id="stat-overdue" class="text-xl font-bold text-red-500 leading-none mt-1">0</p>
            </div>
        </div>
        <div class="md:col-span-4 p-3 flex items-center gap-2 border-t md:border-t-0 md:border-l border-slate-100 bg-slate-50/50">
            <div class="relative flex-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="search-input" placeholder="Filter tasks..." class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all outline-none">
            </div>
            <button id="expand-all-btn" title="Expand all subtasks" class="p-1.5 border border-slate-200 rounded-lg text-slate-500 hover:bg-white hover:text-emerald-700">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <button id="collapse-all-btn" title="Collapse all subtasks" class="p-1.5 border border-slate-200 rounded-lg text-slate-500 hover:bg-white hover:text-emerald-700">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
            </button>
        </div>
    </div>

    <!-- Timeline -->
    <div id="gantt-chart-container" class="gantt-chart-container overflow-auto flex-1 relative bg-slate-50">
        <div id="gantt-chart" class="relative"></div>
    </div>

    <!-- Insights -->
    <div id="insights-view" class="hidden overflow-auto flex-1 bg-slate-50 p-4 md:p-6 no-print"></div>

    <footer class="p-3 bg-white border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center text-[10px] text-slate-400 shrink-0 gap-2 no-print">
        <div class="flex items-center gap-2">
            <span class="font-medium text-[#006858]">HSE Project Planner</span>
            <span class="text-slate-300">|</span>
            <span id="save-status">Autosave ready</span>
        </div>
        <p class="uppercase tracking-widest font-bold opacity-60">Created by Dave Maher &copy; 2026</p>
    </footer>
</div>

<!-- Task Modal -->
<div id="task-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 max-h-[92vh] flex flex-col">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
            <h2 id="modal-title" class="text-lg font-bold text-slate-800">Task Details</h2>
            <button id="close-modal-x" class="text-slate-400 hover:text-red-500 transition-colors">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        <form id="task-form" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="task-id">

            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Task Name</label>
                    <input type="text" id="task-name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none text-sm font-medium" placeholder="e.g. Phase 1 Design" required>
                </div>
                <div class="col-span-2 sm:col-span-1">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Group</label>
                    <input type="text" id="task-group" list="group-suggestions" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none text-sm" placeholder="General">
                    <datalist id="group-suggestions"></datalist>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Parent Task</label>
                    <select id="task-parent" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></select>
                </div>
                <div class="flex items-end pb-2">
                    <label class="flex items-center gap-2 text-sm font-medium text-slate-600 cursor-pointer">
                        <input type="checkbox" id="task-milestone" class="h-4 w-4 rounded border-slate-300 text-[#006858] focus:ring-emerald-500">
                        Milestone (single date)
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Start Date</label>
                    <input type="date" id="task-start" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-600" required>
                </div>
                <div id="end-date-wrap">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">End Date</label>
                    <input type="date" id="task-end" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-600">
                </div>
                <div id="duration-wrap">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Duration (d)</label>
                    <input type="number" id="task-duration" min="1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-slate-600">
                </div>
            </div>

            <div class="grid grid-cols-12 gap-4 items-end">
                <div class="col-span-4">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Colour</label>
                    <input type="color" id="task-color" class="h-9 w-full p-1 bg-white border border-slate-200 rounded-lg cursor-pointer">
                </div>
                <div class="col-span-8">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 flex justify-between">
                        <span>Progress</span><span id="progress-val" class="text-[#006858]">0%</span>
                    </label>
                    <input type="range" id="task-progress" min="0" max="100" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#006858]">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Depends On (must finish first)</label>
                <div id="task-dependencies" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg h-28 overflow-y-auto text-xs space-y-1"></div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Notes</label>
                <textarea id="task-notes" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none text-sm" placeholder="Optional notes..."></textarea>
            </div>

            <div class="pt-2 flex items-center justify-between border-t border-slate-100 mt-2">
                <button type="button" id="delete-task-btn" class="text-red-500 hover:text-red-700 text-xs font-bold uppercase transition-colors opacity-0 pointer-events-none">Delete</button>
                <div class="flex gap-3">
                    <button type="button" id="cancel-btn" class="px-4 py-2 bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg hover:bg-slate-200 transition-colors">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-[#006858] text-white text-sm font-bold rounded-lg hover:bg-emerald-700 shadow-md shadow-emerald-200 transition-all">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="toast-wrap" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[80] space-y-2 no-print"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    /* =========================================================
       1. CONSTANTS & DATE ENGINE (all maths in UTC days)
       ========================================================= */
    const DAY = 86400000;
    const ROW_H = 40;
    const GROUP_H = 30;
    const STORAGE_KEY = 'hse-gantt-planner-v2';
    const LEGACY_KEY = 'gantt-pro-data';

    // One scale per view: pixels per DAY. Everything derives from this,
    // so bars, grid, arrows and drag are identical maths in every view.
    const VIEWS = {
        day:     { ppd: 42,   padBefore: 7,   padAfter: 21 },
        week:    { ppd: 9,    padBefore: 14,  padAfter: 28 },
        month:   { ppd: 2.4,  padBefore: 31,  padAfter: 62 },
        quarter: { ppd: 1.05, padBefore: 92,  padAfter: 120 },
        year:    { ppd: 0.45, padBefore: 180, padAfter: 366 }
    };

    const parseDate = (s) => {
        if (s instanceof Date) return new Date(Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()));
        if (!s) return null;
        const m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
        const d = new Date(s);
        return isNaN(d) ? null : new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    };
    const fmtDate = (d) => d.toISOString().slice(0, 10);
    const addDays = (d, n) => new Date(d.getTime() + n * DAY);
    const daysBetween = (a, b) => Math.round((b - a) / DAY);
    const todayUTC = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
    const displayDate = (s) => { const d = parseDate(s); return d ? d.toLocaleDateString('en-IE', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }) : ''; };
    const getWeekNumber = (d) => {
        const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
        t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
        const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
        return Math.ceil(((t - ys) / DAY + 1) / 7);
    };
    const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const slug = (s) => (String(s || 'Project').trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_').slice(0, 40)) || 'Project';
    const fileStamp = () => {
        const n = new Date();
        const p = (x) => String(x).padStart(2, '0');
        return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}`;
    };

    /* =========================================================
       2. TEMPLATE, STATE, MIGRATION
       ========================================================= */
    const hospitalTemplate = [
        { id: 1,  name: 'Site Clearance & Excavation', group: '1. Site Preparation', start: '2026-03-02', end: '2026-04-15', progress: 100, color: '#8b5cf6', dependencies: [],     parentId: null, milestone: false, notes: '' },
        { id: 2,  name: 'Deep Foundation Piling',      group: '1. Site Preparation', start: '2026-04-16', end: '2026-06-30', progress: 60,  color: '#8b5cf6', dependencies: [1],    parentId: null, milestone: false, notes: '' },
        { id: 3,  name: 'Structural Steel Frame',      group: '2. Structure',        start: '2026-07-01', end: '2026-11-15', progress: 20,  color: '#0ea5e9', dependencies: [2],    parentId: null, milestone: false, notes: 'Summary of zone erection' },
        { id: 13, name: 'Frame Erection — Zone A',     group: '2. Structure',        start: '2026-07-01', end: '2026-09-15', progress: 35,  color: '#38bdf8', dependencies: [],     parentId: 3,    milestone: false, notes: '' },
        { id: 14, name: 'Frame Erection — Zone B',     group: '2. Structure',        start: '2026-09-01', end: '2026-11-15', progress: 5,   color: '#38bdf8', dependencies: [13],   parentId: 3,    milestone: false, notes: '' },
        { id: 4,  name: 'Concrete Floor Slabs',        group: '2. Structure',        start: '2026-08-01', end: '2026-12-01', progress: 10,  color: '#0ea5e9', dependencies: [3],    parentId: null, milestone: false, notes: '' },
        { id: 5,  name: 'Roofing & Weatherproofing',   group: '3. Exterior',         start: '2026-11-16', end: '2027-02-01', progress: 0,   color: '#10b981', dependencies: [3],    parentId: null, milestone: false, notes: '' },
        { id: 6,  name: 'Window & Façade Install',     group: '3. Exterior',         start: '2027-02-02', end: '2027-04-01', progress: 0,   color: '#10b981', dependencies: [5],    parentId: null, milestone: false, notes: '' },
        { id: 7,  name: 'HVAC & Ductwork',             group: '4. MEP Systems',      start: '2026-12-02', end: '2027-06-01', progress: 0,   color: '#f59e0b', dependencies: [4],    parentId: null, milestone: false, notes: '' },
        { id: 8,  name: 'Medical Gas Plumbing',        group: '4. MEP Systems',      start: '2027-02-01', end: '2027-05-15', progress: 0,   color: '#f59e0b', dependencies: [4],    parentId: null, milestone: false, notes: '' },
        { id: 9,  name: 'Electrical Wiring (ICU)',     group: '4. MEP Systems',      start: '2027-06-02', end: '2027-09-01', progress: 0,   color: '#f59e0b', dependencies: [7],    parentId: null, milestone: false, notes: '' },
        { id: 10, name: 'Internal Partitions',         group: '5. Interior Fit-out', start: '2027-06-02', end: '2027-08-01', progress: 0,   color: '#ec4899', dependencies: [7, 8], parentId: null, milestone: false, notes: '' },
        { id: 11, name: 'Operating Theatre Install',   group: '5. Interior Fit-out', start: '2027-08-02', end: '2027-10-01', progress: 0,   color: '#ec4899', dependencies: [10],   parentId: null, milestone: false, notes: '' },
        { id: 12, name: 'Final Commissioning',         group: '6. Handover',         start: '2027-10-02', end: '2027-12-01', progress: 0,   color: '#64748b', dependencies: [9, 11],parentId: null, milestone: false, notes: '' },
        { id: 15, name: 'Practical Completion',        group: '6. Handover',         start: '2027-12-01', end: '2027-12-01', progress: 0,   color: '#006858', dependencies: [12],   parentId: null, milestone: true,  notes: 'Handover to operations' }
    ];

    const normaliseTask = (t, i) => ({
        id: Number.isFinite(+t.id) ? +t.id : i + 1,
        name: String(t.name || 'Task'),
        group: String(t.group || 'General'),
        start: fmtDate(parseDate(t.start) || todayUTC()),
        end: fmtDate(parseDate(t.end) || parseDate(t.start) || todayUTC()),
        progress: Math.max(0, Math.min(100, Math.round(+t.progress || 0))),
        color: /^#[0-9a-fA-F]{6}$/.test(t.color || '') ? t.color : '#10b981',
        dependencies: Array.isArray(t.dependencies) ? t.dependencies.map(Number).filter(Number.isFinite) : [],
        parentId: (t.parentId === null || t.parentId === undefined || t.parentId === '') ? null : +t.parentId,
        milestone: !!t.milestone,
        notes: String(t.notes || '')
    });

    const loadInitial = () => {
        const cached = window.CACHED_STATE || null;
        if (cached && Array.isArray(cached.tasks)) return cached;
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch (e) { /* corrupt autosave — fall through */ }
        try {
            const legacy = localStorage.getItem(LEGACY_KEY);
            if (legacy) return { tasks: JSON.parse(legacy) };
        } catch (e) { /* ignore */ }
        return { tasks: hospitalTemplate };
    };

    const saved = loadInitial();
    let state = {
        tasks: (Array.isArray(saved.tasks) ? saved.tasks : hospitalTemplate).map(normaliseTask),
        title: saved.title || null,
        viewMode: VIEWS[saved.viewMode] ? saved.viewMode : 'day',
        sortBy: saved.sortBy || 'start',
        subtaskMode: saved.subtaskMode === 'top' ? 'top' : 'all',
        collapsed: new Set(Array.isArray(saved.collapsed) ? saved.collapsed : []),
        showCriticalPath: false,
        filterTerm: '',
        activeTab: 'timeline',
        minDate: null,
        listWidth: window.innerWidth < 768 ? 170 : 420
    };
    // Repair any orphaned parent references from older files
    const idSet = new Set(state.tasks.map(t => t.id));
    state.tasks.forEach(t => {
        if (t.parentId !== null && !idSet.has(t.parentId)) t.parentId = null;
        t.dependencies = t.dependencies.filter(d => idSet.has(d) && d !== t.id);
    });

    if (state.title) document.getElementById('project-title').value = state.title;
    document.getElementById('view-mode').value = state.viewMode;
    document.getElementById('subtask-mode').value = state.subtaskMode;

    const refs = {
        chart: document.getElementById('gantt-chart'),
        container: document.getElementById('gantt-chart-container'),
        insights: document.getElementById('insights-view'),
        modal: document.getElementById('task-modal'),
        form: document.getElementById('task-form'),
        saveStatus: document.getElementById('save-status')
    };

    const byId = (id) => state.tasks.find(t => t.id === id);
    const childrenOf = (id) => state.tasks.filter(t => t.parentId === id);
    const hasChildren = (id) => state.tasks.some(t => t.parentId === id);
    const isLeaf = (t) => !hasChildren(t.id);
    const ppd = () => VIEWS[state.viewMode].ppd;

    /* =========================================================
       3. SUMMARY ROLL-UP (effective dates for parent tasks)
       ========================================================= */
    let effMap = {};
    const computeEffective = () => {
        effMap = {};
        const visit = (t, trail) => {
            if (effMap[t.id]) return effMap[t.id];
            if (trail.has(t.id)) { // parent cycle safety net
                return effMap[t.id] = { start: t.start, end: t.end, progress: t.progress, dur: daysBetween(parseDate(t.start), parseDate(t.end)) + 1 };
            }
            trail.add(t.id);
            const kids = childrenOf(t.id);
            if (!kids.length) {
                const dur = daysBetween(parseDate(t.start), parseDate(t.end)) + 1;
                return effMap[t.id] = { start: t.start, end: t.end, progress: t.progress, dur };
            }
            let minS = Infinity, maxE = -Infinity, wSum = 0, pSum = 0;
            kids.forEach(k => {
                const e = visit(k, trail);
                const s = parseDate(e.start).getTime(), en = parseDate(e.end).getTime();
                if (s < minS) minS = s;
                if (en > maxE) maxE = en;
                wSum += e.dur;
                pSum += e.progress * e.dur;
            });
            trail.delete(t.id);
            return effMap[t.id] = {
                start: fmtDate(new Date(minS)),
                end: fmtDate(new Date(maxE)),
                progress: wSum ? Math.round(pSum / wSum) : 0,
                dur: daysBetween(new Date(minS), new Date(maxE)) + 1
            };
        };
        state.tasks.forEach(t => visit(t, new Set()));
    };

    /* =========================================================
       4. LOGIC: cycles, cascade, critical path (date-based CPM)
       ========================================================= */
    const createsDepCycle = (taskId, deps) => {
        const stack = [...deps], seen = new Set();
        while (stack.length) {
            const id = stack.pop();
            if (id === taskId) return true;
            if (seen.has(id)) continue;
            seen.add(id);
            const t = byId(id);
            if (t && t.dependencies) stack.push(...t.dependencies);
        }
        return false;
    };
    const isDescendantOf = (candidateId, ancestorId) => {
        let p = candidateId, guard = 0;
        while (p !== null && guard++ < 500) {
            if (p === ancestorId) return true;
            const t = byId(p);
            p = t ? t.parentId : null;
        }
        return false;
    };

    // Push successors forward so no task starts before its predecessors finish.
    const cascadeDates = (rootId) => {
        const q = [rootId];
        let guard = 0;
        while (q.length && guard++ < 5000) {
            const pid = q.shift();
            const succs = state.tasks.filter(t => t.dependencies.includes(pid));
            succs.forEach(child => {
                if (!isLeaf(child)) return; // summaries derive from children
                const parents = child.dependencies.map(byId).filter(Boolean);
                const maxEnd = parents.reduce((mx, p) => {
                    const e = parseDate((effMap[p.id] || p).end);
                    return e > mx ? e : mx;
                }, new Date(0));
                const nextStart = addDays(maxEnd, 1);
                if (parseDate(child.start) < nextStart) {
                    const dur = daysBetween(parseDate(child.start), parseDate(child.end));
                    child.start = fmtDate(nextStart);
                    child.end = fmtDate(addDays(nextStart, dur));
                    computeEffective();
                    q.push(child.id);
                }
            });
        }
    };

    // Total float per task from scheduled dates (backward pass over the
    // successor graph in reverse-topological order). slack <= 0 => critical.
    const computeCPM = () => {
        computeEffective();
        if (!state.tasks.length) return;
        const succsOf = (id) => state.tasks.filter(t => t.dependencies.includes(id));
        const projectEnd = state.tasks.reduce((mx, t) => {
            const e = parseDate(effMap[t.id].end);
            return e > mx ? e : mx;
        }, new Date(0));

        const order = [];
        const visited = new Set();
        const visit = (t) => {
            if (visited.has(t.id)) return;
            visited.add(t.id);
            succsOf(t.id).forEach(visit);
            order.push(t); // successors are pushed before their predecessors
        };
        state.tasks.forEach(visit);

        const latestFinish = {};
        order.forEach(t => {
            const ss = succsOf(t.id);
            if (!ss.length) {
                latestFinish[t.id] = projectEnd;
            } else {
                let minLS = Infinity;
                ss.forEach(s => {
                    const sEff = effMap[s.id];
                    const sLF = latestFinish[s.id] || parseDate(sEff.end);
                    const sLS = addDays(sLF, -(sEff.dur - 1));
                    const req = addDays(sLS, -1).getTime();
                    if (req < minLS) minLS = req;
                });
                latestFinish[t.id] = new Date(minLS);
            }
            t.slack = daysBetween(parseDate(effMap[t.id].end), latestFinish[t.id]);
            t.isCritical = t.slack <= 0;
        });
    };

    /* =========================================================
       5. ROW MODEL (hierarchy + filter + sort + collapse)
       ========================================================= */
    const sortSiblings = (arr) => [...arr].sort((a, b) => {
        const ea = effMap[a.id], eb = effMap[b.id];
        if (state.sortBy === 'end') return parseDate(ea.end) - parseDate(eb.end);
        if (state.sortBy === 'duration') return eb.dur - ea.dur;
        if (state.sortBy === 'name') return a.name.localeCompare(b.name);
        return parseDate(ea.start) - parseDate(eb.start);
    });

    const buildRows = () => {
        const term = state.filterTerm.toLowerCase();
        const matched = new Set();
        if (term) {
            state.tasks.forEach(t => {
                if (t.name.toLowerCase().includes(term) || (t.group || '').toLowerCase().includes(term)) {
                    matched.add(t.id);
                    let p = t.parentId, guard = 0;
                    while (p !== null && guard++ < 500) { matched.add(p); p = (byId(p) || {}).parentId ?? null; }
                }
            });
        }
        const include = (t) => !term || matched.has(t.id);

        const rows = [];
        const pushTask = (t, depth) => {
            if (!include(t)) return;
            rows.push({ type: 'task', task: t, depth });
            if (state.subtaskMode === 'top') return;
            if (state.collapsed.has(t.id)) return;
            sortSiblings(childrenOf(t.id)).forEach(c => pushTask(c, depth + 1));
        };

        const topLevel = state.tasks.filter(t => t.parentId === null);
        const sortedTop = [...topLevel].sort((a, b) => {
            const gA = (a.group || 'General').toLowerCase(), gB = (b.group || 'General').toLowerCase();
            if (gA !== gB) return gA.localeCompare(gB);
            return sortSiblings([a, b])[0] === a ? -1 : 1;
        });

        let currentGroup = null;
        sortedTop.forEach(t => {
            if (!include(t)) return;
            const g = t.group || 'General';
            if (g !== currentGroup) { currentGroup = g; rows.push({ type: 'group', label: g }); }
            pushTask(t, 0);
        });
        return rows;
    };

    /* =========================================================
       6. TIMELINE COLUMNS (all widths in exact days x ppd)
       ========================================================= */
    const buildColumns = (minD, maxD) => {
        const bottom = [], top = [];
        const scale = ppd();
        const clipDays = (a, b) => Math.max(0, daysBetween(a, b) + 1); // inclusive span

        const pushBottom = (unitStart, unitEndExcl, label, sub, weekend) => {
            const s = unitStart < minD ? minD : unitStart;
            const e = addDays(unitEndExcl, -1) > maxD ? maxD : addDays(unitEndExcl, -1);
            const w = clipDays(s, e) * scale;
            if (w > 0) bottom.push({ w, label, sub, weekend });
        };

        if (state.viewMode === 'day') {
            for (let d = new Date(minD); d <= maxD; d = addDays(d, 1)) {
                const wd = d.getUTCDay();
                pushBottom(d, addDays(d, 1), d.getUTCDate(), 'SMTWTFS'[wd], wd === 0 || wd === 6);
            }
        } else if (state.viewMode === 'week') {
            let d = new Date(minD);
            const dow = d.getUTCDay() || 7;
            if (dow !== 1) d = addDays(d, -(dow - 1));
            for (; d <= maxD; d = addDays(d, 7)) pushBottom(d, addDays(d, 7), 'W' + getWeekNumber(d), '', false);
        } else if (state.viewMode === 'month') {
            let d = new Date(Date.UTC(minD.getUTCFullYear(), minD.getUTCMonth(), 1));
            for (; d <= maxD; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) {
                const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
                pushBottom(d, next, d.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' }), '', false);
            }
        } else if (state.viewMode === 'quarter') {
            let d = new Date(Date.UTC(minD.getUTCFullYear(), Math.floor(minD.getUTCMonth() / 3) * 3, 1));
            for (; d <= maxD; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 3, 1))) {
                const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 3, 1));
                pushBottom(d, next, 'Q' + (Math.floor(d.getUTCMonth() / 3) + 1), '', false);
            }
        } else { // year
            let d = new Date(Date.UTC(minD.getUTCFullYear(), 0, 1));
            for (; d <= maxD; d = new Date(Date.UTC(d.getUTCFullYear() + 1, 0, 1))) {
                const next = new Date(Date.UTC(d.getUTCFullYear() + 1, 0, 1));
                pushBottom(d, next, String(d.getUTCFullYear()), '', false);
            }
        }

        // Top tier: months over days/weeks, years over months/quarters, decades none over years
        const pushTop = (unitStart, unitEndExcl, label) => {
            const s = unitStart < minD ? minD : unitStart;
            const e = addDays(unitEndExcl, -1) > maxD ? maxD : addDays(unitEndExcl, -1);
            const w = clipDays(s, e) * scale;
            if (w > 0) top.push({ w, label });
        };
        if (state.viewMode === 'day' || state.viewMode === 'week') {
            let d = new Date(Date.UTC(minD.getUTCFullYear(), minD.getUTCMonth(), 1));
            for (; d <= maxD; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) {
                const next = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
                pushTop(d, next, d.toLocaleString('en-GB', { month: 'short', timeZone: 'UTC' }) + ' ' + d.getUTCFullYear());
            }
        } else if (state.viewMode === 'month' || state.viewMode === 'quarter') {
            let d = new Date(Date.UTC(minD.getUTCFullYear(), 0, 1));
            for (; d <= maxD; d = new Date(Date.UTC(d.getUTCFullYear() + 1, 0, 1))) {
                const next = new Date(Date.UTC(d.getUTCFullYear() + 1, 0, 1));
                pushTop(d, next, String(d.getUTCFullYear()));
            }
        }
        return { bottom, top };
    };

    /* =========================================================
       7. RENDER
       ========================================================= */
    let rowY = {};       // task id -> y offset of its row within chart body
    let gridWidth = 0;   // px width of the timeline area

    const xOfDate = (dateStr) => daysBetween(state.minDate, parseDate(dateStr)) * ppd();
    const barGeom = (t) => {
        const e = effMap[t.id];
        const left = xOfDate(e.start);
        const width = Math.max((daysBetween(parseDate(e.start), parseDate(e.end)) + 1) * ppd(), 6);
        return { left, width, eff: e };
    };

    // Bounds from ALL tasks so every view and every printout shows the same schedule
    const computeBounds = () => {
        let minT = null, maxT = null;
        state.tasks.forEach(t => {
            const e = effMap[t.id];
            const s = parseDate(e.start), en = parseDate(e.end);
            if (!minT || s < minT) minT = s;
            if (!maxT || en > maxT) maxT = en;
        });
        if (!minT) { minT = todayUTC(); maxT = addDays(minT, 30); }
        const v = VIEWS[state.viewMode];
        minT = addDays(minT, -v.padBefore);
        maxT = addDays(maxT, v.padAfter);
        // Align grid origin to the view's natural unit start
        if (state.viewMode === 'week') { const dow = minT.getUTCDay() || 7; minT = addDays(minT, -(dow - 1)); }
        else if (state.viewMode === 'month') minT = new Date(Date.UTC(minT.getUTCFullYear(), minT.getUTCMonth(), 1));
        else if (state.viewMode === 'quarter') minT = new Date(Date.UTC(minT.getUTCFullYear(), Math.floor(minT.getUTCMonth() / 3) * 3, 1));
        else if (state.viewMode === 'year') minT = new Date(Date.UTC(minT.getUTCFullYear(), 0, 1));
        state.minDate = minT;
        gridWidth = (daysBetween(minT, maxT) + 1) * ppd();
        return { minT, maxT, cols: buildColumns(minT, maxT) };
    };

    const render = () => {
        computeCPM();
        const rows = buildRows();
        const LW = state.listWidth;

        if (!state.tasks.length) {
            refs.chart.style.width = '100%';
            refs.chart.innerHTML = `
                <div class="p-16 text-center text-slate-400">
                    <p class="text-sm font-semibold text-slate-500 mb-1">This project is empty.</p>
                    <p class="text-xs mb-5">Add a task, open a saved file, or load the sample project.</p>
                    <div class="flex justify-center gap-3">
                        <button onclick="app.loadSample()" class="px-4 py-2 bg-[#006858] text-white text-xs font-bold rounded-lg hover:bg-emerald-700">Load sample project</button>
                        <button onclick="document.getElementById('file-input').click()" class="px-4 py-2 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-lg hover:bg-slate-50">Open a file</button>
                    </div>
                </div>`;
            updateStats();
            return;
        }
        if (!rows.some(r => r.type === 'task')) {
            refs.chart.style.width = '100%';
            refs.chart.innerHTML = `<div class="p-12 text-center text-slate-400 font-mono text-sm">No tasks match "${esc(state.filterTerm)}".</div>`;
            return;
        }

        const { minT, maxT, cols } = computeBounds();
        const hasTop = cols.top.length > 0;

        const sortIcon = (m) => state.sortBy === m ? ' ▼' : '';

        let html = '';
        // --- Header (sticky top) ---
        html += `<div class="flex sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
            <div class="flex-none bg-slate-50 text-[11px] text-slate-500 uppercase flex items-center border-r border-slate-200 sticky left-0 z-50" style="width:${LW}px">
                <div class="flex-1 px-3 font-bold cursor-pointer hover:text-emerald-600" onclick="app.toggleSort('name')">Task Name${sortIcon('name')}</div>
                <div class="w-[88px] px-2 hidden md:block font-bold border-l border-slate-100 sort-header" onclick="app.toggleSort('start')">Start${sortIcon('start')}</div>
                <div class="w-[88px] px-2 hidden md:block font-bold border-l border-slate-100 sort-header" onclick="app.toggleSort('end')">Finish${sortIcon('end')}</div>
                <div class="w-12 text-center hidden md:block font-bold border-l border-slate-100 sort-header" onclick="app.toggleSort('duration')">Dur${sortIcon('duration')}</div>
            </div>
            <div class="flex-none" style="width:${gridWidth}px">`;
        if (hasTop) {
            html += `<div class="flex h-5 border-b border-slate-100">`;
            cols.top.forEach(c => {
                html += `<div class="flex-none overflow-hidden text-left pl-1.5 text-[10px] font-bold text-slate-500 border-r border-slate-200 whitespace-nowrap" style="width:${c.w}px">${esc(c.label)}</div>`;
            });
            html += `</div>`;
        }
        html += `<div class="flex" style="height:${hasTop ? 31 : 40}px">`;
        cols.bottom.forEach(c => {
            html += `<div class="flex-none flex flex-col justify-center text-center border-r ${c.weekend ? 'bg-slate-100 border-slate-200' : 'border-slate-100'} overflow-hidden" style="width:${c.w}px">
                ${c.sub ? `<div class="text-[8px] text-slate-400 leading-none">${c.sub}</div>` : ''}
                <div class="text-[10px] font-bold text-slate-600 leading-tight whitespace-nowrap">${esc(c.label)}</div>
            </div>`;
        });
        html += `</div></div></div>`;

        // --- Body (rows + grid layer + arrows + today line) ---
        html += `<div id="gantt-body" class="relative">`;

        // Grid layer drawn once (not per row) — cheap and always aligned
        html += `<div class="absolute top-0 bottom-0 pointer-events-none" style="left:${LW}px;width:${gridWidth}px;z-index:0"><div class="flex h-full">`;
        cols.bottom.forEach(c => {
            html += `<div class="flex-none h-full border-r ${c.weekend ? 'bg-slate-100/70 border-slate-200/70' : 'border-slate-200/60'}" style="width:${c.w}px"></div>`;
        });
        html += `</div></div>`;

        // Today line
        const tNow = todayUTC();
        if (tNow >= minT && tNow <= maxT) {
            const tx = LW + (daysBetween(minT, tNow) + 0.5) * ppd();
            html += `<div class="absolute top-0 bottom-0 w-px bg-red-500/80 pointer-events-none" style="left:${tx}px;z-index:5">
                <div class="absolute -top-0 -left-[14px] text-[8px] font-bold text-white bg-red-500 rounded-b px-1 no-print">TODAY</div>
            </div>`;
        }

        // Rows
        rowY = {};
        let y = 0;
        rows.forEach(r => {
            if (r.type === 'group') {
                html += `<div class="group-header-row flex" style="height:${GROUP_H}px;width:${LW + gridWidth}px">
                    <div class="sticky left-0 flex items-center px-3 text-[10px] font-bold uppercase text-slate-600 tracking-wider" style="width:${LW}px;z-index:35;background:#e8edf2;border-right:1px solid #cbd5e1;box-shadow:2px 0 4px -2px rgba(15,23,42,.18)">&#128193; ${esc(r.label)}</div>
                </div>`;
                y += GROUP_H;
                return;
            }
            const t = r.task;
            rowY[t.id] = y;
            const g = barGeom(t);
            const leaf = isLeaf(t);
            const critClass = state.showCriticalPath && t.isCritical ? 'critical-path-highlight' : '';
            const indent = 12 + r.depth * 18;
            const kids = hasChildren(t.id);
            const chev = kids && state.subtaskMode !== 'top'
                ? `<button class="mr-1 text-slate-400 hover:text-emerald-700 shrink-0" onclick="event.stopPropagation();app.toggleCollapse(${t.id})">
                     <svg class="h-3 w-3 transition-transform ${state.collapsed.has(t.id) ? '-rotate-90' : ''}" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
                   </button>`
                : (kids ? '' : `<span class="mr-1 w-3 shrink-0"></span>`);

            html += `<div class="task-row flex border-b border-slate-100 hover:bg-emerald-50/30 transition-colors relative" style="height:${ROW_H}px;width:${LW + gridWidth}px">
                <div class="flex-none flex items-center border-r border-slate-200 bg-white sticky left-0 group cursor-pointer" style="width:${LW}px;z-index:30;box-shadow:2px 0 4px -2px rgba(15,23,42,.18)" onclick="app.editTask(${t.id})">
                    <div class="flex-1 flex items-center text-xs ${kids ? 'font-bold text-slate-800' : 'font-semibold text-slate-700'} truncate group-hover:text-emerald-700" style="padding-left:${indent}px" title="${esc(t.name)}">
                        ${chev}<span class="truncate">${t.milestone ? '&#9670; ' : ''}${esc(t.name)}</span>
                    </div>
                    <div class="w-[88px] px-2 text-[10px] text-slate-500 border-l border-slate-100 hidden md:block truncate">${displayDate(g.eff.start)}</div>
                    <div class="w-[88px] px-2 text-[10px] text-slate-500 border-l border-slate-100 hidden md:block truncate">${displayDate(g.eff.end)}</div>
                    <div class="w-12 text-center text-[10px] font-mono text-slate-400 border-l border-slate-100 hidden md:block">${t.milestone ? '—' : g.eff.dur + 'd'}</div>
                </div>
                <div class="relative flex-none h-full" style="width:${gridWidth}px">`;

            if (t.milestone) {
                const cx = g.left + Math.min(ppd(), 42) / 2;
                html += `<div class="gantt-bar-wrapper absolute ${critClass}" data-id="${t.id}" data-leaf="1" data-ms="1"
                        style="left:${cx - 8}px;top:${ROW_H / 2 - 8}px;width:16px;height:16px;z-index:20">
                        <div class="w-3.5 h-3.5 rotate-45 border border-white shadow-md mx-auto mt-px" style="background:${t.color}"></div>
                        ${tooltipHTML(t, g)}
                    </div>`;
            } else if (!leaf) {
                html += `<div class="gantt-bar-wrapper summary-bar absolute rounded-sm ${critClass}" data-id="${t.id}"
                        style="left:${g.left}px;top:${ROW_H / 2 - 5}px;width:${g.width}px;height:9px;background:#334155;z-index:20" onclick="app.editTask(${t.id})">
                        <div class="h-full bg-emerald-400/60 pointer-events-none rounded-sm" style="width:${g.eff.progress}%"></div>
                        <div class="absolute -bottom-[5px] left-0 w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-t-[6px]" style="border-top-color:#334155"></div>
                        <div class="absolute -bottom-[5px] right-0 w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-t-[6px]" style="border-top-color:#334155"></div>
                        ${tooltipHTML(t, g)}
                    </div>`;
            } else {
                html += `<div class="gantt-bar-wrapper absolute h-6 rounded shadow-sm ${critClass}" data-id="${t.id}" data-leaf="1"
                        style="left:${g.left}px;top:${ROW_H / 2 - 12}px;width:${g.width}px;background-color:${t.color};z-index:20">
                        <div class="h-full bg-black/15 pointer-events-none rounded-l" style="width:${t.progress}%"></div>
                        ${g.width > 70 ? `<span class="absolute inset-0 flex items-center px-2 text-[10px] font-bold text-white drop-shadow truncate pointer-events-none">${esc(t.name)} · ${t.progress}%</span>` : ''}
                        <div class="resize-handle absolute right-0 top-0 h-full w-2.5" data-resize="1"></div>
                        ${tooltipHTML(t, g)}
                    </div>`;
            }
            html += `</div></div>`;
            y += ROW_H;
        });

        // Dependency arrows: pure maths from the same grid as the bars,
        // inside the chart so they scroll and print as one unit.
        html += buildArrowSVG(rows, y, LW);
        html += `</div>`; // end body

        refs.chart.style.width = `${LW + gridWidth}px`;
        refs.chart.innerHTML = html;
        setupDragEvents();
        updateStats();
        if (state.activeTab === 'insights') renderInsights();
    };

    const tooltipHTML = (t, g) => {
        const slackTxt = Number.isFinite(t.slack) ? (t.slack <= 0 ? 'Critical (no float)' : `Float: ${t.slack}d`) : '';
        return `<div class="gantt-tooltip bg-slate-800 text-white text-[10px] rounded-lg px-3 py-2 shadow-xl whitespace-nowrap" style="top:-8px;left:0;transform:translateY(-100%)">
            <div class="font-bold text-[11px] mb-0.5">${esc(t.name)}</div>
            <div>${displayDate(g.eff.start)} &rarr; ${displayDate(g.eff.end)} (${g.eff.dur}d)</div>
            <div>Progress: ${g.eff.progress}% ${slackTxt ? '&middot; ' + slackTxt : ''}</div>
            ${t.notes ? `<div class="text-slate-300 max-w-[240px] whitespace-normal mt-0.5">${esc(t.notes)}</div>` : ''}
        </div>`;
    };

    // Map a hidden task (collapsed subtask) to its nearest visible ancestor row
    const visibleAnchor = (id, yMap) => {
        const map = yMap || rowY;
        let cur = id, guard = 0;
        while (cur !== null && guard++ < 500) {
            if (map[cur] !== undefined) return cur;
            const t = byId(cur);
            cur = t ? t.parentId : null;
        }
        return null;
    };

    const buildArrowSVG = (rows, totalH, LW, yMap, svgW) => {
        const map = yMap || rowY;
        const width = svgW === undefined ? LW + gridWidth : svgW;
        let paths = '';
        state.tasks.forEach(task => {
            if (!task.dependencies.length) return;
            const toId = visibleAnchor(task.id, map);
            if (toId === null) return;
            task.dependencies.forEach(pid => {
                const fromId = visibleAnchor(pid, map);
                if (fromId === null || fromId === toId) return;
                const from = byId(fromId), to = byId(toId);
                const gF = barGeom(from), gT = barGeom(to);
                const x1 = LW + gF.left + (from.milestone ? Math.min(ppd(), 42) / 2 + 8 : gF.width);
                const y1 = map[fromId] + ROW_H / 2;
                const x2 = LW + gT.left + (to.milestone ? Math.min(ppd(), 42) / 2 - 9 : 0);
                const y2 = map[toId] + ROW_H / 2;
                const crit = state.showCriticalPath && from.isCritical && to.isCritical;
                let d;
                if (x2 >= x1 + 16) {
                    const bend = x1 + 8;
                    d = `M ${x1} ${y1} L ${bend} ${y1} L ${bend} ${y2} L ${x2 - 3} ${y2}`;
                } else {
                    // Successor starts left of predecessor's finish: route around
                    const yMid = y1 + (y2 > y1 ? ROW_H / 2 : -ROW_H / 2);
                    d = `M ${x1} ${y1} L ${x1 + 8} ${y1} L ${x1 + 8} ${yMid} L ${x2 - 12} ${yMid} L ${x2 - 12} ${y2} L ${x2 - 3} ${y2}`;
                }
                paths += `<path d="${d}" class="dependency-arrow ${crit ? 'critical' : ''}" marker-end="url(#arw-${crit ? 'c' : 'n'})"></path>`;
            });
        });
        return `<svg width="${width}" height="${totalH}" style="position:absolute;top:0;left:0;pointer-events:none;z-index:10" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arw-n" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path></marker>
                <marker id="arw-c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"></path></marker>
            </defs>${paths}</svg>`;
    };

    /* =========================================================
       8. DRAG: move whole bar, or resize from the right edge.
          getDateFromX is the exact inverse of xOfDate.
       ========================================================= */
    let drag = null;
    const setupDragEvents = () => {
        refs.chart.querySelectorAll('.gantt-bar-wrapper[data-leaf="1"]').forEach(el => {
            el.onpointerdown = (e) => {
                if (e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                const id = parseInt(el.dataset.id, 10);
                const t = byId(id);
                if (!t) return;
                drag = {
                    id,
                    el,
                    mode: (e.target.dataset && e.target.dataset.resize && !t.milestone) ? 'resize' : 'move',
                    startX: e.clientX,
                    origStart: t.start,
                    origEnd: t.end,
                    origLeft: parseFloat(el.style.left),
                    origWidth: parseFloat(el.style.width) || 16,
                    moved: false
                };
                el.setPointerCapture(e.pointerId);
                el.classList.add('dragging');
                document.body.style.cursor = drag.mode === 'resize' ? 'ew-resize' : 'grabbing';
            };
            el.onpointermove = (e) => {
                if (!drag || drag.el !== el) return;
                const dx = e.clientX - drag.startX;
                if (Math.abs(dx) > 3) drag.moved = true;
                if (drag.mode === 'move') el.style.left = `${drag.origLeft + dx}px`;
                else el.style.width = `${Math.max(drag.origWidth + dx, ppd())}px`;
            };
            el.onpointerup = (e) => {
                if (!drag || drag.el !== el) return;
                el.classList.remove('dragging');
                document.body.style.cursor = 'default';
                const dx = e.clientX - drag.startX;
                const dDays = Math.round(dx / ppd());
                const t = byId(drag.id);
                if (t && drag.moved && dDays !== 0) {
                    snapshot();
                    if (drag.mode === 'move') {
                        t.start = fmtDate(addDays(parseDate(drag.origStart), dDays));
                        t.end = fmtDate(addDays(parseDate(drag.origEnd), dDays));
                    } else {
                        const newEnd = addDays(parseDate(drag.origEnd), dDays);
                        t.end = newEnd < parseDate(t.start) ? t.start : fmtDate(newEnd);
                    }
                    computeEffective();
                    cascadeDates(t.id);
                    persist();
                } else if (drag.mode === 'move') {
                    el.style.left = `${drag.origLeft}px`;
                } else {
                    el.style.width = `${drag.origWidth}px`;
                }
                drag = null;
                render();
            };
            el.ondblclick = (e) => { e.stopPropagation(); window.app.editTask(parseInt(el.dataset.id, 10)); };
            if (!el.dataset.ms) el.onclick = (e) => { e.stopPropagation(); };
        });
        refs.chart.querySelectorAll('.gantt-bar-wrapper[data-ms="1"]').forEach(el => {
            el.ondblclick = (e) => { e.stopPropagation(); window.app.editTask(parseInt(el.dataset.id, 10)); };
        });
    };

    /* =========================================================
       9. STATS, UNDO, PERSISTENCE
       ========================================================= */
    const updateStats = () => {
        const leaves = state.tasks.filter(isLeaf);
        const total = leaves.length;
        const completed = leaves.filter(t => t.progress === 100).length;
        const tNow = todayUTC();
        const overdue = leaves.filter(t => t.progress < 100 && parseDate(t.end) < tNow).length;
        let avg = 0;
        if (total) {
            const wSum = leaves.reduce((a, t) => a + (daysBetween(parseDate(t.start), parseDate(t.end)) + 1), 0);
            const pSum = leaves.reduce((a, t) => a + t.progress * (daysBetween(parseDate(t.start), parseDate(t.end)) + 1), 0);
            avg = wSum ? Math.round(pSum / wSum) : 0;
        }
        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-completed').innerText = completed;
        document.getElementById('stat-pending').innerText = total - completed;
        document.getElementById('stat-overdue').innerText = overdue;
        document.getElementById('stat-progress').innerText = avg + '%';
        document.getElementById('stat-progress-bar').style.width = avg + '%';
    };

    const undoStack = [];
    const snapshot = () => {
        undoStack.push(JSON.stringify(state.tasks));
        if (undoStack.length > 40) undoStack.shift();
    };
    const undo = () => {
        if (!undoStack.length) { toast('Nothing to undo'); return; }
        state.tasks = JSON.parse(undoStack.pop()).map(normaliseTask);
        persist();
        render();
        toast('Change undone');
    };

    const persist = () => {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                title: document.getElementById('project-title').value,
                tasks: state.tasks,
                viewMode: state.viewMode,
                sortBy: state.sortBy,
                subtaskMode: state.subtaskMode,
                collapsed: [...state.collapsed]
            }));
            refs.saveStatus.innerText = 'Autosaved ' + new Date().toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit' }) + ' (browser). Use Save for a file copy.';
        } catch (e) {
            refs.saveStatus.innerText = 'Autosave unavailable — use Save Project to keep a file copy.';
        }
        updateStats();
    };

    const toast = (msg, bad) => {
        const wrap = document.getElementById('toast-wrap');
        const el = document.createElement('div');
        el.className = `toast px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold text-white ${bad ? 'bg-red-600' : 'bg-slate-800'}`;
        el.innerText = msg;
        wrap.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }, 3200);
    };

    /* =========================================================
       10. SAVE / OPEN — cloud-free, never overwrites.
           Every save suggests a new time-stamped filename, and
           where the browser supports it a proper Save dialog opens.
       ========================================================= */
    const downloadBlob = (blob, name) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    const saveViaPickerOrDownload = async (blob, name, types) => {
        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({ suggestedName: name, types });
                const w = await handle.createWritable();
                await w.write(blob); await w.close();
                toast('Saved: ' + handle.name);
                return;
            } catch (err) {
                if (err && err.name === 'AbortError') return; // user cancelled
                // fall through to download on any other failure
            }
        }
        downloadBlob(blob, name);
        toast('Saved to Downloads: ' + name);
    };

    const projectPayload = () => ({
        app: 'HSE Gantt Planner',
        schema: 2,
        savedAt: new Date().toISOString(),
        title: document.getElementById('project-title').value,
        viewMode: state.viewMode,
        subtaskMode: state.subtaskMode,
        tasks: state.tasks
    });

    const saveProjectJSON = () => {
        const name = `${slug(document.getElementById('project-title').value)}_${fileStamp()}.json`;
        const blob = new Blob([JSON.stringify(projectPayload(), null, 2)], { type: 'application/json' });
        saveViaPickerOrDownload(blob, name, [{ description: 'Gantt project file', accept: { 'application/json': ['.json'] } }]);
    };

    // --- Excel export: full round-trip, real Excel dates, formatted columns ---
    const exportExcel = () => {
        const order = [];
        const walk = (t) => { order.push(t); sortSiblings(childrenOf(t.id)).forEach(walk); };
        const tops = state.tasks.filter(t => t.parentId === null)
            .sort((a, b) => (a.group || '').localeCompare(b.group || '') || (parseDate(a.start) - parseDate(b.start)));
        tops.forEach(walk);

        const excelDate = (s) => { const d = parseDate(s); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12)); };
        const rows = order.map(t => {
            const e = effMap[t.id] || { start: t.start, end: t.end, progress: t.progress, dur: 1 };
            return {
                'ID': t.id,
                'Task': t.name,
                'Group': t.group,
                'Parent ID': t.parentId === null ? '' : t.parentId,
                'Milestone': t.milestone ? 'Yes' : '',
                'Start': excelDate(e.start),
                'Finish': excelDate(e.end),
                'Duration (days)': t.milestone ? 0 : e.dur,
                'Progress %': e.progress,
                'Dependencies': t.dependencies.join(','),
                'Colour': t.color,
                'Notes': t.notes || ''
            };
        });
        const ws = XLSX.utils.json_to_sheet(rows, { cellDates: true });
        ws['!cols'] = [{ wch: 5 }, { wch: 34 }, { wch: 22 }, { wch: 9 }, { wch: 9 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, { wch: 14 }, { wch: 9 }, { wch: 40 }];
        const info = XLSX.utils.aoa_to_sheet([
            ['Project', document.getElementById('project-title').value],
            ['Exported', new Date().toLocaleString('en-IE')],
            ['Tasks', state.tasks.length],
            [''],
            ['This file re-opens directly in the HSE Gantt Planner via the Open button.'],
            ['Dates are real Excel dates. Dependencies are comma-separated task IDs.'],
            ['Parent ID links a subtask to its parent task.']
        ]);
        info['!cols'] = [{ wch: 12 }, { wch: 60 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
        XLSX.utils.book_append_sheet(wb, info, 'Project Info');
        const name = `${slug(document.getElementById('project-title').value)}_${fileStamp()}.xlsx`;
        const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true });
        saveViaPickerOrDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name,
            [{ description: 'Excel workbook', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]);
    };

    // --- Smart Excel/CSV import: finds the header row, fuzzy-matches columns,
    //     understands dd/mm/yyyy, ISO dates and Excel serial dates. ---
    const HEADER_ALIASES = {
        id: ['id', 'taskid', 'no', 'ref', 'wbs', 'number'],
        name: ['task', 'name', 'taskname', 'activity', 'title', 'description', 'workitem'],
        group: ['group', 'phase', 'category', 'section', 'workstream', 'stage', 'package'],
        parentId: ['parentid', 'parent', 'wbsparent', 'parenttask'],
        milestone: ['milestone', 'ismilestone'],
        start: ['start', 'startdate', 'begin', 'from', 'plannedstart'],
        end: ['finish', 'end', 'enddate', 'finishdate', 'due', 'duedate', 'to', 'plannedfinish'],
        duration: ['duration', 'durationdays', 'days', 'dur'],
        progress: ['progress', 'complete', 'percentcomplete', 'pctcomplete', 'done', 'completion'],
        dependencies: ['dependencies', 'predecessors', 'dependson', 'pred', 'preds', 'predecessor'],
        color: ['colour', 'color'],
        notes: ['notes', 'comments', 'comment', 'remarks']
    };
    const normHeader = (h) => String(h || '').toLowerCase().replace(/[^a-z0-9]/g, '').replace(/percent|%/g, 'percent');

    const parseAnyDate = (v) => {
        if (v === null || v === undefined || v === '') return null;
        if (typeof v === 'number' && v > 20000 && v < 80000) { // Excel serial
            return fmtDate(new Date(Math.round((v - 25569) * DAY)));
        }
        if (v instanceof Date && !isNaN(v)) return fmtDate(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
        const s = String(v).trim();
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return fmtDate(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])));
        m = s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})$/); // dd/mm/yyyy (Irish)
        if (m) { let yy = +m[3]; if (yy < 100) yy += 2000; return fmtDate(new Date(Date.UTC(yy, +m[2] - 1, +m[1]))); }
        const d = new Date(s);
        return isNaN(d) ? null : fmtDate(new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())));
    };

    const importSpreadsheet = (wb) => {
        const sheet = wb.Sheets[wb.SheetNames.find(n => normHeader(n) === 'tasks') || wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
        if (!aoa.length) throw new Error('The sheet is empty.');

        // Find the header row: first of the top 12 rows containing a name column and a start column
        let headerRow = -1, colMap = {};
        for (let r = 0; r < Math.min(aoa.length, 12); r++) {
            const map = {};
            aoa[r].forEach((cell, c) => {
                const h = normHeader(cell);
                if (!h) return;
                for (const key of Object.keys(HEADER_ALIASES)) {
                    if (map[key] === undefined && HEADER_ALIASES[key].some(a => h === a || h.startsWith(a))) { map[key] = c; break; }
                }
            });
            if (map.name !== undefined && map.start !== undefined) { headerRow = r; colMap = map; break; }
        }
        if (headerRow === -1) throw new Error('Could not find task columns. The sheet needs at least a Task/Name column and a Start column.');

        const truthy = (v) => /^(yes|y|true|1|x)$/i.test(String(v).trim());
        const rawTasks = [];
        for (let r = headerRow + 1; r < aoa.length; r++) {
            const row = aoa[r];
            const cell = (k) => colMap[k] === undefined ? '' : row[colMap[k]];
            const name = String(cell('name') || '').trim();
            const start = parseAnyDate(cell('start'));
            if (!name || !start) continue; // skip blanks, totals, notes rows
            let end = parseAnyDate(cell('end'));
            const durV = parseFloat(cell('duration'));
            if (!end && Number.isFinite(durV) && durV > 0) end = fmtDate(addDays(parseDate(start), Math.round(durV) - 1));
            if (!end) end = start;
            if (parseDate(end) < parseDate(start)) { const tmp = end; end = start; start = tmp; }
            let prog = parseFloat(String(cell('progress')).replace('%', ''));
            if (Number.isFinite(prog) && prog <= 1 && prog > 0 && String(cell('progress')).indexOf('%') === -1 && prog !== 1) prog = prog * 100;
            const idV = parseInt(cell('id'), 10);
            const parentV = parseInt(cell('parentId'), 10);
            rawTasks.push({
                id: Number.isFinite(idV) ? idV : null,
                name,
                group: String(cell('group') || 'General').trim() || 'General',
                parentId: Number.isFinite(parentV) ? parentV : null,
                milestone: truthy(cell('milestone')) || end === start && truthy(cell('milestone')),
                start, end,
                progress: Number.isFinite(prog) ? Math.max(0, Math.min(100, Math.round(prog))) : 0,
                dependencies: String(cell('dependencies') || '').split(/[,;\s]+/).map(x => parseInt(x, 10)).filter(Number.isFinite),
                color: /^#[0-9a-fA-F]{6}$/.test(String(cell('color')).trim()) ? String(cell('color')).trim() : '#10b981',
                notes: String(cell('notes') || '')
            });
        }
        if (!rawTasks.length) throw new Error('No valid task rows were found under the headers.');

        // Re-ID safely: keep original IDs where unique, remap duplicates/missing
        const seen = new Set();
        let nextId = rawTasks.reduce((m, t) => Math.max(m, t.id || 0), 0);
        const idRemap = {};
        rawTasks.forEach(t => {
            if (t.id === null || seen.has(t.id)) {
                const oldId = t.id;
                t.id = ++nextId;
                if (oldId !== null) idRemap[oldId] = idRemap[oldId] || t.id;
            }
            seen.add(t.id);
        });
        const valid = new Set(rawTasks.map(t => t.id));
        rawTasks.forEach(t => {
            if (t.parentId !== null && !valid.has(t.parentId)) t.parentId = null;
            t.dependencies = t.dependencies.filter(d => valid.has(d) && d !== t.id);
        });
        return rawTasks;
    };

    const openFile = (file) => {
        const nameL = file.name.toLowerCase();
        const reader = new FileReader();
        reader.onerror = () => toast('Could not read that file.', true);
        if (nameL.endsWith('.json')) {
            reader.onload = (evt) => {
                try {
                    const data = JSON.parse(evt.target.result);
                    const tasks = Array.isArray(data) ? data : data.tasks;
                    if (!Array.isArray(tasks) || !tasks.length) throw new Error('No tasks in file');
                    snapshot();
                    state.tasks = tasks.map(normaliseTask);
                    if (data.title) document.getElementById('project-title').value = data.title;
                    if (VIEWS[data.viewMode]) { state.viewMode = data.viewMode; document.getElementById('view-mode').value = data.viewMode; }
                    state.collapsed = new Set();
                    persist(); render();
                    toast(`Opened ${file.name} — ${state.tasks.length} tasks`);
                } catch (err) { toast('That JSON file is not a valid project: ' + err.message, true); }
            };
            reader.readAsText(file);
        } else {
            reader.onload = (evt) => {
                try {
                    const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array', cellDates: true });
                    const tasks = importSpreadsheet(wb);
                    snapshot();
                    state.tasks = tasks.map(normaliseTask);
                    state.collapsed = new Set();
                    computeEffective();
                    persist(); render();
                    toast(`Imported ${file.name} — ${tasks.length} tasks`);
                } catch (err) { toast('Import failed: ' + err.message, true); }
            };
            reader.readAsArrayBuffer(file);
        }
    };

    const saveHTMLCopy = () => {
        let html = document.documentElement.outerHTML;
        const payload = {
            tasks: state.tasks,
            title: document.getElementById('project-title').value,
            viewMode: state.viewMode,
            sortBy: state.sortBy,
            subtaskMode: state.subtaskMode,
            collapsed: [...state.collapsed]
        };
        html = html.replace(/<script id="gantt-data-state">[\s\S]*?<\/script>/gi, '');
        const closing = '<' + '/script>';
        const dataScript = `<script id="gantt-data-state">window.CACHED_STATE = ${JSON.stringify(payload)};${closing}`;
        html = html.replace('</head>', `${dataScript}\n</head>`);
        const name = `${slug(payload.title)}_${fileStamp()}.html`;
        saveViaPickerOrDownload(new Blob([html], { type: 'text/html' }), name,
            [{ description: 'Interactive HTML copy', accept: { 'text/html': ['.html'] } }]);
    };

    /* =========================================================
       11. INSIGHTS DASHBOARD
       ========================================================= */
    const renderInsights = () => {
        computeCPM();
        const leaves = state.tasks.filter(isLeaf);
        const tNow = todayUTC();
        if (!leaves.length) {
            refs.insights.innerHTML = '<div class="p-12 text-center text-slate-400 text-sm">Add tasks to see project insights.</div>';
            return;
        }
        let pStart = null, pEnd = null;
        leaves.forEach(t => {
            const s = parseDate(t.start), e = parseDate(t.end);
            if (!pStart || s < pStart) pStart = s;
            if (!pEnd || e > pEnd) pEnd = e;
        });
