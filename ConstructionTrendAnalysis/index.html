const ALL_CODES = NSBE.map(e => e.code);
const keepOnly = (keep) => ALL_CODES.filter(c => !keep.includes(c));

/* Set-up presets - which cells are normally applicable by job type.
   Picked once at set-up, then hand-tuned. Nothing is locked. */
const PRESETS = {

    label:"New Build",
    hint:"The full matrix, substructure through site works.",
    exclude:["33","58","56"],
  },
  "extension": {

             "58","56","8","16","24","32","40","47","54","57","59"],

    hint:"Plant and services replacement with making-good only.",
    exclude:["1","9","17","25","33","2","10","18","26","34","41","48",
             "3","11","19","27","35","42","49","4","12","28","36","43","50",
             "7","15","23","31","39","46","53","8","16","24","32","40","57","59"],

    exclude:keepOnly(["P1","P2","P3","P4","P5","P6","1","9","25",
                      "8","16","24","32","40","47","54","57","59"]),

/* Indicative weightings (% of works cost) used to auto-spread a budget across
   whatever cells are ticked. Anything not listed gets a residual share. These
   are starting points to get a shape on the curve, not a cost plan - overwrite
   them with your own figures. */
const WEIGHTS = {
  "P1":8, "P2":8, "P3":1, "P4":1, "P5":2, "P6":6,
  "1":0.5, "9":2, "17":2, "25":4, "33":3,
  "2":0.5, "10":6, "18":3, "26":4, "34":1, "41":2.5, "48":7,
  "3":0.5, "11":3, "19":1.5, "27":1, "35":0.5, "42":1.5, "49":1,
  "4":0.5, "12":1.5, "20":1.5, "28":2.5, "36":0.3, "43":1, "50":2,
  "5":0.5, "13":2.5, "21":1.5, "29":2, "37":1, "44":2, "51":3, "55":6, "58":1,
  "6":0.5, "14":3, "22":2, "30":2.5, "38":2, "45":1.5, "52":1.5, "56":1,
  "7":0.5, "15":0.5, "23":1.5, "31":1, "39":1, "46":0.5, "53":1,
  "8":0.5, "16":1, "24":0.5, "32":0.5, "40":2, "47":1, "54":0.5, "57":0.3, "59":1,
};

/* ==========================================================================
   2. HELPERS
   ========================================================================== */

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((x,y) => x + (y||0), 0);
const uid = () => "j" + Math.random().toString(36).slice(2,9);

const fmtEur = (n) => "€" + Math.round(n||0).toLocaleString("en-IE");
const fmtK = (n) => {
  const v = n||0, a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e6) return s + "€" + (a/1e6).toFixed(a/1e6 >= 10 ? 1 : 2) + "m";
  if (a >= 1e3) return s + "€" + Math.round(a/1e3) + "k";
  return s + "€" + Math.round(a);
};
const pc = (n, d=1) => (n == null || !isFinite(n)) ? "—" : n.toFixed(d) + "%";
const signedK = (n) => (n > 0 ? "+" : "") + fmtK(n);

const parseDate = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const monthsBetween = (a, b) => {
  const s = parseDate(a), e = parseDate(b);
  if (!s || !e) return 0;
  return Math.max(1, (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth()) + 1);
};
const monthLabel = (start, i) => {
  const d = parseDate(start);
  if (!d) return "M" + (i+1);
  d.setMonth(d.getMonth() + i);
  return d.toLocaleDateString("en-GB", { month:"short", year:"2-digit" });
};
const addMonthsISO = (iso, n) => {
  const d = parseDate(iso) || new Date();
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0,10);
};
const todayISO = () => new Date().toISOString().slice(0,10);

/* S-curve cash flow - logistic, normalised to the total. */
const sCurve = (total, periods) => {
  if (periods < 1) return { periodic:[], cumulative:[] };
  const raw = [];
  // Centre the logistic on the mid-point of the programme, so a short job does
  // not front-load the way an uncentred curve does.
  for (let i=1; i<=periods; i++) raw.push(1 / (1 + Math.exp(-(((i-0.5)/periods)*10 - 5))));
  const last = raw[raw.length-1] || 1;
  const cumulative = raw.map(v => Math.round((v/last) * total));
  const periodic = cumulative.map((v,i) => i === 0 ? v : v - cumulative[i-1]);
  return { periodic, cumulative };
};

/* ==========================================================================
   3. JOB MODEL + THE ANALYSIS
   ========================================================================== */

function makeElements(presetKey, budget) {
  const ex = new Set((PRESETS[presetKey] || PRESETS["new-build"]).exclude);
  // P6 stays off by default - contingency is carried by the contingency %
  // on the job, and having it in both places double-counts it. Tick it only
  // if you would rather run contingency as a cost-plan line instead.
  ex.add("P6");
  const rows = NSBE.map(e => ({ ...e, on: !ex.has(e.code), budget: 0, pct: 0 }));
  return allocate(rows, budget);
}

/* Spread a budget across ticked elements using the indicative weightings. */
function allocate(rows, budget) {
  const on = rows.filter(r => r.on);
  const w = sum(on.map(r => WEIGHTS[r.code] || 1));
  if (!w) return rows;
  return rows.map(r => r.on
    ? { ...r, budget: Math.round(budget * ((WEIGHTS[r.code] || 1) / w)) }
    : { ...r, budget: 0 });
}

function newJob(over = {}) {
  const start = over.startDate || todayISO().slice(0,8) + "01";
  const end = over.endDate || addMonthsISO(start, 17);
  const budget = over.budget != null ? over.budget : 2500000;
  const preset = over.preset || "new-build";
  const months = monthsBetween(start, end);
  return {
    id: uid(),
    name: "New Project",
    ref: "",
    location: "",
    stage: "Construction",
    preset,
    startDate: start,
    endDate: end,
    budget,
    contingencyPct: 10,
    elements: makeElements(preset, budget),
    planned: null,                       // null = derived S-curve
    actuals: [],
    milestones: [],
    ...over,
  };
}

/* Bring a stored job's element list up to the current matrix.
   The element scheme can change between versions of this file. Without this,
   a job saved under an older scheme keeps codes that no longer match any
   group, so every group filters to nothing and the matrix silently renders
   empty - on screen and, worse, in the report. */
function reconcileElements(job) {
  const ex = new Set((PRESETS[job.preset] || PRESETS["new-build"]).exclude);
  ex.add("P6");
  const prev = new Map((job.elements || []).map(e => [e.code, e]));
  const matched = NSBE.filter(e => prev.has(e.code)).length;

  // Nothing recognisable: rebuild from the preset and re-spread the budget.
  if (matched === 0) {
    return { ...job, elements: makeElements(job.preset || "new-build", job.budget || 0) };
  }
  // Partial match: keep what we recognise, default anything newly added.
  return { ...job, elements: NSBE.map(e => {
    const p = prev.get(e.code);
    return p ? { ...e, on: !!p.on, budget: p.budget || 0, pct: p.pct || 0 }
             : { ...e, on: !ex.has(e.code), budget: 0, pct: 0 };
  })};
}

/* --- the whole analysis for one job ------------------------------------- */
function analyse(job) {
  const months = monthsBetween(job.startDate, job.endDate);
  const live = (job.elements || []).filter(e => e.on);

  // Budget: elements are the source of truth once they carry values.
  const elemBudget = sum(live.map(e => e.budget));
  const BAC = elemBudget > 0 ? elemBudget : (job.budget || 0);
  const contingency = BAC * (job.contingencyPct || 0) / 100;
  const authorised = BAC + contingency;

  // Physical completion rolls up from the applicable elements, budget-weighted.
  const wTotal = sum(live.map(e => e.budget)) || live.length;
  const rolledPct = live.length === 0 ? 0
    : wTotal === live.length
      ? sum(live.map(e => e.pct || 0)) / live.length
      : sum(live.map(e => (e.budget || 0) * (e.pct || 0))) / wTotal;
  // Completion is always the elemental roll-up. There is deliberately no
  // "sync to plan" control: setting progress from the plan would force
  // EV == PV, pin SPI at 1.00 and hide every schedule problem.
  const physicalPct = clamp(rolledPct, 0, 100);

  // Planned cash flow
  const plan = job.planned && job.planned.length
    ? (() => { let s = 0; const cum = []; const per = job.planned.map(p => { s += (p.value||0); cum.push(s); return p.value||0; }); return { periodic: per, cumulative: cum }; })()
    : sCurve(BAC, months);
  const planTotal = plan.cumulative[plan.cumulative.length-1] || BAC;

  const actuals = job.actuals || [];
  const nLogged = actuals.length;
  const AC = sum(actuals.map(a => a.value));
  const idx = nLogged - 1;
  const PV = idx >= 0 ? (plan.cumulative[Math.min(idx, plan.cumulative.length-1)] || 0) : 0;
  const EV = BAC * physicalPct / 100;

  const CPI = AC > 0 ? EV / AC : null;
  const SPI = PV > 0 ? EV / PV : null;
  const CV  = EV - AC;                 // cost variance (value earned vs money spent)
  const SV  = EV - PV;                 // schedule variance, in money
  const cashVar = AC - PV;             // pure cash: spent vs planned to spend

  // --- Trend forecasts ---------------------------------------------------
  // Efficiency trend: remaining work costs what the work so far has cost.
  const outEfficiency = CPI && CPI > 0 ? BAC / CPI : BAC;
  // Burn trend: current monthly spend simply continues to the end.
  const burn = nLogged > 0 ? AC / nLogged : 0;
  const projMonths = SPI && SPI > 0 ? months / SPI : months;
  const outBurn = nLogged > 0 ? AC + burn * Math.max(0, projMonths - nLogged) : BAC;
  // Headline: the worse of the two, so the number never flatters the job.
  const outturn = Math.max(outEfficiency, outBurn) || BAC;
  const outturnBasis = outturn === outEfficiency ? "Cost efficiency trend" : "Spend rate trend";

  const variance = outturn - BAC;
  const variancePct = BAC > 0 ? (variance / BAC) * 100 : 0;

  // --- Margin of safety ---------------------------------------------------
  // How much more the job can cost before it breaches the authorised funding.
  const marginEur = authorised - outturn;
  const marginPct = authorised > 0 ? (marginEur / authorised) * 100 : 0;
  const contingencyUsedPct = contingency > 0 ? clamp((variance / contingency) * 100, 0, 999) : (variance > 0 ? 999 : 0);

  // --- Breakeven ----------------------------------------------------------
  // How much of the works the authorised funding actually buys at the forecast
  // cost rate. >= 100% means the job lands inside its funding. Taken off the
  // headline out-turn so it can never disagree with the margin of safety.
  const breakevenPct = nLogged > 0 && outturn > 0
    ? clamp((authorised / outturn) * 100, 0, 200) : null;
  // Required efficiency on the remaining work to land exactly on the funding.
  const requiredCPI = (authorised - AC) > 0 ? (BAC - EV) / (authorised - AC) : null;

  // Forecast cash curve. It lands exactly on the headline out-turn, so the
  // curve, the breakeven month and the margin of safety can never disagree.
  const forecast = [];
  let breakevenMonth = null;
  if (nLogged > 0) {
    const horizon = Math.max(months, Math.ceil(projMonths));
    const ahead = Math.max(1, horizon - nLogged);
    const perMonth = Math.max(0, outturn - AC) / ahead;
    let running = AC;
    for (let i = 0; i < horizon; i++) {
      if (i < nLogged - 1) { forecast.push(null); continue; }
      if (i === nLogged - 1) { forecast.push(Math.round(AC)); continue; }
      running += perMonth;
      forecast.push(Math.round(running));
    }
    // Only a job whose forecast actually breaches funding has a breakeven month.
    if (AC >= authorised) breakevenMonth = nLogged - 1;
    else if (outturn > authorised) {
      const i = forecast.findIndex(v => v != null && v >= authorised);
      breakevenMonth = i === -1 ? null : i;
    }
  }

  // --- Schedule -----------------------------------------------------------
  const delayMonths = projMonths - months;
  const plannedPctToDate = planTotal > 0 && idx >= 0
    ? clamp((plan.cumulative[Math.min(idx, plan.cumulative.length-1)] / planTotal) * 100, 0, 100) : 0;
  const pctDrift = physicalPct - plannedPctToDate;
  const forecastEnd = addMonthsISO(job.startDate, Math.round(projMonths) - 1);

  // --- Risk ---------------------------------------------------------------
  // 0 = clean, 100 = critical. Weighted so cost headroom dominates.
  const rCost  = marginPct >= 10 ? 0 : marginPct <= -10 ? 100 : (10 - marginPct) * 5;
  const rSched = SPI == null ? 20 : SPI >= 1 ? 0 : clamp((1 - SPI) * 250, 0, 100);
  const rEff   = CPI == null ? 20 : CPI >= 1 ? 0 : clamp((1 - CPI) * 250, 0, 100);
  const monthsBehindOnLogs = Math.max(0, Math.min(months, monthsBetween(job.startDate, todayISO())) - nLogged);
  const rData  = clamp(monthsBehindOnLogs * 30, 0, 100);
  const riskScore = Math.round(0.40*rCost + 0.30*rSched + 0.20*rEff + 0.10*rData);

  const band = riskScore >= 70 ? "critical" : riskScore >= 45 ? "at-risk" : riskScore >= 22 ? "watch" : "on-track";

  const drivers = [];
  if (rCost  >= 45) drivers.push(marginEur < 0 ? "Forecast exceeds funding" : "Little cost headroom left");
  if (rSched >= 45) drivers.push("Behind programme");
  if (rEff   >= 45) drivers.push("Poor cost efficiency");
  if (rData  >= 45) drivers.push(monthsBehindOnLogs + " month(s) of spend unlogged");
  if (!drivers.length) drivers.push("No material exceptions");

  return {
    months, live, BAC, contingency, authorised, elemBudget,
    physicalPct, rolledPct, plannedPctToDate, pctDrift,
    plan, planTotal, actuals, nLogged, AC, PV, EV,
    CPI, SPI, CV, SV, cashVar, burn,
    outturn, outturnBasis, outEfficiency, outBurn, variance, variancePct,
    marginEur, marginPct, contingencyUsedPct,
    breakevenPct, requiredCPI, breakevenMonth, forecast,
    projMonths, delayMonths, forecastEnd,
    riskScore, band, drivers, monthsBehindOnLogs,
  };
}

function Money({ value, onChange, className="", disabled }) {
  const [local, setLocal] = useState("");
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setLocal(value ? Number(value).toLocaleString("en-IE") : ""); }, [value, focus]);
  return (
    <input type="text" inputMode="numeric" disabled={disabled} value={local}
      onFocus={() => setFocus(true)}

  );
}

    <span className={"inline-flex items-center gap-1.5 rounded-full font-bold ring-1 " + b.bg + " " + b.text + " " + b.ring + " " + (small ? "px-2 py-0.5 text-[10px]" : "px-2.5 py-1 text-[11px]")}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background:b.dot }} />
      {b.label}{score != null && <span className="opacity-60 tnum">{score}</span>}
    </span>
  );
};

/* KPI tile - the unit the whole dashboard is built from. */
function Kpi({ label, value, sub, tone="ink", hint, foot, accent }) {
  const tones = { ink:"text-slate-900", good:"text-emerald-600", warn:"text-amber-600", risk:"text-red-600", info:"text-blue-600", hse:"text-[#006858]" };
  // No overflow-hidden on the card: it was clipping the hover tips. The accent
  // stripe gets its own rounded corners instead.
  return (
    <div className="bg-white rounded-xl border border-slate-200 p-4 flex flex-col justify-between avoid-break relative">
      {accent && <div className="absolute left-0 top-0 bottom-0 w-1 rounded-l-xl" style={{ background:accent }} />}
      <div className="flex items-start">
        <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider leading-tight">{label}</span>
        {hint && <Tip text={hint} />}
      </div>
      <div className={"text-2xl xl:text-[26px] font-extrabold tnum mt-1.5 leading-none " + (tones[tone]||tones.ink)}>{value}</div>
      {sub && <div className="text-[11px] text-slate-500 mt-1.5 leading-tight">{sub}</div>}
      {foot}
    </div>
  );
}

/* ==========================================================================
   5. THE TREND CHART
   Plan (baseline) vs Actual spend vs Forecast out-turn, with the authorised
   funding line and the breakeven crossing marked. No EVM label anywhere -
   CPI and SPI are performance measures and live in their own tiles; this is
   the money curve.
   ========================================================================== */

function TrendChart({ job, a, height=360, forReport }) {
  const ref = useRef(null);
  const inst = useRef(null);

  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    if (window.Chart.register && window["chartjs-plugin-annotation"]) {
      try { window.Chart.register(window["chartjs-plugin-annotation"]); } catch(e) {}
    }
    if (inst.current) inst.current.destroy();

    const horizon = Math.max(a.months, a.forecast.length, a.nLogged);
    const labels = Array.from({ length: horizon }, (_, i) => monthLabel(job.startDate, i));

    const planData = Array.from({ length: horizon }, (_, i) => a.plan.cumulative[i] ?? null);
    let run = 0;
    const actualData = Array.from({ length: horizon }, (_, i) =>
      i < a.nLogged ? (run += (a.actuals[i].value || 0)) : null);
    const fcData = Array.from({ length: horizon }, (_, i) => a.forecast[i] ?? null);

    const ann = {};
    ann.funding = {
      type:"line", yMin:a.authorised, yMax:a.authorised,
      borderColor:"#dc2626", borderWidth:1.5, borderDash:[6,4],
      label:{ display:true, content:"Authorised " + fmtK(a.authorised), position:"start",
              backgroundColor:"rgba(220,38,38,.92)", color:"#fff",
              font:{ size:9, weight:"bold" }, padding:{ x:5, y:2 } },
    };
    ann.bac = {
      type:"line", yMin:a.BAC, yMax:a.BAC,
      borderColor:"#94a3b8", borderWidth:1, borderDash:[2,3],
      label:{ display:true, content:"Budget " + fmtK(a.BAC), position:"end",
              backgroundColor:"rgba(100,116,139,.9)", color:"#fff",
              font:{ size:9, weight:"bold" }, padding:{ x:5, y:2 } },
    };
    if (a.breakevenMonth != null && a.breakevenMonth < horizon) {
      ann.breakeven = {
        type:"line", xMin:a.breakevenMonth, xMax:a.breakevenMonth,
        borderColor:"#b91c1c", borderWidth:2,
        label:{ display:true, content:"Breakeven " + labels[a.breakevenMonth], position:"start",
                backgroundColor:"#b91c1c", color:"#fff", rotation:0,
                font:{ size:9, weight:"bold" }, padding:{ x:5, y:2 } },
      };
    }
    if (a.nLogged > 0 && a.nLogged - 1 < horizon) {
      ann.cut = {
        type:"line", xMin:a.nLogged-1, xMax:a.nLogged-1,
        borderColor:"#006858", borderWidth:1.5,
        label:{ display:true, content:"Data date", position:"end",
                backgroundColor:"rgba(0,104,88,.9)", color:"#fff",
                font:{ size:9, weight:"bold" }, padding:{ x:5, y:2 } },
      };
    }
    (job.milestones || []).forEach((m, i) => {
      const x = (m.month || 1) - 1;
      if (x < 0 || x >= horizon) return;
      ann["ms" + i] = {
        type:"line", xMin:x, xMax:x, borderColor:"#c7d2fe", borderWidth:1, borderDash:[3,3],
        label:{ display:true, content:m.label || "Milestone", position:"start",
                backgroundColor:"rgba(79,70,229,.85)", color:"#fff",
                font:{ size:8, weight:"bold" }, padding:{ x:4, y:1 } },
      };
    });

    const ctx = ref.current.getContext("2d");
    const fill = ctx.createLinearGradient(0, 0, 0, height);
    fill.addColorStop(0, "rgba(0,104,88,.22)");
    fill.addColorStop(1, "rgba(0,104,88,0)");

    inst.current = new window.Chart(ctx, {
      type:"line",
      data:{ labels, datasets:[
        { label:"Planned spend", data:planData, borderColor:"#94a3b8", borderDash:[6,4],
          borderWidth:2, pointRadius:0, tension:.35, order:3 },
        { label:"Actual spend", data:actualData, borderColor:"#006858", backgroundColor:fill,
          borderWidth:3, fill:true, pointRadius:forReport?0:2.5, pointBackgroundColor:"#006858",
          tension:.3, order:1 },
        { label:"Forecast out-turn", data:fcData, borderColor:"#f59e0b", borderDash:[3,3],
          borderWidth:2.5, pointRadius:0, tension:.3, spanGaps:true, order:2 },
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        animation: forReport ? false : { duration:500 },
        interaction:{ mode:"index", intersect:false },
        layout:{ padding:{ top:16, right:8 } },
        plugins:{
          legend:{ position:"bottom", labels:{ boxWidth:22, boxHeight:2, usePointStyle:false,
                    font:{ size:10, weight:"600" }, color:"#475569", padding:14 } },
          annotation:{ annotations: ann },
          tooltip:{ backgroundColor:"rgba(15,23,42,.95)", padding:10, cornerRadius:8,
            titleFont:{ size:11, weight:"bold" }, bodyFont:{ size:11 },
            callbacks:{ label: (c) => c.dataset.label + ": " + fmtEur(c.parsed.y) } },
        },
        scales:{
          x:{ grid:{ display:false }, ticks:{ font:{ size:9 }, color:"#94a3b8",
              maxRotation:0, autoSkip:true, maxTicksLimit: forReport ? 14 : 18 } },
          y:{ grid:{ color:"#f1f5f9" }, border:{ display:false },
              ticks:{ font:{ size:9 }, color:"#94a3b8", callback:(v) => fmtK(v) } },
        },
      },
    });
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [job, a, height, forReport]);

  return <div style={{ height }}><canvas ref={ref} /></div>;
}

/* Compact sparkline for the portfolio rows - plan vs actual, no axes. */
function Spark({ a, w=110, h=30 }) {
  const max = Math.max(a.authorised, a.planTotal, a.AC, 1);
  const n = Math.max(a.months, 2);
  const pt = (arr) => arr.map((v, i) => (i/(n-1))*w + "," + (h - (v/max)*h)).join(" ");
  let run = 0;
  const act = a.actuals.map(x => (run += (x.value||0)));
  return (
    <svg width={w} height={h} className="overflow-visible">
      <polyline points={pt(a.plan.cumulative.slice(0, n))} fill="none" stroke="#cbd5e1" strokeWidth="1.5" strokeDasharray="3 3" />
      {act.length > 1 && <polyline points={pt(act)} fill="none" stroke={BANDS[a.band].dot} strokeWidth="2" strokeLinecap="round" />}
      <line x1="0" y1={h - (a.authorised/max)*h} x2={w} y2={h - (a.authorised/max)*h} stroke="#fca5a5" strokeWidth="1" strokeDasharray="2 2" />
    </svg>
  );
}

/* ==========================================================================
   6. PORTFOLIO - the parent dashboard over every job
   ========================================================================== */

function Portfolio({ jobs, open, onNew, onDelete, onDuplicate, onReport, onReset }) {
  const [sort, setSort] = useState("risk");
  const [q, setQ] = useState("");

  const rows = useMemo(() => {
    const r = jobs.map(j => ({ job:j, a:analyse(j) }));
    const f = q.trim()
      ? r.filter(x => (x.job.name + " " + (x.job.ref||"") + " " + (x.job.location||"")).toLowerCase().includes(q.toLowerCase()))
      : r;
    const cmp = {
      risk:   (x,y) => y.a.riskScore - x.a.riskScore,
      value:  (x,y) => y.a.BAC - x.a.BAC,
      variance:(x,y) => y.a.variancePct - x.a.variancePct,
      margin: (x,y) => x.a.marginPct - y.a.marginPct,
      name:   (x,y) => x.job.name.localeCompare(y.job.name),
      finish: (x,y) => (x.job.endDate||"").localeCompare(y.job.endDate||""),
    }[sort];
    return [...f].sort(cmp);
  }, [jobs, sort, q]);

  const roll = useMemo(() => {
    const all = jobs.map(analyse);
    const bac = sum(all.map(x => x.BAC));
    const auth = sum(all.map(x => x.authorised));
    const ac = sum(all.map(x => x.AC));
    const out = sum(all.map(x => x.outturn));
    const ev = sum(all.map(x => x.EV));
    const pv = sum(all.map(x => x.PV));
    const counts = { critical:0, "at-risk":0, watch:0, "on-track":0 };
    all.forEach(x => counts[x.band]++);
    return {
      n: all.length, bac, auth, ac, out, ev, pv,
      spi: pv > 0 ? ev/pv : null,
      behind: all.filter(x => x.SPI != null && x.SPI < 0.95).length,
      inefficient: all.filter(x => x.CPI != null && x.CPI < 0.95).length,
      variance: out - bac,
      variancePct: bac > 0 ? ((out - bac)/bac)*100 : 0,
      marginEur: auth - out,
      marginPct: auth > 0 ? ((auth - out)/auth)*100 : 0,
      cpi: ac > 0 ? ev/ac : null,
      pctComplete: bac > 0 ? (ev/bac)*100 : 0,
      counts,
      exposure: sum(all.filter(x => x.marginEur < 0).map(x => -x.marginEur)),
    };
  }, [jobs]);

  const sortBtn = (id, label) => (
    <button key={id} onClick={() => setSort(id)}

      {label}
    </button>
  );

  return (
    <div className="max-w-[1800px] mx-auto px-4 sm:px-6 py-6 space-y-6">

      {/* ---- roll-up ---- */}
      <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">
        <Kpi label="Jobs in portfolio" value={roll.n}
             sub={roll.counts.critical + roll.counts["at-risk"] + " needing attention"} accent="#006858" />
        <Kpi label="Combined budget" value={fmtK(roll.bac)}
             sub={"Authorised " + fmtK(roll.auth)} hint="Sum of every job's elemental budget. Authorised adds each job's contingency." />
        <Kpi label="Spent to date" value={fmtK(roll.ac)}
             sub={pc(roll.bac ? (roll.ac/roll.bac)*100 : 0, 0) + " of budget drawn"} />

        <Kpi label="Cost efficiency (CPI)" accent={roll.cpi == null ? "#94a3b8" : roll.cpi >= 1 ? "#0f9d76" : "#dc2626"}
             value={roll.cpi == null ? "—" : roll.cpi.toFixed(2)}
             tone={roll.cpi == null ? "ink" : roll.cpi >= 1 ? "good" : "risk"}
             sub={roll.inefficient + " of " + roll.n + " job" + (roll.n === 1 ? "" : "s") + " below 0.95"}
             hint="Value earned across the portfolio for every euro spent. Weighted by size, so a big job moves it more than a small one."
             foot={<div className="mt-2"><Bar pct={clamp((roll.cpi||0)*50,0,100)} colour={roll.cpi >= 1 ? "#0f9d76" : "#dc2626"} /></div>} />

        <Kpi label="Schedule (SPI)" accent={roll.spi == null ? "#94a3b8" : roll.spi >= 1 ? "#0f9d76" : "#dc2626"}
             value={roll.spi == null ? "—" : roll.spi.toFixed(2)}
             tone={roll.spi == null ? "ink" : roll.spi >= 1 ? "good" : "risk"}
             sub={roll.behind + " of " + roll.n + " job" + (roll.n === 1 ? "" : "s") + " behind plan"}
             hint="Work done against work planned by now, across the portfolio. Below 1.00 means the programme as a whole is running late."
             foot={<div className="mt-2"><Bar pct={clamp((roll.spi||0)*50,0,100)} colour={roll.spi >= 1 ? "#0f9d76" : "#dc2626"} /></div>} />

        <Kpi label="Forecast out-turn" value={fmtK(roll.out)} tone={roll.variance > 0 ? "risk" : "good"}
             sub={signedK(roll.variance) + " vs budget (" + pc(roll.variancePct,1) + ")"}
             hint="Every job forecast on the worse of its cost-efficiency and spend-rate trends, then added." />
        <Kpi label="Portfolio margin of safety" value={fmtK(roll.marginEur)}
             tone={roll.marginPct < 0 ? "risk" : roll.marginPct < 5 ? "warn" : "good"}
             sub={pc(roll.marginPct,1) + " of authorised funding"}
             hint="How much more the portfolio can cost before it breaches total authorised funding, contingency included." />
        <Kpi label="Exposure on losing jobs" value={fmtK(roll.exposure)} tone={roll.exposure > 0 ? "risk" : "good"}
             sub={roll.exposure > 0 ? "Forecast beyond funding" : "All jobs inside funding"}
             hint="Adds up only the jobs whose forecast already exceeds their own authorised funding - netting is not allowed." />
      </div>

      {/* ---- risk strip ---- */}
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="flex flex-col lg:flex-row lg:items-center gap-4">
          <div className="shrink-0">
            <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider">Risk profile</div>
            <div className="text-[11px] text-slate-500 mt-0.5">Weighted on cost headroom, programme, efficiency and data currency</div>
          </div>
          <div className="flex-1 flex rounded-lg overflow-hidden h-8 bg-slate-100 min-w-[200px]">
            {["critical","at-risk","watch","on-track"].map(b => {
              const n = roll.counts[b]; if (!n) return null;
              return (
                <div key={b} className={"flex items-center justify-center text-[11px] font-bold text-white " + BANDS[b].bar}
                     style={{ width: (n/Math.max(1,roll.n))*100 + "%" }} title={BANDS[b].label + ": " + n}>
                  {n}
                </div>
              );
            })}
          </div>
          <div className="flex flex-wrap gap-2 shrink-0">
            {["critical","at-risk","watch","on-track"].map(b =>
              <RiskPill key={b} band={b} score={roll.counts[b]} small />)}
          </div>
        </div>
      </div>

      {/* ---- controls ---- */}
      <div className="flex flex-col lg:flex-row lg:items-center gap-3">
        <div className="flex-1 relative">
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs, references, locations..."

        <div className="flex items-center gap-2 flex-wrap">

              <div><div className="text-[9px] font-black text-slate-400 uppercase">Budget</div><div className="tnum font-bold text-sm">{fmtK(a.BAC)}</div></div>
              <div><div className="text-[9px] font-black text-slate-400 uppercase">Forecast</div><div className={"tnum font-bold text-sm " + (a.variance > 0 ? "text-red-600" : "text-emerald-600")}>{fmtK(a.outturn)}</div></div>
              <div><div className="text-[9px] font-black text-slate-400 uppercase">Safety</div><div className={"tnum font-bold text-sm " + (a.marginPct < 0 ? "text-red-600" : a.marginPct < 5 ? "text-amber-600" : "text-emerald-600")}>{pc(a.marginPct,0)}</div></div>
            </div>
            <div className="mt-3 flex items-center gap-2">
              <div className="flex-1"><Bar pct={a.physicalPct} colour={BANDS[a.band].dot} /></div>
              <span className="tnum text-[11px] font-bold text-slate-600">{a.physicalPct.toFixed(0)}%</span>
            </div>
            <div className="text-[10px] text-slate-400 mt-2">{a.drivers[0]}</div>
          </div>
        ))}
        <button onClick={onNew} className="w-full py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-400 text-xs font-bold uppercase">+ New job</button>
      </div>

      {/* ---- watchlist ---- */}
      {rows.some(r => r.a.band === "critical" || r.a.band === "at-risk") && (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="px-4 py-3 bg-red-50 border-b border-red-100 flex items-center gap-2">
            <span className="text-red-600"><Ico d={I.warn} size={15} /></span>
            <h3 className="text-[11px] font-black uppercase tracking-wider text-red-800">Watchlist — what is driving the risk</h3>
          </div>
          <div className="divide-y divide-slate-100">
            {rows.filter(r => r.a.band === "critical" || r.a.band === "at-risk").map(({ job, a }) => (
              <div key={job.id} onClick={() => open(job.id)}
                   className="px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-2 hover:bg-slate-50 cursor-pointer">
                <div className="w-full sm:w-64 shrink-0">
                  <div className="font-bold text-sm text-slate-800">{job.name}</div>
                  <div className="text-[11px] text-slate-400">{fmtK(a.BAC)} · {a.physicalPct.toFixed(0)}% complete</div>
                </div>
                <div className="flex-1 flex flex-wrap gap-1.5">
                  {a.drivers.map((d,i) => (
                    <span key={i} className="text-[10px] font-bold px-2 py-1 rounded bg-red-50 text-red-700 border border-red-100">{d}</span>
                  ))}
                </div>
                <div className="text-right shrink-0">
                  <div className={"tnum font-bold text-sm " + (a.marginEur < 0 ? "text-red-600" : "text-amber-600")}>{signedK(a.marginEur)}</div>
                  <div className="text-[10px] text-slate-400">margin of safety</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="flex justify-center pt-2 pb-8">
        <button onClick={onReset}
          className="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-red-600 transition">
          Reset to demo data
        </button>
      </div>
    </div>
  );
}

/* ==========================================================================
   7. JOB SET-UP
   Start date + finish date drive the programme length - months are never
   typed. Then the NSBE matrix: pick a preset, untick what does not apply.
   ========================================================================== */

function Setup({ job, save, onClose }) {
  const [d, setD] = useState(job);
  const months = monthsBetween(d.startDate, d.endDate);
  const live = d.elements.filter(e => e.on);
  const allocated = sum(live.map(e => e.budget));
  const drift = allocated - d.budget;
  const [openGroups, setOpenGroups] = useState(() => new Set(GROUPS.map(g => g.g)));
  const [onlyOn, setOnlyOn] = useState(false);

  const set = (k, v) => setD(p => ({ ...p, [k]: v }));
  const toggleGroup = (g) => setOpenGroups(p => { const n = new Set(p); n.has(g) ? n.delete(g) : n.add(g); return n; });

  const applyPreset = (key) => {
    const ex = new Set(PRESETS[key].exclude);
    setD(p => ({ ...p, preset:key, elements: allocate(p.elements.map(e => ({ ...e, on: !ex.has(e.code) })), p.budget) }));
  };
  const toggleElement = (code) =>
    setD(p => ({ ...p, elements: p.elements.map(e => e.code === code ? { ...e, on: !e.on, budget: e.on ? 0 : e.budget } : e) }));
  const setGroup = (g, on) =>
    setD(p => ({ ...p, elements: p.elements.map(e => e.g === g ? { ...e, on, budget: on ? e.budget : 0 } : e) }));
  const reAllocate = () => setD(p => ({ ...p, elements: allocate(p.elements, p.budget) }));

  return (
    <div className="space-y-6">

      {/* --- identity --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Job details</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="sm:col-span-2">
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Project name</label>
            <input value={d.name} onChange={e => set("name", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] focus:ring-2 focus:ring-[#006858]/20" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Job / capital ref</label>
            <input value={d.ref||""} onChange={e => set("ref", e.target.value)} placeholder="e.g. CAP-2026-118"
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Location</label>
            <input value={d.location||""} onChange={e => set("location", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
        </div>
      </section>

      {/* --- programme --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Programme</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Start on site</label>
            <input type="date" value={d.startDate} onChange={e => set("startDate", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Practical completion</label>
            <input type="date" value={d.endDate} onChange={e => set("endDate", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div className="bg-[#e6f2f0] rounded-lg px-3 py-2 border border-[#006858]/15">
            <div className="text-[10px] font-bold text-[#006858] uppercase">Months planned</div>
            <div className="text-2xl font-extrabold text-[#006858] tnum leading-tight">{months || "—"}</div>
            <div className="text-[10px] text-[#006858]/60">calculated from the dates</div>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Stage</label>
            <select value={d.stage} onChange={e => set("stage", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] bg-white">
              {["Feasibility","Design","Tender","Construction","Commissioning","Defects","Complete"].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
      </section>

      {/* --- money --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Budget</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Works budget (excl. contingency)</label>
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">€</span>
              <Money value={d.budget} onChange={v => set("budget", v)}
                className="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
            </div>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Contingency %</label>
            <input type="number" min="0" max="50" step="0.5" value={d.contingencyPct}
              onChange={e => set("contingencyPct", Number(e.target.value))}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
          </div>
          <div className="bg-slate-50 rounded-lg px-3 py-2 border border-slate-200">
            <div className="text-[10px] font-bold text-slate-500 uppercase">Authorised funding</div>
            <div className="text-lg font-extrabold text-slate-800 tnum">{fmtEur(d.budget * (1 + d.contingencyPct/100))}</div>
            <div className="text-[10px] text-slate-400 leading-tight mt-0.5">works + contingency</div>
          </div>
          <div className={"rounded-lg px-3 py-2 border " + (Math.abs(drift) < 1 ? "bg-emerald-50 border-emerald-200" : "bg-amber-50 border-amber-200")}>
            <div className="text-[10px] font-bold uppercase text-slate-500">Allocated to elements</div>
            <div className="text-lg font-extrabold tnum text-slate-800">{fmtEur(allocated)}</div>
            <div className={"text-[10px] font-bold " + (Math.abs(drift) < 1 ? "text-emerald-600" : "text-amber-700")}>
              {Math.abs(drift) < 1 ? "Balanced" : signedK(drift) + " vs budget"}
            </div>
          </div>
        </div>
      </section>

      {/* --- the matrix --- */}
      <section>
        <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-3 mb-3">
          <div>
            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider">Matrix of Building Elements — NSAI MMC Toolkit</h4>
            <p className="text-[11px] text-slate-500 mt-1 max-w-xl">
              Cells <strong className="tnum">1–59</strong> of the NSAI matrix. Tick only what applies —
              an internal fit-out drops <strong className="tnum">59</strong> Landscape,
              <strong className="tnum"> 40</strong> Roads and the whole substructure column, and they then
              carry no budget and no weight in the completion roll-up. The column summaries
              (<span className="tnum">60–67</span>) are not listed: the app rolls each column up itself.
              Group <strong>P</strong> sits outside the NSAI matrix and holds prelims, fees and contingency;
              <strong className="tnum"> P6</strong> is off by default because contingency is already carried
              by the contingency % above.
            </p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[10px] font-black text-slate-400 uppercase">Preset</span>
            {Object.entries(PRESETS).map(([k,v]) => (
              <button key={k} onClick={() => applyPreset(k)} title={v.hint}
                className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition border " +
                  (d.preset === k ? "bg-[#006858] text-white border-[#006858]" : "bg-white text-slate-600 border-slate-200 hover:border-[#006858] hover:text-[#006858]")}>
                {v.label}
              </button>
            ))}
          </div>
        </div>

        <div className="flex items-center justify-between mb-2 text-[11px]">
          <div className="text-slate-500">
            <strong className="text-slate-800 tnum">{live.length}</strong> of {d.elements.length} elements applicable
          </div>
          <div className="flex items-center gap-3">
            <label className="flex items-center gap-1.5 cursor-pointer text-slate-500 font-bold">
              <input type="checkbox" checked={onlyOn} onChange={e => setOnlyOn(e.target.checked)} className="accent-[#006858]" />
              Show applicable only
            </label>
            <button onClick={reAllocate} className="px-2.5 py-1 rounded bg-white border border-slate-200 font-bold text-slate-600 hover:text-[#006858] hover:border-[#006858]">
              Auto-spread budget
            </button>
          </div>
        </div>

        <div className="border border-slate-200 rounded-xl overflow-hidden max-h-[460px] overflow-y-auto scroll bg-white">
          {GROUPS.map(grp => {
            const items = d.elements.filter(e => e.g === grp.g && (!onlyOn || e.on));
            if (!items.length) return null;
            const all = d.elements.filter(e => e.g === grp.g);
            const onCount = all.filter(e => e.on).length;
            const gBudget = sum(all.filter(e => e.on).map(e => e.budget));
            const isOpen = openGroups.has(grp.g);
            return (
              <div key={grp.g} className="border-b border-slate-100 last:border-0">
                <div className="flex items-center gap-2 px-3 py-2 bg-slate-50 sticky top-0 z-10">
                  <button onClick={() => toggleGroup(grp.g)} className="text-slate-400 hover:text-slate-700">
                    <Ico d={I.chev} size={14} className={isOpen ? "" : "-rotate-90"} />
                  </button>
                  <span className="w-1.5 h-4 rounded-full" style={{ background: grp.colour }} />
                  <span className="font-bold text-[12px] text-slate-700 flex-1">{grp.g === "P" ? "" : grp.g + ". "}{grp.name}</span>
                  <span className="text-[10px] text-slate-400 tnum">{onCount}/{all.length}</span>
                  <span className="text-[11px] font-bold text-slate-600 tnum w-20 text-right">{fmtK(gBudget)}</span>
                  <button onClick={() => setGroup(grp.g, onCount < all.length)}
                    className="text-[10px] font-bold text-[#006858] hover:underline w-14 text-right">
                    {onCount < all.length ? "Tick all" : "Clear"}
                  </button>
                </div>
                {isOpen && items.map(e => (
                  <div key={e.code} className={"flex items-center gap-2 px-3 py-1.5 border-t border-slate-50 " + (e.on ? "" : "opacity-45")}>
                    <input type="checkbox" checked={e.on} onChange={() => toggleElement(e.code)} className="accent-[#006858] w-4 h-4 shrink-0" />
                    <span className="tnum text-[11px] text-slate-400 w-11 shrink-0">{e.code}</span>
                    <span className="text-[12px] text-slate-700 flex-1 truncate">{e.name}</span>
                    <div className="relative w-28 shrink-0">
                      <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-[11px]">€</span>
                      <Money value={e.budget} disabled={!e.on}
                        onChange={v => setD(p => ({ ...p, elements: p.elements.map(x => x.code === e.code ? { ...x, budget:v } : x) }))}
                        className="w-full pl-5 pr-2 py-1 text-[12px] text-right border border-slate-200 rounded outline-none focus:border-[#006858] disabled:bg-slate-50" />
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </section>

      <div className="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-100">
        <button onClick={() => { save({ ...d, budget: allocated > 0 ? allocated : d.budget }); onClose(); }}
          className="flex-1 py-3 bg-[#006858] text-white rounded-xl font-bold hover:bg-[#00806c] transition shadow-sm">
          Save job set-up
        </button>
        <button onClick={onClose} className="px-6 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50">Cancel</button>
      </div>
    </div>
  );
}

/* ==========================================================================
   8. JOB DATA DRAWER - spend log, planned cash flow, milestones
   Hidden by default. The job view is an overview; this is where you type.
   ========================================================================== */

function DataDrawer({ job, a, save }) {
  const [tab, setTab] = useState("log");
  const upd = (k, v) => save({ ...job, [k]: v });

  const addMonth = () => {
    if (a.nLogged >= a.months) return;
    upd("actuals", [...(job.actuals||[]), { value: Math.round(a.plan.periodic[a.nLogged] || 0), comment:"" }]);
  };
  const ensurePlan = () => job.planned && job.planned.length
    ? [...job.planned]
    : a.plan.periodic.map(v => ({ value:v, comment:"" }));

  const tabs = [["log","Spend log"],["plan","Planned cash flow"],["ms","Milestones"]];

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="flex border-b border-slate-100">
        {tabs.map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={"flex-1 py-2.5 text-[11px] font-bold uppercase tracking-wide transition " +
              (tab === id ? "text-[#006858] border-b-2 border-[#006858] bg-[#e6f2f0]/40" : "text-slate-400 hover:text-slate-600")}>
            {label}
          </button>
        ))}
      </div>

      <div className="p-3 max-h-[420px] overflow-y-auto scroll bg-slate-50/60">
        {tab === "log" && (
          <div className="space-y-2">
            {(job.actuals||[]).map((it, i) => (
              <div key={i} className="bg-white rounded-lg border border-slate-200 p-2">
                <div className="flex items-center gap-2">
                  <span className="w-14 h-7 rounded bg-slate-100 text-[10px] font-bold text-slate-500 flex items-center justify-center shrink-0 tnum">
                    {monthLabel(job.startDate, i)}
                  </span>
                  <div className="flex-1 relative">
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-xs">€</span>
                    <Money value={it.value}
                      onChange={v => upd("actuals", job.actuals.map((x,j) => j === i ? { ...x, value:v } : x))}
                      className="w-full pl-6 pr-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                  </div>
                  <button onClick={() => upd("actuals", job.actuals.filter((_,j) => j !== i))}
                    className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={14} /></button>
                </div>
                <input value={it.comment||""} placeholder="Certificate ref, note..."
                  onChange={e => upd("actuals", job.actuals.map((x,j) => j === i ? { ...x, comment:e.target.value } : x))}
                  className="w-full mt-1 text-[11px] px-2 py-1 rounded bg-slate-50 outline-none focus:bg-white focus:ring-1 focus:ring-slate-200" />
              </div>
            ))}
            {a.nLogged < a.months && (
              <button onClick={addMonth}
                className="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-[11px] font-bold uppercase hover:border-[#006858] hover:text-[#006858] transition">
                + Log {monthLabel(job.startDate, a.nLogged)}
              </button>
            )}
            {a.monthsBehindOnLogs > 0 && (
              <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 font-medium">
                {a.monthsBehindOnLogs} month{a.monthsBehindOnLogs > 1 ? "s" : ""} of spend not yet logged — the forecast is running on stale data.
              </div>
            )}
          </div>
        )}

        {tab === "plan" && (
          <div className="space-y-2">
            <div className="flex items-center justify-between text-[11px] mb-1">
              <span className="text-slate-500">
                {job.planned ? "Custom baseline" : "Auto S-curve over " + a.months + " months"}
              </span>
              {job.planned && (
                <button onClick={() => upd("planned", null)} className="font-bold text-[#006858] hover:underline">Reset to S-curve</button>
              )}
            </div>
            {(job.planned || a.plan.periodic.map(v => ({ value:v, comment:"" }))).map((it,i) => (
              <div key={i} className="flex items-center gap-2 bg-white rounded-lg border border-slate-200 p-2">
                <span className="w-14 h-7 rounded bg-slate-100 text-[10px] font-bold text-slate-500 flex items-center justify-center shrink-0 tnum">
                  {monthLabel(job.startDate, i)}
                </span>
                <div className="flex-1 relative">
                  <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-xs">€</span>
                  <Money value={it.value}
                    onChange={v => { const n = ensurePlan(); n[i] = { ...n[i], value:v }; upd("planned", n); }}
                    className="w-full pl-6 pr-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === "ms" && (
          <div className="space-y-2">
            {(job.milestones||[]).map((m,i) => (
              <div key={i} className="bg-white rounded-lg border border-slate-200 p-2 flex items-center gap-2">
                <select value={m.month} onChange={e => upd("milestones", job.milestones.map((x,j) => j === i ? { ...x, month:Number(e.target.value) } : x))}
                  className="px-2 py-1.5 border border-slate-200 rounded text-[11px] outline-none focus:border-[#006858] bg-white tnum">
                  {Array.from({ length:a.months }, (_,k) => <option key={k} value={k+1}>{monthLabel(job.startDate,k)}</option>)}
                </select>
                <input value={m.label} placeholder="Milestone"
                  onChange={e => upd("milestones", job.milestones.map((x,j) => j === i ? { ...x, label:e.target.value } : x))}
                  className="flex-1 px-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                <button onClick={() => upd("milestones", job.milestones.filter((_,j) => j !== i))}
                  className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={14} /></button>
              </div>
            ))}
            <button onClick={() => upd("milestones", [...(job.milestones||[]), { month: Math.ceil(a.months/2), label:"New milestone" }])}
              className="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-[11px] font-bold uppercase hover:border-[#006858] hover:text-[#006858]">
              + Add milestone
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ==========================================================================
   9. ELEMENT PROGRESS PANEL
   Percent complete per applicable element. This is what drives the headline
   completion figure - budget-weighted, not a guess on a slider.
   ========================================================================== */

function ElementProgress({ job, a, save, compact }) {
  const [onlyLive, setOnlyLive] = useState(true);
  const setPct = (code, v) =>
    save({ ...job, elements: job.elements.map(e => e.code === code ? { ...e, pct: clamp(v,0,100) } : e) });

  const groups = GROUPS.map(g => {
    const items = job.elements.filter(e => e.g === g.g && (!onlyLive || e.on));
    const on = items.filter(e => e.on);
    const w = sum(on.map(e => e.budget)) || on.length;
    const gPct = on.length === 0 ? 0
      : w === on.length ? sum(on.map(e => e.pct||0)) / on.length
      : sum(on.map(e => (e.budget||0)*(e.pct||0))) / w;
    return { ...g, items, on, budget: sum(on.map(e => e.budget)), pct: gPct };
  }).filter(g => g.items.length);

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
        <div>
          <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
            <span className="text-[#006858]"><Ico d={I.layers} size={16} /></span>
            Element completion
          </h3>
          <p className="text-[11px] text-slate-500 mt-0.5">Budget-weighted — this drives the headline % complete</p>
        </div>
        <label className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 cursor-pointer shrink-0">
          <input type="checkbox" checked={onlyLive} onChange={e => setOnlyLive(e.target.checked)} className="accent-[#006858]" />
          Applicable only

      <div className={"overflow-y-auto scroll " + (compact ? "max-h-[380px]" : "max-h-[620px]")}>
        {groups.map(g => (
          <div key={g.g} className="border-b border-slate-100 last:border-0">
            <div className="flex items-center gap-2 px-4 py-2 bg-slate-50">
              <span className="w-1.5 h-4 rounded-full" style={{ background:g.colour }} />

                <span className="tnum text-[11px] text-slate-500 w-16 text-right shrink-0 hidden sm:inline">{fmtK(e.budget)}</span>

                <input type="number" min="0" max="100" value={e.pct||0} disabled={!e.on}
                  onChange={ev => setPct(e.code, Number(ev.target.value))}

        <div className="flex-1"><Bar pct={a.rolledPct} colour="#006858" h={7} /></div>
        <span className="tnum text-lg font-extrabold text-[#006858]">{a.rolledPct.toFixed(1)}%</span>
      </div>

}
