<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root{
  --hse:#006858; --hse-dk:#00453a; --hse-lt:#00bfa5; --hse-pale:#e6f2f0;
  --ink:#0f172a; --mute:#64748b; --line:#e2e8f0;
  --good:#0f9d76; --watch:#d97706; --risk:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#f1f5f9;color:#0f172a;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px}
.scroll::-webkit-scrollbar-thumb:hover{background:#94a3b8}

input[type=range]{-webkit-appearance:none;background:transparent;height:18px}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#e2e8f0;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:16px;width:16px;border-radius:50%;background:#006858;margin-top:-6px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}

.fade-in{animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- MAP ----------
   Real OSM tiles, pulled toward the dashboard palette: desaturated, lifted and
   nudged green so the basemap sits behind the risk markers instead of fighting
   them. The filter is on the tile pane only, so markers keep their true colour. */
/* Leaflet's own panes run at z-index 400-800. Without a stacking context of
   its own the map paints straight through any modal opened over it. */
#cta-map{background:#eaf1ef;position:relative;z-index:0;isolation:isolate}
#cta-map .leaflet-tile-pane{
  filter:grayscale(0.72) saturate(0.85) brightness(1.06) sepia(0.16) hue-rotate(118deg);
}
#cta-map .leaflet-container{font-family:'Inter',system-ui,sans-serif}
#cta-map .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.82)}
#cta-map .leaflet-bar a{color:#006858}
.cta-tip{
  background:#0f172a;color:#fff;border:0;border-radius:8px;padding:7px 9px;
  font-size:11px;line-height:1.35;box-shadow:0 6px 18px rgba(15,23,42,.28);
}
.cta-tip::before{border-top-color:#0f172a}

/* ---------- GANTT (ported from HSE Capital Suite) ---------- */
.no-sel{user-select:none}
.group-header-row{background:linear-gradient(to right,#eef2f6,#fff);border-bottom:2px solid #e2e8f0}
.gantt-bar{cursor:grab}
.gantt-bar.dragging{cursor:grabbing;opacity:.85}
.resize-handle{cursor:ew-resize}
/* outline (not box-shadow) so a later sibling row cannot paint over the ring */
.critical-ring{outline:2px solid #ef4444;outline-offset:1px;z-index:5}
/* arrows render above the bars; the halo keeps them legible where they cross one */
.dep-line{fill:none;stroke:#64748b;stroke-width:1.6}
.dep-line-halo{fill:none;stroke:#fff;stroke-width:4;stroke-opacity:.9}
.dep-line.critical{stroke:#ef4444;stroke-width:2.2;stroke-dasharray:4;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-8}}

/* ---------- REPORT / PRINT ---------- */
@page{size:A4 landscape;margin:8mm}
.sheet{width:277mm;min-height:190mm;background:#fff;margin:0 auto;box-shadow:0 10px 40px rgba(15,23,42,.18);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.sheet + .sheet{margin-top:20px}
@media print{
  html,body{background:#fff !important;margin:0 !important;padding:0 !important}
  .no-print{display:none !important}

  /* The dashboard stays mounted behind the report overlay. Without this it
     prints first and the PDF opens on pages of dashboard. */
  body.report-open .app-shell{display:none !important}

  .print-root{position:static !important;inset:auto !important;overflow:visible !important;background:#fff !important;padding:0 !important}
  .sheet{width:auto;min-height:auto;box-shadow:none;border-radius:0;break-after:page;margin:0}
  .sheet:last-child{break-after:auto}
  /* The programme is drawn to fit one page, so pin it to the printable height
     and forbid an internal break - otherwise the header lands on one page and
     the chart slides onto the next. */
  .sheet-fixed{height:194mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
  .avoid-break{break-inside:avoid}

  /* Force the greens, bars and tints to actually ink. Without exact colour
     adjust the browser drops every background and the report prints white. */
  *,*::before,*::after{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
}
</style>

  ["8","Site generally","8"],
  ["16","Prepared site","8"],

const ALL_CODES = NSBE.map(e => e.code);
const keepOnly = (keep) => ALL_CODES.filter(c => !keep.includes(c));

/* Set-up presets - which cells are normally applicable by job type.
   Picked once at set-up, then hand-tuned. Nothing is locked. */
const PRESETS = {

/* Indicative weightings (% of works cost) used to auto-spread a budget across
   whatever cells are ticked. Anything not listed gets a residual share. These
   are starting points to get a shape on the curve, not a cost plan - overwrite
   them with your own figures. */
const WEIGHTS = {
  "P1":8, "P2":8, "P3":1, "P4":1, "P5":2, "P6":6,
  "1":0.5, "9":2, "17":2, "25":4, "33":3,
  "2":0.5, "10":6, "18":3, "26":4, "34":1, "41":2.5, "48":7,
  "3":0.5, "11":3, "19":1.5, "27":1, "35":0.5, "42":1.5, "49":1,
  "4":0.5, "12":1.5, "20":1.5, "28":2.5, "36":0.3, "43":1, "50":2,
  "5":0.5, "13":2.5, "21":1.5, "29":2, "37":1, "44":2, "51":3, "55":6, "58":1,
  "6":0.5, "14":3, "22":2, "30":2.5, "38":2, "45":1.5, "52":1.5, "56":1,
  "7":0.5, "15":0.5, "23":1.5, "31":1, "39":1, "46":0.5, "53":1,
  "8":0.5, "16":1, "24":0.5, "32":0.5, "40":2, "47":1, "54":0.5, "57":0.3, "59":1,

/* ==========================================================================
   2. HELPERS
   ========================================================================== */

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = (a) => a.reduce((x,y) => x + (y||0), 0);
const uid = () => "j" + Math.random().toString(36).slice(2,9);

const fmtEur = (n) => "€" + Math.round(n||0).toLocaleString("en-IE");
const fmtK = (n) => {
  const v = n||0, a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 1e6) return s + "€" + (a/1e6).toFixed(a/1e6 >= 10 ? 1 : 2) + "m";
  if (a >= 1e3) return s + "€" + Math.round(a/1e3) + "k";
  return s + "€" + Math.round(a);
};
const pc = (n, d=1) => (n == null || !isFinite(n)) ? "—" : n.toFixed(d) + "%";

/* Contingency draw past the allowance is far clearer as a multiple than as a
   percentage running into four figures. 574% means nothing; 5.7x does. */
const drawLabel = (pctVal) => {
  if (pctVal == null || !isFinite(pctVal)) return "—";
  return pctVal > 150 ? (pctVal / 100).toFixed(1) + "×" : Math.round(pctVal) + "%";
};
const signedK = (n) => (n > 0 ? "+" : "") + fmtK(n);

const parseDate = (s) => { if (!s) return null; const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
const monthsBetween = (a, b) => {
  const s = parseDate(a), e = parseDate(b);
  if (!s || !e) return 0;
  return Math.max(1, (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth()) + 1);
};
const monthLabel = (start, i) => {
  const d = parseDate(start);
  if (!d) return "M" + (i+1);
  d.setMonth(d.getMonth() + i);
  return d.toLocaleDateString("en-GB", { month:"short", year:"2-digit" });
};
const addMonthsISO = (iso, n) => {
  const d = parseDate(iso) || new Date();
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0,10);
};
const todayISO = () => new Date().toISOString().slice(0,10);

/* Monotone cubic (Fritsch-Carlson) through fixed knots. Monotone matters: an
   ordinary spline would overshoot and hand back negative monthly spend. */
function monotoneThrough(xs, ys) {
  const n = xs.length, dx = [], dy = [], m = [];
  for (let i = 0; i < n-1; i++) { dx.push(xs[i+1]-xs[i]); dy.push(ys[i+1]-ys[i]); m.push(dy[i]/dx[i]); }
  const c = new Array(n);
  c[0] = m[0]; c[n-1] = m[n-2];
  for (let i = 1; i < n-1; i++) {
    if (m[i-1]*m[i] <= 0) { c[i] = 0; continue; }
    const w1 = 2*dx[i] + dx[i-1], w2 = dx[i] + 2*dx[i-1];
    c[i] = (w1 + w2) / (w1/m[i-1] + w2/m[i]);
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n-1]) return ys[n-1];
    let i = 0; while (i < n-2 && x > xs[i+1]) i++;
    const h = dx[i], t = (x - xs[i])/h, t2 = t*t, t3 = t2*t;
    return (2*t3 - 3*t2 + 1)*ys[i] + (t3 - 2*t2 + t)*h*c[i]
         + (-2*t3 + 3*t2)*ys[i+1] + (t3 - t2)*h*c[i+1];
  };
}

/* The standard construction S-curve: 20% of spend in the first third of the
   programme, 60% through the middle third, 20% in the last third. The curve
   passes exactly through those thirds and is smooth in between. */
const SCURVE_SHAPE = monotoneThrough([0, 1/3, 2/3, 1], [0, 0.20, 0.80, 1]);

const sCurve = (total, periods) => {
  if (periods < 1) return { periodic:[], cumulative:[] };
  const cumulative = [];
  for (let i = 1; i <= periods; i++) cumulative.push(Math.round(total * SCURVE_SHAPE(i/periods)));
  const periodic = cumulative.map((v,i) => i === 0 ? v : v - cumulative[i-1]);
  return { periodic, cumulative };
};

/* ==========================================================================
   3. JOB MODEL + THE ANALYSIS
   ========================================================================== */

function makeElements(presetKey, budget) {
  const ex = new Set((PRESETS[presetKey] || PRESETS["new-build"]).exclude);
  // P6 stays off by default - contingency is carried by the contingency %
  // on the job, and having it in both places double-counts it. Tick it only
  // if you would rather run contingency as a cost-plan line instead.
  ex.add("P6");
  const rows = NSBE.map(e => ({ ...e, on: !ex.has(e.code), budget: 0, pct: 0 }));
  return allocate(rows, budget);
}

/* Spread a budget across ticked elements using the indicative weightings. */
function allocate(rows, budget) {
  const on = rows.filter(r => r.on);
  const w = sum(on.map(r => WEIGHTS[r.code] || 1));
  if (!w) return rows;
  return rows.map(r => r.on
    ? { ...r, budget: Math.round(budget * ((WEIGHTS[r.code] || 1) / w)) }
    : { ...r, budget: 0 });
}

function newJob(over = {}) {
  const start = over.startDate || todayISO().slice(0,8) + "01";
  const end = over.endDate || addMonthsISO(start, 17);
  const budget = over.budget != null ? over.budget : 2500000;
  const preset = over.preset || "new-build";
  const months = monthsBetween(start, end);
  return {
    id: uid(),
    name: "New Project",
    ref: "",
    location: "",
    stage: "Construction",
    preset,
    startDate: start,
    endDate: end,
    budget,
    contingencyPct: 10,
    escalationPct: 4,                    // construction inflation, % per year
    elements: makeElements(preset, budget),
    planned: null,                       // null = derived S-curve
    actuals: [],
    milestones: [],
    variations: [],                      // {id, ref, desc, code, amount, status}
    scenarios: [],                       // saved what-if levers
    tasks: null,                         // null = programme not generated yet
    ...over,
  };
}

/* Bring a stored job's element list up to the current matrix.
   The element scheme can change between versions of this file. Without this,
   a job saved under an older scheme keeps codes that no longer match any
   group, so every group filters to nothing and the matrix silently renders
   empty - on screen and, worse, in the report. */
function reconcileElements(job) {
  const ex = new Set((PRESETS[job.preset] || PRESETS["new-build"]).exclude);
  ex.add("P6");
  const prev = new Map((job.elements || []).map(e => [e.code, e]));
  const matched = NSBE.filter(e => prev.has(e.code)).length;

  const elements = matched === 0
    // Nothing recognisable: rebuild from the preset and re-spread the budget.
    ? makeElements(job.preset || "new-build", job.budget || 0)
    // Partial match: keep what we recognise, default anything newly added.
    : NSBE.map(e => {
        const p = prev.get(e.code);
        return p ? { ...e, on: !!p.on, budget: p.budget || 0, pct: p.pct || 0 }
                 : { ...e, on: !ex.has(e.code), budget: 0, pct: 0 };
      });

  // Fields added in later versions: make sure they always exist.
  return {
    ...job, elements,
    escalationPct: job.escalationPct == null ? 4 : job.escalationPct,
    cpiOverride: job.cpiOverride == null ? null : job.cpiOverride,
    variations: job.variations || [],
    scenarios: job.scenarios || [],
    tasks: job.tasks || null,
    milestones: job.milestones || [],
    actuals: job.actuals || [],
  };
}

/* --- the whole analysis for one job ------------------------------------- */
function analyse(job) {
  const months = monthsBetween(job.startDate, job.endDate);
  const live = (job.elements || []).filter(e => e.on);

  // Budget: elements are the source of truth once they carry values.
  // The QS chain is original -> approved variations -> current budget. Approved
  // variations raise the budget being measured against, so agreed extra scope
  // stops reading as an overrun; they are drawn against contingency, so the
  // funding envelope does not move with them.
  const elemBudget = sum(live.map(e => e.budget));
  const original = elemBudget > 0 ? elemBudget : (job.budget || 0);

  const vos = job.variations || [];
  const voApproved    = sum(vos.filter(v => v.status === "approved").map(v => v.amount));
  const voAnticipated = sum(vos.filter(v => v.status === "anticipated").map(v => v.amount));

  const BAC = original + voApproved;                     // current budget
  const contingency = original * (job.contingencyPct || 0) / 100;
  const authorised = original + contingency;             // funding envelope
  const contDrawn = voApproved;
  const contRemaining = contingency - contDrawn;

  // Physical completion rolls up from the applicable elements, budget-weighted.
  const wTotal = sum(live.map(e => e.budget)) || live.length;
  const rolledPct = live.length === 0 ? 0
    : wTotal === live.length
      ? sum(live.map(e => e.pct || 0)) / live.length
      : sum(live.map(e => (e.budget || 0) * (e.pct || 0))) / wTotal;
  // Completion of the original scope is always the elemental roll-up. There is
  // deliberately no "sync to plan" control: setting progress from the plan
  // would force EV == PV, pin SPI at 1.00 and hide every schedule problem.
  const elementPct = clamp(rolledPct, 0, 100);

  // Planned cash flow
  const plan = job.planned && job.planned.length
    ? (() => { let s = 0; const cum = []; const per = job.planned.map(p => { s += (p.value||0); cum.push(s); return p.value||0; }); return { periodic: per, cumulative: cum }; })()
    : sCurve(BAC, months);
  const planTotal = plan.cumulative[plan.cumulative.length-1] || BAC;

  const actuals = job.actuals || [];
  const nLogged = actuals.length;
  const AC = sum(actuals.map(a => a.value));
  const idx = nLogged - 1;
  const PV = idx >= 0 ? (plan.cumulative[Math.min(idx, plan.cumulative.length-1)] || 0) : 0;

  // Earned value. A variation carries its OWN completion, because agreed extra
  // scope normally starts at 0% done. Earning it against the elemental
  // completion instead would hand the job free value the moment a variation is
  // approved, and flatter CPI for work nobody has done yet.
  const voEarned = sum(vos.filter(v => v.status === "approved")
    .map(v => (v.amount || 0) * clamp(v.pct || 0, 0, 100) / 100));
  const EV = original * elementPct / 100 + voEarned;

  // Overall completion measured against the current budget, variations included.
  const physicalPct = BAC > 0 ? clamp((EV / BAC) * 100, 0, 100) : elementPct;

  // CPI is measured from the job unless an assumption has been set. Early on,
  // one or two certificates give a CPI that swings wildly, so a QS may prefer
  // to forecast on a considered figure until there is enough history.
  const measuredCPI = AC > 0 ? EV / AC : null;
  const CPI = job.cpiOverride != null && job.cpiOverride > 0 ? job.cpiOverride : measuredCPI;
  const cpiIsAssumed = CPI != null && CPI !== measuredCPI;
  const SPI = PV > 0 ? EV / PV : null;
  const CV  = EV - AC;                 // cost variance (value earned vs money spent)
  const SV  = EV - PV;                 // schedule variance, in money
  const cashVar = AC - PV;             // pure cash: spent vs planned to spend

  // --- Trend forecasts ---------------------------------------------------
  // Efficiency trend: remaining work costs what the work so far has cost.
  const outEfficiency = CPI && CPI > 0 ? BAC / CPI : BAC;
  // Burn trend: current monthly spend simply continues to the end.
  const burn = nLogged > 0 ? AC / nLogged : 0;
  const projMonths = SPI && SPI > 0 ? months / SPI : months;
  const outBurn = nLogged > 0 ? AC + burn * Math.max(0, projMonths - nLogged) : BAC;
  // Headline: the worse of the two, so the number never flatters the job.
  const outturn = Math.max(outEfficiency, outBurn) || BAC;
  const outturnBasis = outturn === outEfficiency ? "Cost efficiency trend" : "Spend rate trend";

  const variance = outturn - BAC;                        // against current budget
  const variancePct = BAC > 0 ? (variance / BAC) * 100 : 0;
  const varianceVsOriginal = outturn - original;         // the funding story

  // Contingency: drawn by approved variations, forecast to be drawn by the
  // anticipated ones plus whatever overrun is left on top of the current budget.
  const contForecastDraw = contDrawn + voAnticipated + Math.max(0, variance);
  const contDrawnPct    = contingency > 0 ? clamp((contDrawn / contingency) * 100, 0, 999)
                                          : (contDrawn > 0 ? 999 : 0);
  const contForecastPct = contingency > 0 ? clamp((contForecastDraw / contingency) * 100, 0, 999)
                                          : (contForecastDraw > 0 ? 999 : 0);

  // --- Margin of safety ---------------------------------------------------
  // How much more the job can cost before it breaches the authorised funding.
  const marginEur = authorised - outturn;
  const marginPct = authorised > 0 ? (marginEur / authorised) * 100 : 0;

  // --- Breakeven ----------------------------------------------------------
  // How much of the works the authorised funding actually buys at the forecast
  // cost rate. >= 100% means the job lands inside its funding. Taken off the
  // headline out-turn so it can never disagree with the margin of safety.
  const breakevenPct = nLogged > 0 && outturn > 0
    ? clamp((authorised / outturn) * 100, 0, 200) : null;
  // Required efficiency on the remaining work to land exactly on the funding.
  const requiredCPI = (authorised - AC) > 0 ? (BAC - EV) / (authorised - AC) : null;

  // Forecast cash curve. It lands exactly on the headline out-turn, so the
  // curve, the breakeven month and the margin of safety can never disagree.
  const forecast = [];
  let breakevenMonth = null;
  if (nLogged > 0) {
    const horizon = Math.max(months, Math.ceil(projMonths));
    const toSpend = Math.max(0, outturn - AC);

    // Remaining spend follows the same 20/60/20 S-curve as the baseline, not a
    // straight line. A straight line is the common shortcut, but a job halfway
    // through is in the steep middle of the curve, so it understates the next
    // few months and overstates the run-out - which moves the breakeven month.
    const shapeAt = (i) => SCURVE_SHAPE(clamp(i / horizon, 0, 1));
    const weights = [];
    let wSum = 0;
    for (let i = nLogged; i < horizon; i++) {
      const w = Math.max(0, shapeAt(i + 1) - shapeAt(i));
      weights.push(w); wSum += w;
    }

    let running = AC;
    for (let i = 0; i < horizon; i++) {
      if (i < nLogged - 1) { forecast.push(null); continue; }
      if (i === nLogged - 1) { forecast.push(Math.round(AC)); continue; }
      const w = weights[i - nLogged] || 0;
      running += wSum > 0 ? toSpend * (w / wSum) : toSpend / Math.max(1, horizon - nLogged);
      forecast.push(Math.round(running));
    }
    // Only a job whose forecast actually breaches funding has a breakeven month.
    if (AC >= authorised) breakevenMonth = nLogged - 1;
    else if (outturn > authorised) {
      const i = forecast.findIndex(v => v != null && v >= authorised);
      breakevenMonth = i === -1 ? null : i;
    }
  }

  // --- Escalation ---------------------------------------------------------
  // The trend forecasts carry today's cost rates forward, so they are in
  // today's money. Construction inflation over the time still to run is a
  // separate figure - a QS quotes both a base-date cost and an out-turn cost.
  const escPct = job.escalationPct == null ? 0 : job.escalationPct;
  const remainingWork = Math.max(0, BAC - EV);
  const monthsRemaining = Math.max(0, projMonths - nLogged);
  const escalationToEnd = remainingWork * (escPct / 100) * (monthsRemaining / 12);
  const outturnNominal = outturn + escalationToEnd;   // at out-turn prices

  // --- Schedule -----------------------------------------------------------
  const delayMonths = projMonths - months;
  const plannedPctToDate = planTotal > 0 && idx >= 0
    ? clamp((plan.cumulative[Math.min(idx, plan.cumulative.length-1)] / planTotal) * 100, 0, 100) : 0;
  const pctDrift = physicalPct - plannedPctToDate;
  const forecastEnd = addMonthsISO(job.startDate, Math.round(projMonths) - 1);

  // --- Risk ---------------------------------------------------------------
  // 0 = clean, 100 = critical. Weighted so cost headroom dominates.
  const rCost  = marginPct >= 10 ? 0 : marginPct <= -10 ? 100 : (10 - marginPct) * 5;
  const rSched = SPI == null ? 20 : SPI >= 1 ? 0 : clamp((1 - SPI) * 250, 0, 100);
  const rEff   = CPI == null ? 20 : CPI >= 1 ? 0 : clamp((1 - CPI) * 250, 0, 100);
  const monthsBehindOnLogs = Math.max(0, Math.min(months, monthsBetween(job.startDate, todayISO())) - nLogged);
  const rData  = clamp(monthsBehindOnLogs * 30, 0, 100);
  const riskScore = Math.round(0.40*rCost + 0.30*rSched + 0.20*rEff + 0.10*rData);

  const band = riskScore >= 70 ? "critical" : riskScore >= 45 ? "at-risk" : riskScore >= 22 ? "watch" : "on-track";

  const drivers = [];
  if (rCost  >= 45) drivers.push(marginEur < 0 ? "Forecast exceeds funding" : "Little cost headroom left");
  if (rSched >= 45) drivers.push("Behind programme");
  if (rEff   >= 45) drivers.push("Poor cost efficiency");
  if (rData  >= 45) drivers.push(monthsBehindOnLogs + " month(s) of spend unlogged");
  if (!drivers.length) drivers.push("No material exceptions");

  return {
    months, live, BAC, contingency, authorised, elemBudget,
    physicalPct, rolledPct, elementPct, voEarned, plannedPctToDate, pctDrift,
    plan, planTotal, actuals, nLogged, AC, PV, EV,
    CPI, measuredCPI, cpiIsAssumed, SPI, CV, SV, cashVar, burn,
    outturn, outturnBasis, outEfficiency, outBurn, variance, variancePct,
    original, vos, voApproved, voAnticipated, varianceVsOriginal,
    escPct, remainingWork, monthsRemaining, escalationToEnd, outturnNominal,
    contDrawn, contRemaining, contForecastDraw, contDrawnPct, contForecastPct,
    marginEur, marginPct,
    breakevenPct, requiredCPI, breakevenMonth, forecast,
    projMonths, delayMonths, forecastEnd,
    riskScore, band, drivers, monthsBehindOnLogs,
  };
}


/* ==========================================================================
   3b. WHAT-IF SCENARIOS
   Four levers a QS is actually asked about at a project board. The one that
   matters most is slip: delay costs money mainly through time-related
   preliminaries, so slipping the programme draws P1 down at its monthly rate
   rather than just moving a date. That is the bit spreadsheets get wrong.
   ========================================================================== */

const BLANK_SCENARIO = { name:"Scenario", slipMonths:0, inflationPct:0, claim:0, descope:[] };

function runScenario(job, a, sc) {
  const s = { ...BLANK_SCENARIO, ...(sc || {}) };

  // Time-related prelims: P1 spread over the programme.
  const prelims = (job.elements || []).find(e => e.code === "P1" && e.on);
  const prelimsMonthly = prelims && a.months > 0 ? (prelims.budget || 0) / a.months : 0;
  const slipCost = s.slipMonths * prelimsMonthly;

  // Inflation bites on work still to do, not on money already spent.
  const remainingWork = Math.max(0, a.BAC - a.EV);
  const inflationCost = remainingWork * (s.inflationPct / 100);

  // Slipping the programme also pushes the remaining work further into the
  // future, so it gets bought at higher prices. Charged at the job's own
  // escalation rate for the length of the slip - the cost of delay is never
  // just prelims.
  const escalationOnSlip = remainingWork * ((a.escPct || 0) / 100) * (s.slipMonths / 12);

  // Descope returns the uncompleted portion of the elements dropped.
  const dropped = new Set(s.descope || []);
  const descopeSaving = sum((job.elements || [])
    .filter(e => e.on && dropped.has(e.code))
    .map(e => (e.budget || 0) * (1 - clamp(e.pct || 0, 0, 100) / 100)));

  const claim = s.claim || 0;

  const outturn = a.outturn + slipCost + inflationCost + escalationOnSlip + claim - descopeSaving;
  const BAC = a.BAC + claim - descopeSaving;   // a landed claim is agreed scope
  const authorised = a.authorised;             // funding does not move on its own
  const marginEur = authorised - outturn;
  const marginPct = authorised > 0 ? (marginEur / authorised) * 100 : 0;
  const breakevenPct = outturn > 0 ? clamp((authorised / outturn) * 100, 0, 200) : null;
  const projMonths = a.projMonths + s.slipMonths;

  // Efficiency at the new end date, measured on the scope that was always in
  // the job. A landed claim adds the same amount to budget and to cost, so
  // counting it would drag the ratio toward 1.00 and quietly wash out the
  // inefficiency on the original work - a EUR 10m claim should not make a job
  // running at 0.50 look like 0.80.
  const coreBAC = a.BAC - descopeSaving;
  const coreOutturn = outturn - claim;
  const impliedCPI = coreOutturn > 0 ? coreBAC / coreOutturn : null;
  const contForecastDraw = a.contDrawn + a.voAnticipated + claim + Math.max(0, outturn - BAC);
  const contForecastPct = a.contingency > 0 ? clamp((contForecastDraw / a.contingency) * 100, 0, 999)
                                            : (contForecastDraw > 0 ? 999 : 0);

  return {
    ...s, slipCost, inflationCost, escalationOnSlip, descopeSaving, claim, impliedCPI,
    outturn, BAC, authorised, marginEur, marginPct, breakevenPct,
    projMonths, contForecastDraw, contForecastPct,
    delta: outturn - a.outturn,
    fits: marginEur >= 0,
    finishLabel: monthLabel(job.startDate, Math.max(0, Math.round(projMonths) - 1)),
  };
}

/* Worst saved scenario for a job - what the portfolio downside tile reads. */
function worstScenario(job, a) {
  const list = (job.scenarios || []).map(s => runScenario(job, a, s));
  if (!list.length) return null;
  return list.reduce((w, x) => (x.marginEur < w.marginEur ? x : w));
}

/* ==========================================================================
   3c. PROGRAMME ENGINE
   Ported from HSE Capital Suite: critical path by forward/backward pass, with
   summary tasks rolled up from their children, plus the downstream "push" used
   by the delay control. Kept deliberately identical so a programme moved here
   behaves the same way it does there.
   ========================================================================== */

const MS = 86400000;
const D = (s) => { const [y,m,d] = String(s).split("-").map(Number); return Date.UTC(y, m-1, d); };
const isoMs = (ms) => new Date(ms).toISOString().slice(0,10);
const fmtDay = (ms) => new Date(ms).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"2-digit", timeZone:"UTC" });
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Natural density per banding, used only when "fit width" is switched off. */
const ZOOM_PX = { year:1.1, quarter:1.9, month:3.4, week:7, day:16 };
const TIERS = [["auto","Auto"],["year","Year"],["quarter","Quarter"],["month","Month"],["week","Week"],["day","Day"]];

function buildMonths(startMs, endMs) {
  const s = new Date(startMs), e = new Date(endMs);
  let y = s.getUTCFullYear(), m = s.getUTCMonth();
  const ey = e.getUTCFullYear(), em = e.getUTCMonth();
  const out = [];
  while (y < ey || (y === ey && m <= em)) {
    out.push({ key:`${y}-${String(m+1).padStart(2,"0")}`, label:MONTHS[m],
               start:Date.UTC(y,m,1), end:Date.UTC(y,m+1,0) });
    m++; if (m > 11) { m = 0; y++; }
  }
  return out;
}

function resolveProgramme(tasks) {
  const byId = new Map((tasks||[]).map(t => [t.id, {
    ...t, s:D(t.start), e:D(t.end), bs:D(t.bStart || t.start), be:D(t.bEnd || t.end),
  }]));
  const childrenOf = new Map();
  byId.forEach(t => {
    if (t.parentId != null) {
      if (!childrenOf.has(t.parentId)) childrenOf.set(t.parentId, []);
      childrenOf.get(t.parentId).push(t.id);
    }
  });

  // Summary tasks take their span and progress from their children.
  childrenOf.forEach((kids, pid) => {
    const p = byId.get(pid); if (!p) return;
    const cs = kids.map(k => byId.get(k)).filter(Boolean);
    if (!cs.length) return;
    p.s = Math.min(...cs.map(c => c.s));  p.e = Math.max(...cs.map(c => c.e));
    p.bs = Math.min(...cs.map(c => c.bs)); p.be = Math.max(...cs.map(c => c.be));
    const w = cs.reduce((a,c) => a + ((c.e-c.s)/MS + 1), 0);
    p.progress = w > 0 ? Math.round(cs.reduce((a,c) => a + c.progress*((c.e-c.s)/MS + 1), 0) / w) : 0;
    p.isSummary = true;
  });

  const leaves = [...byId.values()].filter(t => !t.isSummary);

  // Forward pass - early finish, in dependency order.
  const ef = new Map();
  const visit = (id, seen = new Set()) => {
    if (ef.has(id)) return ef.get(id);
    if (seen.has(id)) return 0;                     // dependency cycle guard
    seen.add(id);
    const t = byId.get(id); if (!t) return 0;
    const dur = (t.e - t.s)/MS + 1;
    const preds = (t.dependencies || []).filter(d => byId.has(d));
    const start = preds.length ? Math.max(...preds.map(d => visit(d, seen) + MS)) : t.s;
    const v = Math.max(t.s, start) + (dur - 1)*MS;
    ef.set(id, v); return v;
  };
  leaves.forEach(t => visit(t.id));
  const projectFinish = leaves.length ? Math.max(...leaves.map(t => ef.get(t.id) || t.e)) : 0;

  // Backward pass - late finish.
  const successors = new Map();
  leaves.forEach(t => (t.dependencies || []).forEach(d => {
    if (!successors.has(d)) successors.set(d, []);
    successors.get(d).push(t.id);
  }));
  const lf = new Map();
  const back = (id, seen = new Set()) => {
    if (lf.has(id)) return lf.get(id);
    if (seen.has(id)) return projectFinish;
    seen.add(id);
    const succ = (successors.get(id) || []).filter(s => byId.has(s));
    const v = !succ.length ? projectFinish : Math.min(...succ.map(s => {
      const st = byId.get(s);
      return back(s, seen) - ((st.e - st.s)/MS + 1)*MS;
    }));
    lf.set(id, v); return v;
  };
  leaves.forEach(t => back(t.id));

  byId.forEach(t => {
    if (t.isSummary) { t.slack = 0; t.isCritical = false; return; }
    t.slack = Math.round(((lf.get(t.id) || t.e) - (ef.get(t.id) || t.e)) / MS);
    t.isCritical = t.slack <= 0;
  });

  const list = [...byId.values()];
  return { tasks:list, byId, childrenOf, projectFinish, leaves:list.filter(t => !t.isSummary) };
}

/* Push a task and everything downstream of it by `days`. */
function disrupt(tasks, rootId, days) {
  const succ = new Map();
  tasks.forEach(t => (t.dependencies || []).forEach(d => {
    if (!succ.has(d)) succ.set(d, []);
    succ.get(d).push(t.id);
  }));
  const hit = new Set();
  const walk = (id) => { if (hit.has(id)) return; hit.add(id); (succ.get(id) || []).forEach(walk); };
  walk(rootId);
  tasks.forEach(t => { if (t.parentId != null && hit.has(t.parentId)) hit.add(t.id); });
  return tasks.map(t => hit.has(t.id)
    ? { ...t, start:isoMs(D(t.start) + days*MS), end:isoMs(D(t.end) + days*MS) }
    : t);
}

/* Build a starting programme from whichever element groups are ticked, spread
   across the job window and chained end to start. Gives every job a workable
   programme on day one instead of an empty chart; drag it from there. */
function generateProgramme(job) {
  const live = (job.elements || []).filter(e => e.on);
  const months = monthsBetween(job.startDate, job.endDate);
  const order = GROUPS.map(g => g.g);
  const active = order.filter(g => live.some(e => e.g === g));
  if (!active.length || !months) return [];

  // Prelims run the whole job; the rest take a slice each, overlapping a little.
  const work = active.filter(g => g !== "P");
  const span = Math.max(1, Math.round((months * 1.35) / Math.max(1, work.length)));
  const step = Math.max(1, Math.round((months - span) / Math.max(1, work.length - 1)) || 1);

  const tasks = [];
  let id = 1;
  if (active.includes("P")) {
    tasks.push({ id:id++, name:"Preliminaries & site establishment", group:"P. Preliminaries",
      start:job.startDate, end:addMonthsISO(job.startDate, months-1), progress:0,
      colour:GROUP_MAP["P"].colour, dependencies:[], parentId:null, milestone:false });
  }
  work.forEach((g, i) => {
    const startM = Math.min(months-1, i*step);
    const endM = Math.min(months-1, startM + span - 1);
    const els = live.filter(e => e.g === g);
    const w = sum(els.map(e => e.budget)) || els.length;
    const pct = w === els.length
      ? Math.round(sum(els.map(e => e.pct||0)) / Math.max(1, els.length))
      : Math.round(sum(els.map(e => (e.budget||0)*(e.pct||0))) / w);
    tasks.push({
      id:id++, name:GROUP_MAP[g].name, group:g + ". " + GROUP_MAP[g].name,
      start:addMonthsISO(job.startDate, startM), end:addMonthsISO(job.startDate, endM),
      progress:clamp(pct, 0, 100), colour:GROUP_MAP[g].colour,
      dependencies: tasks.length && i > 0 ? [tasks[tasks.length-1].id] : [],
      parentId:null, milestone:false,
    });
  });
  (job.milestones || []).forEach(m => {
    const d = addMonthsISO(job.startDate, clamp((m.month||1)-1, 0, months-1));
    tasks.push({ id:id++, name:m.label || "Milestone", group:"M. Milestones",
      start:d, end:d, progress:0, colour:"#006858", dependencies:[], parentId:null, milestone:true });
  });
  tasks.push({ id:id++, name:"Practical completion", group:"M. Milestones",
    start:addMonthsISO(job.startDate, months-1), end:addMonthsISO(job.startDate, months-1),
    progress:0, colour:"#00453a",
    dependencies: work.length ? [tasks.filter(t => !t.milestone).slice(-1)[0].id] : [],
    parentId:null, milestone:true });
  return tasks;
}

/* Thousands separators appear as you type, not only on blur. The caret is put
   back after the same number of digits it was after before reformatting, so
   inserting a separator does not throw the cursor to the end. */
function Money({ value, onChange, className="", disabled }) {
  const [local, setLocal] = useState("");
  const [focus, setFocus] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!focus) setLocal(value ? Number(value).toLocaleString("en-IE") : "");
  }, [value, focus]);

  const handle = (e) => {
    const el = e.target;
    const raw = el.value;
    const digitsBefore = raw.slice(0, el.selectionStart || 0).replace(/[^0-9]/g, "").length;
    const cleaned = raw.replace(/[^0-9.-]/g, "");
    const n = Number(cleaned);

    if (cleaned === "" || isNaN(n)) { setLocal(raw); return; }
    // Keep a trailing decimal point (and its digits) intact while typing.
    const dot = cleaned.indexOf(".");
    const shown = dot === -1
      ? n.toLocaleString("en-IE")
      : Number(cleaned.slice(0, dot)).toLocaleString("en-IE") + cleaned.slice(dot);

    setLocal(shown);
    onChange(n);

    requestAnimationFrame(() => {
      const node = ref.current;
      if (!node) return;
      let pos = 0, seen = 0;
      while (pos < shown.length && seen < digitsBefore) {
        if (/[0-9]/.test(shown[pos])) seen++;
        pos++;
      }
      try { node.setSelectionRange(pos, pos); } catch (err) {}
    });
  };

  return (
    <input ref={ref} type="text" inputMode="numeric" disabled={disabled} value={local}
      onFocus={() => setFocus(true)}
      onBlur={() => { setFocus(false); const n = Number(String(local).replace(/[^0-9.-]/g,"")); onChange(isNaN(n) ? 0 : n); }}
      onChange={handle}
      className={"tnum " + className} />
  );
}

        type:"line", xMin:x, xMax:x, borderColor:"#c7d2fe", borderWidth:1, borderDash:[3,3],
        label:{ display:true, content:m.label || "Milestone", position:"start",
                backgroundColor:"rgba(79,70,229,.85)", color:"#fff",
                font:{ size:8, weight:"bold" }, padding:{ x:4, y:1 } },
      };
    });

    const ctx = ref.current.getContext("2d");
    const fill = ctx.createLinearGradient(0, 0, 0, height);
    fill.addColorStop(0, "rgba(0,104,88,.22)");
    fill.addColorStop(1, "rgba(0,104,88,0)");

    inst.current = new window.Chart(ctx, {
      type:"line",
      data:{ labels, datasets:[
        { label:"Planned spend", data:planData, borderColor:"#94a3b8", borderDash:[6,4],
          borderWidth:2, pointRadius:0, tension:.35, order:3 },
        { label:"Actual spend", data:actualData, borderColor:"#006858", backgroundColor:fill,
          borderWidth:3, fill:true, pointRadius:forReport?0:2.5, pointBackgroundColor:"#006858",
          tension:.3, order:1 },
        { label:"Forecast out-turn", data:fcData, borderColor:"#f59e0b", borderDash:[3,3],
          borderWidth:2.5, pointRadius:0, tension:.3, spanGaps:true, order:2 },
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        // Draw the lines in from the left, but hold the scales still. Animating
        // the axis made the tick figures appear to count up as the chart grew.
        animation: forReport ? false : { duration:450, easing:"easeOutQuad" },
        animations: forReport ? {} : { y: { duration:0 }, radius: { duration:0 } },
        interaction:{ mode:"index", intersect:false },
        layout:{ padding:{ top:16, right:8 } },
        plugins:{
          legend:{ position:"bottom", labels:{ boxWidth:22, boxHeight:2, usePointStyle:false,
                    font:{ size:10, weight:"600" }, color:"#475569", padding:14 } },
          annotation:{ annotations: ann },
          tooltip:{ backgroundColor:"rgba(15,23,42,.95)", padding:10, cornerRadius:8,
            titleFont:{ size:11, weight:"bold" }, bodyFont:{ size:11 },
            callbacks:{ label: (c) => c.dataset.label + ": " + fmtEur(c.parsed.y) } },
        },
        scales:{
          x:{ grid:{ display:false }, ticks:{ font:{ size:9 }, color:"#94a3b8",
              maxRotation:0, autoSkip:true, maxTicksLimit: forReport ? 14 : 18 } },
          y:{ grid:{ color:"#f1f5f9" }, border:{ display:false },
              ticks:{ font:{ size:9 }, color:"#94a3b8", callback:(v) => fmtK(v) } },
        },
      },
    });
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [job, a, height, forReport, L.funding, L.budget, L.breakeven, L.reported, L.milestones]);

  return <div style={{ height }}><canvas ref={ref} /></div>;
}

/* Compact sparkline for the portfolio rows - plan vs actual, no axes. */
function Spark({ a, w=110, h=30 }) {
  const max = Math.max(a.authorised, a.planTotal, a.AC, 1);
  const n = Math.max(a.months, 2);
  const pt = (arr) => arr.map((v, i) => (i/(n-1))*w + "," + (h - (v/max)*h)).join(" ");
  let run = 0;
  const act = a.actuals.map(x => (run += (x.value||0)));
  return (
    <svg width={w} height={h} className="overflow-visible">
      <polyline points={pt(a.plan.cumulative.slice(0, n))} fill="none" stroke="#cbd5e1" strokeWidth="1.5" strokeDasharray="3 3" />
      {act.length > 1 && <polyline points={pt(act)} fill="none" stroke={BANDS[a.band].dot} strokeWidth="2" strokeLinecap="round" />}
      <line x1="0" y1={h - (a.authorised/max)*h} x2={w} y2={h - (a.authorised/max)*h} stroke="#fca5a5" strokeWidth="1" strokeDasharray="2 2" />
    </svg>
  );
}

/* Somewhere to start when setting a job's position. */
const PLACES = [
  ["Cork City", 51.897, -8.470], ["Wilton / CUH", 51.884, -8.517],
  ["Mallow", 52.135, -8.645], ["Bantry", 51.681, -9.454],
  ["Mercy UH, Cork", 51.899, -8.483], ["Bandon", 51.746, -8.741],
  ["Clonakilty", 51.622, -8.886], ["Youghal", 51.951, -7.851],
  ["Fermoy", 52.139, -8.276], ["Midleton", 51.915, -8.174],
  ["Tralee", 52.270, -9.700], ["Killarney", 52.059, -9.506],
  ["Listowel", 52.446, -9.485], ["Dingle", 52.141, -10.267],
  ["Cahersiveen", 51.947, -10.223], ["Kenmare", 51.881, -9.583],
];

function MapView({ rows, open }) {
  const hostRef = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const [hover, setHover] = useState(null);
  const [ready, setReady] = useState(false);
  const boundsRef = useRef(null);
  const markerRefs = useRef([]);

  const mapped = rows.filter(r => r.job.lat != null && r.job.lon != null);
  const unmapped = rows.filter(r => r.job.lat == null || r.job.lon == null);
  const maxBac = Math.max(1, ...mapped.map(r => r.a.BAC));

  // Create the map once.
  useEffect(() => {
    if (!window.L || !hostRef.current || mapRef.current) return;
    const map = window.L.map(hostRef.current, {
      scrollWheelZoom: false,          // so the page still scrolls over the map
      attributionControl: true,
    }).setView([52.1, -8.9], 8);
    window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, minZoom: 5,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    layerRef.current = window.L.layerGroup().addTo(map);
    mapRef.current = map;
    setReady(true);
    // The container is sized by flex; Leaflet needs telling once that settles.
    setTimeout(() => map.invalidateSize(), 0);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  // Redraw markers whenever the jobs or the hovered row change.
  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current;
    if (!map || !layer) return;
    layer.clearLayers();
    if (!mapped.length) return;

    markerRefs.current = [];
    mapped.forEach(({ job, a }) => {
      const colour = BANDS[a.band].dot;
      const r = 7 + 13 * Math.sqrt(a.BAC / maxBac);

      const halo = window.L.circleMarker([job.lat, job.lon], {
        radius: r + 4, color: colour, weight: 0, fillColor: colour,
        fillOpacity: 0.15, interactive: false,
      }).addTo(layer);

      const m = window.L.circleMarker([job.lat, job.lon], {
        radius: r, color: "#fff", weight: 2,
        fillColor: colour, fillOpacity: 0.95,
      }).addTo(layer);
      markerRefs.current.push({ id: job.id, dot: m, halo });

      m.bindTooltip(
        '<div style="font-weight:700;margin-bottom:2px">' + job.name + "</div>" +
        '<div style="color:#cbd5e1">' + fmtK(a.BAC) + " &middot; " + a.physicalPct.toFixed(0) +
        "% complete &middot; " + BANDS[a.band].label + "</div>" +
        '<div style="color:#94a3b8;margin-top:2px">' +
        (a.marginEur < 0 ? "Over funding by " + fmtK(-a.marginEur) : fmtK(a.marginEur) + " margin of safety") +
        "</div>",
        { className: "cta-tip", direction: "top", offset: [0, -r] }
      );
      m.on("mouseover", () => setHover(job.id));
      m.on("mouseout", () => setHover(null));
      m.on("click", () => open(job.id));
    });

    // Frame the jobs, but do not zoom so far in that one job fills Ireland.
    // invalidateSize first: the container is only just laid out, and centring
    // against a stale size is what leaves the pins off to one side.
    const bounds = window.L.latLngBounds(mapped.map(r => [r.job.lat, r.job.lon]));
    boundsRef.current = bounds;
    map.invalidateSize();
    map.fitBounds(bounds.pad(0.35), { maxZoom: 11, animate: false });
  }, [rows, ready]);

  // Markers restyle on hover without refitting, so the map does not jump.
  useEffect(() => {
    markerRefs.current.forEach(({ id, dot, halo }) => {
      const on = hover === id;
      dot.setStyle({ weight: on ? 3 : 2 });
      halo.setStyle({ fillOpacity: on ? 0.30 : 0.15 });
    });
  }, [hover]);

  // Re-centre whenever the container changes size - switching to the Map tab,
  // resizing the window, or the side list growing.
  useEffect(() => {
    const map = mapRef.current, host = hostRef.current;
    if (!map || !host) return;
    const refit = () => {
      map.invalidateSize();
      if (boundsRef.current) map.fitBounds(boundsRef.current.pad(0.35), { maxZoom: 11, animate: false });
    };
    const t = setTimeout(refit, 150);
    window.addEventListener("resize", refit);
    let ro;
    if (window.ResizeObserver) { ro = new ResizeObserver(refit); ro.observe(host); }
    return () => {
      clearTimeout(t); window.removeEventListener("resize", refit);
      if (ro) ro.disconnect();
    };
  }, [ready, rows.length]);

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2 flex-wrap">
        <div>
          <h3 className="font-bold text-slate-800 text-sm">Where the risk sits</h3>
          <p className="text-[11px] text-slate-500 mt-0.5">
            Circle size is job value, colour is risk band. Click a job to open it.
          </p>
        </div>
        <div className="flex flex-wrap gap-2">
          {["critical","at-risk","watch","on-track"].map(b => (
            <span key={b} className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background:BANDS[b].dot }} />
              {BANDS[b].label}
            </span>
          ))}
        </div>
      </div>

      <div className="flex flex-col lg:flex-row">
        <div id="cta-map" className="lg:w-3/5 shrink-0">
          <div ref={hostRef} style={{ height:460, width:"100%" }} />
        </div>

        <div className="flex-1 min-w-0 p-4 lg:max-h-[460px] lg:overflow-y-auto scroll">
          <div className="space-y-2">
            {mapped.slice().sort((x,y) => y.a.riskScore - x.a.riskScore).map(({ job, a }) => (
              <button key={job.id} onClick={() => open(job.id)}
                onMouseEnter={() => setHover(job.id)} onMouseLeave={() => setHover(null)}
                className={"w-full text-left px-3 py-2 rounded-lg border transition " +
                  (hover === job.id ? "border-[#006858] bg-[#e6f2f0]" : "border-slate-200 hover:border-slate-300")}>
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background:BANDS[a.band].dot }} />
                  <span className="font-bold text-[12px] text-slate-800 truncate flex-1">{job.name}</span>
                  <span className="tnum text-[11px] font-bold text-slate-600">{fmtK(a.BAC)}</span>
                </div>
                <div className="text-[10px] text-slate-400 mt-0.5 truncate">
                  {job.location || "—"} · {a.physicalPct.toFixed(0)}% complete ·{" "}
                  <span className={a.marginEur < 0 ? "text-red-600 font-bold" : "text-emerald-600 font-bold"}>
                    {signedK(a.marginEur)} safety
                  </span>
                </div>
              </button>
            ))}
          </div>

          {!!unmapped.length && (
            <div className="mt-3 pt-3 border-t border-slate-100">
              <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5">
                No coordinates yet ({unmapped.length})
              </div>
              <div className="flex flex-wrap gap-1.5">
                {unmapped.map(({ job }) => (
                  <button key={job.id} onClick={() => open(job.id)}
                    className="text-[10px] font-bold px-2 py-1 rounded bg-slate-100 text-slate-500 hover:text-[#006858]">
                    {job.name}
                  </button>
                ))}
              </div>
              <p className="text-[10px] text-slate-400 mt-1.5">
                Set a position in the job's Set-up to put it on the map.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
/* ==========================================================================
   6. PORTFOLIO - the parent dashboard over every job

function Portfolio({ jobs, open, onNew, onDelete, onDuplicate, onReport }) {
  const [sort, setSort] = useState("risk");
  const [q, setQ] = useState("");
  const [pane, setPane] = useState("table");

  // Same reason as the job view: coming back from a job should not drop you
  // partway down the portfolio.
  useEffect(() => { window.scrollTo(0, 0); }, []);

  const rows = useMemo(() => {
    const r = jobs.map(j => ({ job:j, a:analyse(j) }));
    const f = q.trim()
      ? r.filter(x => (x.job.name + " " + (x.job.ref||"") + " " + (x.job.location||"")).toLowerCase().includes(q.toLowerCase()))
      : r;
    const cmp = {
      risk:   (x,y) => y.a.riskScore - x.a.riskScore,
      value:  (x,y) => y.a.BAC - x.a.BAC,
      variance:(x,y) => y.a.variancePct - x.a.variancePct,
      margin: (x,y) => x.a.marginPct - y.a.marginPct,
      name:   (x,y) => x.job.name.localeCompare(y.job.name),
      finish: (x,y) => (x.job.endDate||"").localeCompare(y.job.endDate||""),
    }[sort];
    return [...f].sort(cmp);
  }, [jobs, sort, q]);

  const roll = useMemo(() => {
    const all = jobs.map(analyse);
    const bac = sum(all.map(x => x.BAC));
    const auth = sum(all.map(x => x.authorised));
    const ac = sum(all.map(x => x.AC));
    const out = sum(all.map(x => x.outturn));
    const ev = sum(all.map(x => x.EV));
    const pv = sum(all.map(x => x.PV));
    const counts = { critical:0, "at-risk":0, watch:0, "on-track":0 };
    all.forEach(x => counts[x.band]++);
    return {
      n: all.length, bac, auth, ac, out, ev, pv,
      spi: pv > 0 ? ev/pv : null,
      behind: all.filter(x => x.SPI != null && x.SPI < 0.95).length,
      inefficient: all.filter(x => x.CPI != null && x.CPI < 0.95).length,
      variance: out - bac,
      variancePct: bac > 0 ? ((out - bac)/bac)*100 : 0,
      marginEur: auth - out,
      marginPct: auth > 0 ? ((auth - out)/auth)*100 : 0,
      cpi: ac > 0 ? ev/ac : null,
      pctComplete: bac > 0 ? (ev/bac)*100 : 0,
      counts,
      exposure: sum(all.filter(x => x.marginEur < 0).map(x => -x.marginEur)),
      voApproved: sum(all.map(x => x.voApproved)),
      voAnticipated: sum(all.map(x => x.voAnticipated)),
      // Downside: each job under its own worst saved scenario, base case where
      // none has been saved. Never nets a good job off against a bad one.
      downside: sum(jobs.map((j, i) => {
        const w = worstScenario(j, all[i]);
        return w ? w.marginEur : all[i].marginEur;
      })),
      scenarioCount: jobs.filter(j => (j.scenarios || []).length).length,
    };
  }, [jobs]);

  const sortBtn = (id, label) => (
    <button key={id} onClick={() => setSort(id)}
      className={"px-3 py-1.5 rounded-lg text-[11px] font-bold transition " +
        (sort === id ? "bg-[#006858] text-white shadow-sm" : "bg-white text-slate-500 hover:text-slate-800 border border-slate-200")}>
      {label}
    </button>
  );

  return (
    <div className="max-w-[1800px] mx-auto px-4 sm:px-6 py-6 space-y-6">

      {/* ---- roll-up ---- */}
      <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">
        <Kpi label="Jobs in portfolio" value={roll.n}
             sub={roll.counts.critical + roll.counts["at-risk"] + " needing attention"} accent="#006858" />
        <Kpi label="Combined budget" value={fmtK(roll.bac)}
             sub={"Authorised " + fmtK(roll.auth)} hint="Sum of every job's elemental budget. Authorised adds each job's contingency." />
        <Kpi label="Spent to date" value={fmtK(roll.ac)}
             sub={pc(roll.bac ? (roll.ac/roll.bac)*100 : 0, 0) + " of budget drawn"} />

        <Kpi label="Cost efficiency (CPI)" accent={roll.cpi == null ? "#94a3b8" : roll.cpi >= 1 ? "#0f9d76" : "#dc2626"}
             value={roll.cpi == null ? "—" : roll.cpi.toFixed(2)}
             tone={roll.cpi == null ? "ink" : roll.cpi >= 1 ? "good" : "risk"}
             sub={roll.inefficient + " of " + roll.n + " job" + (roll.n === 1 ? "" : "s") + " below 0.95"}
             hint="Value earned across the portfolio for every euro spent. Weighted by size, so a big job moves it more than a small one."
             foot={<div className="mt-2"><Bar pct={clamp((roll.cpi||0)*50,0,100)} colour={roll.cpi >= 1 ? "#0f9d76" : "#dc2626"} /></div>} />

        <Kpi label="Schedule (SPI)" accent={roll.spi == null ? "#94a3b8" : roll.spi >= 1 ? "#0f9d76" : "#dc2626"}
             value={roll.spi == null ? "—" : roll.spi.toFixed(2)}
             tone={roll.spi == null ? "ink" : roll.spi >= 1 ? "good" : "risk"}
             sub={roll.behind + " of " + roll.n + " job" + (roll.n === 1 ? "" : "s") + " behind plan"}
             hint="Work done against work planned by now, across the portfolio. Below 1.00 means the programme as a whole is running late."
             foot={<div className="mt-2"><Bar pct={clamp((roll.spi||0)*50,0,100)} colour={roll.spi >= 1 ? "#0f9d76" : "#dc2626"} /></div>} />

        <Kpi label="Forecast out-turn" value={fmtK(roll.out)} tone={roll.variance > 0 ? "risk" : "good"}
             sub={signedK(roll.variance) + " vs budget (" + pc(roll.variancePct,1) + ")"}
             hint="Every job forecast on the worse of its cost-efficiency and spend-rate trends, then added." />
        <Kpi label="Portfolio margin of safety" value={fmtK(roll.marginEur)}
             tone={roll.marginPct < 0 ? "risk" : roll.marginPct < 5 ? "warn" : "good"}
             sub={pc(roll.marginPct,1) + " of authorised funding"}
             hint="How much more the portfolio can cost before it breaches total authorised funding, contingency included." />
        <Kpi label="Exposure on losing jobs" value={fmtK(roll.exposure)} tone={roll.exposure > 0 ? "risk" : "good"}
             sub={roll.exposure > 0 ? "Forecast beyond funding" : "All jobs inside funding"}
             hint="Adds up only the jobs whose forecast already exceeds their own authorised funding - netting is not allowed." />
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Kpi label="Approved variations" value={fmtK(roll.voApproved)} accent="#0f9d76"
             sub={roll.voAnticipated > 0 ? fmtK(roll.voAnticipated) + " further anticipated" : "None anticipated"}
             hint="Agreed changes of scope across the portfolio. These raise each job's budget, so they no longer read as overruns." />
        <Kpi label="Downside margin of safety" value={fmtK(roll.downside)}
             tone={roll.downside < 0 ? "risk" : roll.downside < roll.marginEur * 0.5 ? "warn" : "good"}
             sub={roll.scenarioCount + " of " + roll.n + " job" + (roll.n === 1 ? "" : "s") + " with a saved scenario"}
             hint="Each job under its own worst saved what-if, base case where none is saved. Jobs are never netted off against each other." />
        <Kpi label="Value earned" value={fmtK(roll.ev)} accent="#006858"
             sub={pc(roll.pctComplete, 1) + " of combined budget"}
             hint="Budget-weighted work actually delivered across the portfolio." />
        <Kpi label="Cost variance" value={signedK(roll.ev - roll.ac)}
             tone={roll.ev - roll.ac < 0 ? "risk" : "good"}
             sub="Value earned less money spent"
             hint="Positive means the portfolio has delivered more value than it has paid out." />
      </div>

      {/* ---- risk strip ---- */}
      <div className="bg-white rounded-xl border border-slate-200 p-4">
        <div className="flex flex-col lg:flex-row lg:items-center gap-4">
          <div className="shrink-0">
            <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider">Risk profile</div>
            <div className="text-[11px] text-slate-500 mt-0.5">Weighted on cost headroom, programme, efficiency and data currency</div>
          </div>
          <div className="flex-1 flex rounded-lg overflow-hidden h-8 bg-slate-100 min-w-[200px]">
            {["critical","at-risk","watch","on-track"].map(b => {
              const n = roll.counts[b]; if (!n) return null;
              return (
                <div key={b} className={"flex items-center justify-center text-[11px] font-bold text-white " + BANDS[b].bar}
                     style={{ width: (n/Math.max(1,roll.n))*100 + "%" }} title={BANDS[b].label + ": " + n}>
                  {n}
                </div>
              );
            })}
          </div>
          <div className="flex flex-wrap gap-2 shrink-0">
            {["critical","at-risk","watch","on-track"].map(b =>
              <RiskPill key={b} band={b} score={roll.counts[b]} small />)}
          </div>
        </div>
      </div>

      {/* ---- controls ---- */}
      <div className="flex flex-col lg:flex-row lg:items-center gap-3">
        <div className="flex-1 relative">
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs, references, locations..."
            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm outline-none focus:ring-2 focus:ring-[#006858]/30 focus:border-[#006858]" />
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex rounded-lg border border-slate-200 bg-slate-100 p-0.5 mr-1">
            {[["table","Table"],["map","Map"]].map(([id,label]) => (
              <button key={id} onClick={() => setPane(id)}
                className={"px-3 py-1 rounded-md text-[11px] font-bold transition " +
                  (pane === id ? "bg-white text-[#006858] shadow-sm" : "text-slate-500 hover:text-slate-700")}>

              </button>
            ))}
          </div>
          <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider mr-1">Rank by</span>
          {sortBtn("risk","Risk")}
          {sortBtn("margin","Margin of safety")}
          {sortBtn("variance","Variance")}
          {sortBtn("value","Value")}
          {sortBtn("finish","Finish date")}
          {sortBtn("name","Name")}
          <button onClick={onNew} className="px-3 py-1.5 rounded-lg bg-[#006858] text-white text-[11px] font-bold hover:bg-[#00806c] transition flex items-center gap-1.5 shadow-sm">
            <Ico d={I.plus} size={13} /> New job
          </button>

      {pane === "map" && <MapView rows={rows} open={open} />}
