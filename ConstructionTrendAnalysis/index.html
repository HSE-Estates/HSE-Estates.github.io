function JobView({ job, save, back, onSetup, onReport }) {
  const a = useMemo(() => analyse(job), [job]);
  const [showData, setShowData] = useState(false);
  const [showWhatIf, setShowWhatIf] = useState(false);
  const [view, setView] = useState("overview");   // cost trend stays the main view
  const [layers, setLayers] = useState(ALL_LAYERS);
  const b = BANDS[a.band];

  // Land at the top of the job, not at whatever scroll position the portfolio
  // was left at - otherwise you open a job below its header and view tabs.
  // Has to run after the commit: scrolling before the taller page renders is
  // undone by the browser restoring the old position.
  useEffect(() => { window.scrollTo(0, 0); }, [job.id]);

  const tone = (v, good, warn) => v >= good ? "good" : v >= warn ? "warn" : "risk";

  return (
    <div className="max-w-[1800px] mx-auto px-4 sm:px-6 py-6 space-y-5">

      {/* --- header --- */}
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div className="flex items-start gap-3 min-w-0">
          <button onClick={back} className="mt-1 p-2 rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-[#006858] hover:border-[#006858] transition shrink-0">
            <Ico d={I.back} size={16} />
          </button>
          <div className="min-w-0">
            <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900 leading-tight truncate">{job.name}</h1>
            <div className="text-[11px] text-slate-500 mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
              {job.ref && <span className="font-bold text-slate-600">{job.ref}</span>}
              {job.location && <span>{job.location}</span>}
              <span>{job.stage}</span>
              <span className="tnum">{monthLabel(job.startDate,0)} &rarr; {monthLabel(job.startDate, a.months-1)} · {a.months} months</span>
              <RiskPill band={a.band} score={a.riskScore} small />
            </div>
          </div>
        </div>
        <div className="flex gap-2 shrink-0 flex-wrap">
          <button onClick={() => setShowWhatIf(!showWhatIf)}
            className={"px-3 py-2 rounded-lg text-[11px] font-bold border transition flex items-center gap-1.5 " +
              (showWhatIf ? "bg-[#006858] text-white border-[#006858]" : "bg-white text-slate-600 border-slate-200 hover:border-[#006858] hover:text-[#006858]")}>
            <Ico d={I.target} size={13} /> What-if
          </button>
          <button onClick={() => setShowData(!showData)}
            className={"px-3 py-2 rounded-lg text-[11px] font-bold border transition flex items-center gap-1.5 " +
              (showData ? "bg-[#006858] text-white border-[#006858]" : "bg-white text-slate-600 border-slate-200 hover:border-[#006858] hover:text-[#006858]")}>
            <Ico d={I.chev} size={13} className={showData ? "rotate-180" : ""} /> Job data
          </button>
          <button onClick={onSetup}
            className="px-3 py-2 rounded-lg bg-white border border-slate-200 text-slate-600 text-[11px] font-bold hover:border-[#006858] hover:text-[#006858] transition flex items-center gap-1.5">
            <Ico d={I.cog} size={13} /> Set-up
          </button>
          <button onClick={onReport}
            className="px-3 py-2 rounded-lg bg-[#006858] text-white text-[11px] font-bold hover:bg-[#00806c] transition flex items-center gap-1.5 shadow-sm">
            <Ico d={I.print} size={13} /> Report
          </button>
        </div>
      </div>

      {/* --- view tabs: on their own line so they are actually findable --- */}
      <div className="flex gap-1 border-b border-slate-200">
        {[["overview","Cost trend"],["programme","Programme"]].map(([id,label]) => (
          <button key={id} onClick={() => setView(id)}
            className={"px-4 py-2.5 text-[12px] font-bold transition border-b-2 -mb-px " +
              (view === id
                ? "text-[#006858] border-[#006858]"
                : "text-slate-400 border-transparent hover:text-slate-700")}>
            {label}
          </button>
        ))}
      </div>

      {/* --- headline tiles --- */}
      <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">
        <Kpi label="Current budget" value={fmtK(a.BAC)} accent="#94a3b8"
             sub={a.voApproved > 0
                  ? "Original " + fmtK(a.original) + " + " + fmtK(a.voApproved) + " approved VOs"
                  : "Authorised " + fmtK(a.authorised) + " incl. " + job.contingencyPct + "% cont."}
             hint="Original elemental budget plus approved variations. Variations are drawn against contingency, so the authorised funding envelope does not move with them."
             foot={a.voAnticipated > 0
                   ? <div className="text-[10px] text-amber-600 mt-1.5 font-bold">{fmtK(a.voAnticipated)} anticipated</div>
                   : null} />

        <Kpi label="Spent to date" value={fmtK(a.AC)} accent="#006858"
             sub={a.nLogged + " of " + a.months + " months logged"}
             foot={<div className="mt-2"><Bar pct={a.BAC ? (a.AC/a.BAC)*100 : 0} colour="#006858" /></div>} />

        <Kpi label="Forecast out-turn" value={fmtK(a.outturn)}
             tone={a.variance > 0 ? "risk" : "good"} accent="#f59e0b"
             sub={signedK(a.variance) + " vs budget · " + pc(a.variancePct,1)}
             hint={"In today's money, taken on the worse of two trends so it never flatters the job. Currently: " + a.outturnBasis + ". Efficiency trend " + fmtK(a.outEfficiency) + ", spend-rate trend " + fmtK(a.outBurn) + "."}
             foot={<div className="text-[10px] text-slate-400 mt-1.5 leading-tight">
                     {a.outturnBasis}
                     {a.escalationToEnd > 0 && <div className="text-slate-500">
                       {fmtK(a.outturnNominal)} at out-turn prices ({a.escPct}%/yr)
                     </div>}
                   </div>} />

        <Kpi label="Margin of safety" value={fmtK(a.marginEur)}
             tone={a.marginPct < 0 ? "risk" : a.marginPct < 5 ? "warn" : "good"} accent={a.marginPct < 0 ? "#dc2626" : "#0f9d76"}
             sub={pc(a.marginPct,1) + " of authorised funding"}
             hint="How much further cost the job can absorb before it breaches authorised funding. Negative means the forecast has already broken through."
             foot={<div className="mt-2"><Bar pct={clamp(a.marginPct*4,0,100)} colour={a.marginPct < 0 ? "#dc2626" : a.marginPct < 5 ? "#d97706" : "#0f9d76"} /></div>} />

        <Kpi label="Breakeven point" accent="#b91c1c"
             value={a.breakevenPct == null ? "—" : a.breakevenPct >= 100 ? "Clears" : pc(a.breakevenPct,0)}
             tone={a.breakevenPct == null ? "ink" : a.breakevenPct >= 100 ? "good" : "risk"}
             sub={a.breakevenMonth != null
                  ? "Funding exhausted " + monthLabel(job.startDate, a.breakevenMonth)
                  : "Funding lasts the full programme"}
             hint="How much of the works the authorised funding actually buys at the forecast cost rate. Below 100% means the money runs out before the job finishes."
             foot={a.requiredCPI ? <div className="text-[10px] text-slate-400 mt-1.5 tnum">Needs CPI {a.requiredCPI.toFixed(2)} on remaining work</div> : null} />

        <Kpi label="Complete" value={a.physicalPct.toFixed(1) + "%"} accent={b.dot}
             tone={a.pctDrift < -3 ? "risk" : a.pctDrift > 3 ? "good" : "ink"}
             sub={"Plan expects " + a.plannedPctToDate.toFixed(0) + "% · " + (a.pctDrift > 0 ? "+" : "") + a.pctDrift.toFixed(1) + " pts"}
             hint="Budget-weighted roll-up of the applicable elements."
             foot={<div className="mt-2"><Bar pct={a.physicalPct} colour={b.dot} /></div>} />
      </div>

      {/* --- data drawer --- */}
      {showData && <div className="fade-in"><DataDrawer job={job} a={a} save={save} /></div>}

      {/* --- what-if --- */}
      {showWhatIf && <div className="fade-in"><WhatIf job={job} a={a} save={save} /></div>}

      {/* --- programme: secondary view, cost trend remains the main one --- */}
      {view === "programme" && <div className="fade-in"><Programme job={job} a={a} save={save} /></div>}

      {/* --- chart + performance --- */}
      {view === "overview" && (
      <div className="grid xl:grid-cols-12 gap-5">
        <div className="xl:col-span-8 2xl:col-span-9 space-y-5">
          <div className="bg-white rounded-xl border border-slate-200 p-4 sm:p-5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
              <div>
                <h3 className="font-bold text-slate-800 flex items-center gap-2">
                  <span className="text-[#006858]"><Ico d={I.chart} size={17} /></span> Cost trend
                </h3>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  Planned baseline against actual spend, extended on the current trend to out-turn
                </p>
              </div>
              <div className="flex flex-wrap gap-2 text-[10px] font-bold">
                <span className="px-2 py-1 rounded bg-slate-100 text-slate-600 flex items-center">
                  Spend reported to {a.nLogged ? monthLabel(job.startDate, a.nLogged-1) : "—"}
                  <Tip text="The last month with spend logged against it. Everything to the left of that line is actual; everything to the right is forecast. Planners call it the data date." />
                </span>
                {a.breakevenMonth != null && <span className="px-2 py-1 rounded bg-red-50 text-red-700 border border-red-100">Breakeven {monthLabel(job.startDate, a.breakevenMonth)}</span>}
              </div>
            </div>
            <TrendChart job={job} a={a} height={380} layers={layers} />

            {/* Reference lines toggle on and off the way the series above do. */}
            <div className="mt-2 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-1.5">
              <span className="text-[9px] font-black text-slate-400 uppercase tracking-wider mr-1">Reference lines</span>
              {[["funding","Authorised funding","#dc2626","dash"],
                ["budget","Budget","#94a3b8","dot"],
                ["breakeven","Breakeven","#b91c1c","solid"],
                ["reported","Reported to","#006858","solid"],
                ["milestones","Milestones","#6366f1","dash"]].map(([k,label,colour,style]) => {
                const on = layers[k];
                return (
                  <button key={k} onClick={() => setLayers(p => ({ ...p, [k]: !p[k] }))}
                    title={on ? "Hide " + label : "Show " + label}
                    className={"flex items-center gap-1.5 px-2 py-1 rounded-md border text-[10px] font-bold transition " +
                      (on ? "bg-white border-slate-200 text-slate-600 hover:border-slate-300"
                          : "bg-slate-50 border-slate-100 text-slate-300 line-through")}>
                    <svg width="14" height="6" className="shrink-0">
                      <line x1="0" y1="3" x2="14" y2="3" stroke={on ? colour : "#cbd5e1"} strokeWidth="2"
                        strokeDasharray={style === "dash" ? "4 3" : style === "dot" ? "1 2" : ""} />
                    </svg>
                    {label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* narrative */}
          <div className={"rounded-xl border p-4 flex flex-col sm:flex-row gap-4 " + b.bg + " " + b.ring + " ring-1 border-transparent"}>
            <div className={"shrink-0 " + b.text}><Ico d={a.band === "on-track" ? I.check : I.warn} size={22} /></div>
            <div className="flex-1">
              <h4 className={"text-[11px] font-black uppercase tracking-wider " + b.text}>{b.label} — risk score {a.riskScore}/100</h4>
              <p className="text-[13px] text-slate-700 mt-1 leading-relaxed">
                {a.marginEur >= 0
                  ? <>The job can absorb a further <strong>{fmtEur(a.marginEur)}</strong> before it breaches authorised funding of {fmtEur(a.authorised)}. </>
                  : <>The forecast is <strong>{fmtEur(-a.marginEur)}</strong> beyond authorised funding of {fmtEur(a.authorised)}. </>}
                {a.breakevenPct != null && a.breakevenPct < 100
                  ? <>At the forecast cost rate the funding covers about <strong>{a.breakevenPct.toFixed(0)}%</strong> of the works{a.breakevenMonth != null && <> — funding runs out around <strong>{monthLabel(job.startDate, a.breakevenMonth)}</strong></>}. </>
                  : <>At the forecast cost rate the funding covers the whole of the works. </>}
                {Math.round(a.delayMonths) > 0
                  ? <>Progress against plan points to a <strong>{Math.round(a.delayMonths)} month</strong> overrun, finishing around <strong>{monthLabel(job.startDate, Math.round(a.projMonths)-1)}</strong>.</>
                  : <>Progress is at or ahead of the planned curve.</>}
              </p>
              <div className="flex flex-wrap gap-1.5 mt-2">
                {a.drivers.map((d,i) => (
                  <span key={i} className={"text-[10px] font-bold px-2 py-1 rounded bg-white/70 " + b.text}>{d}</span>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* right rail */}
        <div className="xl:col-span-4 2xl:col-span-3 space-y-5">
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2 mb-3">
              <span className="text-[#006858]"><Ico d={I.target} size={16} /></span> Performance
            </h3>
            <div className="grid grid-cols-2 gap-3">
              <div className="rounded-lg bg-slate-50 p-3">
                <div className="text-[10px] font-black text-slate-400 uppercase flex items-center">Cost efficiency<Tip text="Value earned for every euro spent. Below 1.00 means the work delivered is worth less than the money paid out." /></div>
                <div className={"text-xl font-extrabold tnum " + (a.CPI == null ? "text-slate-300" : a.CPI >= 1 ? "text-emerald-600" : "text-red-600")}>
                  {a.CPI == null ? "—" : a.CPI.toFixed(2)}
                </div>
                <div className="text-[10px] text-slate-400">
                  {a.cpiIsAssumed
                    ? <span className="text-amber-600 font-bold" title={"Measured " + (a.measuredCPI == null ? "—" : a.measuredCPI.toFixed(2))}>
                        CPI · assumed
                      </span>
                    : "CPI"}
                </div>
              </div>
              <div className="rounded-lg bg-slate-50 p-3">
                <div className="text-[10px] font-black text-slate-400 uppercase flex items-center">Schedule<Tip text="Work done against work planned by now. Below 1.00 means behind programme." /></div>
                <div className={"text-xl font-extrabold tnum " + (a.SPI == null ? "text-slate-300" : a.SPI >= 1 ? "text-emerald-600" : "text-red-600")}>
                  {a.SPI == null ? "—" : a.SPI.toFixed(2)}
                </div>
                <div className="text-[10px] text-slate-400">SPI</div>
              </div>
              <div className="rounded-lg bg-slate-50 p-3">
                <div className="text-[10px] font-black text-slate-400 uppercase">Cost variance</div>
                <div className={"text-lg font-extrabold tnum " + (a.CV < 0 ? "text-red-600" : "text-emerald-600")}>{signedK(a.CV)}</div>
                <div className="text-[10px] text-slate-400">value earned less spend</div>
              </div>
              <div className="rounded-lg bg-slate-50 p-3">
                <div className="text-[10px] font-black text-slate-400 uppercase">Cash variance</div>
                <div className={"text-lg font-extrabold tnum " + (a.cashVar > 0 ? "text-amber-600" : "text-slate-700")}>{signedK(a.cashVar)}</div>
                <div className="text-[10px] text-slate-400">spend vs planned draw</div>
              </div>
            </div>

            <div className="mt-3 pt-3 border-t border-slate-100 space-y-2 text-[11px]">
              <div className="flex justify-between"><span className="text-slate-500">Contingency</span><span className="tnum font-bold text-slate-700">{fmtEur(a.contingency)}</span></div>
              <div className="flex items-center gap-2">
                <div className="flex-1"><Bar pct={a.contDrawnPct} colour={a.contDrawnPct > 100 ? "#dc2626" : a.contDrawnPct > 70 ? "#d97706" : "#0f9d76"} /></div>
                <span className="tnum font-bold text-slate-600 w-12 text-right">{drawLabel(a.contDrawnPct)}</span>
              </div>
              <div className="text-[10px] text-slate-400">drawn by approved variations</div>
              <div className="flex items-center gap-2">
                <div className="flex-1"><Bar pct={a.contForecastPct} colour={a.contForecastPct > 100 ? "#dc2626" : a.contForecastPct > 70 ? "#d97706" : "#0f9d76"} /></div>
                <span className="tnum font-bold text-slate-600 w-12 text-right">{drawLabel(a.contForecastPct)}</span>
              </div>
              <div className="text-[10px] text-slate-400">forecast draw, incl. anticipated variations and overrun</div>
              <div className="flex justify-between pt-2 border-t border-slate-100"><span className="text-slate-500">Forecast completion</span>
                <span className="tnum font-bold text-slate-700">{monthLabel(job.startDate, Math.max(0, Math.round(a.projMonths)-1))}</span></div>
              <div className="flex justify-between"><span className="text-slate-500">Monthly burn</span><span className="tnum font-bold text-slate-700">{fmtK(a.burn)}</span></div>
            </div>
          </div>

          <ElementProgress job={job} a={a} save={save} compact />
        </div>
      </div>
      )}

      <footer className="text-center text-[10px] text-slate-400 pt-4 pb-8">
        Construction Trend Analysis · created by Dave Maher
      </footer>
    </div>
  );
}

/* ==========================================================================
   11. REPORT
   Two A4 landscape sheets that read like the dashboard, not like a printout
   of it. Screen preview is the print output.
   ========================================================================== */

function ReportKpi({ label, value, sub, colour="#0f172a", bar }) {
  return (
    <div className="rounded-lg border border-slate-200 bg-white px-3 py-2.5 avoid-break">
      <div className="text-[7pt] font-black text-slate-400 uppercase tracking-wider leading-none">{label}</div>
      <div className="text-[15pt] font-extrabold tnum leading-tight mt-1" style={{ color:colour }}>{value}</div>
      {sub && <div className="text-[7pt] text-slate-500 leading-tight mt-0.5">{sub}</div>}
      {bar != null && <div className="mt-1.5"><Bar pct={bar} colour={colour} h={4} /></div>}
    </div>
  );
}

function Report({ jobs, focusId, onClose }) {
  // The programme is an extra sheet people mostly do not want, so it is opt-in.
  const [withProgramme, setWithProgramme] = useState(false);

  // The dashboard is still mounted behind this overlay, and print would put the
  // whole of it in the PDF ahead of the sheets. Flag it on the body so print
  // CSS can drop everything except the report.
  useEffect(() => {
    document.body.classList.add("report-open");

  const list = focusId ? jobs.filter(j => j.id === focusId) : jobs;

    return { bac, auth, out, ac, ev, variance: out-bac, margin: auth-out,

      {/* ---------- SHEET 1 ---------- */}
      <div className="sheet">
        <Head title={single ? rows[0].job.name : "Portfolio Summary"}
              sub={single
                ? [rows[0].job.ref, rows[0].job.location, rows[0].job.stage].filter(Boolean).join("   ·   ")

        <div className="p-6 flex-1 flex flex-col gap-4">
          {single ? (() => {
            const { job, a } = rows[0];
            return (
              <>
                <div className="grid grid-cols-6 gap-2.5">
                  <ReportKpi label="Current budget" value={fmtK(a.BAC)} colour="#475569"
                    sub={a.voApproved > 0 ? "Orig " + fmtK(a.original) + " + " + fmtK(a.voApproved) + " VOs" : "Authorised " + fmtK(a.authorised)} />
                  <ReportKpi label="Spent to date" value={fmtK(a.AC)} sub={a.nLogged + " of " + a.months + " months"} colour="#006858" bar={a.BAC ? (a.AC/a.BAC)*100 : 0} />
                  <ReportKpi label="Forecast out-turn" value={fmtK(a.outturn)} sub={signedK(a.variance) + " · " + pc(a.variancePct,1)} colour={a.variance > 0 ? "#dc2626" : "#0f9d76"} />
                  <ReportKpi label="Margin of safety" value={fmtK(a.marginEur)} sub={pc(a.marginPct,1) + " of funding"} colour={a.marginPct < 0 ? "#dc2626" : a.marginPct < 5 ? "#d97706" : "#0f9d76"} bar={clamp(a.marginPct*4,0,100)} />
                  <ReportKpi label="Breakeven point" value={a.breakevenPct == null ? "—" : a.breakevenPct >= 100 ? "Clears" : pc(a.breakevenPct,0)}

                  <ReportKpi label="Complete" value={a.physicalPct.toFixed(1) + "%"} sub={"Plan " + a.plannedPctToDate.toFixed(0) + "%  (" + (a.pctDrift>0?"+":"") + a.pctDrift.toFixed(1) + ")"}
                             colour={BANDS[a.band].dot} bar={a.physicalPct} />
                </div>

                <div className="grid grid-cols-12 gap-4 flex-1">

                    <div className="rounded-lg border p-3 avoid-break" style={{ borderColor:BANDS[a.band].dot + "44", background:BANDS[a.band].dot + "0f" }}>
                      <div className="flex items-center justify-between">

                      <ul className="mt-1.5 space-y-0.5">

                    <div className="rounded-lg border border-slate-200 p-3 grid grid-cols-2 gap-2 avoid-break">
                      {[["Cost efficiency (CPI)", a.CPI == null ? "—" : a.CPI.toFixed(2), a.CPI == null ? "#94a3b8" : a.CPI >= 1 ? "#0f9d76" : "#dc2626"],

          })() : (

                <ReportKpi label="Combined budget" value={fmtK(portfolio.bac)} sub={"Authorised " + fmtK(portfolio.auth)} colour="#475569" />
                <ReportKpi label="Spent to date" value={fmtK(portfolio.ac)} sub={pc(portfolio.bac ? (portfolio.ac/portfolio.bac)*100 : 0, 0) + " drawn"} colour="#006858" bar={portfolio.bac ? (portfolio.ac/portfolio.bac)*100 : 0} />
                <ReportKpi label="Forecast out-turn" value={fmtK(portfolio.out)} sub={signedK(portfolio.variance) + " vs budget"} colour={portfolio.variance > 0 ? "#dc2626" : "#0f9d76"} />
                <ReportKpi label="Margin of safety" value={fmtK(portfolio.margin)} sub={pc(portfolio.marginPct,1) + " of funding"} colour={portfolio.marginPct < 0 ? "#dc2626" : portfolio.marginPct < 5 ? "#d97706" : "#0f9d76"} bar={clamp(portfolio.marginPct*4,0,100)} />

                <table className="w-full text-[8pt]">
                  <thead>

                  <tbody>
                    {rows.map(({ job, a }) => (

                        </td>
                        <td className="px-2 py-1.5 text-right">

        </div>

        <div className="px-8 py-2.5 border-t border-slate-200 flex justify-between text-[6.5pt] text-slate-400">
          <span>Construction Trend Analysis · created by Dave Maher</span>
          <span>Forecasts are trend-based and assume current cost efficiency and spend rate continue</span>
        </div>
      </div>

      {/* ---------- SHEET 2: element matrix (single job only) ---------- */}
      {single && (() => {
        const { job, a } = rows[0];
        const groups = GROUPS.map(g => {
          const on = job.elements.filter(e => e.g === g.g && e.on);
          const w = sum(on.map(e => e.budget)) || on.length;
          const pctG = on.length === 0 ? 0
            : w === on.length ? sum(on.map(e => e.pct||0))/on.length
            : sum(on.map(e => (e.budget||0)*(e.pct||0)))/w;
          return { ...g, on, budget: sum(on.map(e => e.budget)), pct: pctG,
                   off: job.elements.filter(e => e.g === g.g && !e.on).length };
        }).filter(g => g.on.length);
        const offCount = job.elements.filter(e => !e.on).length;

        // Balance the groups across columns by line count, and go to three
        // columns once two would run past the bottom of the page. The matrix
        // has to land on one sheet - split across two it stops being a matrix.
        const lines = sum(groups.map(g => g.on.length + 1));
        const nCol = lines > 34 ? 3 : 2;
        const col = Array.from({ length: nCol }, () => []);
        const load = new Array(nCol).fill(0);
        groups.forEach(g => {
          const i = load.indexOf(Math.min(...load));
          col[i].push(g);
          load[i] += g.on.length + 1;

        const tight = lines > 26;      // squeeze the rows on a busy matrix

              <div className={"grid gap-x-4 gap-y-0 " + (nCol === 3 ? "grid-cols-3" : "grid-cols-2")}>
                {col.map((c, ci) => (
                  <div key={ci}>
                    {c.map(g => (
                      <div key={g.g} className={(tight ? "mb-1.5" : "mb-3") + " avoid-break"}>
                        <div className="flex items-center gap-1.5 pb-0.5 border-b-2" style={{ borderColor:g.colour }}>
                          <span className="w-1.5 h-3 rounded-full shrink-0" style={{ background:g.colour }} />
                          <span className={(tight ? "text-[7pt]" : "text-[8pt]") + " font-black text-slate-700 flex-1 truncate"}>
                            {g.g === "P" ? "" : g.g + ". "}{g.name}
                          </span>
                          <span className="text-[6.5pt] tnum text-slate-500">{fmtK(g.budget)}</span>
                          <span className="text-[7pt] font-extrabold tnum w-7 text-right" style={{ color:g.colour }}>{g.pct.toFixed(0)}%</span>
                        </div>
                        {g.on.map(e => (
                          <div key={e.code}
                               className={"flex items-center gap-1.5 border-b border-slate-50 " + (tight ? "py-0" : "py-[3px]")}>
                            <span className="text-[6pt] tnum text-slate-400 w-6 shrink-0">{e.code}</span>
                            <span className={(tight ? "text-[6.5pt]" : "text-[7.5pt]") + " text-slate-700 flex-1 truncate"}>{e.name}</span>
                            <span className="text-[6pt] tnum text-slate-500 w-10 text-right shrink-0">{fmtK(e.budget)}</span>
                            <div className={nCol === 3 ? "w-9 shrink-0" : "w-14 shrink-0"}><Bar pct={e.pct||0} colour={g.colour} h={3} /></div>
                            <span className="text-[6pt] tnum font-bold text-slate-600 w-6 text-right shrink-0">{(e.pct||0).toFixed(0)}%</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              {!!a.vos.length && (
                <div className="mt-3 pt-3 border-t border-slate-200 avoid-break">
                  <div className="flex items-baseline gap-3 mb-1.5">
                    <span className="text-[8pt] font-black text-slate-500 uppercase tracking-wider">Variations</span>
                    <span className="text-[7pt] text-slate-500 tnum">
                      Original {fmtEur(a.original)} + approved {fmtEur(a.voApproved)} = current budget {fmtEur(a.BAC)}
                      {a.voAnticipated > 0 && "   ·   " + fmtEur(a.voAnticipated) + " anticipated"}
                    </span>
                  </div>
                  <table className="w-full text-[7.5pt]">
                    <thead>
                      <tr className="text-[6.5pt] font-black text-slate-400 uppercase border-b border-slate-200">
                        <th className="text-left py-1 w-16">Ref</th>
                        <th className="text-left py-1">Description</th>
                        <th className="text-left py-1 w-24">Element</th>
                        <th className="text-left py-1 w-20">Status</th>
                        <th className="text-right py-1 w-20">Amount</th>
                      </tr>
                    </thead>
                    <tbody>
                      {a.vos.map(v => {
                        const el = job.elements.find(e => e.code === v.code);
                        const st = VO_STATUS[v.status] || VO_STATUS.anticipated;
                        return (
                          <tr key={v.id} className="border-b border-slate-50">
                            <td className="py-0.5 tnum font-bold text-slate-600">{v.ref}</td>
                            <td className="py-0.5 text-slate-700 truncate">{v.desc || "—"}</td>
                            <td className="py-0.5 text-slate-500 truncate">{el ? el.code + " " + el.name : "—"}</td>
                            <td className="py-0.5 font-bold" style={{ color: st.dot }}>{st.label}</td>
                            <td className="py-0.5 text-right tnum font-bold">{fmtEur(v.amount)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}

              {!!(job.milestones||[]).length && (
                <div className="mt-3 pt-3 border-t border-slate-200 avoid-break">
                  <div className="text-[8pt] font-black text-slate-500 uppercase tracking-wider mb-1.5">Milestones</div>
                  <div className="flex flex-wrap gap-2">
                    {job.milestones.map((m,i) => (
                      <span key={i} className="text-[7.5pt] px-2 py-1 rounded border border-slate-200 bg-slate-50">
                        <strong className="tnum text-slate-500">{monthLabel(job.startDate, (m.month||1)-1)}</strong>
                        <span className="text-slate-700 ml-1.5">{m.label}</span>
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="px-8 py-2.5 border-t border-slate-200 flex justify-between text-[6.5pt] text-slate-400">
              <span>Element completion is budget-weighted and rolls up to the headline figure on sheet 1</span>
              <span>{stamp}</span>
            </div>
          </div>
        );
      })()}

      {/* ---------- SHEET 3: programme, only when asked for ---------- */}
      {single && withProgramme && (rows[0].job.tasks || []).length > 0 && (() => {
        const { job, a } = rows[0];
        return <ProgrammeSheet job={job} a={a} Head={Head} stamp={stamp} />;
      })()}
    </div>
  );
}

/* Static Gantt for print. Scaled to the sheet rather than the screen, so the
   whole programme always fits the page width - no scrolling, no clipping. */
function ProgrammeSheet({ job, a, Head, stamp }) {
  const prog = useMemo(() => resolveProgramme(job.tasks), [job.tasks]);
  const all = prog.tasks;
  if (!all.length) return null;

  // Drawn 1:1 against the real sheet width (277mm ~ 1047px, less padding, the
  // 230px name column and the gap). Letting the SVG scale up with the column
  // inflated its height too, which is what pushed the chart onto a second page.
  const CHART_W = 760;
  // Rows breathe to fill the sheet when there are few tasks, and tighten (to a
  // floor) when there are many, so the programme neither looks squashed at the
  // top of the page nor runs off the bottom.
  const groupCount = new Set(all.map(t => t.group)).size;
  const lineCount = all.length + groupCount;
  // Row budget in CSS px for one A4 landscape page: 194mm printable is ~733px,
  // less the sheet header, padding, summary strip and footer.
  const ROW = clamp(Math.floor(500 / Math.max(1, lineCount)), 10, 22);
  const t0 = Math.min(...all.map(t => t.s));
  const t1 = Math.max(...all.map(t => t.e));
  const days = Math.max(1, (t1 - t0)/MS);
  const px = CHART_W / days;
  const x = (ms) => ((ms - t0)/MS) * px;

  const months = buildMonths(t0, t1);
  const years = [];
  months.forEach(m => {
    const y = new Date(m.start).getUTCFullYear();
    const last = years[years.length-1];
    if (last && last.year === y) last.end = m.end; else years.push({ year:y, start:m.start, end:m.end });
  });
  const quarters = [];
  months.forEach(m => {
    const d = new Date(m.start), q = Math.floor(d.getUTCMonth()/3)+1, y = d.getUTCFullYear();
    const last = quarters[quarters.length-1];
    if (last && last.q === q && last.y === y) last.end = m.end;
    else quarters.push({ key:y+"Q"+q, q, y, start:m.start, end:m.end });
  });
  // Same rule as on screen: months only where they fit, otherwise quarters.
  const useMonths = px * 30 >= 17;
  const bands = useMonths ? months : quarters;

  const groups = [...new Set(all.map(t => t.group))].sort();
  const ordered = [];
  groups.forEach(g => {
    ordered.push({ group:g });
    all.filter(t => t.group === g).forEach(t => ordered.push({ task:t }));
  });
  const H = ordered.length * ROW;
  const dataDate = D(todayISO());

  return (
    <div className="sheet sheet-fixed">
      <Head title="Programme"
            sub={job.name + "   ·   " + prog.leaves.length + " tasks   ·   "
                 + prog.leaves.filter(t => t.isCritical).length + " on the critical path   ·   finish "
                 + fmtDay(prog.projectFinish)}
            page="Sheet 3" />
      <div className="p-6 flex-1">
        <div className="flex gap-2">
          {/* task names + dates */}
          <div style={{ width:230 }} className="shrink-0">
            <div style={{ height:26 }} className="flex items-end pb-1 border-b border-slate-300">
              <span className="text-[6.5pt] font-black text-slate-400 uppercase flex-1">Task</span>
              <span className="text-[6.5pt] font-black text-slate-400 uppercase w-11">Start</span>
              <span className="text-[6.5pt] font-black text-slate-400 uppercase w-11">Finish</span>
              <span className="text-[6.5pt] font-black text-slate-400 uppercase w-6 text-right">%</span>
            </div>
            {ordered.map((r, i) => r.group ? (
              <div key={"g"+i} style={{ height:ROW }} className="flex items-center bg-slate-100 px-1">
                <span className="text-[6.5pt] font-black uppercase text-slate-600 truncate">{r.group}</span>
              </div>
            ) : (
              <div key={r.task.id} style={{ height:ROW }} className="flex items-center border-b border-slate-50 px-1 gap-1">
                <span className="text-[7pt] text-slate-700 truncate flex-1">
                  {r.task.milestone && "◆ "}{r.task.name}
                </span>
                {r.task.isCritical && !r.task.isSummary &&
                  <span className="text-[6pt] font-black shrink-0 px-1 rounded"
                        style={{ color:"#fff", backgroundColor:"#dc2626" }}>CP</span>}
                <span className="text-[6.5pt] tnum text-slate-500 w-11 shrink-0">{fmtDay(r.task.s)}</span>
                <span className="text-[6.5pt] tnum text-slate-500 w-11 shrink-0">
                  {r.task.milestone ? "—" : fmtDay(r.task.e)}
                </span>
                <span className="text-[6.5pt] tnum font-bold text-slate-600 w-6 text-right shrink-0">{r.task.progress}</span>
              </div>
            ))}
          </div>

          {/* bars */}
          <div className="flex-1 relative" style={{ minWidth:0 }}>
            <svg width="100%" viewBox={"0 0 " + CHART_W + " " + (H + 26)} style={{ display:"block", maxWidth:CHART_W + "px" }}>
              <defs>
                <pattern id="cpHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <rect width="5" height="5" fill="none" />
                  <line x1="0" y1="0" x2="0" y2="5" stroke="#dc2626" strokeWidth="2.2" />
                </pattern>
              </defs>
              {/* two-tier date header */}
              {years.map(y => (
                <g key={y.year}>
                  <rect x={x(y.start)} y="0" width={Math.max(0, x(y.end)-x(y.start))} height="12" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="0.5" />
                  <text x={x(y.start) + Math.max(0, x(y.end)-x(y.start))/2} y="9" textAnchor="middle"
                        fontSize="7" fontWeight="800" fill="#475569">{y.year}</text>
                </g>
              ))}
              {bands.map(bd => {
                const w = Math.max(0, x(bd.end) - x(bd.start));
                return (
                  <g key={bd.key}>
                    <rect x={x(bd.start)} y="12" width={w} height="12" fill="#fff" stroke="#e2e8f0" strokeWidth="0.5" />
                    {w > 11 && <text x={x(bd.start) + w/2} y="21" textAnchor="middle" fontSize="6" fontWeight="700" fill="#94a3b8">
                      {useMonths ? bd.label : "Q" + bd.q}
                    </text>}
                    <line x1={x(bd.start)} y1="24" x2={x(bd.start)} y2={H+26} stroke="#f1f5f9" strokeWidth="0.5" />
                  </g>
                );
              })}

              {ordered.map((r, i) => {
                const y = 26 + i*ROW;
                if (r.group) return <rect key={"gb"+i} x="0" y={y} width={CHART_W} height={ROW} fill="#f1f5f9" />;
                const t = r.task;
                if (t.milestone) {
                  const cx = x(t.s), cy = y + ROW/2;
                  return <rect key={t.id} x={cx-4} y={cy-4} width="8" height="8" fill={t.colour}
                               transform={"rotate(45 " + cx + " " + cy + ")"} />;
                }
                const w = Math.max(1.5, x(t.e) - x(t.s));
                const bh = Math.max(5, ROW - 7);
                const crit = t.isCritical && !t.isSummary;
                return (
                  <g key={t.id}>
                    <rect x={x(t.s)} y={y+3} width={w} height={bh} rx="2" fill={t.colour} />
                    <rect x={x(t.s)} y={y+3} width={w*(t.progress/100)} height={bh} rx="2" fill="rgba(0,0,0,.28)" />
                    {/* Critical path is marked three ways so it survives a
                        printer that thins strokes or prints in greyscale: a
                        hatch over the bar, a heavy outline, and a solid rule
                        under it. Colour alone was not carrying through. */}
                    {crit && <>
                      <rect x={x(t.s)} y={y+3} width={w} height={bh} rx="2" fill="url(#cpHatch)" />
                      <rect x={x(t.s)-1} y={y+2} width={w+2} height={bh+2} rx="3"
                            fill="none" stroke="#dc2626" strokeWidth="2" />
                      <rect x={x(t.s)} y={y+3+bh+1} width={w} height="2.4" fill="#dc2626" />
                    </>}
                  </g>
                );
              })}

              {dataDate >= t0 && dataDate <= t1 && (
                <g>
                  <line x1={x(dataDate)} y1="24" x2={x(dataDate)} y2={H+26} stroke="#dc2626" strokeWidth="1" />
                  <text x={x(dataDate)+2} y="33" fontSize="6" fontWeight="800" fill="#dc2626">TODAY</text>
                </g>
              )}
            </svg>
          </div>
        </div>

        <div className="mt-3 pt-2 border-t border-slate-200 flex flex-wrap gap-4 text-[7pt] text-slate-600">
          <span><strong>Programme finish</strong> {fmtDay(prog.projectFinish)}</span>
          <span><strong>Cost-trend finish</strong> {monthLabel(job.startDate, Math.max(0, Math.round(a.projMonths)-1))}</span>
          <span><strong>Contract completion</strong> {monthLabel(job.startDate, a.months-1)}</span>
          <span className="text-red-600"><strong>Red hatch, outline and CP</strong> = critical path</span>
        </div>
      </div>
      <div className="px-8 py-2.5 border-t border-slate-200 flex justify-between text-[6.5pt] text-slate-400">
        <span>Programme is drawn to the sheet width; bar shading shows progress</span>
        <span>{stamp}</span>
      </div>
    </div>
  );
}

const STORE = "CTA_V1";

/* Demo jobs. Actuals are the planned S-curve scaled by a cost factor, and
   element progress is spread as a work front then rescaled to hit a target
   completion - so CPI, SPI and the trends all hang together sensibly. */
function seed() {
  const ORDER = GROUPS.map(g => g.g);
  const JITTER = [0.94, 1.07, 0.98, 1.05, 0.96, 1.03, 1.01, 0.97, 1.04, 0.99, 1.02, 0.95];

  const mk = (over, monthsLogged, costFactor, progressFactor, notes, vos) => {
    const j = newJob(over);
    j.variations = (vos || []).map(v => ({ ...v, id: uid() }));
    const months = monthsBetween(j.startDate, j.endDate);
    const plan = sCurve(j.budget, months);

    j.actuals = plan.periodic.slice(0, monthsLogged).map((v, i) => ({
      value: Math.round(v * costFactor * JITTER[i % JITTER.length]),
      comment: (notes && notes[i]) || "",
    }));

    // Target completion = what the plan expects by now, flexed by performance.
    const planPct = (plan.cumulative[monthsLogged-1] / (plan.cumulative[months-1] || 1)) * 100;
    const target = clamp(planPct * progressFactor, 0, 100) / 100;

    // Work front: earlier element groups finish first, with a small
    // deterministic spread inside each group so it does not read as flat.
    const raw = j.elements.map(e => {
      if (!e.on) return 0;
      const s = ORDER.indexOf(e.g) / (ORDER.length - 1);
      const jitter = ((Number(e.code.replace(/\D/g, "")) % 7) - 3) * 0.035;
      return clamp((target * 2.0 - s * 1.15) * 1.7 + jitter, 0, 1);
    });
    const w = j.elements.map(e => e.on ? (e.budget || 1) : 0);
    const tw = sum(w) || 1;
    let scaled = raw;
    for (let it = 0; it < 4; it++) {              // rescale, allowing for the 0-1 clamp
      const mean = sum(scaled.map((r,i) => r * w[i])) / tw;
      if (mean <= 0) break;
      const k = target / mean;
      if (Math.abs(k - 1) < 0.002) break;
      scaled = scaled.map(r => clamp(r * k, 0, 1));
    }
    j.elements = j.elements.map((e,i) => e.on ? { ...e, pct: Math.round(scaled[i] * 100) } : e);
    // Give the demo jobs a programme so the Gantt and its report sheet are
    // there to look at without having to build one first.
    j.tasks = generateProgramme(j);
    return j;
  };

  return [
    mk({ name:"Community Nursing Unit, Mallow — Phase 2", ref:"CAP-2026-118", location:"Mallow, Co. Cork", lat:52.135, lon:-8.645,
         preset:"new-build", budget:9400000, contingencyPct:10,
         startDate:"2025-09-01", endDate:"2027-06-30", stage:"Construction",
         milestones:[{month:6,label:"Substructure complete"},{month:13,label:"Watertight"}] },
       11, 1.09, 0.94,
       { 3:"Rock breaking beyond allowance", 8:"Frame delivery 3 weeks late" },
       [{ ref:"VO-001", desc:"Rock excavation beyond allowance", code:"9", amount:210000, status:"approved" },
        { ref:"VO-002", desc:"Revised sprinkler layout to fire cert", code:"58", amount:86000, status:"anticipated" }]),

    mk({ name:"Theatre Suite Refurbishment, CUH", ref:"CAP-2026-042", location:"Wilton, Co. Cork", lat:51.884, lon:-8.517,
         preset:"refurb", budget:3200000, contingencyPct:8,
         startDate:"2026-01-01", endDate:"2026-12-31", stage:"Construction",
         milestones:[{month:4,label:"Strip-out complete"},{month:9,label:"Validation"}] },
       7, 1.13, 0.84,
       { 2:"Asbestos found in ceiling void", 5:"Additional decant ward required" },
       [{ ref:"VO-001", desc:"Asbestos removal to ceiling voids", code:"20", amount:118000, status:"approved" },
        { ref:"VO-002", desc:"Additional decant ward fit-out",    code:"18", amount:64000,  status:"approved" },
        { ref:"VO-003", desc:"Theatre ventilation upgrade to HTM", code:"55", amount:145000, status:"anticipated" }]),

    mk({ name:"Primary Care Centre Extension, Tralee", ref:"CAP-2027-007", location:"Tralee, Co. Kerry", lat:52.270, lon:-9.700,
         preset:"extension", budget:5600000, contingencyPct:12,
         startDate:"2026-04-01", endDate:"2027-09-30", stage:"Construction",
         milestones:[{month:8,label:"Frame complete"}] },
       5, 0.97, 1.03, null),

    mk({ name:"Ward Block M&E Upgrade, Bantry", ref:"CAP-2026-233", location:"Bantry, Co. Cork", lat:51.681, lon:-9.454,
         preset:"mep", budget:2100000, contingencyPct:10,
         startDate:"2026-02-01", endDate:"2026-11-30", stage:"Construction",
         milestones:[{month:7,label:"Plant changeover"}] },
       6, 1.05, 0.97, { 4:"Switchgear lead time extended" },
       [{ ref:"VO-001", desc:"Generator changeover out of hours", code:"65", amount:38000, status:"approved" }]),

    mk({ name:"Site Access & Car Parking, Killarney CH", ref:"CAP-2026-311", location:"Killarney, Co. Kerry", lat:52.059, lon:-9.506,
         preset:"external", budget:1250000, contingencyPct:7,
         startDate:"2026-05-01", endDate:"2026-12-31", stage:"Construction", milestones:[] },
       4, 0.95, 1.00, null),
  ];
}

function App() {
  const [jobs, setJobs] = useState(() => {
    try {
      const s = localStorage.getItem(STORE);
      // An empty array is a deliberate "cleared" state and must survive a
      // reload - only seed when nothing has ever been stored.
      if (s) { const p = JSON.parse(s); if (Array.isArray(p)) return p.map(reconcileElements); }
    } catch(e) {}
    return seed();
  });
  const [openId, setOpenId] = useState(null);
  const [setupId, setSetupId] = useState(null);
  const [reportFor, setReportFor] = useState(undefined); // undefined = closed, null = portfolio, id = job
  const [isSettingsOpen, setIsSettingsOpen] = useState(false);

  /* Portfolio-wide forecast assumptions. New jobs inherit them; "apply to all"
     pushes them onto existing jobs. */
  const [assump, setAssump] = useState(() => {
    try {
      const s = localStorage.getItem(STORE + "_ASSUMPTIONS");
      if (s) return { escalationPct:4, contingencyPct:10, cpiOverride:null, ...JSON.parse(s) };
    } catch(e) {}
    return { escalationPct:4, contingencyPct:10, cpiOverride:null };
  });
  useEffect(() => {
    try { localStorage.setItem(STORE + "_ASSUMPTIONS", JSON.stringify(assump)); } catch(e) {}
  }, [assump]);

  const applyAssumptions = () => {
    setJobs(p => p.map(j => ({
      ...j,
      escalationPct: assump.escalationPct,
      contingencyPct: assump.contingencyPct,
      cpiOverride: assump.cpiOverride,
    })));
  };

  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify(jobs)); } catch(e) {} }, [jobs]);

  const save = (j) => setJobs(p => p.map(x => x.id === j.id ? j : x));
  const current = jobs.find(j => j.id === openId);
  const setupJob = jobs.find(j => j.id === setupId);

  const addJob = () => {
    const j = newJob({ name:"New Project", escalationPct:assump.escalationPct,
                       contingencyPct:assump.contingencyPct, cpiOverride:assump.cpiOverride });
    setJobs(p => [...p, j]); setSetupId(j.id);
  };
  const duplicate = (id) => {
    const src = jobs.find(j => j.id === id); if (!src) return;
    setJobs(p => [...p, { ...JSON.parse(JSON.stringify(src)), id: uid(), name: src.name + " (copy)" }]);
  };
  const remove = (id) => {
    const j = jobs.find(x => x.id === id);
    if (!window.confirm("Delete \"" + (j ? j.name : "this job") + "\"? This cannot be undone.")) return;
    setJobs(p => p.filter(x => x.id !== id));
    if (openId === id) setOpenId(null);
  };

  const goTo = (id) => setOpenId(id);

  /* Destructive actions sit behind a code. It is in the source of this file and
     anyone determined will find it - the point is only that neither can be
     triggered by a stray click. */
  const DESTRUCTIVE_CODE = "2005";
  const guard = (warning, run) => {
    const entered = window.prompt(warning + "\n\nEnter the 4-digit code to confirm.");
    if (entered == null) return;                       // cancelled
    if (entered.trim() !== DESTRUCTIVE_CODE) {
      window.alert("That code is not right. Nothing has been changed.");
      return;
    }
    run();
    setIsSettingsOpen(false);
  };

  const resetDemo = () => guard(
    "This replaces every job with the five demo jobs. Anything you have entered is lost.\nExport first if you want to keep it.",
    () => { setJobs(seed()); setOpenId(null); });

  const clearAll = () => guard(
    "This deletes every job and leaves the app completely empty.\nExport first if you want to keep anything.",
    () => { setJobs([]); setOpenId(null); });

  const exportJson = () => {
    const blob = new Blob([JSON.stringify(jobs, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "construction-trend-analysis-" + todayISO() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const importJson = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (Array.isArray(p) && p.length) { setJobs(p.map(reconcileElements)); setOpenId(null); }
        else window.alert("That file does not contain a job list.");
      } catch(err) { window.alert("Could not read that file."); }
    };
    r.readAsText(f); e.target.value = "";
  };

  return (
    <>
      <div className="min-h-screen app-shell">
      <nav className="text-white shadow-lg no-print sticky top-0 z-40"
           style={{ backgroundColor:"#006858", backgroundImage:"linear-gradient(100deg,#00453a 0%,#006858 55%,#00755f 100%)" }}>
        <div className="max-w-[1800px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
          <button onClick={() => goTo(null)} className="flex items-center gap-3 min-w-0 text-left">
            <span className="bg-white rounded-lg p-1.5 shrink-0 flex items-center shadow-sm">
              <img src={HSE_LOGO} alt="HSE" className="h-7 w-auto" />
            </span>
            <div className="min-w-0">
              <div className="font-extrabold text-[15px] leading-tight truncate">Construction Trend Analysis</div>
              <div className="text-[9px] uppercase tracking-[0.18em] opacity-70">
                {current ? "Job view" : "Portfolio dashboard"} · {jobs.length} job{jobs.length !== 1 ? "s" : ""}
              </div>
            </div>
          </button>
          <div className="flex items-center gap-2 shrink-0">
            <label className="px-3 py-2 rounded-lg bg-white/10 border border-white/15 hover:bg-white/20 transition cursor-pointer flex items-center gap-1.5 text-[11px] font-bold" title="Import a saved job file">
              <Ico d={I.save} size={14} /><span className="hidden sm:inline">Import</span>
              <input type="file" accept=".json" onChange={importJson} className="hidden" />
            </label>
            <button onClick={exportJson} title="Export all jobs"
              className="px-3 py-2 rounded-lg bg-white/10 border border-white/15 hover:bg-white/20 transition flex items-center gap-1.5 text-[11px] font-bold">
              <Ico d={I.down} size={14} /><span className="hidden sm:inline">Export</span>
            </button>
            <button onClick={() => setIsSettingsOpen(true)} title="Settings"
              className="px-3 py-2 rounded-lg bg-white/10 border border-white/15 hover:bg-white/20 transition">
              <Ico d={I.cog} size={14} />
            </button>
            <button onClick={() => setReportFor(current ? current.id : null)}
              className="px-3 py-2 rounded-lg bg-white text-[#006858] hover:bg-emerald-50 transition flex items-center gap-1.5 text-[11px] font-bold shadow-sm">
              <Ico d={I.print} size={14} /> Report
            </button>
          </div>
        </div>
      </nav>

      {current
        ? <JobView job={current} save={save} back={() => goTo(null)}
                   onSetup={() => setSetupId(current.id)} onReport={() => setReportFor(current.id)} />
        : <Portfolio jobs={jobs} open={goTo} onNew={addJob} onDelete={remove}
                     onDuplicate={duplicate} onReport={(id) => setReportFor(id)} />}

      <Modal open={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="Settings">
        <div className="space-y-5">
          <section>
            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Your data</h4>
            <p className="text-[12px] text-slate-600 leading-relaxed">
              Jobs are stored in this browser only — nothing leaves the machine. Clearing the
              browser's site data removes them, so export a copy if they matter.
            </p>
            <div className="grid sm:grid-cols-2 gap-2 mt-3">
              <button onClick={exportJson}
                className="py-2.5 rounded-lg bg-[#006858] text-white text-xs font-bold hover:bg-[#00806c] flex items-center justify-center gap-2">
                <Ico d={I.down} size={14} /> Export all jobs
              </button>
              <label className="py-2.5 rounded-lg border border-slate-200 text-slate-600 text-xs font-bold hover:border-[#006858] hover:text-[#006858] flex items-center justify-center gap-2 cursor-pointer">
                <Ico d={I.save} size={14} /> Import from file
                <input type="file" accept=".json" onChange={importJson} className="hidden" />
              </label>
            </div>
            <div className="mt-2 text-[11px] text-slate-500 tnum">
              {jobs.length} job{jobs.length === 1 ? "" : "s"} stored
            </div>
          </section>

          <section className="rounded-xl border border-red-200 bg-red-50/60 p-4">
            <h4 className="text-[10px] font-black text-red-700 uppercase tracking-wider flex items-center gap-1.5">
              <Ico d={I.warn} size={13} /> Danger zone
            </h4>
            <p className="text-[11px] text-red-800/80 mt-1.5 leading-relaxed">
              Both actions are immediate and cannot be undone. Each asks for a 4-digit code first,
              so neither can happen by a stray click.
            </p>
            <div className="grid sm:grid-cols-2 gap-2 mt-3">
              <button onClick={resetDemo}
                className="py-2.5 rounded-lg bg-white border border-red-200 text-red-700 text-xs font-bold hover:bg-red-100 transition">
                Reset to demo data
              </button>
              <button onClick={clearAll}
                className="py-2.5 rounded-lg bg-red-600 text-white text-xs font-bold hover:bg-red-700 transition">
                Clear everything
              </button>
            </div>
            <div className="text-[10px] text-red-800/70 mt-2 leading-relaxed">
              <strong>Reset</strong> puts the five demo jobs back. <strong>Clear</strong> leaves the
              app completely empty, ready for a fresh job.
            </div>
          </section>

          <section>
            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Forecast assumptions</h4>
            <p className="text-[12px] text-slate-600 leading-relaxed mb-3">
              Applied to every job unless that job overrides them in its own Set-up.
            </p>
            <div className="grid sm:grid-cols-3 gap-3 items-end">
              <div>
                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1 flex items-center">
                  Inflation % / yr
                  <Tip text="Construction escalation. Prices the cost of delay in what-if, and gives the out-turn-price figure alongside today's money." />
                </label>
                <input type="number" min="0" max="25" step="0.5" value={assump.escalationPct}
                  onChange={e => setAssump({ ...assump, escalationPct: Number(e.target.value) })}
                  className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
              </div>
              <div>
                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Contingency %</label>
                <input type="number" min="0" max="50" step="0.5" value={assump.contingencyPct}
                  onChange={e => setAssump({ ...assump, contingencyPct: Number(e.target.value) })}
                  className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
              </div>
              <div>
                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1 flex items-center">
                  Assumed CPI
                  <Tip text="Leave blank to use each job's measured CPI. Set a figure to forecast on that instead — useful early on, when one or two certificates swing the measured value wildly." />
                </label>
                <input type="number" min="0" max="3" step="0.01" placeholder="measured"
                  value={assump.cpiOverride == null ? "" : assump.cpiOverride}
                  onChange={e => setAssump({ ...assump, cpiOverride: e.target.value === "" ? null : Number(e.target.value) })}
                  className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
              </div>
            </div>
            <button onClick={applyAssumptions}
              className="mt-3 w-full py-2.5 rounded-lg bg-[#006858] text-white text-xs font-bold hover:bg-[#00806c]">
              Apply to all {jobs.length} job{jobs.length === 1 ? "" : "s"}
            </button>
            <p className="text-[10px] text-slate-400 mt-2 leading-relaxed">
              New jobs pick these up automatically. "Apply to all" pushes them onto existing jobs too,
              overwriting anything set per job.
            </p>
          </section>

          <section>
            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Planned cash flow</h4>
            <p className="text-[12px] text-slate-600 leading-relaxed">
              New jobs are phased on the standard construction S-curve — <strong>20%</strong> of spend
              in the first third of the programme, <strong>60%</strong> through the middle third and
              <strong> 20%</strong> in the last. The forecast follows the same shape for the work still
              to run, rather than a straight line. Override any month in Job data → Planned cash flow.
            </p>
          </section>
        </div>
      </Modal>

      <Modal open={!!setupJob} onClose={() => setSetupId(null)} title="Job set-up" wide>
        {setupJob && <Setup key={setupJob.id} job={setupJob} save={save} onClose={() => setSetupId(null)} />}
      </Modal>

      </div>

      {/* Outside .app-shell on purpose: print hides the shell so the dashboard
          does not print behind the report, and the report must survive that. */}
      {reportFor !== undefined &&
        <Report jobs={jobs} focusId={reportFor} onClose={() => setReportFor(undefined)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
