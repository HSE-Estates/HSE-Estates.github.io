        <div className="overflow-x-auto scroll">
          <table className="w-full text-sm min-w-[1280px]">
            <thead>
              <tr className="bg-slate-50 border-b border-slate-200 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                <th className="text-left px-4 py-3">Job</th>
                <th className="text-left px-3 py-3">Risk</th>
                <th className="text-right px-3 py-3">Budget</th>
                <th className="text-right px-3 py-3">Spent</th>
                <th className="text-right px-3 py-3">CPI</th>
                <th className="text-right px-3 py-3">SPI</th>
                <th className="text-right px-3 py-3">Forecast</th>
                <th className="text-right px-3 py-3">Variance</th>
                <th className="text-right px-3 py-3">Margin of safety</th>
                <th className="text-right px-3 py-3">Breakeven</th>
                <th className="text-left px-3 py-3 w-[190px]">Complete</th>
                <th className="text-left px-3 py-3">Trend</th>
                <th className="px-3 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {rows.map(({ job, a }) => (
                <tr key={job.id} onClick={() => open(job.id)}
                    className="border-b border-slate-100 hover:bg-[#f0f9f7] cursor-pointer transition group">
                  <td className="px-4 py-3">
                    <div className="font-bold text-slate-800 leading-tight">{job.name}</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">
                      {[job.ref, job.location, job.stage].filter(Boolean).join("  ·  ")}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-0.5 tnum">
                      {monthLabel(job.startDate,0)} &rarr; {monthLabel(job.startDate, a.months-1)}
                      {Math.round(a.delayMonths) > 0 &&
                        <span className="text-red-500 font-bold"> (+{Math.round(a.delayMonths)}m forecast)</span>}
                    </div>
                  </td>
                  <td className="px-3 py-3"><RiskPill band={a.band} score={a.riskScore} small /></td>
                  <td className="px-3 py-3 text-right tnum font-semibold text-slate-700">{fmtK(a.BAC)}</td>
                  <td className="px-3 py-3 text-right tnum text-slate-600">{fmtK(a.AC)}</td>
                  <td className={"px-3 py-3 text-right tnum font-bold " + (a.CPI == null ? "text-slate-300" : a.CPI >= 1 ? "text-emerald-600" : a.CPI >= 0.95 ? "text-amber-600" : "text-red-600")}>
                    {a.CPI == null ? "—" : a.CPI.toFixed(2)}
                  </td>
                  <td className={"px-3 py-3 text-right tnum font-bold " + (a.SPI == null ? "text-slate-300" : a.SPI >= 1 ? "text-emerald-600" : a.SPI >= 0.95 ? "text-amber-600" : "text-red-600")}>
                    {a.SPI == null ? "—" : a.SPI.toFixed(2)}
                  </td>
                  <td className="px-3 py-3 text-right tnum font-bold text-slate-800">{fmtK(a.outturn)}</td>
                  <td className={"px-3 py-3 text-right tnum font-bold " + (a.variance > 0 ? "text-red-600" : "text-emerald-600")}>
                    {signedK(a.variance)}
                    <div className="text-[10px] font-medium opacity-70">{pc(a.variancePct,1)}</div>
                  </td>
                  <td className={"px-3 py-3 text-right tnum font-bold " + (a.marginPct < 0 ? "text-red-600" : a.marginPct < 5 ? "text-amber-600" : "text-emerald-600")}>
                    {fmtK(a.marginEur)}
                    <div className="text-[10px] font-medium opacity-70">{pc(a.marginPct,1)}</div>
                  </td>
                  <td className="px-3 py-3 text-right tnum">
                    {a.breakevenPct == null ? <span className="text-slate-300">—</span> :
                      <span className={a.breakevenPct >= 100 ? "text-emerald-600 font-bold" : "text-red-600 font-bold"}>
                        {a.breakevenPct >= 100 ? "Clears" : pc(a.breakevenPct,0)}
                      </span>}
                    {a.breakevenMonth != null &&
                      <div className="text-[10px] text-red-500 font-medium">{monthLabel(job.startDate, a.breakevenMonth)}</div>}
                  </td>
                  <td className="px-3 py-3">
                    <div className="flex items-center gap-2">
                      <div className="flex-1"><Bar pct={a.physicalPct} colour={BANDS[a.band].dot} /></div>
                      <span className="tnum text-[11px] font-bold text-slate-600 w-10 text-right">{a.physicalPct.toFixed(0)}%</span>
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 tnum">
                      plan {a.plannedPctToDate.toFixed(0)}%
                      <span className={a.pctDrift < -2 ? "text-red-500 font-bold" : a.pctDrift > 2 ? "text-emerald-600 font-bold" : ""}>
                        {" "}({a.pctDrift > 0 ? "+" : ""}{a.pctDrift.toFixed(0)})
                      </span>
                    </div>
                  </td>
                  <td className="px-3 py-3"><Spark a={a} /></td>
                  <td className="px-3 py-3 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
                    <button onClick={() => onReport(job.id)} title="Report"
                      className="p-1.5 rounded text-slate-300 hover:text-[#006858] hover:bg-slate-100"><Ico d={I.print} size={15} /></button>
                    <button onClick={() => onDuplicate(job.id)} title="Duplicate"
                      className="p-1.5 rounded text-slate-300 hover:text-slate-700 hover:bg-slate-100"><Ico d={I.copy} size={15} /></button>
                    <button onClick={() => onDelete(job.id)} title="Delete"
                      className="p-1.5 rounded text-slate-300 hover:text-red-600 hover:bg-red-50"><Ico d={I.trash} size={15} /></button>
                  </td>
                </tr>
              ))}
              {!rows.length && (
                <tr><td colSpan={13} className="px-4 py-16 text-center text-slate-400 text-sm">
                  No jobs match. <button onClick={onNew} className="text-[#006858] font-bold hover:underline">Set one up</button>.
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {/* ---- job cards (mobile) ---- */}
      <div className={pane === "map" ? "hidden" : "md:hidden space-y-3"}>
        {rows.map(({ job, a }) => (
          <div key={job.id} onClick={() => open(job.id)}
               className="bg-white rounded-xl border border-slate-200 p-4 active:bg-slate-50">
            <div className="flex justify-between items-start gap-3">
              <div className="min-w-0">
                <div className="font-bold text-slate-800 leading-tight truncate">{job.name}</div>
                <div className="text-[11px] text-slate-400 mt-0.5 truncate">{[job.ref, job.location].filter(Boolean).join("  ·  ")}</div>
              </div>
              <RiskPill band={a.band} score={a.riskScore} small />
            </div>
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div><div className="text-[9px] font-black text-slate-400 uppercase">Budget</div><div className="tnum font-bold text-sm">{fmtK(a.BAC)}</div></div>
              <div><div className="text-[9px] font-black text-slate-400 uppercase">Forecast</div><div className={"tnum font-bold text-sm " + (a.variance > 0 ? "text-red-600" : "text-emerald-600")}>{fmtK(a.outturn)}</div></div>
              <div><div className="text-[9px] font-black text-slate-400 uppercase">Safety</div><div className={"tnum font-bold text-sm " + (a.marginPct < 0 ? "text-red-600" : a.marginPct < 5 ? "text-amber-600" : "text-emerald-600")}>{pc(a.marginPct,0)}</div></div>
            </div>
            <div className="mt-3 flex items-center gap-2">
              <div className="flex-1"><Bar pct={a.physicalPct} colour={BANDS[a.band].dot} /></div>
              <span className="tnum text-[11px] font-bold text-slate-600">{a.physicalPct.toFixed(0)}%</span>
            </div>
            <div className="text-[10px] text-slate-400 mt-2">{a.drivers[0]}</div>
          </div>
        ))}
        <button onClick={onNew} className="w-full py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-400 text-xs font-bold uppercase">+ New job</button>
      </div>

      {/* ---- watchlist ---- */}
      {rows.some(r => r.a.band === "critical" || r.a.band === "at-risk") && (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="px-4 py-3 bg-red-50 border-b border-red-100 flex items-center gap-2">
            <span className="text-red-600"><Ico d={I.warn} size={15} /></span>
            <h3 className="text-[11px] font-black uppercase tracking-wider text-red-800">Watchlist — what is driving the risk</h3>
          </div>
          <div className="divide-y divide-slate-100">
            {rows.filter(r => r.a.band === "critical" || r.a.band === "at-risk").map(({ job, a }) => (
              <div key={job.id} onClick={() => open(job.id)}
                   className="px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-2 hover:bg-slate-50 cursor-pointer">
                <div className="w-full sm:w-64 shrink-0">
                  <div className="font-bold text-sm text-slate-800">{job.name}</div>
                  <div className="text-[11px] text-slate-400">{fmtK(a.BAC)} · {a.physicalPct.toFixed(0)}% complete</div>
                </div>
                <div className="flex-1 flex flex-wrap gap-1.5">
                  {a.drivers.map((d,i) => (
                    <span key={i} className="text-[10px] font-bold px-2 py-1 rounded bg-red-50 text-red-700 border border-red-100">{d}</span>
                  ))}
                </div>
                <div className="text-right shrink-0">
                  <div className={"tnum font-bold text-sm " + (a.marginEur < 0 ? "text-red-600" : "text-amber-600")}>{signedK(a.marginEur)}</div>
                  <div className="text-[10px] text-slate-400">margin of safety</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="pb-8" />
    </div>
  );
}

/* ==========================================================================
   7. JOB SET-UP
   Start date + finish date drive the programme length - months are never
   typed. Then the NSBE matrix: pick a preset, untick what does not apply.
   ========================================================================== */

function Setup({ job, save, onClose }) {
  const [d, setD] = useState(job);
  const months = monthsBetween(d.startDate, d.endDate);
  const live = d.elements.filter(e => e.on);
  const allocated = sum(live.map(e => e.budget));
  const drift = allocated - d.budget;
  const [openGroups, setOpenGroups] = useState(() => new Set(GROUPS.map(g => g.g)));
  const [onlyOn, setOnlyOn] = useState(false);

  const set = (k, v) => setD(p => ({ ...p, [k]: v }));
  const toggleGroup = (g) => setOpenGroups(p => { const n = new Set(p); n.has(g) ? n.delete(g) : n.add(g); return n; });

  const applyPreset = (key) => {
    const ex = new Set(PRESETS[key].exclude);
    setD(p => ({ ...p, preset:key, elements: allocate(p.elements.map(e => ({ ...e, on: !ex.has(e.code) })), p.budget) }));
  };
  const toggleElement = (code) =>
    setD(p => ({ ...p, elements: p.elements.map(e => e.code === code ? { ...e, on: !e.on, budget: e.on ? 0 : e.budget } : e) }));
  const setGroup = (g, on) =>
    setD(p => ({ ...p, elements: p.elements.map(e => e.g === g ? { ...e, on, budget: on ? e.budget : 0 } : e) }));
  const reAllocate = () => setD(p => ({ ...p, elements: allocate(p.elements, p.budget) }));

  return (
    <div className="space-y-6">

      {/* --- identity --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Job details</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="sm:col-span-2">
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Project name</label>
            <input value={d.name} onChange={e => set("name", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] focus:ring-2 focus:ring-[#006858]/20" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Job / capital ref</label>
            <input value={d.ref||""} onChange={e => set("ref", e.target.value)} placeholder="e.g. CAP-2026-118"
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Location</label>
            <input value={d.location||""} onChange={e => set("location", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
        </div>

        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-3 items-end">
          <div className="sm:col-span-2">
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1 flex items-center">
              Put it on the map
              <Tip text="Coordinates place the job on the portfolio map. Pick a town to fill them in, or type your own if you have the site's exact position." />
            </label>
            <select value=""
              onChange={e => {
                if (!e.target.value) return;
                const p = PLACES.find(x => x[0] === e.target.value);
                if (p) setD(prev => ({ ...prev, lat:p[1], lon:p[2], location: prev.location || p[0] }));
              }}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] bg-white">
              <option value="">Choose a town…</option>
              {PLACES.map(p => <option key={p[0]} value={p[0]}>{p[0]}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Latitude</label>
            <input type="number" step="0.0001" value={d.lat == null ? "" : d.lat}
              placeholder="51.8974"
              onChange={e => set("lat", e.target.value === "" ? null : Number(e.target.value))}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Longitude</label>
            <input type="number" step="0.0001" value={d.lon == null ? "" : d.lon}
              placeholder="-8.4706"
              onChange={e => set("lon", e.target.value === "" ? null : Number(e.target.value))}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
          </div>
        </div>
      </section>

      {/* --- programme --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Programme</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Start on site</label>
            <input type="date" value={d.startDate} onChange={e => set("startDate", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Practical completion</label>
            <input type="date" value={d.endDate} onChange={e => set("endDate", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
          </div>
          <div className="bg-[#e6f2f0] rounded-lg px-3 py-2 border border-[#006858]/15">
            <div className="text-[10px] font-bold text-[#006858] uppercase">Months planned</div>
            <div className="text-2xl font-extrabold text-[#006858] tnum leading-tight">{months || "—"}</div>
            <div className="text-[10px] text-[#006858]/60">calculated from the dates</div>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Stage</label>
            <select value={d.stage} onChange={e => set("stage", e.target.value)}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] bg-white">
              {["Feasibility","Design","Tender","Construction","Commissioning","Defects","Complete"].map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
      </section>

      {/* --- money --- */}
      <section>
        <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3">Budget</h4>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Works budget (excl. contingency)</label>
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">€</span>
              <Money value={d.budget} onChange={v => set("budget", v)}
                className="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
            </div>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Contingency %</label>
            <input type="number" min="0" max="50" step="0.5" value={d.contingencyPct}
              onChange={e => set("contingencyPct", Number(e.target.value))}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1 flex items-center">
              Escalation % / yr
              <Tip text="Construction inflation. Used to price the cost of delay in what-if, and to state an out-turn cost alongside the today's-money figure." />
            </label>
            <input type="number" min="0" max="25" step="0.5" value={d.escalationPct == null ? 4 : d.escalationPct}
              onChange={e => set("escalationPct", Number(e.target.value))}
              className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858] tnum" />
          </div>
          <div className="bg-slate-50 rounded-lg px-3 py-2 border border-slate-200">
            <div className="text-[10px] font-bold text-slate-500 uppercase">Authorised funding</div>
            <div className="text-lg font-extrabold text-slate-800 tnum">{fmtEur(d.budget * (1 + d.contingencyPct/100))}</div>
            <div className="text-[10px] text-slate-400 leading-tight mt-0.5">works + contingency</div>
          </div>
          <div className={"rounded-lg px-3 py-2 border " + (Math.abs(drift) < 1 ? "bg-emerald-50 border-emerald-200" : "bg-amber-50 border-amber-200")}>
            <div className="text-[10px] font-bold uppercase text-slate-500">Allocated to elements</div>
            <div className="text-lg font-extrabold tnum text-slate-800">{fmtEur(allocated)}</div>
            <div className={"text-[10px] font-bold " + (Math.abs(drift) < 1 ? "text-emerald-600" : "text-amber-700")}>
              {Math.abs(drift) < 1 ? "Balanced" : signedK(drift) + " vs budget"}
            </div>
          </div>
        </div>
      </section>

      {/* --- the matrix --- */}
      <section>
        <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-3 mb-3">
          <div>
            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-wider">Matrix of Building Elements — NSAI MMC Toolkit</h4>
            <p className="text-[11px] text-slate-500 mt-1 max-w-xl">
              Cells <strong className="tnum">1–59</strong> of the NSAI matrix. Tick only what applies —
              an internal fit-out drops <strong className="tnum">59</strong> Landscape,
              <strong className="tnum"> 40</strong> Roads and the whole substructure column, and they then
              carry no budget and no weight in the completion roll-up. The column summaries
              (<span className="tnum">60–67</span>) are not listed: the app rolls each column up itself.
              Group <strong>P</strong> sits outside the NSAI matrix and holds prelims, fees and contingency;
              <strong className="tnum"> P6</strong> is off by default because contingency is already carried
              by the contingency % above.
            </p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[10px] font-black text-slate-400 uppercase">Preset</span>
            {Object.entries(PRESETS).map(([k,v]) => (
              <button key={k} onClick={() => applyPreset(k)} title={v.hint}
                className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition border " +
                  (d.preset === k ? "bg-[#006858] text-white border-[#006858]" : "bg-white text-slate-600 border-slate-200 hover:border-[#006858] hover:text-[#006858]")}>
                {v.label}
              </button>
            ))}
          </div>
        </div>

        <div className="flex items-center justify-between mb-2 text-[11px]">
          <div className="text-slate-500">
            <strong className="text-slate-800 tnum">{live.length}</strong> of {d.elements.length} elements applicable
          </div>
          <div className="flex items-center gap-3">
            <label className="flex items-center gap-1.5 cursor-pointer text-slate-500 font-bold">
              <input type="checkbox" checked={onlyOn} onChange={e => setOnlyOn(e.target.checked)} className="accent-[#006858]" />
              Show applicable only
            </label>
            <button onClick={reAllocate} className="px-2.5 py-1 rounded bg-white border border-slate-200 font-bold text-slate-600 hover:text-[#006858] hover:border-[#006858]">
              Auto-spread budget
            </button>
          </div>
        </div>

        <div className="border border-slate-200 rounded-xl overflow-hidden max-h-[460px] overflow-y-auto scroll bg-white">
          {GROUPS.map(grp => {
            const items = d.elements.filter(e => e.g === grp.g && (!onlyOn || e.on));
            if (!items.length) return null;
            const all = d.elements.filter(e => e.g === grp.g);
            const onCount = all.filter(e => e.on).length;
            const gBudget = sum(all.filter(e => e.on).map(e => e.budget));
            const isOpen = openGroups.has(grp.g);
            return (
              <div key={grp.g} className="border-b border-slate-100 last:border-0">
                <div className="flex items-center gap-2 px-3 py-2 bg-slate-50 sticky top-0 z-10">
                  <button onClick={() => toggleGroup(grp.g)} className="text-slate-400 hover:text-slate-700">
                    <Ico d={I.chev} size={14} className={isOpen ? "" : "-rotate-90"} />
                  </button>
                  <span className="w-1.5 h-4 rounded-full" style={{ background: grp.colour }} />
                  <span className="font-bold text-[12px] text-slate-700 flex-1">{grp.g === "P" ? "" : grp.g + ". "}{grp.name}</span>
                  <span className="text-[10px] text-slate-400 tnum">{onCount}/{all.length}</span>
                  <span className="text-[11px] font-bold text-slate-600 tnum w-20 text-right">{fmtK(gBudget)}</span>
                  <button onClick={() => setGroup(grp.g, onCount < all.length)}
                    className="text-[10px] font-bold text-[#006858] hover:underline w-14 text-right">
                    {onCount < all.length ? "Tick all" : "Clear"}
                  </button>
                </div>
                {isOpen && items.map(e => (
                  <div key={e.code} className={"flex items-center gap-2 px-3 py-1.5 border-t border-slate-50 " + (e.on ? "" : "opacity-45")}>
                    <input type="checkbox" checked={e.on} onChange={() => toggleElement(e.code)} className="accent-[#006858] w-4 h-4 shrink-0" />
                    <span className="tnum text-[11px] text-slate-400 w-11 shrink-0">{e.code}</span>
                    <span className="text-[12px] text-slate-700 flex-1 truncate">{e.name}</span>
                    <div className="relative w-28 shrink-0">
                      <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-[11px]">€</span>
                      <Money value={e.budget} disabled={!e.on}
                        onChange={v => setD(p => ({ ...p, elements: p.elements.map(x => x.code === e.code ? { ...x, budget:v } : x) }))}
                        className="w-full pl-5 pr-2 py-1 text-[12px] text-right border border-slate-200 rounded outline-none focus:border-[#006858] disabled:bg-slate-50" />
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </section>

      <div className="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-100">
        <button onClick={() => { save({ ...d, budget: allocated > 0 ? allocated : d.budget }); onClose(); }}
          className="flex-1 py-3 bg-[#006858] text-white rounded-xl font-bold hover:bg-[#00806c] transition shadow-sm">
          Save job set-up
        </button>
        <button onClick={onClose} className="px-6 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50">Cancel</button>
      </div>
    </div>
  );
}

/* ==========================================================================
   8. JOB DATA DRAWER - spend log, planned cash flow, milestones
   Hidden by default. The job view is an overview; this is where you type.
   ========================================================================== */

function DataDrawer({ job, a, save }) {
  const [tab, setTab] = useState("log");
  const upd = (k, v) => save({ ...job, [k]: v });

  const addMonth = () => {
    if (a.nLogged >= a.months) return;
    upd("actuals", [...(job.actuals||[]), { value: Math.round(a.plan.periodic[a.nLogged] || 0), comment:"" }]);
  };
  const ensurePlan = () => job.planned && job.planned.length
    ? [...job.planned]
    : a.plan.periodic.map(v => ({ value:v, comment:"" }));

  const tabs = [["log","Spend log"],["vo","Variations"],["plan","Planned cash flow"],["ms","Milestones"]];

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="flex border-b border-slate-100">
        {tabs.map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={"flex-1 py-2.5 text-[11px] font-bold uppercase tracking-wide transition " +
              (tab === id ? "text-[#006858] border-b-2 border-[#006858] bg-[#e6f2f0]/40" : "text-slate-400 hover:text-slate-600")}>
            {label}
          </button>
        ))}
      </div>

      <div className="p-3 max-h-[420px] overflow-y-auto scroll bg-slate-50/60">
        {tab === "log" && (
          <div className="space-y-2">
            {(job.actuals||[]).map((it, i) => (
              <div key={i} className="bg-white rounded-lg border border-slate-200 p-2">
                <div className="flex items-center gap-2">
                  <span className="w-14 h-7 rounded bg-slate-100 text-[10px] font-bold text-slate-500 flex items-center justify-center shrink-0 tnum">
                    {monthLabel(job.startDate, i)}
                  </span>
                  <div className="flex-1 relative">
                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-xs">€</span>
                    <Money value={it.value}
                      onChange={v => upd("actuals", job.actuals.map((x,j) => j === i ? { ...x, value:v } : x))}
                      className="w-full pl-6 pr-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                  </div>
                  <button onClick={() => upd("actuals", job.actuals.filter((_,j) => j !== i))}
                    className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={14} /></button>
                </div>
                <input value={it.comment||""} placeholder="Certificate ref, note..."
                  onChange={e => upd("actuals", job.actuals.map((x,j) => j === i ? { ...x, comment:e.target.value } : x))}
                  className="w-full mt-1 text-[11px] px-2 py-1 rounded bg-slate-50 outline-none focus:bg-white focus:ring-1 focus:ring-slate-200" />
              </div>
            ))}
            {a.nLogged < a.months && (
              <button onClick={addMonth}
                className="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-[11px] font-bold uppercase hover:border-[#006858] hover:text-[#006858] transition">
                + Log {monthLabel(job.startDate, a.nLogged)}
              </button>
            )}
            {a.monthsBehindOnLogs > 0 && (
              <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 font-medium">
                {a.monthsBehindOnLogs} month{a.monthsBehindOnLogs > 1 ? "s" : ""} of spend not yet logged — the forecast is running on stale data.
              </div>
            )}
          </div>
        )}

        {tab === "plan" && (
          <div className="space-y-2">
            <div className="flex items-center justify-between text-[11px] mb-1">
              <span className="text-slate-500">
                {job.planned ? "Custom baseline" : "Auto S-curve (20/60/20) over " + a.months + " months"}
              </span>
              {job.planned && (
                <button onClick={() => upd("planned", null)} className="font-bold text-[#006858] hover:underline">Reset to S-curve</button>
              )}
            </div>
            {(job.planned || a.plan.periodic.map(v => ({ value:v, comment:"" }))).map((it,i) => (
              <div key={i} className="flex items-center gap-2 bg-white rounded-lg border border-slate-200 p-2">
                <span className="w-14 h-7 rounded bg-slate-100 text-[10px] font-bold text-slate-500 flex items-center justify-center shrink-0 tnum">
                  {monthLabel(job.startDate, i)}
                </span>
                <div className="flex-1 relative">
                  <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-xs">€</span>
                  <Money value={it.value}
                    onChange={v => { const n = ensurePlan(); n[i] = { ...n[i], value:v }; upd("planned", n); }}
                    className="w-full pl-6 pr-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === "vo" && <Variations job={job} a={a} save={save} />}

        {tab === "ms" && (
          <div className="space-y-2">
            {(job.milestones||[]).map((m,i) => (
              <div key={i} className="bg-white rounded-lg border border-slate-200 p-2 flex items-center gap-2">
                <select value={m.month} onChange={e => upd("milestones", job.milestones.map((x,j) => j === i ? { ...x, month:Number(e.target.value) } : x))}
                  className="px-2 py-1.5 border border-slate-200 rounded text-[11px] outline-none focus:border-[#006858] bg-white tnum">
                  {Array.from({ length:a.months }, (_,k) => <option key={k} value={k+1}>{monthLabel(job.startDate,k)}</option>)}
                </select>
                <input value={m.label} placeholder="Milestone"
                  onChange={e => upd("milestones", job.milestones.map((x,j) => j === i ? { ...x, label:e.target.value } : x))}
                  className="flex-1 px-2 py-1.5 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
                <button onClick={() => upd("milestones", job.milestones.filter((_,j) => j !== i))}
                  className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={14} /></button>
              </div>
            ))}
            <button onClick={() => upd("milestones", [...(job.milestones||[]), { month: Math.ceil(a.months/2), label:"New milestone" }])}
              className="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-[11px] font-bold uppercase hover:border-[#006858] hover:text-[#006858]">
              + Add milestone
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ==========================================================================
   9. ELEMENT PROGRESS PANEL
   Percent complete per applicable element. This is what drives the headline
   completion figure - budget-weighted, not a guess on a slider.
   ========================================================================== */

function ElementProgress({ job, a, save, compact }) {
  const [onlyLive, setOnlyLive] = useState(true);
  const setPct = (code, v) =>
    save({ ...job, elements: job.elements.map(e => e.code === code ? { ...e, pct: clamp(v,0,100) } : e) });

  const groups = GROUPS.map(g => {
    const items = job.elements.filter(e => e.g === g.g && (!onlyLive || e.on));
    const on = items.filter(e => e.on);
    const w = sum(on.map(e => e.budget)) || on.length;
    const gPct = on.length === 0 ? 0
      : w === on.length ? sum(on.map(e => e.pct||0)) / on.length
      : sum(on.map(e => (e.budget||0)*(e.pct||0))) / w;
    return { ...g, items, on, budget: sum(on.map(e => e.budget)), pct: gPct };
  }).filter(g => g.items.length);

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
        <div>
          <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
            <span className="text-[#006858]"><Ico d={I.layers} size={16} /></span>
            Element completion
          </h3>
          <p className="text-[11px] text-slate-500 mt-0.5">Budget-weighted — this drives the headline % complete</p>
        </div>
        <label className="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 cursor-pointer shrink-0">
          <input type="checkbox" checked={onlyLive} onChange={e => setOnlyLive(e.target.checked)} className="accent-[#006858]" />
          Applicable only
        </label>
      </div>

      <div className={"overflow-y-auto scroll " + (compact ? "max-h-[380px]" : "max-h-[620px]")}>
        {groups.map(g => (
          <div key={g.g} className="border-b border-slate-100 last:border-0">
            <div className="flex items-center gap-2 px-4 py-2 bg-slate-50">
              <span className="w-1.5 h-4 rounded-full" style={{ background:g.colour }} />
              <span className="font-bold text-[11px] text-slate-700 flex-1 truncate">{g.name}</span>
              <span className="text-[10px] text-slate-400 tnum w-16 text-right">{fmtK(g.budget)}</span>
              <div className="w-20 hidden sm:block"><Bar pct={g.pct} colour={g.colour} h={5} /></div>
              <span className="tnum text-[11px] font-bold text-slate-700 w-9 text-right">{g.pct.toFixed(0)}%</span>
            </div>
            {g.items.map(e => (
              <div key={e.code} className={"flex items-center gap-2 px-4 py-1.5 border-t border-slate-50 " + (e.on ? "" : "opacity-40")}>
                <span className="tnum text-[10px] text-slate-400 w-10 shrink-0">{e.code}</span>
                <span className="text-[12px] text-slate-700 flex-1 truncate" title={e.name}>{e.name}</span>
                <span className="tnum text-[11px] text-slate-500 w-16 text-right shrink-0 hidden sm:inline">{fmtK(e.budget)}</span>
                <input type="range" min="0" max="100" step="1" value={e.pct||0} disabled={!e.on}
                  onChange={ev => setPct(e.code, Number(ev.target.value))}
                  className="w-20 sm:w-28 shrink-0 disabled:opacity-40" />
                <input type="number" min="0" max="100" value={e.pct||0} disabled={!e.on}
                  onChange={ev => setPct(e.code, Number(ev.target.value))}
                  className="w-14 px-1.5 py-1 text-[11px] text-right border border-slate-200 rounded tnum outline-none focus:border-[#006858] disabled:bg-slate-50 shrink-0" />
              </div>
            ))}
          </div>
        ))}
      </div>

      <div className="px-4 py-3 bg-[#e6f2f0] border-t border-[#006858]/15 flex items-center gap-3">
        <span className="text-[10px] font-black text-[#006858] uppercase tracking-wider">Rolled-up completion</span>
        <div className="flex-1"><Bar pct={a.rolledPct} colour="#006858" h={7} /></div>
        <span className="tnum text-lg font-extrabold text-[#006858]">{a.rolledPct.toFixed(1)}%</span>
      </div>
    </div>
  );
}


/* ==========================================================================
   9b. VARIATIONS REGISTER
   Original -> approved -> current budget, with anticipated variations tracked
   separately as risk. Approved variations are drawn against contingency, so
   the funding envelope stays put while the budget being measured moves.
   ========================================================================== */

const VO_STATUS = {
  approved:    { label:"Approved",    bg:"bg-emerald-50", text:"text-emerald-700", dot:"#0f9d76" },
  anticipated: { label:"Anticipated", bg:"bg-amber-50",   text:"text-amber-700",   dot:"#d97706" },
  rejected:    { label:"Rejected",    bg:"bg-slate-100",  text:"text-slate-500",   dot:"#94a3b8" },
};

function Variations({ job, a, save }) {
  const vos = job.variations || [];
  const upd = (v) => save({ ...job, variations: v });
  const add = () => upd([...vos, {
    id: uid(), ref: "VO-" + String(vos.length + 1).padStart(3, "0"),
    desc: "", code: "", amount: 0, status: "anticipated",
  }]);
  const set = (i, patch) => upd(vos.map((v, j) => j === i ? { ...v, ...patch } : v));

  const live = (job.elements || []).filter(e => e.on);

  return (
    <div className="space-y-2">
      <div className="grid grid-cols-3 gap-2">
        {[["Original budget", a.original, "#475569"],
          ["Approved variations", a.voApproved, a.voApproved > 0 ? "#0f9d76" : "#475569"],
          ["Current budget", a.BAC, "#006858"]].map(([l, v, c], i) => (
          <div key={i} className="bg-white rounded-lg border border-slate-200 px-2.5 py-2">
            <div className="text-[9px] font-black text-slate-400 uppercase leading-tight">{l}</div>
            <div className="text-sm font-extrabold tnum" style={{ color: c }}>{fmtK(v)}</div>
          </div>
        ))}
      </div>

      <div className={"rounded-lg border px-3 py-2 " +
        (a.contRemaining < 0 ? "bg-red-50 border-red-200" : "bg-slate-50 border-slate-200")}>
        <div className="flex justify-between text-[11px]">
          <span className="text-slate-500">Contingency drawn</span>
          <span className="tnum font-bold text-slate-700">{fmtK(a.contDrawn)} of {fmtK(a.contingency)}</span>
        </div>
        <div className="mt-1.5"><Bar pct={a.contDrawnPct}
          colour={a.contDrawnPct > 100 ? "#dc2626" : a.contDrawnPct > 70 ? "#d97706" : "#0f9d76"} /></div>
        {a.contForecastDraw > a.contDrawn && (
          <div className="text-[10px] text-amber-700 mt-1.5 font-medium leading-relaxed">
            {a.voAnticipated > 0 && <>A further {fmtK(a.voAnticipated)} is anticipated. </>}
            With the forecast overrun on top, the total call on contingency is {fmtK(a.contForecastDraw)} —
            <strong> {drawLabel(a.contForecastPct)}</strong> of the allowance.
          </div>
        )}
      </div>

      {vos.map((v, i) => {
        const st = VO_STATUS[v.status] || VO_STATUS.anticipated;
        return (
          <div key={v.id} className="bg-white rounded-lg border border-slate-200 p-2 space-y-1.5">
            <div className="flex items-center gap-2">
              <input value={v.ref} onChange={e => set(i, { ref: e.target.value })}
                className="w-20 px-1.5 py-1 text-[11px] font-bold border border-slate-200 rounded outline-none focus:border-[#006858] tnum" />
              <div className="flex-1 relative">
                <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-300 text-xs">€</span>
                <Money value={v.amount} onChange={n => set(i, { amount: n })}
                  className="w-full pl-6 pr-2 py-1 text-sm border border-slate-200 rounded outline-none focus:border-[#006858]" />
              </div>
              <button onClick={() => upd(vos.filter((_, j) => j !== i))}
                className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={14} /></button>
            </div>
            <input value={v.desc} placeholder="Description of the change..."
              onChange={e => set(i, { desc: e.target.value })}
              className="w-full text-[11px] px-2 py-1 rounded bg-slate-50 outline-none focus:bg-white focus:ring-1 focus:ring-slate-200" />
            <div className="flex items-center gap-1.5">
              <select value={v.status} onChange={e => set(i, { status: e.target.value })}
                className={"px-1.5 py-1 rounded text-[10px] font-bold border-0 outline-none " + st.bg + " " + st.text}>
                {Object.entries(VO_STATUS).map(([k, s]) => <option key={k} value={k}>{s.label}</option>)}
              </select>
              <select value={v.code} onChange={e => set(i, { code: e.target.value })}
                className="flex-1 px-1.5 py-1 rounded text-[10px] border border-slate-200 outline-none focus:border-[#006858] bg-white text-slate-600">
                <option value="">Not allocated to an element</option>
                {live.map(e => <option key={e.code} value={e.code}>{e.code} · {e.name}</option>)}
              </select>
              {v.status === "approved" && (
                <div className="flex items-center gap-1 shrink-0" title="How much of this variation has actually been carried out">
                  <input type="number" min="0" max="100" value={v.pct || 0}
                    onChange={e => set(i, { pct: clamp(Number(e.target.value), 0, 100) })}
                    className="w-12 px-1 py-1 text-[10px] text-right border border-slate-200 rounded tnum outline-none focus:border-[#006858]" />
                  <span className="text-[10px] text-slate-400">% done</span>
                </div>
              )}
            </div>
          </div>
        );
      })}

      <button onClick={add}
        className="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-lg text-slate-400 text-[11px] font-bold uppercase hover:border-[#006858] hover:text-[#006858] transition">
        + Add variation
      </button>
      {!vos.length && (
        <p className="text-[10px] text-slate-400 text-center leading-relaxed px-2">
          With no variations logged, every euro over the original budget reads as an overrun.
          Log approved changes here and they stop counting against you.
        </p>
      )}
    </div>
  );
}

/* ==========================================================================
   9c. WHAT-IF PANEL
   ========================================================================== */

function WhatIf({ job, a, save }) {
  const [sc, setSc] = useState(BLANK_SCENARIO);
  const [showDescope, setShowDescope] = useState(false);
  const r = useMemo(() => runScenario(job, a, sc), [job, a, sc]);
  const set = (k, v) => setSc(p => ({ ...p, [k]: v }));
  const saved = job.scenarios || [];

  const live = (job.elements || []).filter(e => e.on);
  const toggleDrop = (code) => setSc(p => ({
    ...p, descope: p.descope.includes(code) ? p.descope.filter(c => c !== code) : [...p.descope, code],
  }));

  const store = () => {
    const name = window.prompt("Name this scenario", sc.name || "Scenario");
    if (!name) return;
    save({ ...job, scenarios: [...saved.filter(s => s.name !== name), { ...sc, name, id: uid() }] });
  };

  const Row = ({ label, base, now, fmt = fmtK, good }) => {
    const moved = Math.abs((now ?? 0) - (base ?? 0)) > 0.5;
    return (
      <div className="flex items-center gap-2 py-1.5 border-b border-slate-100 last:border-0">
        <span className="text-[11px] text-slate-500 flex-1">{label}</span>
        <span className="tnum text-[11px] text-slate-400 w-20 text-right">{fmt(base)}</span>
        <span className="text-slate-300 text-[10px]">→</span>
        <span className={"tnum text-[12px] font-bold w-24 text-right " +
          (!moved ? "text-slate-600" : good(now) ? "text-emerald-600" : "text-red-600")}>{fmt(now)}</span>
      </div>
    );
  };

  const slider = (key, label, min, max, step, suffix, hint) => (
    <div>
      <div className="flex justify-between items-baseline">
        <label className="text-[10px] font-bold text-slate-500 uppercase">{label}</label>
        <span className="tnum text-[12px] font-extrabold text-[#006858]">{sc[key]}{suffix}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={sc[key]}
        onChange={e => set(key, Number(e.target.value))} className="w-full" />
      <div className="text-[10px] text-slate-400 leading-tight">{hint}</div>
    </div>
  );

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
        <div>
          <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
            <span className="text-[#006858]"><Ico d={I.target} size={16} /></span> What-if
          </h3>
          <p className="text-[11px] text-slate-500 mt-0.5">Move the levers; the forecast, margin and breakeven follow</p>
        </div>
        <div className="flex gap-1.5 shrink-0">
          <button onClick={() => setSc(BLANK_SCENARIO)}
            className="px-2.5 py-1.5 rounded-lg border border-slate-200 text-[10px] font-bold text-slate-500 hover:text-slate-800">Reset</button>
          <button onClick={store}
            className="px-2.5 py-1.5 rounded-lg bg-[#006858] text-white text-[10px] font-bold hover:bg-[#00806c]">Save</button>
        </div>
      </div>

      <div className="p-4 grid md:grid-cols-2 gap-5">
        <div className="space-y-4">
          {slider("slipMonths", "Programme slip", 0, 12, 1, " mo",
            "Draws prelims down at " + fmtK(a.months ? ((job.elements.find(e => e.code === "P1" && e.on) || {}).budget || 0) / a.months : 0) + "/month")}
          {slider("inflationPct", "Inflation on remaining work", 0, 15, 0.5, "%",
            "Applies to " + fmtK(Math.max(0, a.BAC - a.EV)) + " of work still to do")}
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Claim / variation lands</label>
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">€</span>
              <Money value={sc.claim} onChange={v => set("claim", v)}
                className="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#006858]" />
            </div>
            {a.voAnticipated > 0 && (
              <button onClick={() => set("claim", a.voAnticipated)}
                className="text-[10px] font-bold text-[#006858] hover:underline mt-1">
                Use anticipated variations ({fmtK(a.voAnticipated)})
              </button>
            )}
          </div>
          <div>
            <button onClick={() => setShowDescope(!showDescope)}
              className="text-[10px] font-bold text-slate-500 uppercase flex items-center gap-1 hover:text-[#006858]">
              <Ico d={I.chev} size={12} className={showDescope ? "" : "-rotate-90"} />
              Descope {sc.descope.length > 0 && <span className="text-[#006858]">({sc.descope.length} — saves {fmtK(r.descopeSaving)})</span>}
            </button>
            {showDescope && (
              <div className="mt-2 max-h-40 overflow-y-auto scroll border border-slate-200 rounded-lg">
                {live.map(e => (
                  <label key={e.code} className="flex items-center gap-2 px-2 py-1 hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-0">
                    <input type="checkbox" checked={sc.descope.includes(e.code)}
                      onChange={() => toggleDrop(e.code)} className="accent-[#006858]" />
                    <span className="tnum text-[10px] text-slate-400 w-8">{e.code}</span>
                    <span className="text-[11px] text-slate-700 flex-1 truncate">{e.name}</span>
                    <span className="tnum text-[10px] text-slate-500">{fmtK((e.budget||0)*(1-(e.pct||0)/100))}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
        </div>

        <div>
          <div className={"rounded-lg px-3 py-2 mb-2 text-[11px] font-bold " +
            (r.fits ? "bg-emerald-50 text-emerald-800" : "bg-red-50 text-red-800")}>
            {r.fits
              ? "Still inside authorised funding, with " + fmtK(r.marginEur) + " to spare"
              : "Breaches authorised funding by " + fmtK(-r.marginEur)}
          </div>
          <div className="flex items-center gap-2 pb-1.5 border-b border-slate-200 text-[9px] font-black text-slate-400 uppercase">
            <span className="flex-1"></span><span className="w-20 text-right">Base</span>
            <span className="w-3"></span><span className="w-24 text-right">Scenario</span>
          </div>
          <Row label="Out-turn, today's money" base={a.outturn} now={r.outturn} good={v => v <= a.outturn} />
          <Row label="Margin of safety" base={a.marginEur} now={r.marginEur} good={v => v >= 0} />
          <Row label="Breakeven point" base={a.breakevenPct} now={r.breakevenPct}
               fmt={v => v == null ? "—" : v >= 100 ? "Clears" : pc(v, 0)} good={v => v >= 100} />
          <Row label="Implied CPI, existing scope" base={a.BAC / (a.outturn || 1)} now={r.impliedCPI}
               fmt={v => v == null ? "—" : v.toFixed(2)} good={v => v >= 1} />
          <Row label="Contingency draw" base={a.contForecastPct} now={r.contForecastPct}
               fmt={drawLabel} good={v => v <= 100} />
          <Row label="Forecast finish" base={a.projMonths} now={r.projMonths}
               fmt={v => monthLabel(job.startDate, Math.max(0, Math.round(v) - 1))} good={v => v <= a.projMonths} />

          {r.delta !== 0 && (
            <div className="mt-2 text-[10px] text-slate-500 leading-relaxed">
              {[r.slipCost > 0 && "prelims on slip " + fmtK(r.slipCost),
                r.escalationOnSlip > 0 && "escalation on slip " + fmtK(r.escalationOnSlip),
                r.inflationCost > 0 && "extra inflation " + fmtK(r.inflationCost),
                r.claim > 0 && "claim " + fmtK(r.claim),
                r.descopeSaving > 0 && "descope −" + fmtK(r.descopeSaving)].filter(Boolean).join("  ·  ")}
            </div>
          )}

          {a.escPct > 0 && (
            <div className="mt-2 pt-2 border-t border-slate-100 text-[10px] text-slate-500 leading-relaxed">
              Figures above are in <strong>today's money</strong>. Adding construction inflation at{" "}
              <strong className="tnum">{a.escPct}%</strong>/yr over the{" "}
              {Math.max(0, Math.round(r.projMonths - a.nLogged))} months still to run puts the out-turn at{" "}
              <strong className="tnum text-slate-700">
                {fmtK(r.outturn + a.remainingWork * (a.escPct/100) * (Math.max(0, r.projMonths - a.nLogged)/12))}
              </strong> at out-turn prices.
            </div>
          )}

          {!!saved.length && (
            <div className="mt-3 pt-3 border-t border-slate-100">
              <div className="text-[9px] font-black text-slate-400 uppercase mb-1.5">Saved scenarios</div>
              <div className="space-y-1">
                {saved.map(s => {
                  const rs = runScenario(job, a, s);
                  return (
                    <div key={s.id || s.name} className="flex items-center gap-2 text-[11px]">
                      <button onClick={() => setSc(s)} className="flex-1 text-left font-bold text-slate-700 hover:text-[#006858] truncate">{s.name}</button>
                      <span className="tnum text-slate-500">{fmtK(rs.outturn)}</span>
                      <span className={"tnum font-bold w-16 text-right " + (rs.fits ? "text-emerald-600" : "text-red-600")}>{fmtK(rs.marginEur)}</span>
                      <button onClick={() => save({ ...job, scenarios: saved.filter(x => x !== s) })}
                        className="text-slate-300 hover:text-red-500"><Ico d={I.trash} size={12} /></button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================
   9d. PROGRAMME (GANTT)
   Ported from HSE Capital Suite. Secondary view - the cost trend stays the
   main function. Drag to move, edges to resize, delay control pushes a task
   and everything downstream of it.
   ========================================================================== */

function Programme({ job, save, a }) {
  const tasks = job.tasks || [];
  const setTasks = (t) => save({ ...job, tasks: t });
  const prog = useMemo(() => resolveProgramme(tasks), [tasks]);
  const [selected, setSelected] = useState(null);
  const [showCritical, setShowCritical] = useState(true);
  const [showBaseline, setShowBaseline] = useState(false);
  const [delayWeeks, setDelayWeeks] = useState(4);
  const [dragging, setDragging] = useState(null);
  const [tierChoice, setTierChoice] = useState("auto");   // date banding
  const [fitWidth, setFitWidth] = useState(true);         // span the pane
  const [showDates, setShowDates] = useState(true);
  const paneRef = useRef(null);
  const [paneW, setPaneW] = useState(0);

  // Track the visible width so "fit" can scale the timeline to it.
  useEffect(() => {
    const el = paneRef.current;
    if (!el || !window.ResizeObserver) return;
    const ro = new ResizeObserver(() => setPaneW(el.clientWidth));
    ro.observe(el);
    setPaneW(el.clientWidth);
    return () => ro.disconnect();
  }, [tasks.length]);

  if (!tasks.length) {
    return (
      <div className="bg-white rounded-xl border border-slate-200 p-10 text-center">
        <p className="text-sm text-slate-500 mb-1">No programme on this job yet.</p>
        <p className="text-[11px] text-slate-400 mb-4 max-w-md mx-auto">
          A starting programme can be built from the element groups you have ticked, spread across
          the job window and chained. Drag it into shape from there.
        </p>
        <button onClick={() => setTasks(generateProgramme(job))}
          className="px-4 py-2 rounded-lg bg-[#006858] text-white text-xs font-bold hover:bg-[#00806c]">
          Build programme from elements
        </button>
      </div>
    );
  }

  const all = prog.tasks;
  const t0 = Math.min(...all.map(t => Math.min(t.s, t.bs))) - 14*MS;
  const t1 = Math.max(...all.map(t => Math.max(t.e, t.be))) + 14*MS;

  // With "fit width" on (the default) the programme always spans the pane at
  // every scale - the scale only chooses how the dates are banded, so Year,
  // Quarter, Month, Week and Day all fill the screen and differ in detail, not
  // in size. Turn fit off to see a scale at its natural density and scroll.
  const nameW = showDates ? 460 : 300;
  const days = (t1 - t0)/MS;
  const avail = Math.max(240, (paneW || 900) - nameW - 24);
  const fitPx = Math.max(0.05, avail / days);
  const pxPerDay = fitWidth ? fitPx : ZOOM_PX[tierChoice === "auto" ? "month" : tierChoice];

  const width = Math.max(320, days * pxPerDay);
  const x = (ms) => ((ms - t0)/MS) * pxPerDay;
  const monthBands = buildMonths(t0, t1);
  const yearBands = [];
  monthBands.forEach(m => {
    const y = new Date(m.start).getUTCFullYear();
    const last = yearBands[yearBands.length-1];
    if (last && last.year === y) last.end = m.end; else yearBands.push({ year:y, start:m.start, end:m.end });
  });

  const quarterBands = [];
  monthBands.forEach(m => {
    const d = new Date(m.start);
    const q = Math.floor(d.getUTCMonth()/3) + 1, y = d.getUTCFullYear();
    const last = quarterBands[quarterBands.length-1];
    if (last && last.q === q && last.y === y) last.end = m.end;
    else quarterBands.push({ key:y + "Q" + q, q, y, label:"Q" + q, start:m.start, end:m.end });
  });

  // Auto keeps the finest banding that is still legible at the current scale.
  const autoTier = pxPerDay >= 2.6 ? "month" : pxPerDay >= 0.9 ? "quarter" : "year";
  const tier = tierChoice === "auto" ? autoTier : tierChoice;

  const stepBands = (stepDays, fmt) => {
    const out = [];
    // Anchor weeks to Monday so the columns line up with a working week.
    let s = t0;
    if (stepDays === 7) { const d = new Date(s); s -= ((d.getUTCDay() + 6) % 7) * MS; }
    for (let ms = s, i = 0; ms <= t1 && i < 1200; ms += stepDays*MS, i++) {
      out.push({ key:"s"+ms, start:ms, end:Math.min(t1, ms + (stepDays-1)*MS), label:fmt(ms) });
    }
    return out;
  };

  const bands =
      tier === "quarter" ? quarterBands
    : tier === "month"   ? monthBands
    : tier === "week"    ? stepBands(7, (ms) => new Date(ms).getUTCDate() + "/" + (new Date(ms).getUTCMonth()+1))
    : tier === "day"     ? stepBands(1, (ms) => String(new Date(ms).getUTCDate()))
    : [];                                        // year: the top tier carries it

  const groups = [...new Set(all.map(t => t.group))].sort();
  const rows = [];
  groups.forEach(g => {
    const inG = all.filter(t => t.group === g);
    rows.push({ type:"group", group:g });
    inG.filter(t => t.parentId == null).forEach(t => {
      rows.push({ type:"task", task:t, depth:0 });
      all.filter(c => c.parentId === t.id).forEach(c => rows.push({ type:"task", task:c, depth:1 }));
    });
  });

  const ROW = 34;
  const rowY = new Map();
  let yy = 0;
  rows.forEach(r => { if (r.type === "task") rowY.set(r.task.id, yy + ROW/2); yy += ROW; });

  const startDrag = (e, task, mode) => {
    if (task.isSummary) return;
    e.preventDefault(); e.stopPropagation();
    setSelected(task.id);
    const x0 = e.clientX, s0 = task.s, e0 = task.e;
    setDragging(task.id);
    const move = (ev) => {
      const dd = Math.round((ev.clientX - x0) / pxPerDay);
      setTasks((job.tasks || []).map(t => {
        if (t.id !== task.id) return t;
        if (mode === "move") return { ...t, start:isoMs(s0 + dd*MS), end:isoMs(e0 + dd*MS) };
        if (mode === "l")    return { ...t, start:isoMs(Math.min(s0 + dd*MS, e0)) };
        return { ...t, end:isoMs(Math.max(e0 + dd*MS, s0)) };
      }));
    };
    const up = () => { setDragging(null); window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  };

  const arrows = [];
  prog.leaves.forEach(t => (t.dependencies || []).forEach(d => {
    const from = prog.byId.get(d);
    if (!from || rowY.get(d) == null || rowY.get(t.id) == null) return;
    const x1 = x(from.e + MS), y1 = rowY.get(d), x2 = x(t.s), y2 = rowY.get(t.id);
    // The last segment always runs left to right so the arrowhead points right.
    let path;
    if (x2 - x1 >= 18) path = "M" + x1 + " " + y1 + " H" + (x2-10) + " V" + y2 + " H" + x2;
    else {
      const lane = y2 + (y2 > y1 ? -ROW/2 : ROW/2);
      path = "M" + x1 + " " + y1 + " H" + (x1+10) + " V" + lane + " H" + (x2-16) + " V" + y2 + " H" + x2;
    }
    arrows.push({ key:d + "-" + t.id, d:path, critical: from.isCritical && t.isCritical });
  }));

  const dataDate = D(todayISO());
  const progFinish = prog.projectFinish;
  const costFinishMs = D(addMonthsISO(job.startDate, Math.max(0, Math.round(a.projMonths) - 1)));
  const gapMonths = Math.round((progFinish - costFinishMs) / MS / 30.4);

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Kpi label="Programme finish" value={fmtDay(progFinish)} accent="#0ea5e9"
             sub={prog.leaves.filter(t => t.isCritical).length + " tasks on the critical path"} />
        <Kpi label="Cost-trend finish" value={fmtDay(costFinishMs)} accent="#f59e0b"
             sub={"From SPI " + (a.SPI == null ? "—" : a.SPI.toFixed(2))}
             hint="What the cost model expects, derived from progress against the planned spend curve." />
        <Kpi label="Programme vs trend"
             value={(gapMonths > 0 ? "+" : "") + gapMonths + " mo"}
             tone={Math.abs(gapMonths) <= 1 ? "good" : "warn"}
             sub={Math.abs(gapMonths) <= 1 ? "The two agree" : "The two disagree — one is stale"}
             hint="If the drawn programme and the cost trend disagree by more than a month, either the programme has not been updated or progress is not being reported honestly." />
        <Kpi label="Contract completion" value={monthLabel(job.startDate, a.months - 1)} accent="#006858"
             sub={a.months + " month programme"} />
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col" style={{ height:560 }}>
        <div className="flex items-center gap-2 px-3 py-2 border-b border-slate-200 flex-wrap shrink-0">
          <button onClick={() => setShowCritical(!showCritical)}
            className={"px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition " + (showCritical
              ? "bg-red-50 border-red-200 text-red-700" : "bg-white border-slate-200 text-slate-500 hover:border-slate-300")}>
            Critical path
          </button>
          <button onClick={() => setShowBaseline(!showBaseline)}
            className={"px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition " + (showBaseline
              ? "bg-slate-100 border-slate-300 text-slate-700" : "bg-white border-slate-200 text-slate-500 hover:border-slate-300")}>
            Baseline
          </button>
          <div className="h-5 w-px bg-slate-200 mx-1" />
          <div className={"flex items-center rounded-lg border overflow-hidden " + (selected
            ? "bg-amber-50 border-amber-200" : "bg-slate-50 border-slate-200 opacity-50")}>
            <span className="pl-2.5 pr-1 text-[11px] font-bold text-amber-800">Delay</span>
            <input type="number" min="1" max="52" value={delayWeeks} disabled={!selected}
              onChange={e => setDelayWeeks(clamp(Number(e.target.value) || 1, 1, 52))}
              className="w-11 text-[11px] font-bold tnum text-center bg-white/70 border-x border-amber-200 py-1 outline-none" />
            <span className="px-1.5 text-[11px] font-bold text-amber-800">wks</span>
            <button onClick={() => selected && setTasks(disrupt(job.tasks, selected, delayWeeks * 7))}
              disabled={!selected}
              title={selected ? "Push this task and everything downstream out by " + delayWeeks + " weeks" : "Select a task first"}
              className="px-2.5 py-1 text-[11px] font-bold bg-amber-500 text-white hover:bg-amber-600 disabled:bg-slate-300">
              Apply
            </button>
          </div>
          <button onClick={() => setTasks(job.tasks.map(t => ({ ...t, bStart:t.start, bEnd:t.end })))}
            className="px-2.5 py-1.5 text-[11px] font-bold rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-[#006858] hover:text-[#006858]">
            Re-baseline
          </button>
          <button onClick={() => { if (window.confirm("Rebuild the programme from the elements? Any changes you have dragged are lost.")) setTasks(generateProgramme(job)); }}
            className="px-2.5 py-1.5 text-[11px] font-bold rounded-lg bg-white border border-slate-200 text-slate-500 hover:border-red-300 hover:text-red-600">
            Rebuild
          </button>
          <button onClick={() => setShowDates(!showDates)}
            className={"px-2.5 py-1.5 text-[11px] font-bold rounded-lg border transition " + (showDates
              ? "bg-slate-100 border-slate-300 text-slate-700" : "bg-white border-slate-200 text-slate-500 hover:border-slate-300")}>
            Dates
          </button>
          <div className="ml-auto flex items-center gap-2 flex-wrap">
            <label className="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 cursor-pointer"
                   title="Span the pane at every scale; turn off to see natural density and scroll">
              <input type="checkbox" checked={fitWidth} onChange={e => setFitWidth(e.target.checked)}
                     className="accent-[#006858]" />
              Fit width
            </label>
            <div className="flex rounded-lg border border-slate-200 bg-slate-100 p-0.5">
              {TIERS.map(([id,label]) => (
                <button key={id} onClick={() => setTierChoice(id)}
                  className={"px-2 py-1 rounded-md text-[10px] font-bold transition " +
                    (tierChoice === id ? "bg-white text-[#006858] shadow-sm" : "text-slate-500 hover:text-slate-700")}>
                  {label}
                  {id === "auto" && tierChoice === "auto" &&
                    <span className="opacity-50"> · {autoTier === "month" ? "M" : autoTier === "quarter" ? "Q" : "Y"}</span>}
                </button>
              ))}
            </div>
          </div>
        </div>

        <div ref={paneRef} className="flex-1 overflow-auto min-h-0 no-sel bg-white scroll">
          <div className={"flex " + (fitWidth ? "" : "min-w-max")}>
            <div className="sticky left-0 z-40 bg-white shrink-0 border-r border-slate-200" style={{ width:nameW }}>
              <div className="h-10 bg-slate-50 border-b border-slate-200 sticky top-0 z-10 flex items-center px-3 gap-2">
                <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 flex-1">Task</span>
                {showDates && <>
                  <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 w-[62px]">Start</span>
                  <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 w-[62px]">Finish</span>
                  <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 w-9 text-right">Dur</span>
                </>}
                <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 w-8 text-right">%</span>
              </div>
              {rows.map((r, i) => r.type === "group" ? (
                <div key={"g"+i} style={{ height:ROW }} className="group-header-row flex items-center px-3">
                  <span className="text-[11px] font-black uppercase tracking-wide text-slate-600 truncate">{r.group}</span>
                </div>
              ) : (
                <div key={r.task.id} onClick={() => setSelected(r.task.id)} style={{ height:ROW }}
                  className={"flex items-center gap-2 px-3 border-b border-slate-100 cursor-pointer " +
                    (selected === r.task.id ? "bg-emerald-50" : "bg-white hover:bg-slate-50")}>
                  <span className="truncate text-[11px] font-medium text-slate-700 flex-1" style={{ paddingLeft:r.depth*14 }}>
                    {r.task.milestone && "◆ "}{r.task.name}
                  </span>
                  {r.task.isCritical && !r.task.isSummary && showCritical && (
                    <span className="text-[9px] font-black text-red-600 shrink-0">CP</span>
                  )}
                  {showDates && <>
                    <span className="text-[10px] text-slate-500 tnum w-[62px] shrink-0">{fmtDay(r.task.s)}</span>
                    <span className="text-[10px] text-slate-500 tnum w-[62px] shrink-0">
                      {r.task.milestone ? "—" : fmtDay(r.task.e)}
                    </span>
                    <span className="text-[10px] text-slate-500 tnum w-9 text-right shrink-0">
                      {r.task.milestone ? "—" : Math.round((r.task.e - r.task.s)/MS + 1) + "d"}
                    </span>
                  </>}
                  <span className="text-[11px] font-bold text-slate-500 tnum w-8 text-right shrink-0">{r.task.progress}%</span>
                </div>
              ))}
            </div>

            <div className="relative" style={{ width }}>
              <div className="h-10 bg-slate-50 border-b border-slate-200 sticky top-0 z-10 flex flex-col">
                <div className="flex h-[18px] border-b border-slate-200">
                  {yearBands.map(yb => (
                    <div key={yb.year} style={{ width:((yb.end-yb.start)/MS + 1)*pxPerDay }}
                      className="border-r border-slate-300 flex items-center justify-center overflow-hidden bg-slate-100">
                      <span className="text-[10px] font-black text-slate-600 truncate px-1">{yb.year}</span>
                    </div>
                  ))}
                </div>
                <div className="flex flex-1">
                  {bands.map(bd => {
                    const w = ((bd.end - bd.start)/MS + 1) * pxPerDay;
                    return (
                      <div key={bd.key} style={{ width:w }}
                        className="border-r border-slate-200 flex items-center justify-center overflow-hidden">
                        {/* Drop the text rather than the column when a band is
                            too narrow to read - the gridline still helps. */}
                        {w >= 13 && <span className="text-[9px] font-bold text-slate-400 truncate px-0.5">{bd.label}</span>}
                      </div>
                    );
                  })}
                  {!bands.length && <div className="flex-1" />}
                </div>
              </div>

              <div className="absolute top-10 left-0 right-0 bottom-0 pointer-events-none">
                {(bands.length ? bands : yearBands.map((y,i) => ({ key:"y"+i, start:y.start, end:y.end })))
                  .filter((_, i, arr) => arr.length <= 220 || i % Math.ceil(arr.length/220) === 0)
                  .map(m => (
                    <div key={m.key} className="absolute top-0 bottom-0 border-r border-slate-100"
                      style={{ left:x(m.start), width:((m.end-m.start)/MS + 1)*pxPerDay }} />
                  ))}
              </div>

              <div className="absolute top-10 bottom-0 w-px bg-red-500 z-30 pointer-events-none" style={{ left:x(dataDate) }}>
                <div className="absolute top-0 -translate-x-1/2 text-[9px] font-black text-red-600 bg-white px-1 rounded shadow-sm">TODAY</div>
              </div>

              <svg className="absolute left-0 pointer-events-none z-30" style={{ top:40, width, height:yy }}>
                <defs>
                  <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 z" fill="#64748b" /></marker>
                  <marker id="ahc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 z" fill="#ef4444" /></marker>
                </defs>
                {arrows.map(ar => <path key={ar.key+"-h"} d={ar.d} className="dep-line-halo" />)}
                {arrows.map(ar => (
                  <path key={ar.key} d={ar.d} markerEnd={ar.critical && showCritical ? "url(#ahc)" : "url(#ah)"}
                    className={"dep-line " + (ar.critical && showCritical ? "critical" : "")} />
                ))}
              </svg>

              <div className="relative z-20">
                {rows.map((r, i) => {
                  if (r.type === "group") return <div key={"gb"+i} style={{ height:ROW }} className="group-header-row" />;
                  const t = r.task;
                  const w = Math.max(4, ((t.e - t.s)/MS + 1) * pxPerDay);
                  const crit = t.isCritical && showCritical && !t.isSummary;
                  const slip = (t.s !== t.bs || t.e !== t.be) && showBaseline;
                  return (
                    <div key={t.id} onClick={() => setSelected(t.id)} style={{ height:ROW }}
                      className={"relative border-b border-slate-100 " + (selected === t.id ? "bg-emerald-50/50" : "")}>
                      {slip && (
                        <div className="absolute h-1.5 rounded bg-slate-300" title={"Baseline " + fmtDay(t.bs) + " – " + fmtDay(t.be)}
                          style={{ left:x(t.bs), width:Math.max(4, ((t.be-t.bs)/MS + 1)*pxPerDay), bottom:4 }} />
                      )}
                      {t.milestone ? (
                        <div onMouseDown={e => startDrag(e, t, "move")}
                          className={"absolute gantt-bar " + (crit ? "critical-ring" : "")}
                          style={{ left:x(t.s)-8, top:ROW/2-8, width:16, height:16,
                                   background:t.colour, transform:"rotate(45deg)", borderRadius:3 }}
                          title={t.name + " — " + fmtDay(t.s)} />
                      ) : (
                        <div onMouseDown={e => startDrag(e, t, "move")}
                          className={"absolute rounded-md shadow-sm group gantt-bar " +
                            (dragging === t.id ? "dragging " : "") + (crit ? "critical-ring" : "")}
                          style={{ left:x(t.s), width:w, top:slip ? 5 : 8, height:slip ? 15 : 18, background:t.colour }}
                          title={t.name + "\n" + fmtDay(t.s) + " – " + fmtDay(t.e) + "\n" + t.progress + "% · slack " + t.slack + "d"}>
                          <div className="absolute inset-y-0 left-0 bg-black/25 rounded-l-md" style={{ width:t.progress + "%" }} />
                          <div onMouseDown={e => startDrag(e, t, "l")}
                            className="resize-handle absolute inset-y-0 left-0 w-1.5 bg-white/50 rounded-l-md opacity-0 group-hover:opacity-100" />
                          <div onMouseDown={e => startDrag(e, t, "r")}
                            className="resize-handle absolute inset-y-0 right-0 w-1.5 bg-white/50 rounded-r-md opacity-0 group-hover:opacity-100" />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      </div>

      {selected && prog.byId.get(selected) && (() => {
        const t = prog.byId.get(selected);
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center gap-4">
            <div className="flex-1 min-w-0">
              <input value={t.name}
                onChange={e => setTasks(job.tasks.map(x => x.id === t.id ? { ...x, name:e.target.value } : x))}
                className="w-full font-bold text-slate-800 outline-none border-b border-transparent focus:border-[#006858] pb-0.5" />
              <div className="flex flex-wrap items-center gap-2 mt-2">
                <label className="text-[10px] font-bold text-slate-500 uppercase">Start</label>
                <input type="date" value={isoMs(t.s)} disabled={t.isSummary}
                  onChange={e => { if (!e.target.value) return;
                    setTasks(job.tasks.map(x => {
                      if (x.id !== t.id) return x;
                      const ns = D(e.target.value);
                      // Dragging the start past the finish would invert the bar;
                      // carry the finish along instead so duration is preserved.
                      return { ...x, start:e.target.value, end: ns > D(x.end) ? isoMs(ns + (t.e - t.s)) : x.end };
                    })); }}
                  className="px-2 py-1 border border-slate-200 rounded text-[11px] tnum outline-none focus:border-[#006858] disabled:bg-slate-50" />
                <label className="text-[10px] font-bold text-slate-500 uppercase">
                  {t.milestone ? "Date" : "Finish"}
                </label>
                <input type="date" value={isoMs(t.e)} disabled={t.isSummary || t.milestone}
                  onChange={e => { if (!e.target.value) return;
                    setTasks(job.tasks.map(x => x.id === t.id
                      ? { ...x, end: D(e.target.value) < D(x.start) ? x.start : e.target.value } : x)); }}
                  className="px-2 py-1 border border-slate-200 rounded text-[11px] tnum outline-none focus:border-[#006858] disabled:bg-slate-50" />
                {!t.milestone && (
                  <span className="text-[10px] text-slate-400 tnum">
                    {Math.round((t.e - t.s)/MS + 1)} days
                  </span>
                )}
                <span className="text-[10px] text-slate-400 tnum">
                  slack {t.slack}d {t.isCritical && <span className="text-red-600 font-bold">· critical</span>}
                </span>
              </div>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              <label className="text-[10px] font-bold text-slate-500 uppercase">Progress</label>
              <input type="range" min="0" max="100" value={t.progress} disabled={t.isSummary}
                onChange={e => setTasks(job.tasks.map(x => x.id === t.id ? { ...x, progress:Number(e.target.value) } : x))}
                className="w-32" />
              <span className="tnum font-bold text-slate-700 w-10 text-right">{t.progress}%</span>
              <button onClick={() => { setTasks(job.tasks.filter(x => x.id !== t.id)); setSelected(null); }}
                className="p-1.5 text-slate-300 hover:text-red-500"><Ico d={I.trash} size={15} /></button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}
/* ==========================================================================
   10. JOB VIEW
