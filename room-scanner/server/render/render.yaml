services:
  - type: web
    name: room-scanner-assist
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DETECTION_ONLY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: "*"
