<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE Aspergillus Control Measures</title>
<link rel="icon" href="https://assets.hse.ie/static/hse-frontend/assets/favicons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --pine:#113A33; --pine-2:#1A4F44; --pine-3:#26685A;
  --canvas:#DCE6E0; --paper:#EDF3EF; --paper-2:#F5F8F6; --line:#B9CCC2;
  --ink:#12302A; --muted:#48635A;
  --fern:#2F8A5B; --fern-deep:#1F6B45; --mint:#C6E6D2;
  --apricot:#F7C58F; --amber:#EA9440; --ember:#C4541F; --peach:#FBE3C8;
  --harbour:#2F6F93; --harbour-tint:#D3E4EE;
  --h0:#D3EDDB; --h1:#86C9A1; --h2:#F2B45F; --h3:#C4541F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
svg{flex-shrink:0}

/* Top bar */
.topbar{background:var(--pine);color:#E8F2EC;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar-in{max-width:1320px;margin:0 auto;padding:.65rem 1.25rem;display:flex;align-items:center;gap:1rem}
.logo-pill{background:var(--paper-2);border-radius:999px;padding:.3rem .85rem;display:flex;align-items:center}
.logo-pill img{height:30px;display:block}
.brand{display:flex;flex-direction:column;line-height:1.15;border:0;background:none;text-align:left;padding:0}
.brand strong{font-size:1.05rem}
.brand span{font-size:.875rem;color:#A9CDBB}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;padding:.6rem 1.15rem;font-weight:700;font-size:.95rem;min-height:44px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn-apricot{background:var(--apricot);color:var(--pine)}
.btn-apricot:hover{background:#F9D3A8}
.btn-ghost{background:rgba(255,255,255,.07);color:#E8F2EC;box-shadow:inset 0 0 0 1.5px rgba(232,242,236,.3)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-pine{background:var(--pine);color:#F1F7F3}
.btn-pine:hover{background:var(--pine-3)}
.btn-pine:disabled{opacity:.6}
.btn-soft{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-soft:hover{background:#fff}
.btn-icon{padding:.55rem;min-width:44px}
.banner{background:var(--peach);color:#6A2E10;padding:.7rem 1.25rem;text-align:center;font-weight:700;font-size:.95rem}

/* Hero */
.hero{background:var(--pine);color:#E8F2EC;padding:3.25rem 1.25rem 3.75rem}
.hero-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:3.5rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1.03;letter-spacing:-.02em;margin-bottom:1.1rem;max-width:14ch}
.lede{font-size:1.2rem;color:#BFD9CB;max-width:36ch;margin:0 0 1.75rem}
.start-step{display:flex;gap:.9rem;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1.75rem;max-width:44ch}
.start-step p{margin:0;color:#D9EAE0}
.start-step strong{color:#fff}
.start-dot{flex-shrink:0;width:14px;height:14px;border-radius:50%;background:var(--apricot);margin-top:.35rem;box-shadow:0 0 0 5px rgba(247,197,143,.2)}
.hero-actions{display:flex;flex-wrap:wrap;gap:.75rem}
.hm-card{background:var(--pine-2);border-radius:24px;padding:1.5rem 1.5rem 1.25rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.hm-card h2{font-size:1.35rem;color:#fff}
.hm-card-head{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;flex-wrap:wrap;margin-bottom:1.1rem}
.hm-card-head p{margin:0;color:#A9CDBB;font-size:.95rem;max-width:40ch}
.hm-note{margin:.9rem 0 0;color:#CFE3D8;font-size:.95rem}
.hm-note strong{color:var(--apricot)}

/* Heat map */
.hm{display:grid;grid-template-columns:minmax(92px,1.3fr) repeat(5,minmax(0,1fr));gap:7px}
.hm-corner{display:flex;flex-direction:column;justify-content:flex-end;font-size:.85rem;padding:0 .3rem .5rem 0}
.hm-col,.hm-row{border:0;background:none;padding:0;border-radius:10px}
.hm-col{text-align:center;padding:.2rem .15rem .55rem;display:flex;flex-direction:column;justify-content:flex-end}
.hm-col b{display:block;font-size:1.15rem}
.hm-col span{display:block;font-size:.8rem;line-height:1.2;margin-top:.1rem}
.hm-row{display:flex;flex-direction:column;justify-content:center;text-align:left;padding:.2rem .5rem .2rem 0}
.hm-row b{font-size:1rem;white-space:nowrap}
.hm-row em{font-style:normal}
.g-short{display:none}
.hm-row span{font-size:.8rem;line-height:1.2}
button.hm-col:hover,button.hm-row:hover{background:rgba(17,58,51,.08)}
.hm-dark .hm-corner,.hm-dark .hm-col span,.hm-dark .hm-row span{color:#A9CDBB}
.hm-dark .hm-col b,.hm-dark .hm-row b{color:#fff}
.hm-light .hm-corner,.hm-light .hm-col span,.hm-light .hm-row span{color:var(--muted)}
.hm-light .hm-col span{display:none}
.hm-light{grid-template-columns:minmax(84px,1.3fr) repeat(5,minmax(0,1fr));gap:5px}
.hm-col.on b,.hm-row.on b{color:var(--ember)}
.hm-dark .hm-col.on b,.hm-dark .hm-row.on b{color:var(--apricot)}
.hm-cell{border:0;border-radius:12px;min-height:54px;aspect-ratio:1.3/1;font-weight:700;font-size:clamp(1.15rem,2.1vw,1.75rem);display:grid;place-items:center;transition:transform .12s,box-shadow .12s,opacity .15s;animation:cellIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 28ms)}
.hm-light .hm-cell{min-height:40px;font-size:1.05rem;border-radius:9px;aspect-ratio:auto;animation:none}
.hm-cell:hover{transform:scale(1.05);box-shadow:0 0 0 3px var(--apricot)}
@keyframes cellIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.c0{background:var(--h0);color:var(--pine)}
.c1{background:var(--h1);color:var(--pine)}
.c2{background:var(--h2);color:#3A2308}
.c3{background:var(--h3);color:#FFF6EE}
.hm.has-sel .hm-cell{opacity:.4}
.hm.has-sel .hm-cell.in-line{opacity:.78}
.hm.has-sel .hm-cell.sel{opacity:1;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--pine);transform:scale(1.04)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;margin-top:1rem;font-size:.9rem}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:-4px;margin-right:.35rem}
.legend-dark{color:#D9EAE0}
.legend-light{color:var(--muted)}
.lg-end{font-weight:700}

/* Sections */
.section{max-width:1320px;margin:0 auto;padding:2.75rem 1.25rem}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}
.section-head h2{font-size:clamp(1.6rem,2.6vw,2.1rem);letter-spacing:-.01em}
.section-head p{margin:0;color:var(--muted);max-width:52ch}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.recent-card{border:0;text-align:left;background:var(--paper);border-radius:18px;padding:1rem 1.1rem;display:flex;gap:.9rem;align-items:center;box-shadow:inset 0 0 0 1px #C8D8CF}
.recent-card:hover{background:var(--paper-2);box-shadow:inset 0 0 0 2px var(--fern)}
.recent-card .meta{font-size:.9rem;color:var(--muted)}
.badge{flex-shrink:0;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.05rem}
.badge.none{background:#CBD8D1;color:var(--muted)}

/* Flow */
.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:2rem;align-items:start}
.lane-head{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:.9rem;min-height:3.4rem}
.lane-head i{width:14px;height:14px;border-radius:4px;margin-top:.3rem;flex-shrink:0;background:var(--tone)}
.lane-head h3{font-size:1.15rem}
.lane-head p{margin:.1rem 0 0;font-size:.92rem;color:var(--muted)}
.lane{display:flex;flex-direction:column;height:100%}
.lane-body{display:flex;flex-direction:column;flex:1}
.t-blue{--tone:var(--harbour);--tone-line:#93BAD1;--tone-tint:var(--harbour-tint);--ring:rgba(47,111,147,.22)}
.t-orange{--tone:var(--amber);--tone-line:#EDB57A;--tone-tint:var(--peach);--ring:rgba(234,148,64,.28)}
.t-green{--tone:var(--fern);--tone-line:#9BCBAF;--tone-tint:var(--mint);--ring:rgba(47,138,91,.25)}
.t-pine{--tone:var(--pine);--tone-line:#8FAFA3;--tone-tint:#D5E2DB;--ring:rgba(17,58,51,.2)}
.node{background:var(--paper);border-radius:14px;padding:.85rem 1rem;box-shadow:inset 0 0 0 2px var(--tone-line);transition:opacity .2s,box-shadow .2s,background .2s}
.node-row{display:flex;gap:.8rem;align-items:flex-start}
.node-body{flex:1;min-width:0}
.node-title{font-weight:700;line-height:1.32}
.node-sub{font-size:.92rem;color:var(--muted);margin-top:.2rem}
.k-note{background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--tone-line)}
.k-note .node-title{font-weight:400;font-size:.95rem;color:var(--muted)}
.mark{width:28px;height:28px;display:grid;place-items:center;flex-shrink:0;margin-top:-1px}
.mark-ring{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--tone)}
.mark-diamond{width:17px;height:17px;transform:rotate(45deg);border-radius:3px;background:var(--tone)}
.mark-info{width:24px;height:24px;border-radius:50%;background:var(--tone-tint);color:var(--tone);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-style:italic}
.tick{width:32px;height:32px;margin:-3px 0 0 -2px;border-radius:50%;border:0;background:var(--paper-2);box-shadow:inset 0 0 0 2.5px var(--tone);display:grid;place-items:center;color:transparent;transition:background .15s}
.tick:hover:not(:disabled){background:var(--tone-tint)}
.tick[aria-pressed="true"]{background:var(--tone);color:#fff}
.tick svg{width:18px;height:18px}
.is-todo{box-shadow:inset 0 0 0 2px var(--tone-line)}
.is-done{background:var(--tone-tint);box-shadow:inset 0 0 0 2px var(--tone)}
.is-done .node-title{color:var(--ink)}
.is-active{background:var(--paper-2);box-shadow:inset 0 0 0 2.5px var(--tone),0 0 0 5px var(--ring)}
.is-passed,.is-exited{background:var(--tone-tint);box-shadow:inset 0 0 0 2px var(--tone)}
.is-waiting{opacity:.5}
.is-off{opacity:.32;filter:saturate(.25)}
.is-na{opacity:.75;box-shadow:inset 0 0 0 2px dashed}
.link{position:relative;height:28px;width:0;margin-left:29px;border-left:2.5px solid var(--tone-line);transition:opacity .2s}
.link.grow{flex:1;min-height:28px}
.link.is-off,.link.is-waiting{opacity:.35}
.link.is-reached{border-left-color:var(--ember)}
.link .lbl{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.yn{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--line);margin-top:.6rem}
.yn button{border:0;background:transparent;border-radius:999px;padding:.35rem 1rem;font-weight:700;font-size:.95rem;min-width:64px;min-height:36px;color:var(--muted)}
.yn button:hover:not(:disabled){color:var(--ink)}
.yn button[aria-pressed="true"],.yn button[aria-pressed="true"]:hover{background:var(--pine);color:#fff}
.is-passed .exit{opacity:.6}
.exit{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;margin-top:.6rem;font-size:.92rem}
.exit-ans{font-weight:700;color:var(--muted)}
.exit svg{width:16px;height:16px;color:var(--muted)}
.exit-dest{padding:.25rem .75rem;border-radius:999px;font-weight:700;background:var(--mint);color:var(--fern-deep)}
.exit.neutral .exit-dest{background:#D3DED8;color:var(--muted)}
.exit.taken .exit-dest{background:var(--fern);color:#fff}
.exit.neutral.taken .exit-dest{background:var(--pine-3);color:#fff}
.node-field{margin-top:.6rem}
.node-field input{width:100%;background:var(--paper-2);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.95rem}
.node-field input:focus{outline:none;border-color:var(--fern);box-shadow:0 0 0 3px rgba(47,138,91,.2)}
.node-field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.2rem;font-weight:700}
.right-head{margin-bottom:.9rem}
.split{position:relative;height:46px}
.merge{position:relative;height:30px}
.split b{position:absolute;left:29px;top:0;height:46px;border-left:2.5px solid var(--tone-line)}
.split em{position:absolute;left:40px;top:-2px;font-size:.82rem;font-weight:700;font-style:normal;color:var(--muted)}
.split::before{content:"";position:absolute;left:29px;width:calc((100% - 1.5rem)/2 + 1.5rem);top:16px;border-top:2.5px solid var(--tone-line)}
.split i{position:absolute;left:calc((100% - 1.5rem)/2 + 1.5rem + 29px);top:16px;height:30px;border-left:2.5px solid var(--tone-line)}
.merge::before{content:"";position:absolute;left:29px;width:calc((100% - 1.5rem)/2 + 1.5rem);top:0;border-top:2.5px solid var(--ember)}
.merge::after{content:"";position:absolute;left:29px;top:0;height:100%;border-left:2.5px solid var(--ember)}
.split.is-off,.split.is-waiting,.merge.is-off,.merge.is-waiting{opacity:.35}
.reloc-link{position:relative;height:28px;margin-left:29px;border-left:2.5px solid var(--tone-line)}
.reloc-link .lbl{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.82rem;font-weight:700;color:var(--muted)}
.lanes2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:stretch}
.lanes2 .lane-head{margin-top:0}
.tafu{margin-top:0;background:var(--peach);box-shadow:inset 0 0 0 2px #E7A77D;--tone:var(--ember);--tone-line:#E7A77D}
.tafu .node-title{font-size:1.1rem}
.tafu.is-required{background:var(--ember);box-shadow:0 0 0 5px rgba(196,84,31,.22)}
.tafu.is-required .node-title,.tafu.is-required .node-sub{color:#FFF3E8}
.tafu.is-required .mark-diamond{background:#FFF3E8}
.join-mobile{display:none}

/* Assessment */
.subbar{background:var(--paper);border-bottom:1px solid #C5D5CC}
.subbar-in{max-width:1320px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.subbar h1{font-size:1.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.save-state{font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.save-state i{width:9px;height:9px;border-radius:50%;background:var(--fern)}
.save-state.bad i{background:var(--ember)}
.assess{max-width:1320px;margin:0 auto;padding:1.5rem 1.25rem 3rem;display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:1.5rem;align-items:start}
.side{display:grid;gap:1.25rem}
.card{background:var(--paper);border-radius:20px;padding:1.2rem 1.25rem;box-shadow:inset 0 0 0 1px #C8D8CF}
.card>h2{font-size:1.2rem;margin-bottom:.9rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.9rem;flex-wrap:wrap}
.card-head h2{font-size:1.2rem}
.field{display:grid;gap:.25rem;margin-bottom:.8rem}
.field label{font-size:.92rem;font-weight:700;color:var(--muted)}
.field input,.field textarea{width:100%;background:var(--paper-2);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .75rem;font-size:1rem}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--fern);box-shadow:0 0 0 3px rgba(47,138,91,.2)}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:0 .75rem}
.ipc{display:flex;gap:.8rem;align-items:center;width:100%;border:0;text-align:left;border-radius:14px;padding:.8rem .9rem;margin-bottom:1rem;background:var(--peach);color:#6A2E10;font-weight:700}
.ipc.on{background:var(--mint);color:var(--fern-deep)}
.switch{width:46px;height:26px;border-radius:999px;background:#E3B38D;position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.ipc.on .switch{background:var(--fern)}
.ipc.on .switch::after{transform:translateX(20px)}
.result{display:flex;gap:1rem;align-items:center;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid #C8D8CF}
.result-num{width:78px;height:78px;border-radius:16px;display:grid;place-items:center;font-size:2rem;font-weight:700;flex-shrink:0}
.result-num.none{background:#CBD8D1;color:var(--muted)}
.result-title{font-weight:700;font-size:1.1rem}
.result-sub{font-size:.95rem;color:var(--muted)}
.outcome{list-style:none;margin:0 0 1rem;padding:0;display:grid;gap:.55rem}
.outcome li{display:flex;gap:.65rem;align-items:flex-start;font-size:.98rem;line-height:1.35}
.outcome li i{width:11px;height:11px;border-radius:50%;margin-top:.35rem;flex-shrink:0;background:var(--muted)}
.outcome .good i{background:var(--fern)}
.outcome .alert i,.outcome .alert-strong i{background:var(--ember)}
.outcome .alert-strong{font-weight:700;color:#8A3510}
.outcome .muted{color:var(--muted)}
.state-pill{font-size:.85rem;font-weight:700;padding:.2rem .7rem;border-radius:999px;background:var(--peach);color:#8A3510}
.state-pill.ok{background:var(--mint);color:var(--fern-deep)}
.flow-card{padding:1.4rem 1.4rem 1.6rem}
.assess .flow{grid-template-columns:1fr}
.assess .lane-blue .lane-body{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.assess .lane-blue .link{display:none}
.lock-msg{display:flex;gap:.7rem;align-items:center;background:var(--peach);color:#6A2E10;border-radius:14px;padding:.8rem 1rem;margin-bottom:1.25rem;font-weight:700}
.full-btn{width:100%}

/* Dialog */
.overlay{position:fixed;inset:0;background:rgba(10,32,28,.55);z-index:50;display:grid;place-items:center;padding:1rem}
.dialog{background:var(--paper);border-radius:22px;width:min(640px,100%);max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.25rem;border-bottom:1px solid #C8D8CF}
.dialog-head h2{font-size:1.25rem}
.dialog-body{overflow:auto;padding:.75rem 1.25rem 1.25rem}
.saved-row{display:flex;align-items:center;gap:.9rem;padding:.75rem 0;border-bottom:1px solid #D2DFD8}
.saved-row:last-child{border-bottom:0}
.saved-info{flex:1;min-width:0}
.saved-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-info span{font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);padding:1.5rem 0;text-align:center}

.footer{text-align:center;color:var(--muted);padding:1.5rem 1rem 2.5rem;font-size:.92rem}

@media (max-width:1100px){
  .hero-in{grid-template-columns:1fr;gap:2.25rem}
  .hero h1{max-width:20ch}
  .assess{grid-template-columns:1fr}
}
@media (max-width:860px){
  .flow{grid-template-columns:1fr}
  .lanes2{grid-template-columns:1fr}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const LOGO_URL = "https://www.esther.ie/wp-content/uploads/2022/05/HSE-Logo-Green-NEW-no-background.png";
const STORE_KEY = "hse_aspergillus_assessments_v2";

/* ---------- Reference data from the control measures chart ---------- */
const GROUPS = [
  { id: 1, name: "No risk", eg: "Offices and non patient areas" },
  { id: 2, name: "Increased risk", eg: "General wards and outpatient areas" },
  { id: 3, name: "High risk", eg: "ICU, oncology, theatres and burns units" },
  { id: 4, name: "Very high risk", eg: "Transplant and haematology units" },
];
const TYPES = [
  { id: "A1", name: "Minor internal", eg: "Inspection and non invasive work" },
  { id: "A2", name: "Minor small internal", eg: "Small scale, short duration, minimal dust" },
  { id: "B", name: "Medium internal", eg: "Moderate dust, cutting walls, cabling" },
  { id: "C", name: "Major internal", eg: "Demolition, ceiling tile removal" },
  { id: "D", name: "Major external", eg: "Excavation and heavy machinery" },
];
const MATRIX = {
  1: { A1: "0", A2: "I", B: "I", C: "III", D: "III" },
  2: { A1: "0", A2: "I", B: "II", C: "III", D: "III" },
  3: { A1: "I", A2: "I", B: "II", C: "III", D: "III" },
  4: { A1: "I", A2: "I", B: "II", C: "III", D: "III" },
};
const CLASS_KEY = { "0": "c0", I: "c1", II: "c2", III: "c3" };
const classFor = (g, t) => {
  if (!g || !t) return null;
  let c = MATRIX[g][t];
  if (c === "0" && g >= 3) c = "I"; // Class 0 does not apply to Group 3 and 4
  return c;
};

const PRE = [
  { kind: "step", key: "preMeasures", title: "Identify preventative measures as per the matrix" },
  { kind: "step", key: "preMonitoring", title: "Identify air and dust monitoring locations and frequency", field: { key: "monitoringDetail", type: "text", label: "Locations and frequency", placeholder: "e.g. Ward 2B corridor, weekly" } },
  { kind: "answer", key: "preIndoorDust", title: "Clarify if indoor dust monitoring is required" },
  { kind: "step", key: "preBaseline", title: "Carry out baseline samples before enabling or construction works", field: { key: "baselineDate", type: "date", label: "Sample date" } },
];
const RELOC = { kind: "decision", key: "relocate", title: "Can patients in Groups 2 to 4 be relocated?", exit: { answer: "yes", label: "Issue resolved", tone: "good" } };
const VENT = [
  { kind: "step", key: "ventSeal", title: "Seal windows and trickle vents, air intake and exhaust vents" },
  { kind: "step", key: "ventAhu", title: "Check AHUs in the vicinity of the project. Change to HEPA filters in high risk locations" },
  { kind: "step", key: "ventMaint", title: "Preventative maintenance of AHUs with increased inspection and filter changes" },
  { kind: "decision", key: "ventCamfil", title: "Can ducted Camfil units be used?", exit: { answer: "yes", label: "Install and activate Camfil units", tone: "good" } },
  { kind: "note", key: "ventNote", title: "Room air HEPA filtered units (Camfil, fixed or portable) can be installed where Groups 2 to 4 are located. They are not recommended for longer term locations used for Groups 3 and 4 but may be provided on a short term basis." },
];
const COOL = [
  { kind: "decision", key: "coolReq", title: "Is cooling required?", exit: { answer: "no", label: "No cooling measures needed", tone: "neutral" } },
  { kind: "decision", key: "coolInternal", title: "Is internal cooling in place?", exit: { answer: "yes", label: "Existing internal cooling in place", tone: "good" } },
  { kind: "step", key: "coolSolar", title: "Install solar guard on windows for heat gain" },
  { kind: "decision", key: "coolSolarOk", title: "Does the solar guard control the heat gain?", exit: { answer: "yes", label: "Heat gain controlled", tone: "good" } },
  { kind: "decision", key: "coolAC", title: "Consider ducted A/C units. Can they be used?", exit: { answer: "yes", label: "Install and activate ducted A/C units", tone: "good" } },
];

/* ---------- Flow logic ---------- */
function walk(nodes, ans, ctx = {}) {
  let blocked = !!ctx.waiting, exited = !!ctx.off, exitNode = null;
  const status = nodes.map((n) => {
    if (exited) return "off";
    if (blocked) return "waiting";
    if (n.kind === "step" || n.kind === "answer") return ans[n.key] ? "done" : "todo";
    if (n.kind === "note") return "seen";
    const v = ans[n.key];
    if (!v) { blocked = true; return "active"; }
    if (v === n.exit.answer) { exited = true; exitNode = n; return "exited"; }
    return "passed";
  });
  return { status, end: exited ? "off" : blocked ? "waiting" : "reached", exitNode };
}

function computeFlow(a) {
  const cls = classFor(a.group, a.type);
  const locked = !cls;
  const ans = a.ans || {};
  const pre = walk(PRE, ans, { waiting: locked });
  let reloc;
  if (locked) reloc = "waiting";
  else if (a.group === 1) reloc = "na";
  else if (!ans.relocate) reloc = "active";
  else if (ans.relocate === "yes") reloc = "exited";
  else reloc = "passed";
  const ctx = { off: reloc === "exited", waiting: reloc === "waiting" || reloc === "active" };
  const vent = walk(VENT, ans, ctx);
  const cool = walk(COOL, ans, ctx);
  let tafu = "off";
  if (vent.end === "reached" || cool.end === "reached") tafu = "required";
  else if (vent.end === "waiting" || cool.end === "waiting") tafu = "waiting";
  return { cls, locked, pre, reloc, vent, cool, tafu };
}

function buildOutcome(a) {
  const f = computeFlow(a);
  const ans = a.ans || {};
  const items = [];
  let open = 0;
  if (!a.details.ipcDone) { items.push({ tone: "alert", text: "Confirm the risk assessment was carried out with the IPC team" }); open++; }
  if (f.locked) {
    items.push({ tone: "muted", text: "Choose a patient risk group and works type in the matrix" });
    return { f, items, complete: false };
  }
  const g = GROUPS.find((x) => x.id === a.group);
  const t = TYPES.find((x) => x.id === a.type);
  items.push({ tone: "class", cls: f.cls, text: `Class ${f.cls} preventative measures for Group ${g.id} (${g.name.toLowerCase()}) with Type ${t.id} works (${t.name.toLowerCase()})` });
  const preTodo = f.pre.status.filter((s) => s === "todo").length;
  if (preTodo) { items.push({ tone: "alert", text: `${preTodo} of ${PRE.length} pre works tasks outstanding` }); open++; }
  else items.push({ tone: "good", text: "Pre works tasks complete" });
  if (ans.preIndoorDust === "yes") items.push({ tone: "plain", text: "Indoor dust monitoring required" });
  if (f.reloc === "exited") items.push({ tone: "good", text: "Patients relocated, issue resolved for air and heat controls" });
  if (f.reloc === "active") { items.push({ tone: "alert", text: "Decide whether patients in Groups 2 to 4 can be relocated" }); open++; }
  const lane = (nodes, w, name) => {
    const todo = w.status.filter((s) => s === "todo").length;
    if (todo) { items.push({ tone: "alert", text: `${todo} ${name} control ${todo === 1 ? "task" : "tasks"} outstanding` }); open++; }
    const ai = w.status.indexOf("active");
    if (ai > -1) { items.push({ tone: "alert", text: `Answer: ${nodes[ai].title}` }); open++; }
    if (w.exitNode) items.push({ tone: w.exitNode.exit.tone === "neutral" ? "plain" : "good", text: w.exitNode.exit.label });
  };
  lane(VENT, f.vent, "air");
  lane(COOL, f.cool, "heat");
  if (f.tafu === "required") items.push({ tone: "alert-strong", text: "Tempered air filtration units (TAFUs) required" });
  return { f, items, complete: open === 0 };
}

/* ---------- Storage in this browser ---------- */
function storageAvailable() {
  try { const k = "__asp_test__"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; }
  catch (e) { return false; }
}
function loadList() {
  try { const raw = window.localStorage.getItem(STORE_KEY); const v = raw ? JSON.parse(raw) : []; return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function persist(list) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}
const today = () => new Date().toISOString().slice(0, 10);
const blank = (g = null, t = null) => ({
  id: "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
  created: new Date().toISOString(),
  details: { project: "", site: "", location: "", assessor: "", ipcContact: "", date: today(), ipcDone: false },
  group: g, type: t, ans: {}, notes: "",
});
const hasContent = (a) => {
  const d = a.details;
  return !!(d.project || d.site || d.location || d.assessor || d.ipcContact || d.ipcDone || a.group || a.type || a.notes || Object.keys(a.ans).length);
};
const fmtDate = (iso) => { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const fmtTime = (d) => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

/* ---------- PDF ---------- */
function loadLogo() {
  return new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => resolve(null), 4000);
    img.crossOrigin = "anonymous";
    img.onload = () => {
      clearTimeout(timer);
      try {
        const c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext("2d").drawImage(img, 0, 0);
        resolve({ data: c.toDataURL("image/png"), w: img.naturalWidth, h: img.naturalHeight });
      } catch (e) { resolve(null); }
    };
    img.onerror = () => { clearTimeout(timer); resolve(null); };
    img.src = LOGO_URL;
  });
}

async function makePdf(a) {
  if (!window.jspdf) throw new Error("The PDF library did not load. Check your internet connection and reload the page.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const { f, items, complete } = buildOutcome(a);
  const d = a.details, ans = a.ans || {};
  const W = 210, H = 297, M = 15, CW = W - 2 * M;
  const C = {
    pine: [17, 58, 51], paper: [237, 243, 239], line: [200, 216, 207], ink: [18, 48, 42], muted: [72, 99, 90],
    fern: [47, 138, 91], mint: [198, 230, 210], amber: [234, 148, 64], peach: [251, 227, 200], ember: [196, 84, 31],
    harbour: [47, 111, 147], htint: [211, 228, 238], grey: [220, 228, 224], white: [255, 255, 255],
    h0: [211, 237, 219], h1: [134, 201, 161], h2: [242, 180, 95], h3: [196, 84, 31],
  };
  const clsCol = { "0": C.h0, I: C.h1, II: C.h2, III: C.h3 };
  const fill = (c) => doc.setFillColor(c[0], c[1], c[2]);
  const txt = (c) => doc.setTextColor(c[0], c[1], c[2]);
  const draw = (c) => doc.setDrawColor(c[0], c[1], c[2]);
  const font = (s, size) => { doc.setFont("helvetica", s); doc.setFontSize(size); };
  let y = 0;
  const ensure = (h) => { if (y + h > H - 18) { doc.addPage(); y = M + 2; } };

  const logo = await loadLogo();
  fill(C.pine); doc.rect(0, 0, W, 40, "F");
  if (logo) {
    const bw = 46, bh = 20;
    fill(C.paper); doc.roundedRect(W - M - bw, 10, bw, bh, 3, 3, "F");
    const r = Math.min((bw - 8) / logo.w, (bh - 6) / logo.h);
    doc.addImage(logo.data, "PNG", W - M - bw + (bw - logo.w * r) / 2, 10 + (bh - logo.h * r) / 2, logo.w * r, logo.h * r);
  }
  txt(C.white); font("bold", 18); doc.text("Aspergillus control measures", M, 18);
  font("normal", 11); txt([191, 217, 203]); doc.text("Construction and renovation risk assessment record", M, 25);
  font("bold", 10); txt([247, 197, 143]); doc.text(complete ? "Assessment complete" : "Draft with items outstanding", M, 33);
  y = 50;

  const section = (title, tone, need = 20) => {
    ensure(need);
    fill(tone); doc.roundedRect(M, y, 3.2, 7, 1.2, 1.2, "F");
    txt(C.ink); font("bold", 12.5); doc.text(title, M + 6.5, y + 5.4);
    y += 11;
  };

  const kvGrid = (pairs) => {
    const gap = 4, colW = (CW - gap) / 2;
    for (let i = 0; i < pairs.length; i += 2) {
      const row = pairs.slice(i, i + 2);
      font("bold", 10);
      const lineCount = Math.max(...row.map(([, v]) => doc.splitTextToSize(String(v || "Not recorded"), colW - 8).length));
      const h = 8.5 + lineCount * 4.3;
      ensure(h + gap);
      row.forEach(([k, v], j) => {
        const x = M + j * (colW + gap);
        fill(C.paper); doc.roundedRect(x, y, colW, h, 2.5, 2.5, "F");
        font("normal", 8); txt(C.muted); doc.text(k, x + 4, y + 5);
        font("bold", 10); txt(v ? C.ink : C.muted); doc.text(doc.splitTextToSize(String(v || "Not recorded"), colW - 8), x + 4, y + 10);
      });
      y += h + gap;
    }
    y += 3;
  };

  section("Project details", C.pine);
  kvGrid([
    ["Project", d.project], ["Hospital or site", d.site],
    ["Location or ward", d.location], ["Assessment date", fmtDate(d.date)],
    ["Assessor", d.assessor], ["IPC team contact", d.ipcContact],
    ["Risk assessment with IPC team", d.ipcDone ? "Yes" : "Not confirmed"], ["Report generated", fmtDate(new Date().toISOString()) + " at " + fmtTime(new Date())],
  ]);

  // Matrix result
  section("Risk matrix result", C.amber, 70);
  const g = GROUPS.find((x) => x.id === a.group), t = TYPES.find((x) => x.id === a.type);
  const boxW = 80, boxH = 52;
  fill(f.cls ? clsCol[f.cls] : C.grey); doc.roundedRect(M, y, boxW, boxH, 3, 3, "F");
  const light = f.cls === "III";
  txt(light ? [255, 246, 238] : C.ink);
  font("normal", 9); doc.text("Preventative measures", M + 5, y + 8);
  font("bold", 28); doc.text(f.cls ? `Class ${f.cls}` : "Not set", M + 5, y + 22);
  font("normal", 9.5);
  doc.text(doc.splitTextToSize(g ? `Group ${g.id}: ${g.name}` : "Group not selected", boxW - 10), M + 5, y + 33);
  doc.text(doc.splitTextToSize(t ? `Type ${t.id}: ${t.name}` : "Works type not selected", boxW - 10), M + 5, y + 40);
  const mx = M + boxW + 8, hw = 20, cw = (W - M - mx - hw) / 5, ch = 8.4;
  font("bold", 8.5); txt(C.muted);
  TYPES.forEach((tp, i) => doc.text(tp.id, mx + hw + i * cw + cw / 2, y + 4, { align: "center" }));
  GROUPS.forEach((gp, r) => {
    const cy = y + 6 + r * (ch + 1.3);
    txt(C.muted); font("bold", 8.5); doc.text(`Group ${gp.id}`, mx, cy + 5.6);
    TYPES.forEach((tp, i) => {
      const c = classFor(gp.id, tp.id), cx = mx + hw + i * cw;
      fill(clsCol[c]); doc.roundedRect(cx + 0.6, cy, cw - 1.2, ch, 1.5, 1.5, "F");
      if (a.group === gp.id && a.type === tp.id) { draw(C.pine); doc.setLineWidth(0.9); doc.roundedRect(cx + 0.6, cy, cw - 1.2, ch, 1.5, 1.5, "S"); }
      txt(c === "III" ? C.white : C.ink); font("bold", 9); doc.text(c, cx + cw / 2, cy + 5.6, { align: "center" });
    });
  });
  font("normal", 7.5); txt(C.muted);
  doc.text("Class 0 preventative measures do not apply to Group 3 and 4 patients.", mx, y + 6 + 4 * (ch + 1.3) + 3.5);
  y += boxH + 9;

  // Required actions
  section("What this assessment requires", C.fern);
  items.forEach((it) => {
    font(it.tone === "alert-strong" ? "bold" : "normal", 10);
    const lines = doc.splitTextToSize(it.text, CW - 10);
    const h = lines.length * 4.3 + 2.8;
    ensure(h);
    const col = it.tone === "good" ? C.fern : it.tone.indexOf("alert") === 0 ? C.ember : it.tone === "class" ? clsCol[it.cls] : C.muted;
    fill(col); doc.circle(M + 2, y + 2.6, 1.6, "F");
    txt(C.ink); doc.text(lines, M + 7, y + 3.8);
    y += h;
  });
  y += 5;

  // Workflow tables
  const pill = { good: [C.fern, C.white], warn: [C.peach, C.ember], alert: [C.ember, C.white], muted: [C.grey, C.muted], plain: [C.mint, C.ink], blue: [C.htint, C.harbour] };
  const rows = (list) => {
    list.forEach((r, i) => {
      font(r.bold ? "bold" : "normal", 10);
      const lines = doc.splitTextToSize(r.text, CW - 48);
      const h = Math.max(9.5, lines.length * 4.3 + 5);
      ensure(h);
      if (i % 2 === 0) { fill(C.paper); doc.rect(M, y, CW, h, "F"); }
      txt(r.dim ? C.muted : C.ink); doc.text(lines, M + 3, y + 6);
      const [bg, fg] = pill[r.tone]; const pw = 38;
      fill(bg); doc.roundedRect(W - M - pw - 2, y + (h - 6.2) / 2, pw, 6.2, 3.1, 3.1, "F");
      txt(fg); font("bold", 8.5); doc.text(r.status, W - M - 2 - pw / 2, y + (h - 6.2) / 2 + 4.2, { align: "center" });
      y += h;
    });
    y += 7;
  };
  const nodeRows = (nodes, w) => {
    const out = [];
    nodes.forEach((n, i) => {
      const s = w.status[i];
      if (n.kind === "note") { if (s === "seen") out.push({ text: n.title, status: "Note", tone: "blue", dim: true }); return; }
      let status, tone;
      if (s === "off") { status = "Not required"; tone = "muted"; }
      else if (s === "waiting") { status = "Awaiting answer"; tone = "muted"; }
      else if (n.kind === "step") { status = s === "done" ? "Done" : "Outstanding"; tone = s === "done" ? "good" : "warn"; }
      else { const v = ans[n.key]; status = v ? (v === "yes" ? "Yes" : "No") : "Not answered"; tone = v ? "plain" : "warn"; }
      let text = n.title;
      if (n.field && ans[n.field.key] && s !== "off") text += ` (${n.field.type === "date" ? fmtDate(ans[n.field.key]) : ans[n.field.key]})`;
      out.push({ text, status, tone, dim: s === "off" || s === "waiting" });
      if (s === "exited") out.push({ text: n.exit.label, status: "Outcome", tone: "good", bold: true });
    });
    return out;
  };

  section("Before works start", C.harbour);
  rows(nodeRows(PRE, f.pre));

  section("Patient relocation", C.pine);
  if (f.reloc === "na") rows([{ text: RELOC.title, status: "Not applicable", tone: "muted", dim: true }]);
  else rows(nodeRows([RELOC], { status: [f.reloc === "waiting" ? "waiting" : f.reloc] }));

  section("Protect the air", C.amber);
  rows(nodeRows(VENT, f.vent));

  section("Manage heat gain", C.fern);
  rows(nodeRows(COOL, f.cool));

  section("Tempered air filtration units", C.ember);
  rows([{
    text: "TAFUs are needed when ducted Camfil units or ducted A/C units cannot be used",
    status: f.tafu === "required" ? "Required" : f.tafu === "waiting" ? "Awaiting answer" : "Not required",
    tone: f.tafu === "required" ? "alert" : "muted", bold: f.tafu === "required",
  }]);

  if (a.notes && a.notes.trim()) {
    section("Notes", C.pine);
    font("normal", 10); txt(C.ink);
    doc.splitTextToSize(a.notes.trim(), CW).forEach((ln) => { ensure(5); doc.text(ln, M, y + 3.5); y += 4.5; });
    y += 6;
  }

  section("Sign off", C.pine, 62);
  const sw = (CW - 8) / 2;
  [["Assessor", d.assessor], ["IPC team", d.ipcContact]].forEach(([k, v], j) => {
    const x = M + j * (sw + 8);
    fill(C.paper); doc.roundedRect(x, y, sw, 42, 3, 3, "F");
    font("bold", 10.5); txt(C.ink); doc.text(k, x + 5, y + 7.5);
    font("normal", 9.5); txt(C.muted);
    doc.text(`Name: ${v || ""}`, x + 5, y + 15);
    draw(C.line); doc.setLineWidth(0.35);
    doc.text("Signature", x + 5, y + 27); doc.line(x + 24, y + 27, x + sw - 5, y + 27);
    doc.text("Date", x + 5, y + 36); doc.line(x + 24, y + 36, x + sw - 5, y + 36);
  });
  y += 48;

  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    draw(C.line); doc.setLineWidth(0.3); doc.line(M, H - 12, W - M, H - 12);
    font("normal", 8); txt(C.muted);
    const label = "HSE Aspergillus control assessment" + (d.project ? ": " + d.project : "");
    doc.text(label.length > 90 ? label.slice(0, 87) + "..." : label, M, H - 7);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 7, { align: "right" });
  }
  const slug = (d.project || "aspergillus").replace(/[^a-z0-9]+/gi, "_").replace(/^_|_$/g, "").toLowerCase() || "aspergillus";
  doc.save(`${slug}_aspergillus_assessment_${d.date || today()}.pdf`);
}

/* ---------- Icons ---------- */
const Svg = ({ children, size = 18 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
);
const IArrow = () => <Svg><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></Svg>;
const IBack = () => <Svg><path d="M19 12H5" /><path d="m11 18-6-6 6-6" /></Svg>;
const ICheck = () => <Svg><path d="M20 6 9 17l-5-5" /></Svg>;
const IDownload = () => <Svg><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></Svg>;
const IPlus = () => <Svg><path d="M12 5v14" /><path d="M5 12h14" /></Svg>;
const IFolder = () => <Svg><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></Svg>;
const ITrash = () => <Svg><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M6 7l1 13h10l1-13" /><path d="M9 7V4h6v3" /></Svg>;
const IClose = () => <Svg><path d="M18 6 6 18" /><path d="m6 6 12 12" /></Svg>;
const ILock = () => <Svg size={20}><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></Svg>;

/* ---------- Heat map ---------- */
function HeatMap({ group, type, onPick, onPickGroup, onPickType, variant = "dark" }) {
  const hasSel = !!(group && type);
  return (
    <div className={`hm hm-${variant} ${hasSel ? "has-sel" : ""}`}>
      <div className="hm-corner"><span>Construction activity</span><span>by patient group</span></div>
      {TYPES.map((t) => {
        const inner = <><b>{t.id}</b><span>{t.name}</span></>;
        return onPickType
          ? <button key={t.id} className={`hm-col ${type === t.id ? "on" : ""}`} onClick={() => onPickType(t.id)} title={`Type ${t.id}: ${t.name}. ${t.eg}`}>{inner}</button>
          : <div key={t.id} className="hm-col" title={`Type ${t.id}: ${t.name}. ${t.eg}`}>{inner}</div>;
      })}
      {GROUPS.map((g, r) => (
        <React.Fragment key={g.id}>
          {onPickGroup
            ? <button className={`hm-row ${group === g.id ? "on" : ""}`} onClick={() => onPickGroup(g.id)} title={g.eg}><b><em className="g-long">Group </em><em className="g-short">G</em>{g.id}</b><span>{g.name}</span></button>
            : <div className="hm-row" title={g.eg}><b><em className="g-long">Group </em><em className="g-short">G</em>{g.id}</b><span>{g.name}</span></div>}
          {TYPES.map((t, c) => {
            const k = classFor(g.id, t.id);
            const sel = group === g.id && type === t.id;
            const inLine = hasSel && (group === g.id || type === t.id);
            return (
              <button key={t.id} style={{ "--i": r + c }}
                className={`hm-cell ${CLASS_KEY[k]} ${sel ? "sel" : ""} ${inLine ? "in-line" : ""}`}
                onClick={() => onPick(g.id, t.id)} aria-pressed={sel}
                aria-label={`Group ${g.id} ${g.name}, Type ${t.id} ${t.name}: Class ${k}`}
                title={`Group ${g.id} (${g.name}) with Type ${t.id} (${t.name}): Class ${k}`}>
                {k}
              </button>
            );
          })}
        </React.Fragment>
      ))}
    </div>
  );
}
const Legend = ({ variant }) => (
  <div className={`legend legend-${variant}`}>
    <span className="lg-end">Lowest</span>
    {["0", "I", "II", "III"].map((c) => <span key={c}><i className={CLASS_KEY[c]} />Class {c}</span>)}
    <span className="lg-end">Highest</span>
  </div>
);

/* ---------- Flow nodes ---------- */
function YesNo({ value, onChange, disabled }) {
  return (
    <div className="yn" role="group">
      {[["yes", "Yes"], ["no", "No"]].map(([v, l]) => (
        <button key={v} disabled={disabled} aria-pressed={value === v} onClick={() => onChange(value === v ? null : v)}>{l}</button>
      ))}
    </div>
  );
}
const ExitChip = ({ exit, taken }) => (
  <div className={`exit ${exit.tone} ${taken ? "taken" : ""}`}>
    <span className="exit-ans">{exit.answer === "yes" ? "Yes" : "No"}</span><IArrow />
    <span className="exit-dest">{exit.label}</span>
  </div>
);
const linkLabel = (n) => (n && n.kind === "decision" ? (n.exit.answer === "yes" ? "No" : "Yes") : null);

function FlowNode({ node, status, tone, live, ans, setAns, sub }) {
  const inactive = status === "off" || status === "waiting" || status === "na";
  const canUse = live && !inactive;
  let mark;
  if (node.kind === "note") mark = <span className="mark"><span className="mark-info">i</span></span>;
  else if (node.kind === "step" && live) mark = (
    <button className="tick" disabled={!canUse} aria-pressed={!!ans[node.key]} aria-label={`Mark as done: ${node.title}`} onClick={() => setAns(node.key, !ans[node.key])}><ICheck /></button>
  );
  else if (node.kind === "step") mark = <span className="mark"><span className="mark-ring" /></span>;
  else mark = <span className="mark"><span className="mark-diamond" /></span>;
  return (
    <div className={`node t-${tone} k-${node.kind} is-${status}`}>
      <div className="node-row">
        {mark}
        <div className="node-body">
          <div className="node-title">{node.title}</div>
          {sub && <div className="node-sub">{sub}</div>}
          {live && node.field && status !== "off" && (
            <div className="node-field">
              <label htmlFor={`f_${node.field.key}`}>{node.field.label}</label>
              <input id={`f_${node.field.key}`} type={node.field.type} disabled={!canUse} placeholder={node.field.placeholder || ""}
                value={ans[node.field.key] || ""} onChange={(e) => setAns(node.field.key, e.target.value)} />
            </div>
          )}
          {live && (node.kind === "decision" || node.kind === "answer") && status !== "na" && (
            <YesNo value={ans[node.key]} disabled={!canUse} onChange={(v) => setAns(node.key, v)} />
          )}
          {node.kind === "decision" && status !== "na" && <ExitChip exit={node.exit} taken={status === "exited"} />}
        </div>
      </div>
    </div>
  );
}

function Lane({ tone, title, sub, nodes, w, live, ans, setAns, join, className = "" }) {
  const st = (i) => (live ? w.status[i] : "idle");
  const endStatus = live ? w.end : "idle";
  return (
    <div className={`lane t-${tone} ${className}`}>
      <div className="lane-head"><i /><div><h3>{title}</h3><p>{sub}</p></div></div>
      <div className="lane-body">
        {nodes.map((n, i) => (
          <React.Fragment key={n.key}>
            {i > 0 && <div className={`link is-${st(i)}`}>{linkLabel(nodes[i - 1]) && <span className="lbl">{linkLabel(nodes[i - 1])}</span>}</div>}
            <FlowNode node={n} status={st(i)} tone={tone} live={live} ans={ans} setAns={setAns} />
          </React.Fragment>
        ))}
        {join && (
          <div className={`link grow is-${endStatus}`}>
            {linkLabel(nodes[nodes.length - 1]) && <span className="lbl">{linkLabel(nodes[nodes.length - 1])}</span>}
          </div>
        )}
      </div>
    </div>
  );
}

function Flow({ a, setAns }) {
  const live = !!a;
  const ans = live ? a.ans : {};
  const f = live ? computeFlow(a) : null;
  const relocStatus = live ? f.reloc : "idle";
  const splitState = live ? (f.reloc === "exited" ? "off" : f.reloc === "waiting" || f.reloc === "active" ? "waiting" : "on") : "idle";
  const tafuStatus = live ? f.tafu : "idle";
  return (
    <div className="flow">
      <Lane className="lane-blue" tone="blue" title="Before works start" sub="Set up measures and monitoring with the IPC team"
        nodes={PRE} w={f && f.pre} live={live} ans={ans} setAns={setAns} />
      <div className="flow-right">
        <div className="lane-head right-head t-pine"><i /><div><h3>Controls during works</h3><p>Relocate at risk patients, or protect the air and manage heat</p></div></div>
        <FlowNode node={RELOC} status={relocStatus} tone="pine" live={live} ans={ans} setAns={setAns}
          sub={relocStatus === "na" ? "Not applicable to Group 1 areas. Continue with the air and heat controls." : null} />
        <div className={`reloc-link t-pine join-mobile is-${splitState}`}><span className="lbl">{relocStatus === "na" ? "" : "No"}</span></div>
        <div className={`split t-pine is-${splitState}`}><b /><em>{relocStatus === "na" ? "" : "No"}</em><i /></div>
        <div className="lanes2">
          <Lane tone="orange" title="Protect the air" sub="Ventilation and filtration" nodes={VENT} w={f && f.vent} live={live} ans={ans} setAns={setAns} join />
          <Lane tone="green" title="Manage heat gain" sub="Cooling while windows stay sealed" nodes={COOL} w={f && f.cool} live={live} ans={ans} setAns={setAns} join />
        </div>
        <div className={`merge is-${tafuStatus === "off" ? "off" : tafuStatus === "waiting" ? "waiting" : "on"}`} />
        <div className={`node tafu is-${tafuStatus}`}>
          <div className="node-row">
            <span className="mark"><span className="mark-diamond" /></span>
            <div className="node-body">
              <div className="node-title">Tempered air filtration units (TAFUs)</div>
              <div className="node-sub">
                {tafuStatus === "required" ? "Required for this assessment. Ducted Camfil or ducted A/C units cannot be used." : "Needed when ducted Camfil units or ducted A/C units cannot be used"}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Screens ---------- */
function Overview({ list, onStart, onOpen, onShowSaved }) {
  const recent = [...list].sort((x, y) => (y.updated || "").localeCompare(x.updated || "")).slice(0, 3);
  return (
    <>
      <section className="hero">
        <div className="hero-in">
          <div>
            <h1>Aspergillus control during construction and renovation</h1>
            <p className="lede">Find the preventative measures for works near patients, walk through the air and heat controls, and download the record as a PDF.</p>
            <div className="start-step">
              <span className="start-dot" />
              <p><strong>Start with the IPC team.</strong> Carry out the risk assessment with Infection Prevention and Control, then classify the works and the patient risk group.</p>
            </div>
            <div className="hero-actions">
              <button className="btn btn-apricot" onClick={() => onStart()}><IPlus /> Start an assessment</button>
              <button className="btn btn-ghost" onClick={onShowSaved}><IFolder /> Saved assessments ({list.length})</button>
            </div>
          </div>
          <div className="hm-card">
            <div className="hm-card-head">
              <h2>Risk matrix</h2>
              <p>Select a cell to start an assessment with that group and works type.</p>
            </div>
            <HeatMap variant="dark" onPick={(g, t) => onStart(g, t)} />
            <Legend variant="dark" />
            <p className="hm-note"><strong>Note:</strong> Class 0 preventative measures do not apply to Group 3 and 4 patients.</p>
          </div>
        </div>
      </section>

      {recent.length > 0 && (
        <section className="section" style={{ paddingBottom: 0 }}>
          <div className="section-head"><h2>Recent assessments</h2><button className="btn btn-soft" onClick={onShowSaved}>View all</button></div>
          <div className="recent">
            {recent.map((x) => {
              const c = classFor(x.group, x.type);
              return (
                <button key={x.id} className="recent-card" onClick={() => onOpen(x.id)}>
                  <span className={`badge ${c ? CLASS_KEY[c] : "none"}`}>{c || "?"}</span>
                  <span><strong>{x.details.project || "Untitled assessment"}</strong><br /><span className="meta">{[x.details.location, x.details.site].filter(Boolean).join(", ") || "No location"}. Updated {fmtDate(x.updated)}</span></span>
                </button>
              );
            })}
          </div>
        </section>
      )}

      <section className="section">
        <div className="section-head">
          <h2>Control measures workflow</h2>
          <p>Every assessment follows this path. Pre works tasks run alongside the relocation decision, and both air and heat routes can end with TAFUs.</p>
        </div>
        <Flow a={null} />
      </section>
    </>
  );
}

function Assess({ a, setA, storageOk, savedAt, saveFailed }) {
  const [busy, setBusy] = useState(false);
  const outcome = useMemo(() => buildOutcome(a), [a]);
  const cls = outcome.f.cls;
  const setDetail = (k, v) => setA((p) => ({ ...p, details: { ...p.details, [k]: v } }));
  const setAns = (k, v) => setA((p) => ({ ...p, ans: { ...p.ans, [k]: v } }));
  const downloadPdf = async () => {
    setBusy(true);
    try { await makePdf(a); }
    catch (e) { window.alert("The PDF could not be created. " + (e && e.message ? e.message : "")); }
    setBusy(false);
  };
  const g = GROUPS.find((x) => x.id === a.group), t = TYPES.find((x) => x.id === a.type);
  const field = (k, label, type = "text", ph = "") => (
    <div className="field">
      <label htmlFor={`d_${k}`}>{label}</label>
      <input id={`d_${k}`} type={type} value={a.details[k]} placeholder={ph} onChange={(e) => setDetail(k, e.target.value)} />
    </div>
  );
  const pdfBtn = (
    <button className="btn btn-pine full-btn" onClick={downloadPdf} disabled={busy}><IDownload /> {busy ? "Creating PDF" : "Download PDF"}</button>
  );
  return (
    <>
      <div className="subbar">
        <div className="subbar-in">
          <h1>{a.details.project || "Untitled assessment"}</h1>
          <span className={`save-state ${!storageOk || saveFailed ? "bad" : ""}`}>
            <i />{!storageOk ? "Not saved, browser storage is blocked" : saveFailed ? "Could not save, browser storage is full" : savedAt ? `Saved in this browser at ${fmtTime(savedAt)}` : "Changes save in this browser automatically"}
          </span>
          <span className="spacer" />
          <button className="btn btn-pine" onClick={downloadPdf} disabled={busy}><IDownload /> <span>{busy ? "Creating PDF" : "Download PDF"}</span></button>
        </div>
      </div>
      <div className="assess">
        <aside className="side">
          <div className="card">
            <h2>Project details</h2>
            <button className={`ipc ${a.details.ipcDone ? "on" : ""}`} aria-pressed={a.details.ipcDone} onClick={() => setDetail("ipcDone", !a.details.ipcDone)}>
              <span className="switch" />
              <span>{a.details.ipcDone ? "Risk assessment carried out with the IPC team" : "Confirm the risk assessment was carried out with the IPC team"}</span>
            </button>
            {field("project", "Project name", "text", "e.g. Ward 2B refurbishment")}
            <div className="fields2">
              {field("site", "Hospital or site", "text", "e.g. CUH")}
              {field("location", "Location or ward", "text", "e.g. Ward 2B")}
              {field("assessor", "Assessor")}
              {field("ipcContact", "IPC team contact")}
            </div>
            {field("date", "Assessment date", "date")}
          </div>

          <div className="card">
            <div className="card-head"><h2>Risk matrix</h2></div>
            <HeatMap variant="light" group={a.group} type={a.type}
              onPick={(gid, tid) => setA((p) => ({ ...p, group: gid, type: tid }))}
              onPickGroup={(gid) => setA((p) => ({ ...p, group: gid }))}
              onPickType={(tid) => setA((p) => ({ ...p, type: tid }))} />
            <Legend variant="light" />
            <div className="result">
              <div className={`result-num ${cls ? CLASS_KEY[cls] : "none"}`}>{cls || "?"}</div>
              <div>
                <div className="result-title">{cls ? `Class ${cls} preventative measures` : "No class yet"}</div>
                <div className="result-sub">
                  {g ? `Group ${g.id}, ${g.name.toLowerCase()}` : "Pick a patient risk group"}<br />
                  {t ? `Type ${t.id}, ${t.name.toLowerCase()} works` : "Pick a construction activity type"}
                  {g && <><br />Typical areas: {g.eg}</>}
                </div>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-head">
              <h2>What this assessment requires</h2>
              <span className={`state-pill ${outcome.complete ? "ok" : ""}`}>{outcome.complete ? "Complete" : "In progress"}</span>
            </div>
            <ul className="outcome">
              {outcome.items.map((it, i) => (
                <li key={i} className={it.tone}>
                  <i style={it.tone === "class" ? { background: `var(--h${["0", "I", "II", "III"].indexOf(it.cls)})` } : null} />
                  <span>{it.text}</span>
                </li>
              ))}
            </ul>
            {pdfBtn}
          </div>
        </aside>

        <main style={{ display: "grid", gap: "1.25rem", minWidth: 0 }}>
          <div className="card flow-card">
            <div className="card-head"><h2>Control measures workflow</h2></div>
            {!cls && <div className="lock-msg"><ILock /> Choose a patient risk group and works type in the matrix to start the workflow.</div>}
            <Flow a={a} setAns={setAns} />
          </div>
          <div className="card">
            <div className="field" style={{ marginBottom: 0 }}>
              <label htmlFor="notes" style={{ fontSize: "1.2rem", color: "var(--ink)", marginBottom: ".4rem" }}>Notes and agreed actions</label>
              <textarea id="notes" value={a.notes} placeholder="Anything agreed with the IPC team, contractor or ward manager" onChange={(e) => setA((p) => ({ ...p, notes: e.target.value }))} />
            </div>
          </div>
        </main>
      </div>
    </>
  );
}

function SavedDialog({ list, onOpen, onDelete, onClose }) {
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  const sorted = [...list].sort((x, y) => (y.updated || "").localeCompare(x.updated || ""));
  return (
    <div className="overlay" onClick={onClose}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="savedTitle" onClick={(e) => e.stopPropagation()}>
        <div className="dialog-head">
          <h2 id="savedTitle">Saved in this browser</h2>
          <button className="btn btn-soft btn-icon" onClick={onClose} aria-label="Close"><IClose /></button>
        </div>
        <div className="dialog-body">
          {sorted.length === 0 && <p className="empty">No saved assessments yet. Start one from the overview and it will save here as you work.</p>}
          {sorted.map((x) => {
            const c = classFor(x.group, x.type);
            return (
              <div key={x.id} className="saved-row">
                <span className={`badge ${c ? CLASS_KEY[c] : "none"}`}>{c || "?"}</span>
                <div className="saved-info">
                  <strong>{x.details.project || "Untitled assessment"}</strong>
                  <span>{[x.details.location, x.details.site].filter(Boolean).join(", ") || "No location"}. Updated {fmtDate(x.updated)}</span>
                </div>
                <button className="btn btn-pine" onClick={() => onOpen(x.id)}>Open</button>
                <button className="btn btn-soft btn-icon" aria-label={`Delete ${x.details.project || "untitled assessment"}`} onClick={() => onDelete(x.id)}><ITrash /></button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [storageOk] = useState(() => storageAvailable());
  const [list, setList] = useState(() => (storageAvailable() ? loadList() : []));
  const [view, setView] = useState("overview");
  const [a, setA] = useState(null);
  const [savedAt, setSavedAt] = useState(null);
  const [saveFailed, setSaveFailed] = useState(false);
  const [showSaved, setShowSaved] = useState(false);

  useEffect(() => {
    if (!a || !hasContent(a)) return;
    const timer = setTimeout(() => {
      const stamped = { ...a, updated: new Date().toISOString() };
      setList((prev) => {
        const next = [stamped, ...prev.filter((x) => x.id !== a.id)];
        if (storageOk) { const ok = persist(next); setSaveFailed(!ok); if (ok) setSavedAt(new Date()); }
        return next;
      });
    }, 400);
    return () => clearTimeout(timer);
  }, [a, storageOk]);

  const start = (g = null, t = null) => { setA(blank(g, t)); setSavedAt(null); setView("assess"); setShowSaved(false); window.scrollTo(0, 0); };
  const open = (id) => { const x = list.find((i) => i.id === id); if (!x) return; setA(x); setSavedAt(null); setView("assess"); setShowSaved(false); window.scrollTo(0, 0); };
  const remove = (id) => {
    const x = list.find((i) => i.id === id);
    if (!window.confirm(`Delete "${(x && x.details.project) || "Untitled assessment"}" from this browser? This cannot be undone.`)) return;
    const next = list.filter((i) => i.id !== id);
    setList(next);
    if (storageOk) persist(next);
    if (a && a.id === id) { setA(null); setView("overview"); }
  };
  const goOverview = () => { setView("overview"); window.scrollTo(0, 0); };

  return (
    <>
      <header className="topbar">
        <div className="topbar-in">
          <span className="logo-pill"><img src={LOGO_URL} alt="HSE" /></span>
          <button className="brand" onClick={goOverview}>
            <strong>Aspergillus Control Measures</strong>
            <span>HSE Capital and Estates with Infection Prevention and Control</span>
          </button>
          <span className="spacer" />
          {view === "assess" && <button className="btn btn-ghost" onClick={goOverview}><IBack /> <span className="hide-sm">Overview</span></button>}
          <button className="btn btn-ghost" onClick={() => setShowSaved(true)}><IFolder /> <span className="hide-sm">Saved</span></button>
          <button className="btn btn-apricot" onClick={() => start()}><IPlus /> <span>New</span></button>
        </div>
      </header>
      {!storageOk && <div className="banner">This browser is blocking storage, so assessments will not be kept after you close the page. Download the PDF to keep a record.</div>}
      {view === "overview" || !a
        ? <Overview list={list} onStart={start} onOpen={open} onShowSaved={() => setShowSaved(true)} />
        : <Assess a={a} setA={setA} storageOk={storageOk} savedAt={savedAt} saveFailed={saveFailed} />}
      <footer className="footer">Created by Dave Maher &copy; 2026. HSE Infection Prevention and Control framework.</footer>
      {showSaved && <SavedDialog list={list} onOpen={open} onDelete={remove} onClose={() => setShowSaved(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
