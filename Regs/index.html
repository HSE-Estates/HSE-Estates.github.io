<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RegVault">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>RegVault</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --line:#e2e6ec;
  --ink:#101828; --ink-2:#475467; --ink-3:#8a94a6;
  --accent:#0b6b5e; --accent-ink:#ffffff; --accent-soft:#e3f2ee;
  --warn:#b54708; --warn-soft:#fef0c7; --danger:#b42318; --danger-soft:#fee4e2;
  --mark:#fde68a; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --r:12px; --r-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --line:#2a323d;
    --ink:#e6edf3; --ink-2:#9aa7b6; --ink-3:#6b7787;
    --accent:#2ec4a6; --accent-ink:#04211c; --accent-soft:#123029;
    --warn:#f0b429; --warn-soft:#3a2c0a; --danger:#f97066; --danger-soft:#3d1512;
    --mark:#7a5b00; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --line:#2a323d;
  --ink:#e6edf3; --ink-2:#9aa7b6; --ink-3:#6b7787;
  --accent:#2ec4a6; --accent-ink:#04211c; --accent-soft:#123029;
  --warn:#f0b429; --warn-soft:#3a2c0a; --danger:#f97066; --danger-soft:#3d1512;
  --mark:#7a5b00; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
.hide{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;min-height:100dvh}
header.topbar{
  position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px;font-weight:800}
.searchwrap{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;min-width:0}
.searchwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q{flex:1;border:0;background:transparent;outline:0;min-width:0;padding:4px 0;font-size:16px}
.modeswap{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.modeswap button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.modeswap button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 96px}

nav.tabs{
  position:sticky;bottom:0;z-index:30;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
nav.tabs button[aria-pressed="true"]{color:var(--accent)}
nav.tabs svg{width:20px;height:20px}
@media (min-width:900px){
  nav.tabs{position:fixed;left:0;top:0;bottom:0;width:88px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top) + 72px);justify-content:flex-start;gap:2px}
  nav.tabs button{flex:0 0 auto;padding:12px 4px}
  #app{padding-left:88px}
}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.tight{padding:11px 13px}
.hit{cursor:pointer;transition:border-color .12s,transform .12s}
.hit:hover{border-color:var(--accent)}
.hit:active{transform:scale(.995)}
.hit h3{margin:0 0 4px;font-size:15px;font-weight:650;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:7px}
.tag{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tag.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.snippet{font-size:14px;color:var(--ink-2);line-height:1.55}
.snippet mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.scorebar{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:9px}
.scorebar i{display:block;height:100%;background:var(--accent)}

h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:18px 2px 8px;font-weight:700}
.muted{color:var(--ink-3)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}
.empty h3{margin:0 0 6px;color:var(--ink-2);font-size:16px}

/* ---------- forms ---------- */
label.f{display:block;margin:0 0 10px}
label.f span{display:block;font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=url],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;outline:0;font-size:15px
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:70px;resize:vertical}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.row{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-sm);padding:9px 14px;font-weight:650;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:14px}
.switch input{width:42px;height:24px;appearance:none;background:var(--line);border-radius:999px;position:relative;transition:background .15s;flex:none}
.switch input:checked{background:var(--accent)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- reader ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(8,12,18,.5);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet .panel{background:var(--panel);width:100%;max-width:900px;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:900px){.sheet{align-items:center}.sheet .panel{border-radius:16px;max-height:88dvh}}
.sheet header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.sheet header h3{margin:0;font-size:16px;line-height:1.3;flex:1}
.sheet .body{padding:16px;overflow:auto;flex:1}
.sheet footer{padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.passage{font-size:15.5px;line-height:1.65;white-space:pre-wrap}
.passage.ctx{color:var(--ink-3);font-size:14px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---------- progress / toast ---------- */
.bar{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:up .15s}
.toast.err{background:var(--danger);color:#fff}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.answer{font-size:15px;line-height:1.65}
.answer .cite{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 6px;font-size:12px;font-weight:700;cursor:pointer;margin:0 1px}
.answer h4{margin:14px 0 6px;font-size:14px}
.answer ul{margin:6px 0 6px 18px;padding:0}
.answer p{margin:0 0 10px}
table.lib{width:100%;border-collapse:collapse;font-size:14px}
table.lib th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.lib td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.lib tr:hover td{background:var(--panel-2)}
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--ink-3);background:var(--panel-2)}
.dz.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kbd{font:600 11px var(--mono);background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-2)}
.pdfstage{background:#3a3f46;border-radius:var(--r-sm);padding:10px;overflow:auto;text-align:center}
.pdfstage canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.list-clean{list-style:none;margin:0;padding:0}
.list-clean li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list-clean li:last-child{border-bottom:0}

/* ---------- brief ---------- */
.sev{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin:0 0 12px}
.sev:last-child{margin-bottom:0}
.sev.critical{border-left-color:var(--danger)}
.sev.important{border-left-color:var(--warn)}
.sev.check{border-left-color:var(--accent)}
.sev b{display:block;font-size:14.5px;margin-bottom:3px}
.sev p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
.sevtag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;vertical-align:2px;margin-right:6px}
.sevtag.critical{background:var(--danger-soft);color:var(--danger)}
.sevtag.important{background:var(--warn-soft);color:var(--warn)}
.sevtag.check{background:var(--accent-soft);color:var(--accent)}
.refchip{display:inline-block;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:700;cursor:pointer;margin:4px 4px 0 0}
.refchip:hover{border-color:var(--accent);color:var(--accent)}
.cov{display:flex;flex-wrap:wrap;gap:6px}
.cov span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2)}
.cov span.none{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.cov span.good{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* ---------- flashcards ---------- */
.deckbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;text-align:center;min-width:74px}
.stat b{display:block;font-size:19px;line-height:1.2}
.stat span{font-size:11px;color:var(--ink-3)}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  min-height:230px;display:flex;flex-direction:column;justify-content:center;padding:26px 22px;text-align:center;cursor:pointer}
.flash .qq{font-size:19px;font-weight:650;line-height:1.45}
.flash .aa{font-size:17px;line-height:1.55;color:var(--accent);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.flash .src{font-size:12px;color:var(--ink-3);margin-top:14px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grade button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:11px 4px;font-weight:650;font-size:13px;line-height:1.25}
.grade button small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.grade button.g1{border-color:var(--danger);color:var(--danger)}
.grade button.g4{border-color:var(--accent);color:var(--accent)}
.cardrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cardrow:last-child{border-bottom:0}
</style>
</head>
<body>

<div id="app" class="hide">
  <header class="topbar">
    <div class="brand"><span class="dot">R</span><span>RegVault</span></div>
    <div class="searchwrap" id="searchwrap">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-3);flex:none"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search regulations, clauses, policies…" autocomplete="off" enterkeyhint="search" spellcheck="false">
      <button class="iconbtn hide" id="clearq" style="width:28px;height:28px;border:0;background:transparent" title="Clear">✕</button>
    </div>
    <div class="modeswap" role="group" aria-label="Search mode">
      <button id="mFind" aria-pressed="true">Find</button>
      <button id="mAsk" aria-pressed="false">Ask</button>
    </div>
    <button class="iconbtn" id="syncBtn" title="Sync library">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>

  <div class="filters" id="filters"></div>

  <main>
    <div class="wrap">
      <section id="view-search"></section>
      <section id="view-brief" class="hide"></section>
      <section id="view-cards" class="hide"></section>
      <section id="view-library" class="hide"></section>
      <section id="view-add" class="hide"></section>
      <section id="view-settings" class="hide"></section>
    </div>
  </main>

  <nav class="tabs" id="tabs">
    <button data-view="search" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
    <button data-view="brief" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/></svg>Brief</button>
    <button data-view="cards" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/></svg>Cards</button>
    <button data-view="library" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Library</button>
    <button data-view="settings" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 17 4.6l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
</div>

<div id="gate" class="wrap" style="max-width:440px;padding-top:8vh">
  <div class="card">
    <div class="brand" style="margin-bottom:6px"><span class="dot">R</span><span style="font-size:19px">RegVault</span></div>
    <p class="muted" style="margin:0 0 18px;font-size:14px">Your regulations, technical guidance and policy library — searchable on any device.</p>
    <label class="f"><span>Service address (Apps Script /exec URL)</span>
      <input id="gEndpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label class="f"><span>Access code</span>
      <input id="gCode" type="password" placeholder="XXX-XXX-XXX" autocomplete="current-password"></label>
    <div class="switch"><input type="checkbox" id="gRemember" checked><label for="gRemember">Remember on this device</label></div>
    <button class="btn primary" id="gGo" style="width:100%;margin-top:6px">Connect</button>
    <p id="gMsg" class="muted" style="font-size:13px;margin:12px 0 0"></p>
  </div>
</div>

<div id="toast"></div>
<div id="modal"></div>

<script>
"use strict";
/* ============================================================== state ==== */
const LS = 'regvault.settings.v1';
const state = {
  endpoint:'', code:'', user:null, embeddings:false, firecrawl:false,
  view:'search', mode:'find',
  docs:[], collections:[], filters:{collection:null, superseded:false, internalOnly:false},
  chunks:[], vecs:null, dim:0, inv:null, avgdl:0,
  results:[], lastQuery:'', busy:false
};
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind, ms){
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err'?' err':'');
  el.innerHTML = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>el.remove(), ms || (kind==='err'?6000:2600));
  return el;
}

/* ============================================================== storage == */
const DB = (()=>{
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open('regvault', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if(!db.objectStoreNames.contains('parts')) db.createObjectStore('parts');
        if(!db.objectStoreNames.contains('files')) db.createObjectStore('files');
      };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
    return dbp;
  }
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res,rej)=>{
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch(e){ rej(e); return; }
      t.oncomplete = ()=>res(out && out.result !== undefined ? out.result : out);
      t.onerror = ()=>rej(t.error);
    });
  };
  // Private windows, sandboxed frames and locked-down browsers can refuse
  // IndexedDB outright. Fall back to memory so the app still runs — it just
  // re-downloads the index next launch instead of opening offline.
  const mem = {kv:new Map(), parts:new Map(), files:new Map()};
  let broken = false;
  async function guard(run, fallback){
    if (broken) return fallback();
    try { return await run(); }
    catch(e){
      broken = true;
      if (!DB._warned){ DB._warned = true; setTimeout(()=>toast('This browser is blocking local storage — offline mode is off.','err'), 400); }
      return fallback();
    }
  }
  const DB = {
    get: (store,k)=>guard(()=>tx(store,'readonly',s=>s.get(k)), ()=>mem[store].get(k)),
    put: (store,k,v)=>guard(()=>tx(store,'readwrite',s=>s.put(v,k)), ()=>{ mem[store].set(k,v); }),
    del: (store,k)=>guard(()=>tx(store,'readwrite',s=>s.delete(k)), ()=>{ mem[store].delete(k); }),
    keys: (store)=>guard(()=>tx(store,'readonly',s=>s.getAllKeys()), ()=>Array.from(mem[store].keys())),
    clear: (store)=>guard(()=>tx(store,'readwrite',s=>s.clear()), ()=>{ mem[store].clear(); }),
    get available(){ return !broken; }
  };
  return DB;
})();

/* ============================================================== api ====== */
async function api(action, body, opts){
  if(!state.endpoint) throw new Error('No service address configured.');
  const payload = Object.assign({action, code: state.code}, body||{});
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), (opts&&opts.timeout) || 180000);
  let res;
  try {
    res = await fetch(state.endpoint, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      redirect:'follow',
      signal: ctl.signal
    });
  } catch(e){
    clearTimeout(t);
    throw new Error('Could not reach the service. Check the address and your connection.');
  }
  clearTimeout(t);
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); }
  catch(e){ throw new Error('Unexpected reply from the service (is the deployment set to "Anyone"?)'); }
  if (j.ok === false && j.error === 'auth'){ signOut('Your access code was rejected.'); throw new Error(j.message||'Not authorised'); }
  if (j.ok === false) throw new Error(j.message || j.error || 'Request failed');
  return j;
}

/* ============================================================== vectors == */
function b64ToI8(s){
  const bin = atob(s);
  const a = new Int8Array(bin.length);
  for (let i=0;i<bin.length;i++){ const c = bin.charCodeAt(i); a[i] = c>127 ? c-256 : c; }
  return a;
}

/* ============================================================== text ===== */
const STOP = new Set(('a an the of to in for on with by or and be is are as at from that this these those it its shall must may can should would could not no if then than which who whom whose where when what how any all such other into over under be been being do does did have has had').split(' '));

function tokenize(s){
  const out = [];
  const raw = String(s).toLowerCase().replace(/[‘’]/g,"'").match(/[a-z0-9][a-z0-9.'\-]*/g) || [];
  for (let w of raw){
    w = w.replace(/^[.'-]+|[.'-]+$/g,'');
    if (!w) continue;
    if (/^\d+(\.\d+)+$/.test(w)) { out.push(w); continue; }   // clause numbers kept whole
    if (w.length < 2 || STOP.has(w)) continue;
    out.push(stem(w));
  }
  return out;
}
function stem(w){
  if (w.length < 5) return w;
  return w.replace(/(ations|ation|ings|ing|ies|ied|es|s|ly|ment)$/,'') || w;
}

/* ============================================================== index ==== */
function buildIndex(){
  const chunks = state.chunks;
  const inv = new Map();
  let total = 0;
  for (let i=0;i<chunks.length;i++){
    const c = chunks[i];
    const toks = tokenize((c.h?c.h+' ':'') + (c.c?c.c+' ':'') + c.t);
    c.len = toks.length || 1;
    total += c.len;
    const tf = new Map();
    for (const t of toks) tf.set(t, (tf.get(t)||0)+1);
    for (const [t,n] of tf){
      let p = inv.get(t);
      if (!p) { p = []; inv.set(t, p); }
      p.push(i, n);
    }
  }
  state.inv = inv;
  state.avgdl = chunks.length ? total/chunks.length : 1;

  // pack vectors into one buffer
  const withVec = chunks.filter(c=>c.v);
  if (withVec.length){
    const dim = b64ToI8(withVec[0].v).length;
    state.dim = dim;
    const buf = new Int8Array(chunks.length * dim);
    const has = new Uint8Array(chunks.length);
    for (let i=0;i<chunks.length;i++){
      if (!chunks[i].v) continue;
      const a = b64ToI8(chunks[i].v);
      if (a.length !== dim) continue;
      buf.set(a, i*dim);
      has[i] = 1;
      chunks[i].v = null;                        // free the base64 string
    }
    state.vecs = {buf, has, dim};
  } else {
    state.vecs = null; state.dim = 0;
  }
}

function bm25(qtoks){
  const inv = state.inv, chunks = state.chunks, N = chunks.length;
  if (!N) return new Map();
  const k1 = 1.4, b = 0.72;
  const scores = new Map();
  const counted = new Set();
  for (const t of qtoks){
    if (counted.has(t)) continue;
    counted.add(t);
    const p = inv.get(t);
    if (!p) continue;
    const df = p.length/2;
    const idf = Math.log(1 + (N - df + 0.5)/(df + 0.5));
    for (let j=0;j<p.length;j+=2){
      const i = p[j], f = p[j+1];
      const dl = chunks[i].len;
      const s = idf * (f*(k1+1))/(f + k1*(1 - b + b*dl/state.avgdl));
      scores.set(i, (scores.get(i)||0) + s);
    }
  }
  return scores;
}

function cosineAll(qvecB64){
  const V = state.vecs;
  if (!V || !qvecB64) return null;
  const q = b64ToI8(qvecB64);
  if (q.length !== V.dim) return null;
  const out = new Float32Array(state.chunks.length);
  const dim = V.dim, buf = V.buf, has = V.has;
  for (let i=0;i<out.length;i++){
    if (!has[i]) continue;
    let dot = 0;
    const off = i*dim;
    for (let d=0; d<dim; d++) dot += buf[off+d]*q[d];
    out[i] = dot / 16129;                       // 127*127
  }
  return out;
}

function docById(id){ return state.docs.find(d=>d.docId===id) || {title:'(unknown)', collection:''}; }

function passesFilter(c){
  const d = docById(c.d);
  if (state.filters.collection && d.collection !== state.filters.collection) return false;
  if (!state.filters.superseded && d.status === 'superseded') return false;
  if (state.filters.internalOnly && !d.internal) return false;
  return true;
}

async function runSearch(query, wantVec, presetVec){
  const q = String(query||'').trim();
  if (!q) return [];
  const qtoks = tokenize(q);
  const kw = bm25(qtoks);

  let vec = null;
  if (presetVec && state.vecs){
    vec = cosineAll(presetVec);
  } else if (wantVec && state.embeddings && state.vecs){
    try {
      const r = await api('embedQuery', {q});
      if (r.vec) vec = cosineAll(r.vec);
    } catch(e){ /* keyword-only fallback */ }
  }

  let maxKw = 0;
  for (const v of kw.values()) if (v > maxKw) maxKw = v;
  const candidates = new Set(kw.keys());
  if (vec){
    // add the strongest semantic matches even when no keyword hit
    const idx = [];
    for (let i=0;i<vec.length;i++) if (vec[i] > 0.25) idx.push(i);
    idx.sort((a,b)=>vec[b]-vec[a]);
    for (let i=0;i<Math.min(idx.length, 400); i++) candidates.add(idx[i]);
  }

  const phrase = q.toLowerCase().replace(/\s+/g,' ').trim();
  const clauseQ = (q.match(/\b\d+(?:\.\d+){1,4}\b/)||[])[0] || '';
  const rawWords = phrase.split(' ').filter(w=>w.length>2);

  const out = [];
  for (const i of candidates){
    const c = state.chunks[i];
    if (!c || !passesFilter(c)) continue;
    const k = maxKw ? (kw.get(i)||0)/maxKw : 0;
    const v = vec ? Math.max(0, vec[i]) : 0;
    let score = vec ? (0.55*k + 0.45*v) : k;

    const low = c.t.toLowerCase();
    if (phrase.length>6 && low.includes(phrase)) score += 0.22;
    if (clauseQ && (String(c.c)===clauseQ || low.indexOf(clauseQ)>=0)) score += 0.30;
    const d = docById(c.d);
    const title = (d.title+' '+(d.docRef||'')).toLowerCase();
    let tHit = 0;
    for (const w of rawWords) if (title.includes(w)) tHit++;
    if (tHit) score += Math.min(0.12, tHit*0.05);
    if (d.status === 'superseded') score *= 0.6;

    out.push({i, score, kw:k, vec:v});
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0, 60);
}

/* ============================================================== snippets = */
function snippet(text, query, len){
  len = len || 300;
  const words = Array.from(new Set(String(query).toLowerCase().match(/[a-z0-9][a-z0-9.\-]*/g)||[])).filter(w=>w.length>2 && !STOP.has(w));
  const low = text.toLowerCase();
  let best = 0, bestScore = -1;
  const step = 40;
  for (let s=0; s<Math.max(1, text.length-len); s+=step){
    const seg = low.slice(s, s+len);
    let sc = 0;
    for (const w of words){ let p = seg.indexOf(w); if (p>=0) sc += 1 + (seg.indexOf(w, p+1)>=0?0.3:0); }
    if (sc > bestScore){ bestScore = sc; best = s; }
  }
  let start = best;
  if (start > 0){ const sp = text.indexOf(' ', start); if (sp>=0 && sp-start<25) start = sp+1; }
  let out = text.slice(start, start+len).trim();
  if (start > 0) out = '… ' + out;
  if (start+len < text.length) out = out + ' …';
  return highlight(out, words);
}
function highlight(text, words){
  let html = esc(text);
  if (!words.length) return html;
  const pat = words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|');
  try { html = html.replace(new RegExp('('+pat+')','gi'), '<mark>$1</mark>'); } catch(e){}
  return html;
}

/* ============================================================== sync ===== */
async function sync(force){
  if (state.busy) return;
  state.busy = true;
  const t = toast('<span class="spin"></span> Syncing library…', null, 60000);
  try {
    const m = await api('manifest');
    state.docs = m.docs || [];
    state.collections = m.collections || [];
    state.embeddings = !!m.embeddings;

    const localStamps = (await DB.get('kv','stamps')) || {};
    const chunks = [];
    let fetched = 0;

    for (const d of state.docs){
      const key = 'doc:'+d.docId;
      let cached = (!force && localStamps[d.docId] === d.stamp) ? await DB.get('parts', key) : null;
      if (!cached){
        const all = [];
        for (const p of (d.parts||[])){
          t.innerHTML = '<span class="spin"></span> Downloading “'+esc(d.title.slice(0,40))+'” part '+(p.part+1)+'/'+d.parts.length;
          const r = await api('docIndex', {docId:d.docId, part:p.part});
          for (const c of (r.chunks||[])) all.push(c);
        }
        cached = all;
        await DB.put('parts', key, all);
        localStamps[d.docId] = d.stamp;
        fetched++;
      }
      for (let n=0;n<cached.length;n++){
        const c = cached[n];
        chunks.push({d:d.docId, n, p:c.p, h:c.h, c:c.c, t:c.t, v:c.v||''});
      }
    }
    // drop caches for documents that are gone
    const live = new Set(state.docs.map(d=>'doc:'+d.docId));
    for (const k of await DB.keys('parts')) if (!live.has(k)) await DB.del('parts', k);
    for (const id of Object.keys(localStamps)) if (!state.docs.some(d=>d.docId===id)) delete localStamps[id];
    await DB.put('kv','stamps', localStamps);
    await DB.put('kv','docs', state.docs);

    state.chunks = chunks;
    buildIndex();
    renderFilters();
    if (state.view==='library') renderLibrary();
    t.remove();
    toast('Library ready — '+state.docs.length+' documents, '+chunks.length.toLocaleString()+' passages'+(fetched?' ('+fetched+' updated)':''));
  } catch(e){
    t.remove();
    toast(esc(e.message), 'err');
  } finally {
    state.busy = false;
  }
}

async function loadFromCache(){
  const docs = await DB.get('kv','docs');
  if (!docs || !docs.length) return false;
  state.docs = docs;
  state.collections = Array.from(new Set(docs.map(d=>d.collection).filter(Boolean))).sort();
  const chunks = [];
  for (const d of docs){
    const cached = await DB.get('parts','doc:'+d.docId);
    if (!cached) continue;
    for (let n=0;n<cached.length;n++){
      const c = cached[n];
      chunks.push({d:d.docId, n, p:c.p, h:c.h, c:c.c, t:c.t, v:c.v||''});
    }
  }
  if (!chunks.length) return false;
  state.chunks = chunks;
  buildIndex();
  renderFilters();
  return true;
}

/* ============================================================== views ==== */
function setView(v){
  if (state.view==='cards' && v!=='cards') flushReviews();
  state.view = v;
  ['search','brief','cards','library','add','settings'].forEach(x=>{
    $('#view-'+x).classList.toggle('hide', x!==v);
  });
  $$('#tabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.view===v || (v==='add' && b.dataset.view==='library'))));
  $('#filters').classList.toggle('hide', v!=='search');
  if (v==='search' && !$('#view-search').innerHTML.trim()) renderSearchHome();
  if (v==='library') renderLibrary();
  if (v==='add') renderAdd();
  if (v==='brief') renderBrief();
  if (v==='cards') renderCards();
  if (v==='settings') renderSettings();
  window.scrollTo(0,0);
  document.querySelector('main').scrollTop = 0;
}

function renderFilters(){
  const f = $('#filters');
  const cols = state.collections;
  let html = '<button class="chip" data-col="" aria-pressed="'+(!state.filters.collection)+'">All</button>';
  for (const c of cols){
    html += '<button class="chip" data-col="'+esc(c)+'" aria-pressed="'+(state.filters.collection===c)+'">'+esc(c)+'</button>';
  }
  if (state.user && state.user.internal && state.docs.some(d=>d.internal)){
    html += '<button class="chip" data-toggle="internalOnly" aria-pressed="'+state.filters.internalOnly+'">Internal only</button>';
  }
  html += '<button class="chip" data-toggle="superseded" aria-pressed="'+state.filters.superseded+'">Include superseded</button>';
  f.innerHTML = html;
  f.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{
    state.filters.collection = b.dataset.col || null;
    renderFilters(); doSearch();
  });
  f.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.toggle;
    state.filters[k] = !state.filters[k];
    renderFilters(); doSearch();
  });
}

/* ---------- search view ---------- */
let searchTimer = null;
function onQueryInput(){
  $('#clearq').classList.toggle('hide', !$('#q').value);
  clearTimeout(searchTimer);
  if (state.mode==='ask') return;
  searchTimer = setTimeout(()=>doSearch(), 220);
}

async function doSearch(){
  const q = $('#q').value.trim();
  state.lastQuery = q;
  const v = $('#view-search');
  if (!q){ renderSearchHome(); return; }
  if (!state.chunks.length){
    v.innerHTML = emptyState('Nothing indexed yet', 'Add documents on the Add tab, then sync.');
    return;
  }

  if (state.mode==='ask'){ return; }

  v.innerHTML = '<p class="muted" style="padding:8px 2px"><span class="spin"></span> Searching…</p>';
  const hits = await runSearch(q, true);
  if (q !== state.lastQuery) return;
  state.results = hits;
  if (!hits.length){
    v.innerHTML = emptyState('No matches', 'Try fewer words, a clause number like 3.2.1, or turn on “Include superseded”.');
    return;
  }
  let html = '<h2 class="sec">'+hits.length+' passage'+(hits.length===1?'':'s')+(state.vecs&&state.embeddings?' · keyword + meaning':' · keyword')+'</h2>';
  hits.forEach((h,ix)=>{ html += hitCard(h, q, ix); });
  v.innerHTML = html;
  v.querySelectorAll('.hit').forEach(el=>el.onclick=()=>openReader(Number(el.dataset.i)));
}

function hitCard(h, q, ix){
  const c = state.chunks[h.i];
  const d = docById(c.d);
  const loc = [c.c ? 'Clause '+esc(c.c) : '', c.p ? 'p.'+c.p : ''].filter(Boolean).join(' · ');
  return '<article class="card hit" data-i="'+h.i+'">'
    + '<div class="meta">'
    + '<span class="tag accent">'+esc(d.collection||'—')+'</span>'
    + (d.docRef?'<span class="tag">'+esc(d.docRef)+'</span>':'')
    + (d.internal?'<span class="tag warn">Internal</span>':'')
    + (d.status==='superseded'?'<span class="tag danger">Superseded</span>':'')
    + (loc?'<span>'+loc+'</span>':'')
    + '</div>'
    + '<h3>'+esc(c.h || d.title)+'</h3>'
    + (c.h ? '<div class="muted" style="font-size:12.5px;margin:-2px 0 7px">'+esc(d.title)+'</div>' : '')
    + '<div class="snippet">'+snippet(c.t, q)+'</div>'
    + '<div class="scorebar"><i style="width:'+Math.round(Math.min(1,h.score)*100)+'%"></i></div>'
    + '</article>';
}

function emptyState(title, sub){
  return '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>'

}

/* ---------- ask ---------- */
async function doAsk(){

    const top = hits.slice(0,12).map(h=>{
      const c = state.chunks[h.i], d = docById(c.d);
      return {title:d.title+(d.docRef?' ('+d.docRef+')':''), clause:c.c, page:c.p, text:c.t, _i:h.i};
    });
    v.innerHTML = '<div class="card"><p class="muted" style="margin:0"><span class="spin"></span> Drafting a cited answer…</p></div>';
    const r = await api('ask', {q, passages: top.map(p=>({title:p.title, clause:p.clause, page:p.page, text:p.text}))});
    let html = '<div class="card"><div class="meta"><span class="tag accent">Answer</span><span>from '+top.length+' passages</span></div>'
      + '<div class="answer">'+formatAnswer(r.answer)+'</div>'
      + '<p class="muted" style="font-size:12px;margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px">'
      + 'Generated from your indexed extracts. Always confirm against the published document before relying on it.</p></div>';
    html += '<h2 class="sec">Sources</h2>';
    top.forEach((p,ix)=>{
      const h = hits[ix];
      html += '<article class="card tight hit" data-i="'+p._i+'"><div class="meta"><span class="tag accent">['+(ix+1)+']</span>'
        + '<span>'+esc(p.title)+'</span>'+(p.clause?'<span class="tag">'+esc(p.clause)+'</span>':'')+(p.page?'<span>p.'+p.page+'</span>':'')+'</div>'
        + '<div class="snippet">'+snippet(p.text, q, 220)+'</div></article>';
    });
    v.innerHTML = html;
    v.querySelectorAll('.hit').forEach(el=>el.onclick=()=>openReader(Number(el.dataset.i)));
    v.querySelectorAll('.cite').forEach(el=>el.onclick=()=>{
      const n = Number(el.dataset.n)-1;
      if (top[n]) openReader(top[n]._i);
    });
  } catch(e){
    v.innerHTML = '<div class="card"><p style="margin:0;color:var(--danger)">'+esc(e.message)+'</p></div>';
  }
}

function formatAnswer(md){
  let h = esc(md||'');
  h = h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h4>$1</h4>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  h = h.replace(/\[(\d{1,2})\]/g, (m,n)=>'<span class="cite" data-n="'+n+'">'+n+'</span>');
  h = h.split(/\n{2,}/).map(p=>{
    if (/^\s*[-*]\s/m.test(p) && p.split('\n').every(l=>/^\s*[-*]\s|^\s*$/.test(l))){
      return '<ul>'+p.split('\n').filter(l=>l.trim()).map(l=>'<li>'+l.replace(/^\s*[-*]\s/,'')+'</li>').join('')+'</ul>';
    }
    if (/^<h4>/.test(p)) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return h;
}

function openReader(i){
  const c = state.chunks[i];

  const q = state.lastQuery;
  const words = Array.from(new Set(String(q).toLowerCase().match(/[a-z0-9][a-z0-9.\-]*/g)||[])).filter(w=>w.length>2 && !STOP.has(w));

  const sibs = state.chunks;
  const prev = (i>0 && sibs[i-1].d===c.d) ? sibs[i-1] : null;
  const next = (i+1<sibs.length && sibs[i+1].d===c.d) ? sibs[i+1] : null;

  const head = '<div class="meta" style="margin-bottom:2px"><span class="tag accent">'+esc(d.collection||'—')+'</span>'
    + (d.docRef?'<span class="tag">'+esc(d.docRef)+'</span>':'')
    + (d.edition?'<span class="tag">'+esc(d.edition)+'</span>':'')
    + (d.internal?'<span class="tag warn">Internal</span>':'')
    + (d.status==='superseded'?'<span class="tag danger">Superseded</span>':'')
    + '</div>' + esc(d.title);

  let body = '';
  if (c.h || c.c) body += '<div style="font-weight:700;margin-bottom:8px">'+esc([c.c,c.h].filter(Boolean).join('  '))+'</div>';
  if (c.p) body += '<div class="muted" style="font-size:12.5px;margin-bottom:12px">Page '+c.p+'</div>';
  if (prev) body += '<div class="passage ctx">'+highlight(prev.t.slice(-320), words)+'</div><div class="divider"></div>';
  body += '<div class="passage">'+highlight(c.t, words)+'</div>';
  if (next) body += '<div class="divider"></div><div class="passage ctx">'+highlight(next.t.slice(0,320), words)+'</div>';

  const foot = '<button class="btn" id="rPrev"'+(prev?'':' disabled')+'>← Previous</button>'
    + '<button class="btn" id="rNext"'+(next?'':' disabled')+'>Next →</button>'
    + '<div style="flex:1"></div>'
    + (state.embeddings ? '<button class="btn" id="rCard">Make card</button>' : '')
    + '<button class="btn" id="rCite">Copy citation</button>'
    + (d.driveFileId ? '<button class="btn primary" id="rPdf">Open document</button>' : '');

  showSheet(head, body, foot);
  if ($('#rCard')) $('#rCard').onclick = ()=>makeCardsFrom([{
    docId:d.docId, title:d.title, clause:c.c, page:c.p, text:c.t, tags:d.tags||''
  }], d.collection || 'General', 2);
  if (prev) $('#rPrev').onclick = ()=>openReader(i-1);
  if (next) $('#rNext').onclick = ()=>openReader(i+1);
  $('#rCite').onclick = ()=>{
    const cite = [d.title, d.docRef, d.edition, c.c?('clause '+c.c):'', c.p?('p. '+c.p):''].filter(Boolean).join(', ');
    navigator.clipboard.writeText(cite).then(()=>toast('Citation copied')).catch(()=>toast('Copy failed','err'));
  };

}

/* ---------- pdf viewer ---------- */
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res(window.pdfjsLib);
    };
    s.onerror = ()=>rej(new Error('Could not load the PDF engine (needs internet the first time).'));
    document.head.appendChild(s);
  });
  return pdfjsReady;
}

async function getPdfBytes(docId, onProgress){
  const cached = await DB.get('files','pdf:'+docId);
  if (cached) return cached;
  let part = 0, out = [], total = 0, driveUrl = '';
  for(;;){
    const r = await api('pdf', {docId, part});
    driveUrl = r.driveUrl || driveUrl;
    const bin = atob(r.b64 || '');
    const a = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
    out.push(a); total += a.length;
    if (onProgress) onProgress(total, r.total||0);
    if (r.done || !r.b64) break;
    part++;
    if (part > 40) break;
  }
  const buf = new Uint8Array(total);
  let off = 0;
  for (const a of out){ buf.set(a, off); off += a.length; }
  try { if (total < 30*1024*1024) await DB.put('files','pdf:'+docId, buf); } catch(e){}
  buf._driveUrl = driveUrl;
  return buf;
}

async function openPdf(d, page){
  showSheet(esc(d.title), '<p class="muted" id="pdfMsg"><span class="spin"></span> Fetching document…</p><div class="bar"><i id="pdfBar" style="width:0"></i></div>', '');
  try {
    const [lib, bytes] = await Promise.all([
      loadPdfJs(),
      getPdfBytes(d.docId, (got,tot)=>{ const b=$('#pdfBar'); if(b&&tot) b.style.width = Math.round(got/tot*100)+'%'; })
    ]);
    const pdf = await lib.getDocument({data: bytes.slice(0)}).promise;
    let cur = Math.min(Math.max(1, page||1), pdf.numPages);
    let scale = 1.3;
    const panel = $('#sheet .body');
    const footer = $('#sheet footer');
    panel.innerHTML = '<div class="pdfstage"><canvas id="pdfCanvas"></canvas></div>';
    footer.innerHTML = '<button class="btn" id="pPrev">←</button>'
      + '<span id="pNum" class="muted" style="align-self:center;min-width:88px;text-align:center"></span>'
      + '<button class="btn" id="pNext">→</button>'
      + '<button class="btn" id="pOut">−</button><button class="btn" id="pIn">+</button>'
      + '<div style="flex:1"></div>'
      + '<a class="btn" href="https://drive.google.com/file/d/'+esc(d.driveFileId)+'/view" target="_blank" rel="noopener">Drive</a>';
    async function draw(){
      const p = await pdf.getPage(cur);
      const vp = p.getViewport({scale: scale * (window.devicePixelRatio>1?1.4:1)});
      const cv = $('#pdfCanvas');
      cv.width = vp.width; cv.height = vp.height;
      cv.style.width = Math.round(vp.width/(window.devicePixelRatio>1?1.4:1))+'px';
      await p.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      $('#pNum').textContent = cur+' / '+pdf.numPages;
    }
    $('#pPrev').onclick = ()=>{ if(cur>1){cur--;draw();} };
    $('#pNext').onclick = ()=>{ if(cur<pdf.numPages){cur++;draw();} };
    $('#pIn').onclick = ()=>{ scale=Math.min(3,scale+0.25); draw(); };
    $('#pOut').onclick = ()=>{ scale=Math.max(0.5,scale-0.25); draw(); };
    await draw();
  } catch(e){
    const b = $('#sheet .body');
    if (b) b.innerHTML = '<p style="color:var(--danger)">'+esc(e.message)+'</p>'
      + (d.driveFileId?'<p><a href="https://drive.google.com/file/d/'+esc(d.driveFileId)+'/view" target="_blank" rel="noopener">Open in Google Drive instead</a></p>':'');
  }
}

function updJob(j, status, pct, error){
  j.status = status; if (pct!=null) j.pct = pct; if (error) j.error = error;
  renderQueue();
}

async function handleFiles(files){
  for (const f of files){
    try { await ingestFile(f, currentMeta()); }
    catch(e){ toast(esc(e.message),'err'); }
  }
  sync(false);
}

async function fetchUrlDoc(){
  const url = $('#urlPdf').value.trim();
  if (!url) return;
  const j = pushJob(url.split('/').pop().slice(0,60));
  try {
    updJob(j,'downloading',0.05);
    const bytes = await fetchRemote(url, (g,t)=>updJob(j,'downloading', t?0.05+0.25*(g/t):0.1));
    const name = decodeURIComponent(url.split('/').pop().split('?')[0]) || 'document.pdf';
    const file = new File([bytes], name, {type:'application/pdf'});
    await ingestFile(file, Object.assign(currentMeta(), {sourceUrl:url}), j);
    $('#urlPdf').value = '';
    sync(false);
  } catch(e){ updJob(j,'failed', j.pct, e.message); }
}

async function fetchRemote(url, onProgress){
  let part = 0, out = [], total = 0;
  for(;;){
    const r = await api('fetchUrl', {url, part});
    const bin = atob(r.b64||'');
    const a = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    out.push(a); total += a.length;
    if (onProgress) onProgress(total, r.total||0);
    if (r.done || !r.b64) break;
    part++;
    if (part>40) break;
  }
  const buf = new Uint8Array(total);
  let off=0; for (const a of out){ buf.set(a,off); off+=a.length; }
  return buf;
}

    let html = '<div class="divider"></div><div class="muted" style="font-size:12.5px;margin-bottom:6px">'+r.pdfs.length+' documents found via '+esc(r.via)+' — tick the ones you want</div>';
    html += '<div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px">';
    r.pdfs.forEach((p,ix)=>{
      const label = p.text || decodeURIComponent(p.url.split('/').pop());
      html += '<label style="display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px">'
        + '<input type="checkbox" data-pdf="'+ix+'" style="margin-top:3px;flex:none">'
        + '<span><b>'+esc(label.slice(0,110))+'</b><br><span class="muted" style="font-size:11.5px;word-break:break-all">'+esc(p.url)+'</span></span></label>';
    });
    html += '</div><div class="btnrow" style="margin-top:10px"><button class="btn primary" id="btnGrab">Add selected</button>'
      + '<button class="btn" id="btnAllPdf">Select all</button></div>';
    box.innerHTML = html;
    $('#btnAllPdf').onclick = ()=>box.querySelectorAll('[data-pdf]').forEach(cb=>cb.checked=true);
    $('#btnGrab').onclick = async ()=>{
      const picks = Array.from(box.querySelectorAll('[data-pdf]:checked')).map(cb=>r.pdfs[Number(cb.dataset.pdf)]);
      if (!picks.length) return;
      $('#btnGrab').disabled = true;
      for (const p of picks){
        const j = pushJob((p.text||p.url.split('/').pop()).slice(0,60));
        try {
          updJob(j,'downloading',0.05);
          const bytes = await fetchRemote(p.url, (g,t)=>updJob(j,'downloading', t?0.05+0.25*(g/t):0.1));
          const name = decodeURIComponent(p.url.split('/').pop().split('?')[0]) || 'document.pdf';
          const file = new File([bytes], name, {type:'application/pdf'});
          await ingestFile(file, Object.assign(currentMeta(), {sourceUrl:p.url, title:(p.text||'').slice(0,140)||undefined}), j);
        } catch(e){ updJob(j,'failed', j.pct, e.message); }
      }
      $('#btnGrab').disabled = false;
      sync(false);
    };
  } catch(e){
    box.innerHTML = '<p style="color:var(--danger)">'+esc(e.message)+'</p>';
  }
}

/* ---------- extraction ---------- */
function cleanTitle(name){
  return name.replace(/\.[a-z0-9]+$/i,'').replace(/[_+]+/g,' ').replace(/\s{2,}/g,' ')
    .replace(/\b(\d{4})\b/, '$1').trim().slice(0,150);
}

async function extractPdf(file, onProgress){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data: buf}).promise;
  const pages = [];
  for (let n=1; n<=pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const lines = [];
    let cur = null;
    const items = tc.items.slice().sort((a,b)=>{
      const dy = b.transform[5]-a.transform[5];
      if (Math.abs(dy) > 2.5) return dy;
      return a.transform[4]-b.transform[4];
    });
    for (const it of items){
      const y = it.transform[5];
      const size = Math.abs(it.transform[0]) || it.height || 10;
      if (!cur || Math.abs(cur.y - y) > 2.5){
        cur = {y, size, text: it.str};
        lines.push(cur);
      } else {
        const needsSpace = cur.text && !/[\s\-‐-―]$/.test(cur.text) && !/^\s/.test(it.str);
        cur.text += (needsSpace ? ' ' : '') + it.str;
        cur.size = Math.max(cur.size, size);
      }
    }
    pages.push({page:n, lines: lines.map(l=>({text:l.text.replace(/\s+/g,' ').trim(), size:l.size})).filter(l=>l.text)});
    if (onProgress) onProgress(n, pdf.numPages);
  }
  let title = '';
  try { const md = await pdf.getMetadata(); title = (md.info && md.info.Title) || ''; } catch(e){}
  return {pages, numPages: pdf.numPages, title: (title||'').trim()};
}

let mammothReady = null;
function loadMammoth(){
  if (mammothReady) return mammothReady;
  mammothReady = new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    s.onload = ()=>res(window.mammoth);
    s.onerror = ()=>rej(new Error('Could not load the Word reader (needs internet the first time).'));
    document.head.appendChild(s);
  });
  return mammothReady;
}

async function extractDocx(file){
  const m = await loadMammoth();
  const r = await m.convertToHtml({arrayBuffer: await file.arrayBuffer()});
  const div = document.createElement('div');
  div.innerHTML = r.value;
  const lines = [];
  div.querySelectorAll('h1,h2,h3,h4,h5,p,li,td').forEach(el=>{
    const t = (el.textContent||'').replace(/\s+/g,' ').trim();
    if (!t) return;
    const heading = /^H[1-5]$/.test(el.tagName);
    lines.push({text:t, size: heading ? 18 : 10});
  });
  // synthetic pages of ~45 lines so citations still have a locator
  const pages = [];
  for (let i=0;i<lines.length;i+=45) pages.push({page: pages.length+1, lines: lines.slice(i, i+45)});
  return {pages, numPages: pages.length, title:''};
}

async function extractPlain(file){
  let text = await file.text();
  if (/\.html?$/i.test(file.name)){
    const d = document.createElement('div');
    d.innerHTML = text.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
    text = d.textContent || '';
  }
  const lines = text.split(/\r?\n/).map(t=>({text:t.replace(/\s+/g,' ').trim(), size:10})).filter(l=>l.text);
  const pages = [];
  for (let i=0;i<lines.length;i+=50) pages.push({page: pages.length+1, lines: lines.slice(i, i+50)});
  return {pages, numPages: pages.length, title:''};
}

const CLAUSE_RE = /^((?:\d{1,3}(?:\.\d{1,3}){1,4})|(?:[A-Z]\d{1,3}(?:\.\d{1,3}){0,3})|(?:Table\s+\d+[\.\d]*)|(?:Diagram\s+\d+[\.\d]*)|(?:Appendix\s+[A-Z0-9]+)|(?:Section\s+\d+[\.\d]*)|(?:Part\s+[A-Z0-9]+))[\s:.–-]+(.*)$/;

function chunkPages(pages, target, overlap){
  target = target || 1100; overlap = overlap || 160;
  // work out the body text size so we can spot headings
  const sizes = {};
  pages.forEach(p=>p.lines.forEach(l=>{ const k = Math.round(l.size); sizes[k]=(sizes[k]||0)+l.text.length; }));
  let body = 10, bestN = -1;
  Object.keys(sizes).forEach(k=>{ if (sizes[k] > bestN){ bestN = sizes[k]; body = Number(k); } });

  const chunks = [];
  let buf = '', bufPage = 1, head = '', clause = '';
  const flush = () => {
    const t = buf.trim();
    if (t.length > 40) chunks.push({p:bufPage, h:head, clause:clause, t:t});
    buf = '';
  };

  for (const pg of pages){
    for (const line of pg.lines){
      const txt = line.text;
      if (!txt) continue;
      if (/^(page\s+)?\d{1,4}(\s+of\s+\d+)?$/i.test(txt)) continue;    // page furniture

      const m = txt.match(CLAUSE_RE);
      const looksHeading =
        (m && txt.length < 160) ||
        (line.size > body + 0.9 && txt.length < 140) ||
        (/^[A-Z0-9][A-Z0-9 ,&()\/'\-]{4,80}$/.test(txt) && txt.length < 90);

      if (looksHeading){
        // a new numbered clause always starts a new passage once there is real
        // content behind it, so short clauses keep their own citation
        const held = buf.trim().length;
        if (held > target*0.35 || (held > 120 && (m || clause))) flush();
        if (m){ clause = m[1]; head = (m[2]||'').trim() || head; }
        else { head = txt; clause = ''; }
        if (!buf) bufPage = pg.page;
        buf += (buf?'\n':'') + txt;
        continue;
      }
      if (!buf) bufPage = pg.page;
      buf += (buf?'\n':'') + txt;
      if (buf.length >= target){
        const tail = buf.slice(-overlap);
        flush();
        const cut = tail.indexOf(' ');
        buf = cut>0 ? tail.slice(cut+1) : tail;
        bufPage = pg.page;
      }
    }
  }
  flush();
  return chunks;
}

async function ingestFile(file, meta, job){
  const j = job || pushJob(file.name);
  const name = file.name;
  updJob(j,'reading text', 0.3);

  let ex;
  if (/\.pdf$/i.test(name) || file.type==='application/pdf'){
    ex = await extractPdf(file, (n,t)=>updJob(j,'reading page '+n+'/'+t, 0.30+0.25*(n/t)));
  } else if (/\.docx$/i.test(name)){
    ex = await extractDocx(file);
  } else {
    ex = await extractPlain(file);
  }

  const chunks = chunkPages(ex.pages);
  if (!chunks.length) throw new Error('No readable text found in '+name+' (it may be a scan — OCR it first).');

  const m = Object.assign({}, meta);
  m.title = (meta.title || ex.title || cleanTitle(name)).slice(0,180);
  m.pages = ex.numPages;

  updJob(j,'creating record', 0.56);
  const {docId} = await api('beginDoc', {meta:m});

  // upload the original, in 3 MB slices
  updJob(j,'uploading file', 0.6);
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (bytes.length > 32*1024*1024) throw new Error(name+' is larger than 32 MB — split it first.');
  const SLICE = 8*1024*1024;
  const parts = Math.max(1, Math.ceil(bytes.length/SLICE));
  for (let i=0;i<parts;i++){
    const sl = bytes.subarray(i*SLICE, Math.min(bytes.length,(i+1)*SLICE));
    await api('uploadPart', {docId, index:i, b64: u8ToB64(sl)});
    updJob(j,'uploading file '+(i+1)+'/'+parts, 0.6+0.12*((i+1)/parts));
  }
  await api('finishUpload', {docId, count:parts, filename:name, mime: file.type||'application/pdf'});

  // send chunks for embedding, in batches
  const BATCH = 40;
  let embedWarn = '';
  for (let i=0, seq=0; i<chunks.length; i+=BATCH, seq++){
    const slice = chunks.slice(i, i+BATCH);
    const r = await api('addChunks', {docId, seq, chunks: slice});
    if (r.embedError && !embedWarn) embedWarn = r.embedError;
    updJob(j,'indexing '+Math.min(i+BATCH, chunks.length)+'/'+chunks.length+' passages', 0.72+0.25*((i+BATCH)/chunks.length));
  }
  if (embedWarn) toast('Stored as keyword-only — embedding said: '+esc(embedWarn), 'err', 9000);

  await api('commitDoc', {docId, pages: ex.numPages});
  updJob(j,'done', 1);
  toast('Added “'+esc(m.title.slice(0,50))+'” — '+chunks.length+' passages');
  return docId;
}

function u8ToB64(u8){
  let s = '';
  const step = 0x8000;
  for (let i=0;i<u8.length;i+=step) s += String.fromCharCode.apply(null, u8.subarray(i, i+step));
  return btoa(s);
}

const briefState = { profileId:'acute', notes:'', result:null, refs:[], coverage:[], saved:null, savedList:[] };

function findChunkFor(docId, page, clause){
  let best = -1;
  for (let i=0;i<state.chunks.length;i++){
    const c = state.chunks[i];
    if (c.d !== docId) continue;
    if (clause && String(c.c) === String(clause)) return i;
    if (page && Number(c.p) === Number(page) && best < 0) best = i;
    if (best < 0) best = i;
  }
  return best;
}

/* ---------- retrieval across a profile's themes ---------- */
async function retrieveThemes(profile, notes, onStep){
  const themes = profile.themes.map(t=>({name:t.name, q:t.q.slice()}));
  const extra = notes.trim();
  if (extra) themes.push({name:'Your project notes', q:[extra.slice(0,400)]});

  const flat = [];
  themes.forEach((t,ti)=>t.q.forEach(q=>flat.push({ti,q})));

  let vecs = [];
  if (state.embeddings && state.vecs){
    if (onStep) onStep('understanding the brief');
    try {
      const r = await api('embedQueries', {qs: flat.map(x=>x.q)});
      vecs = r.vecs || [];
    } catch(e){ vecs = []; }
  }

  const per = themes.map(()=>new Map());
  for (let i=0;i<flat.length;i++){
    if (onStep) onStep('searching ('+(i+1)+'/'+flat.length+')');
    const hits = await runSearch(flat[i].q, false, vecs[i] || null);
    for (const h of hits.slice(0,5)){
      const prev = per[flat[i].ti].get(h.i);
      if (!prev || h.score > prev) per[flat[i].ti].set(h.i, h.score);
    }
  }

  const used = new Set();
  const chosen = [], coverage = [];
  let budget = 26;
  themes.forEach((t,ti)=>{
    const ranked = Array.from(per[ti].entries())
      .filter(e=>e[1] > 0.10)
      .sort((a,b)=>b[1]-a[1]);
    const take = [];
    for (const [ix] of ranked){
      if (take.length >= 3 || budget <= 0) break;
      if (used.has(ix)) continue;
      used.add(ix); budget--; take.push(ix);
    }
    coverage.push({name:t.name, n:take.length});
    if (take.length) chosen.push({name:t.name, idx:take});
  });

  const refs = [];
  const payload = chosen.map(t=>({
    name: t.name,
    passages: t.idx.map(ix=>{
      const c = state.chunks[ix], d = docById(c.d);
      const n = refs.length + 1;
      refs.push({n, i:ix, docId:c.d, title:d.title, docRef:d.docRef, clause:c.c, page:c.p,
                 snippet:c.t.slice(0,180), internal:!!d.internal});
      return {n, title: d.title + (d.docRef ? ' ('+d.docRef+')' : ''), clause:c.c, page:c.p, text:c.t};
    })
  }));

  return {payload, refs, coverage, missing: coverage.filter(c=>!c.n).map(c=>c.name)};
}

async function buildBrief(){
  if (!state.chunks.length){ toast('Add some documents first.','err'); return; }
  if (!state.embeddings){ toast('Briefs need a Gemini key on the service.','err'); return; }
  const profile = PROFILES.find(p=>p.id===briefState.profileId) || PROFILES[0];
  const notes = briefState.notes;
  const out = $('#bOut');
  const setMsg = m => { out.innerHTML = '<div class="card"><p class="muted" style="margin:0"><span class="spin"></span> '+esc(m)+'</p></div>'; };
  setMsg('reading the library');
  $('#bGo').disabled = true;
  try {
    const found = await retrieveThemes(profile, notes, setMsg);
    briefState.refs = found.refs;
    briefState.coverage = found.coverage;
    if (!found.payload.length){
      out.innerHTML = '<div class="card"><p style="margin:0">Nothing in your library matched this project type yet. '
        + 'Add the relevant guidance first — the themes it looked for were:</p>'
        + '<div class="cov" style="margin-top:10px">'+found.coverage.map(c=>'<span class="none">'+esc(c.name)+'</span>').join('')+'</div></div>';
      return;
    }
    setMsg('writing the brief');
    const r = await api('brief', {profile: profile.label, notes, themes: found.payload, missing: found.missing});
    briefState.result = {profile: profile.label, notes, brief: r.brief, refs: found.refs, coverage: found.coverage};
    renderBriefResult(briefState.result);
  } catch(e){
    out.innerHTML = '<div class="card"><p style="margin:0;color:var(--danger)">'+esc(e.message)+'</p></div>';
  } finally {

    }).filter(Boolean).slice(0,16);

function briefToText(res){
  const b = res.brief || {};
  const L = [];
  L.push(res.profile);
  if (res.notes) L.push(res.notes);
  L.push('');
  if (b.summary) { L.push(b.summary); L.push(''); }
  (b.sections||[]).forEach(s=>{
    L.push('## ' + (s.theme||''));
    (s.watchOuts||[]).forEach(w=>{
      L.push('- [' + (w.severity||'check').toUpperCase() + '] ' + (w.point||''));
      if (w.detail) L.push('    ' + w.detail);
      (w.refs||[]).forEach(n=>{
        const r = (res.refs||[]).find(x=>x.n===n);
        if (r) L.push('    ref ' + n + ': ' + r.title + (r.clause?', clause '+r.clause:'') + (r.page?', p.'+r.page:''));
      });
    });
    L.push('');
  });
  if ((b.earlyDecisions||[]).length){ L.push('## Settle early'); b.earlyDecisions.forEach(x=>L.push('- '+x)); L.push(''); }
  if ((b.gaps||[]).length){ L.push('## Gaps in the library'); b.gaps.forEach(x=>L.push('- '+x)); L.push(''); }
  if ((b.sourcesToFind||[]).length){ L.push('## Worth sourcing (unverified)'); b.sourcesToFind.forEach(x=>L.push('- '+x)); }
  return L.join('\n');
}

/* ============================================================== cards ==== */
const cardState = { cards:[], sched:{}, deck:'', queue:[], pos:0, shown:false, pending:[], loaded:false, session:{done:0, again:0} };

const DAY = 86400000;
function cardDue(id){
  const s = cardState.sched[id];
  if (!s) return 0;                       // never seen = due now
  return Number(s.due || 0);
}
function dueCards(deck){
  const now = Date.now();
  return cardState.cards.filter(c=>(!deck || c.deck===deck) && cardDue(c.id) <= now);
}

function schedule(prev, grade){
  let interval = prev ? Number(prev.interval||0) : 0;
  let ease = prev ? Number(prev.ease||2.5) : 2.5;
  let reps = prev ? Number(prev.reps||0) : 0;
  let lapses = prev ? Number(prev.lapses||0) : 0;
  if (grade === 1){ lapses++; reps = 0; ease = Math.max(1.3, ease-0.2); interval = 0; }
  else if (grade === 2){ ease = Math.max(1.3, ease-0.15); interval = reps ? Math.max(1, Math.round(interval*1.2)) : 1; reps++; }
  else if (grade === 3){ interval = reps === 0 ? 1 : (reps === 1 ? 3 : Math.round(Math.max(1,interval)*ease)); reps++; }
  else { ease = Math.min(3.2, ease+0.15); interval = reps === 0 ? 3 : Math.round(Math.max(1,interval)*ease*1.3); reps++; }
  interval = Math.min(interval, 365);
  return {interval, ease, reps, lapses, due: Date.now() + interval*DAY, last: Date.now()};
}

async function loadCardBank(force){
  if (cardState.loaded && !force) return;
  const local = await DB.get('kv','cards');
  if (local && !force){ cardState.cards = local.cards||[]; cardState.sched = local.sched||{}; cardState.loaded = true; }
  try {
    const r = await api('cardsSync');
    cardState.cards = r.cards || [];
    const server = r.state || {};
    // a review that hasn't been pushed yet is newer than whatever the server holds
    const unpushed = new Set(cardState.pending.map(p=>p.id));
    Object.keys(cardState.sched || {}).forEach(id=>{ if (unpushed.has(id)) server[id] = cardState.sched[id]; });
    cardState.sched = server;
    cardState.loaded = true;
    await DB.put('kv','cards', {cards:cardState.cards, sched:cardState.sched});
  } catch(e){
    if (!cardState.loaded) throw e;
  }
}

async function flushReviews(){
  if (!cardState.pending.length) return;
  const batch = cardState.pending.splice(0, cardState.pending.length);
  try { await api('cardsReview', {reviews: batch}); }
  catch(e){ cardState.pending = batch.concat(cardState.pending); }
}

function renderCards(){
  const v = $('#view-cards');
  v.innerHTML = '<div class="card"><p class="muted" style="margin:0"><span class="spin"></span> Loading cards…</p></div>';
  loadCardBank(false).then(()=>drawCards()).catch(e=>{
    v.innerHTML = '<div class="card"><p style="margin:0;color:var(--danger)">'+esc(e.message)+'</p></div>';
  });
}

function drawCards(){
  const v = $('#view-cards');
  const decks = Array.from(new Set(cardState.cards.map(c=>c.deck))).sort();
  const due = dueCards(cardState.deck);
  const total = cardState.cards.filter(c=>!cardState.deck || c.deck===cardState.deck).length;
  const isAdmin = state.user && state.user.role==='admin';

  let html = '<div class="deckbar">'
    + '<div class="stat"><b>'+due.length+'</b><span>due now</span></div>'
    + '<div class="stat"><b>'+total+'</b><span>in deck</span></div>'
    + '<div class="stat"><b>'+cardState.session.done+'</b><span>this session</span></div>'
    + '<div style="flex:1"></div>'
    + (state.embeddings?'<button class="btn" id="cMake">Generate cards</button>':'')
    + '<button class="btn" id="cBrowse">Browse</button>'
    + '</div>';

  if (decks.length > 1){
    html += '<div class="filters" style="border:0;background:transparent;padding:0 0 10px">'
      + '<button class="chip" data-deck="" aria-pressed="'+(!cardState.deck)+'">All decks</button>'
      + decks.map(d=>'<button class="chip" data-deck="'+esc(d)+'" aria-pressed="'+(cardState.deck===d)+'">'+esc(d)+'</button>').join('')
      + '</div>';
  }

  if (!cardState.cards.length){
    html += emptyState('No flashcards yet', state.embeddings
      ? 'Hit <b>Generate cards</b>, or open any passage in Search and choose <b>Make card</b>.'
      : 'Flashcards need a Gemini key on the service.');
    v.innerHTML = html;
    bindCardBar();
    return;
  }

  if (!cardState.queue.length || cardState.pos >= cardState.queue.length){
    if (due.length){
      cardState.queue = due.slice().sort(()=>Math.random()-0.5).slice(0,40);
      cardState.pos = 0; cardState.shown = false;
    } else {
      const next = cardState.cards.filter(c=>!cardState.deck||c.deck===cardState.deck)
        .map(c=>cardDue(c.id)).filter(Boolean).sort((a,b)=>a-b)[0];
      html += '<div class="card" style="text-align:center;padding:34px 20px">'
        + '<div style="font-size:34px">✓</div>'
        + '<h3 style="margin:8px 0 4px">Nothing due</h3>'
        + '<p class="muted" style="margin:0;font-size:14px">'
        + (next ? 'Next card comes back '+relDay(next)+'.' : 'Generate some cards to get started.')
        + '</p>'
        + (total?'<div class="btnrow" style="justify-content:center;margin-top:14px"><button class="btn" id="cCram">Review anyway</button></div>':'')
        + '</div>';
      v.innerHTML = html;
      bindCardBar();
      if ($('#cCram')) $('#cCram').onclick = ()=>{
        cardState.queue = cardState.cards.filter(c=>!cardState.deck||c.deck===cardState.deck)
          .slice().sort(()=>Math.random()-0.5).slice(0,20);
        cardState.pos = 0; cardState.shown = false; drawCards();
      };
      return;
    }
  }

  const card = cardState.queue[cardState.pos];
  const src = [card.title, card.clause?('clause '+card.clause):'', card.page?('p.'+card.page):''].filter(Boolean).join(' · ');
  html += '<div class="flash" id="flash">'
    + '<div class="qq">'+esc(card.q)+'</div>'
    + (cardState.shown ? '<div class="aa">'+esc(card.a)+'</div><div class="src">'+esc(src)+'</div>'
                       : '<div class="src" style="margin-top:18px">tap to reveal · <span class="kbd">space</span></div>')
    + '</div>';

  if (cardState.shown){
    html += '<div class="grade">'
      + '<button class="g1" data-g="1">Again<small>&lt; 1 day</small></button>'
      + '<button data-g="2">Hard<small>sooner</small></button>'
      + '<button data-g="3">Good<small>on track</small></button>'
      + '<button class="g4" data-g="4">Easy<small>later</small></button>'
      + '</div>';
    html += '<div class="btnrow" style="margin-top:10px;justify-content:center">'
      + (card.docId?'<button class="btn" id="cSource">Read the source</button>':'')
      + '<button class="btn" id="cDrop">Delete card</button></div>';
  } else {
    html += '<div class="btnrow" style="margin-top:12px;justify-content:center"><button class="btn primary" id="cShow" style="min-width:180px">Show answer</button></div>';
  }
  html += '<p class="muted" style="text-align:center;font-size:12px;margin-top:14px">'
    + (cardState.pos+1)+' of '+cardState.queue.length+' in this round</p>';

  v.innerHTML = html;
  bindCardBar();

  const reveal = ()=>{ cardState.shown = true; drawCards(); };
  $('#flash').onclick = ()=>{ if (!cardState.shown) reveal(); };
  if ($('#cShow')) $('#cShow').onclick = reveal;
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>gradeCard(Number(b.dataset.g)));
  if ($('#cSource')) $('#cSource').onclick = ()=>{
    const ix = findChunkFor(card.docId, card.page, card.clause);
    if (ix >= 0) openReader(ix); else toast('That document is no longer in the library.','err');
  };
  if ($('#cDrop')) $('#cDrop').onclick = async ()=>{
    if (!confirm('Delete this card?')) return;
    try {
      await api('cardsDelete', {ids:[card.id]});
      cardState.cards = cardState.cards.filter(c=>c.id!==card.id);
      cardState.queue.splice(cardState.pos,1);
      cardState.shown = false;
      await DB.put('kv','cards', {cards:cardState.cards, sched:cardState.sched});
      drawCards();
    } catch(e){ toast(esc(e.message),'err'); }
  };
}

function bindCardBar(){
  const v = $('#view-cards');
  v.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>{
    cardState.deck = b.dataset.deck || '';
    cardState.queue = []; cardState.pos = 0; cardState.shown = false;
    drawCards();
  });
  if ($('#cMake')) $('#cMake').onclick = openGenerator;
  if ($('#cBrowse')) $('#cBrowse').onclick = browseCards;
}

function relDay(ts){
  const d = Math.round((ts - Date.now())/DAY);
  if (d <= 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d < 30) return 'in '+d+' days';
  return 'in '+Math.round(d/30)+' months';
}

function gradeCard(g){
  const card = cardState.queue[cardState.pos];
  if (!card) return;
  const s = schedule(cardState.sched[card.id], g);
  cardState.sched[card.id] = s;
  cardState.pending.push(Object.assign({id:card.id}, s));
  cardState.session.done++;
  if (g === 1){
    cardState.session.again++;
    cardState.queue.push(card);                    // see it again before the round ends
  }
  cardState.pos++;
  cardState.shown = false;
  DB.put('kv','cards', {cards:cardState.cards, sched:cardState.sched}).catch(()=>{});
  if (cardState.pending.length >= 5) flushReviews();
  drawCards();
}

/* ---------- generating cards ---------- */
function openGenerator(){
  const docs = state.docs.slice().sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  const body = '<label class="f"><span>Make cards from</span><select id="gSource">'
    + '<option value="">— pick a document —</option>'
    + docs.map(d=>'<option value="'+esc(d.docId)+'">'+esc(d.title)+'</option>').join('')
    + '</select></label>'
    + '<div class="row">'
    + '<label class="f"><span>How many passages to draw on</span><select id="gCount">'
    + '<option value="8">8 — quick</option><option value="16" selected>16 — a decent set</option><option value="26">26 — thorough</option>'
    + '</select></label>'
    + '<label class="f"><span>Deck name</span><input type="text" id="gDeck" placeholder="e.g. Part B"></label>'
    + '</div>'
    + '<p class="muted" style="font-size:13px;margin:0">Passages are sampled evenly across the document, favouring ones that carry a clause number and a real figure.</p>';
  showSheet('Generate flashcards', body, '<div style="flex:1"></div><button class="btn primary" id="gRun">Generate</button>');
  const sel = $('#gSource');
  sel.onchange = ()=>{ const d = docById(sel.value); if (d && !$('#gDeck').value) $('#gDeck').value = d.docRef || d.collection || 'General'; };
  $('#gRun').onclick = async ()=>{
    const docId = sel.value;
    if (!docId){ toast('Pick a document first.','err'); return; }
    const n = Number($('#gCount').value);
    const deck = $('#gDeck').value.trim() || (docById(docId).docRef || 'General');
    const pool = state.chunks
      .map((c,i)=>({c,i}))
      .filter(x=>x.c.d===docId && x.c.t.length>180)
      .sort((a,b)=>{
        const sa = (a.c.c?2:0) + (/\d/.test(a.c.t)?1:0);
        const sb = (b.c.c?2:0) + (/\d/.test(b.c.t)?1:0);
        return sb-sa;
      });
    if (!pool.length){ toast('That document has no passages long enough.','err'); return; }
    const step = Math.max(1, Math.floor(pool.length/n));
    const picked = [];
    for (let i=0;i<pool.length && picked.length<n;i+=step) picked.push(pool[i]);
    const d = docById(docId);
    const passages = picked.map(x=>({docId, title:d.title, clause:x.c.c, page:x.c.p, text:x.c.t, tags:d.tags||''}));
    closeModal();
    makeCardsFrom(passages, deck, 1);
  };
}

async function makeCardsFrom(passages, deck, per){
  if (!state.embeddings){ toast('Card writing needs a Gemini key on the service.','err'); return; }
  showSheet('Writing cards', '<p class="muted"><span class="spin"></span> Reading '+passages.length+' passage'+(passages.length===1?'':'s')+'…</p>', '');
  let made = [];
  try {
    const r = await api('genCards', {passages: passages.map(p=>({docId:p.docId, title:p.title, clause:p.clause, page:p.page, text:p.text, tags:p.tags})), per: per||1});
    made = r.cards || [];
  } catch(e){
    const b = $('#sheet .body'); if (b) b.innerHTML = '<p style="color:var(--danger)">'+esc(e.message)+'</p>';
    return;
  }
  if (!made.length){
    const b = $('#sheet .body'); if (b) b.innerHTML = '<p class="muted">Nothing in those passages was worth a card.</p>';
    return;
  }
  const body = '<label class="f"><span>Deck</span><input type="text" id="mDeck" value="'+esc(deck||'General')+'"></label>'
    + '<div class="muted" style="font-size:12.5px;margin-bottom:6px">Untick anything that reads badly — nothing is saved until you press Save.</div>'
    + made.map((c,i)=>'<label class="cardrow"><input type="checkbox" data-c="'+i+'" checked style="margin-top:4px;flex:none">'
      + '<span><b>'+esc(c.q)+'</b><br><span style="color:var(--accent)">'+esc(c.a)+'</span>'
      + '<br><span class="muted" style="font-size:11.5px">'+esc([c.title, c.clause?('clause '+c.clause):'', c.page?('p.'+c.page):''].filter(Boolean).join(' · '))+'</span></span></label>').join('');
  const panel = $('#sheet .body');
  if (!panel) return;
  panel.innerHTML = body;
  const foot = $('#sheet footer') || (()=>{ const f=document.createElement('footer'); $('#sheet .panel').appendChild(f); return f; })();
  foot.innerHTML = '<span class="muted" style="align-self:center;font-size:13px">'+made.length+' proposed</span><div style="flex:1"></div>'
    + '<button class="btn primary" id="mSave">Save selected</button>';
  $('#sheet header h3').textContent = 'Review the cards';
  $('#mSave').onclick = async ()=>{
    const picks = Array.from(panel.querySelectorAll('[data-c]:checked')).map(cb=>made[Number(cb.dataset.c)]);
    if (!picks.length){ closeModal(); return; }
    const dk = $('#mDeck').value.trim() || 'General';
    $('#mSave').disabled = true;
    try {
      const r = await api('cardsAdd', {cards: picks.map(c=>Object.assign({}, c, {deck:dk}))});
      cardState.cards = cardState.cards.concat(r.added||[]);
      cardState.queue = []; cardState.pos = 0; cardState.shown = false;
      await DB.put('kv','cards', {cards:cardState.cards, sched:cardState.sched});
      closeModal();
      toast('Saved '+(r.added||[]).length+' cards to “'+esc(dk)+'”');
      if (state.view === 'cards') drawCards();
    } catch(e){ toast(esc(e.message),'err'); $('#mSave').disabled = false; }
  };
}

function browseCards(){
  const list = cardState.cards.filter(c=>!cardState.deck || c.deck===cardState.deck);
  if (!list.length){ showSheet('All cards','<p class="muted">No cards yet.</p>',''); return; }
  const body = list.map(c=>{
    const nxt = cardDue(c.id);
    return '<div class="cardrow"><span style="flex:1"><b>'+esc(c.q)+'</b><br>'
      + '<span style="color:var(--accent)">'+esc(c.a)+'</span><br>'
      + '<span class="muted" style="font-size:11.5px">'+esc(c.deck)+' · '+esc(c.title||'')
      + (c.clause?' · clause '+esc(c.clause):'')+' · '+(nxt?relDay(nxt):'new')+'</span></span>'
      + '<button class="btn" data-del="'+esc(c.id)+'" style="padding:4px 9px;font-size:12px;flex:none">✕</button></div>';
  }).join('');
  showSheet(list.length+' cards', body, '');
  $('#sheet .body').querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    try {
      await api('cardsDelete', {ids:[b.dataset.del]});
      cardState.cards = cardState.cards.filter(c=>c.id!==b.dataset.del);
      await DB.put('kv','cards', {cards:cardState.cards, sched:cardState.sched});
      b.closest('.cardrow').remove();
      if (state.view==='cards') { cardState.queue=[]; }
    } catch(e){ toast(esc(e.message),'err'); }
  });
}

async function statStore(){
  const el = $('#storeStats');
  if (!el) return;
  let line = state.docs.length+' documents · '+state.chunks.length.toLocaleString()+' passages indexed';
  try {
    if (navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      line += ' · '+(e.usage/1048576).toFixed(1)+' MB stored on this device';
    }
  } catch(e){}
  el.textContent = line;
}

/* ============================================================== auth ===== */
function signOut(msg){
  const keep = settingsRaw();
  localStorage.setItem(LS, JSON.stringify({endpoint: keep.endpoint||'', theme: keep.theme||''}));
  state.code = ''; state.user = null;
  cardState.cards = []; cardState.sched = {}; cardState.queue = []; cardState.pending = []; cardState.loaded = false;
  briefState.result = null; briefState.refs = []; briefState.savedList = [];
  DB.del('kv','cards').catch(()=>{});
  $('#gCode').value = '';
  $('#gEndpoint').value = keep.endpoint || '';
  $('#app').classList.add('hide');
  $('#gate').classList.remove('hide');
  if (msg) $('#gMsg').textContent = msg;
}

async function connect(endpoint, code, remember){
  state.endpoint = endpoint.trim().replace(/\s+/g,'');
  state.code = code.trim();
  const r = await api('auth', {});
  state.user = r.user;
  state.embeddings = !!r.embeddings;
  state.firecrawl = !!r.firecrawl;
  if (remember) saveSettings();
  else localStorage.removeItem(LS);
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  const hadCache = await loadFromCache();
  if (hadCache) renderSearchHome();
  sync(false).then(()=>{ if (state.view==='search' && !state.lastQuery) renderSearchHome(); });
  loadCardBank(false)
    .then(()=>{ if (state.view==='search' && !state.lastQuery) renderSearchHome(); })
    .catch(()=>{});
}

function bindShell(){
  $$('#tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $('#q').addEventListener('input', onQueryInput);
  $('#q').addEventListener('keydown', e=>{
    if (e.key==='Enter'){ e.preventDefault(); state.mode==='ask' ? doAsk() : doSearch(); }
    if (e.key==='Escape'){ $('#q').value=''; onQueryInput(); renderSearchHome(); }
  });
  $('#clearq').onclick = ()=>{ $('#q').value=''; onQueryInput(); renderSearchHome(); $('#q').focus(); };
  $('#mFind').onclick = ()=>setMode('find');
  $('#mAsk').onclick = ()=>setMode('ask');
  $('#syncBtn').onclick = ()=>sync(false);
  document.addEventListener('keydown', e=>{
    const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if (state.view==='cards' && !typing && !$('#modal').innerHTML){
      if (e.key===' '){
        e.preventDefault();
        if (!cardState.shown && cardState.queue.length){ cardState.shown = true; drawCards(); }
        return;
      }
      if (cardState.shown && ['1','2','3','4'].includes(e.key)){ e.preventDefault(); gradeCard(Number(e.key)); return; }
    }
    if (e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
      e.preventDefault(); setView('search'); $('#q').focus(); $('#q').select();
    }
    if (e.key==='Escape' && $('#modal').innerHTML) closeModal();
  });
}
function setMode(m){
  state.mode = m;
  $('#mFind').setAttribute('aria-pressed', String(m==='find'));
  $('#mAsk').setAttribute('aria-pressed', String(m==='ask'));
  $('#q').placeholder = m==='ask'
    ? 'Ask a question — e.g. what travel distance is allowed in a dead end?'
    : 'Search regulations, clauses, policies…';
  if ($('#q').value.trim()) { m==='ask' ? doAsk() : doSearch(); }
}

(function boot(){
  loadSettings();
  bindShell();
  $('#gEndpoint').value = state.endpoint;
  $('#gGo').onclick = async ()=>{
    const btn = $('#gGo');
    btn.disabled = true; $('#gMsg').textContent = 'Connecting…';
    try {
      await connect($('#gEndpoint').value, $('#gCode').value, $('#gRemember').checked);
      $('#gMsg').textContent = '';
    } catch(e){
      $('#gMsg').innerHTML = '<span style="color:var(--danger)">'+esc(e.message)+'</span>';
    } finally { btn.disabled = false; }
  };
  $('#gCode').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#gGo').click(); });

  if (state.endpoint && state.code){
    $('#gMsg').textContent = 'Connecting…';
    connect(state.endpoint, state.code, true).catch(e=>{
      $('#gMsg').innerHTML = '<span style="color:var(--danger)">'+esc(e.message)+'</span>';
    });
  }

  if (location.protocol.startsWith('http') && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
